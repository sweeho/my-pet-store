<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8" />
<title>My Pet Store — Administration</title>
<style>
:root{
  --background: oklch(1 0 0);
  --foreground: oklch(0.145 0 0);
  --primary: oklch(0.205 0 0);
  --primary-foreground: oklch(0.985 0 0);
  --secondary: oklch(0.97 0 0);
  --secondary-foreground: oklch(0.205 0 0);
  --muted: oklch(0.97 0 0);
  --muted-foreground: oklch(0.556 0 0);
  --accent: oklch(0.97 0 0);
  --destructive: oklch(0.577 0.245 27.325);
  --border: oklch(0.922 0 0);
  --input: oklch(0.922 0 0);
  --ring: oklch(0.87 0 0);
  --radius: 0.625rem;
  --radius-md: calc(var(--radius) - 2px);
  --radius-sm: calc(var(--radius) - 4px);
}
*{box-sizing:border-box;margin:0;padding:0;border-color:var(--border);}
html,body{height:100%;}
body{
  background:var(--background);color:var(--foreground);
  font-family:ui-sans-serif,system-ui,-apple-system,"Segoe UI",Roboto,"Helvetica Neue",Arial,"Noto Sans",sans-serif;
  -webkit-font-smoothing:antialiased;
}
h1{font-size:1.5rem;line-height:2rem;font-weight:700;}
h2{font-size:1.25rem;line-height:1.75rem;font-weight:700;}
label{font-size:.875rem;line-height:1.25rem;font-weight:500;}
input[type=text],input[type=password]{
  width:100%;border:1px solid var(--input);background:var(--background);color:var(--foreground);
  border-radius:var(--radius-md);padding:.5rem .75rem;font-size:.875rem;line-height:1.25rem;font-family:inherit;
}
.btn{display:inline-flex;align-items:center;justify-content:center;white-space:nowrap;
  border-radius:var(--radius-md);font-size:.875rem;font-weight:500;height:2.5rem;padding:0 1rem;border:1px solid transparent;}
.btn-default{background:var(--primary);color:var(--primary-foreground);}
.btn-outline{background:var(--background);color:var(--foreground);border-color:var(--input);}
.muted{color:var(--muted-foreground);}
.sm{font-size:.875rem;line-height:1.25rem;}
.xs{font-size:.75rem;line-height:1rem;}
a.link{color:var(--foreground);font-size:.875rem;text-decoration:none;text-underline-offset:4px;}
</style>
  <style>
    .wrap{margin:0 auto;display:flex;min-height:100vh;max-width:28rem;flex-direction:column;justify-content:center;gap:2rem;padding:2rem;}
    .field{display:flex;flex-direction:column;gap:.25rem;}
    form{display:flex;flex-direction:column;gap:1rem;margin-top:1rem;}
    .brand{display:flex;align-items:center;gap:.5rem;}
    .brand-dot{width:1.75rem;height:1.75rem;border-radius:var(--radius-sm);background:var(--primary);color:var(--primary-foreground);
      display:flex;align-items:center;justify-content:center;font-size:.75rem;font-weight:700;letter-spacing:.02em;}
  </style>
</head>
<body>
  <div class="wrap">
    <div>
      <div class="brand">
        <div class="brand-dot">MPS</div>
        <span class="sm muted">My Pet Store · Administration</span>
      </div>
      <h1 style="margin-top:1.5rem">Administrator Sign In</h1>
      <p class="sm muted" style="margin-top:.5rem">Fields are pre-filled with the development default credentials.</p>
      <form aria-label="Administrator sign in">
        <div class="field">
          <label for="j_username">Username</label>
          <input id="j_username" name="j_username" type="text" value="jps_admin" />
        </div>
        <div class="field">
          <label for="j_password">Password</label>
          <input id="j_password" name="j_password" type="password" value="admin" />
        </div>
        <button class="btn btn-default" type="submit" style="width:100%">Sign In</button>
      </form>
    </div>
    <a class="link" href="#">← Back to store</a>
  </div>
</body>
</html>
