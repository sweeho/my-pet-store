<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8" />
<title>Login Error — wireframe</title>
<style>
  * { box-sizing: border-box; }
  body {
    margin: 0; background: #fff; color: #3f3f46;
    font: 14px/1.45 ui-sans-serif, system-ui, -apple-system, "Segoe UI", sans-serif;
  }
  .frame { min-height: 576px; display: flex; align-items: center; justify-content: center; padding: 32px; }
  .col { width: 100%; max-width: 384px; }
  .h1 { height: 22px; width: 58%; background: #52525b; border-radius: 3px; }
  .cap { font-size: 11px; color: #a1a1aa; margin-top: 6px; letter-spacing: .04em; }
  .msg {
    margin-top: 22px; border-left: 3px solid #a1a1aa; padding-left: 12px;
    font-size: 13px; color: #52525b;
  }
  .msg-cap { font-size: 11px; color: #a1a1aa; margin-top: 8px; }
  .link {
    margin-top: 26px; font-size: 13px; color: #3f3f46;
    text-decoration: underline; text-underline-offset: 4px;
  }
</style>
</head>
<body>
  <div class="frame">
    <div class="col">
      <div class="h1"></div>
      <div class="cap">heading — “Sign In Failed”</div>

      <div class="msg">
        Please verify your username and password, then try again.
      </div>
      <div class="msg-cap">error message region</div>

      <div class="link">← Back to sign in</div>
    </div>
  </div>
</body>
</html>
