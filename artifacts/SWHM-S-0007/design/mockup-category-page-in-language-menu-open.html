<!doctype html>
<html lang="ja">
  <head>
    <meta charset="utf-8" />
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@300;400;500;700&family=Noto+Sans+JP:wght@400;500;700&family=Noto+Sans+SC:wght@400;500;700&display=swap"
      rel="stylesheet"
    />
    <style>
      :root {
        --background: oklch(1 0 0);
        --foreground: oklch(0.145 0 0);
        --card: oklch(1 0 0);
        --primary: oklch(0.205 0 0);
        --primary-foreground: oklch(0.985 0 0);
        --muted: oklch(0.97 0 0);
        --muted-foreground: oklch(0.556 0 0);
        --accent: oklch(0.97 0 0);
        --border: oklch(0.922 0 0);
        --input: oklch(0.922 0 0);
        --radius: 0.625rem;
      }
      * { box-sizing: border-box; margin: 0; padding: 0; }
      body {
        width: 1440px; height: 900px; background: var(--background); color: var(--foreground);
        font-family: "Space Grotesk", "Noto Sans JP", "Noto Sans SC", system-ui, sans-serif;
        -webkit-font-smoothing: antialiased;
      }
      .page { margin: 0 auto; max-width: 672px; padding: 24px; }
      .breadcrumb { font-size: 14px; color: var(--muted-foreground); text-decoration: none; }
      .head { display: flex; align-items: flex-start; justify-content: space-between; margin-top: 8px; }
      h1 { font-size: 20px; font-weight: 700; line-height: 1.3; }
      .descn { color: var(--muted-foreground); font-size: 14px; margin-top: 4px; }

      .lang { position: relative; }
      .lang-trigger {
        display: inline-flex; align-items: center; gap: 8px; height: 36px; padding: 0 12px;
        border: 1px solid var(--input); background: var(--background); color: var(--foreground);
        border-radius: calc(var(--radius) - 2px); font-size: 14px; font-weight: 500; white-space: nowrap;
      }
      .globe { width: 16px; height: 16px; stroke: var(--muted-foreground); }
      .chev { width: 14px; height: 14px; stroke: var(--muted-foreground); }
      .lang-panel {
        position: absolute; right: 0; top: 42px; width: 224px;
        background: var(--card); border: 1px solid var(--border);
        border-radius: var(--radius); padding: 6px; box-shadow: 0 8px 24px oklch(0.145 0 0 / 0.08);
      }
      .lang-item {
        display: flex; align-items: center; justify-content: space-between; gap: 8px;
        padding: 8px 10px; border-radius: calc(var(--radius) - 2px); font-size: 14px;
      }
      .lang-item.is-active { background: var(--accent); font-weight: 500; }
      .lang-item .code { font-size: 11px; color: var(--muted-foreground); letter-spacing: 0.04em; }
      .tick { width: 14px; height: 14px; stroke: var(--foreground); }
      .lang-foot {
        border-top: 1px solid var(--border); margin-top: 6px; padding: 8px 10px 4px;
        font-size: 11px; color: var(--muted-foreground); line-height: 1.45;
      }

      ul.products { list-style: none; display: flex; flex-direction: column; gap: 8px; margin-top: 24px; }
      ul.products a { color: var(--foreground); text-decoration: none; font-size: 16px; }
      .pager { display: flex; gap: 8px; margin-top: 16px; }
      .btn {
        display: inline-flex; align-items: center; justify-content: center; height: 40px; padding: 0 16px;
        border-radius: calc(var(--radius) - 2px); font-size: 14px; font-weight: 500;
        border: 1px solid transparent; background: var(--primary); color: var(--primary-foreground);
      }
      .btn-outline { background: var(--background); color: var(--foreground); border-color: var(--input); }
      .btn[disabled] { opacity: 0.5; }
    </style>
  </head>
  <body>
    <div class="page">
      <a class="breadcrumb" href="#">← Catalog</a>
      <div class="head">
        <div>
          <h1>鳥</h1>
          <p class="descn">鳥は素晴らしいペットです。話せる種類もいます。</p>
        </div>
        <div class="lang">
          <div class="lang-trigger">
            <svg class="globe" viewBox="0 0 24 24" fill="none" stroke-width="2" stroke-linecap="round">
              <circle cx="12" cy="12" r="9" /><path d="M3 12h18M12 3c2.5 2.7 2.5 15.3 0 18M12 3c-2.5 2.7-2.5 15.3 0 18" />
            </svg>
            日本語
            <svg class="chev" viewBox="0 0 24 24" fill="none" stroke-width="2" stroke-linecap="round"><path d="m6 9 6 6 6-6" /></svg>
          </div>
          <div class="lang-panel" role="listbox" aria-label="Language">
            <div class="lang-item"><span>English (US)</span><span class="code">en_US</span></div>
            <div class="lang-item is-active">
              <span>日本語</span>
              <svg class="tick" viewBox="0 0 24 24" fill="none" stroke-width="2.5" stroke-linecap="round"><path d="m5 13 4 4L19 7" /></svg>
            </div>
            <div class="lang-item"><span>中文</span><span class="code">zh_CN</span></div>
            <div class="lang-foot">Saved to your profile — applies on every visit.</div>
          </div>
        </div>
      </div>

      <ul class="products">
        <li><a href="#">オウム</a></li>
        <li><a href="#">フィンチ</a></li>
      </ul>

      <div class="pager">
        <span class="btn btn-outline" disabled>Previous</span>
        <span class="btn btn-outline" disabled>Next</span>
      </div>
    </div>
  </body>
</html>
