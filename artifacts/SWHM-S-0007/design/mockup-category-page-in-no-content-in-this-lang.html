<!doctype html>
<html lang="zh-CN">
  <head>
    <meta charset="utf-8" />
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@300;400;500;700&family=Noto+Sans+JP:wght@400;500;700&family=Noto+Sans+SC:wght@400;500;700&display=swap"
      rel="stylesheet"
    />
    <style>
      :root {
        --background: oklch(1 0 0);
        --foreground: oklch(0.145 0 0);
        --card: oklch(1 0 0);
        --primary: oklch(0.205 0 0);
        --primary-foreground: oklch(0.985 0 0);
        --secondary: oklch(0.97 0 0);
        --muted: oklch(0.97 0 0);
        --muted-foreground: oklch(0.556 0 0);
        --accent: oklch(0.97 0 0);
        --border: oklch(0.922 0 0);
        --input: oklch(0.922 0 0);
        --radius: 0.625rem;
      }
      * { box-sizing: border-box; margin: 0; padding: 0; }
      body {
        width: 1440px; height: 900px; background: var(--background); color: var(--foreground);
        font-family: "Space Grotesk", "Noto Sans SC", "Noto Sans JP", system-ui, sans-serif;
        -webkit-font-smoothing: antialiased;
      }
      .page { margin: 0 auto; max-width: 672px; padding: 24px; }
      .breadcrumb { font-size: 14px; color: var(--muted-foreground); text-decoration: none; }
      .head { display: flex; align-items: flex-start; justify-content: space-between; margin-top: 8px; }
      h1 { font-size: 20px; font-weight: 700; line-height: 1.3; }
      .descn { color: var(--muted-foreground); font-size: 14px; margin-top: 4px; }

      .lang-trigger {
        display: inline-flex; align-items: center; gap: 8px; height: 36px; padding: 0 12px;
        border: 1px solid var(--input); background: var(--background); color: var(--foreground);
        border-radius: calc(var(--radius) - 2px); font-size: 14px; font-weight: 500; white-space: nowrap;
      }
      .globe { width: 16px; height: 16px; stroke: var(--muted-foreground); }
      .chev { width: 14px; height: 14px; stroke: var(--muted-foreground); }

      .empty {
        margin-top: 24px; border: 1px solid var(--border); background: var(--muted);
        border-radius: var(--radius); padding: 24px; text-align: center;
      }
      .empty .icon { width: 24px; height: 24px; stroke: var(--muted-foreground); margin: 0 auto 10px; display: block; }
      .empty h2 { font-size: 15px; font-weight: 500; }
      .empty p { font-size: 13px; color: var(--muted-foreground); margin-top: 6px; line-height: 1.5; }
      .empty .actions { display: flex; gap: 8px; justify-content: center; margin-top: 16px; }
      .btn {
        display: inline-flex; align-items: center; justify-content: center; height: 36px; padding: 0 14px;
        border-radius: calc(var(--radius) - 2px); font-size: 14px; font-weight: 500;
        border: 1px solid transparent; background: var(--primary); color: var(--primary-foreground);
      }
      .btn-outline { background: var(--background); color: var(--foreground); border-color: var(--input); }
      .btn[disabled] { opacity: 0.5; }
      .pager { display: flex; gap: 8px; margin-top: 16px; }
    </style>
  </head>
  <body>
    <div class="page">
      <a class="breadcrumb" href="#">← Catalog</a>
      <div class="head">
        <div>
          <h1>鸟</h1>
          <p class="descn">鸟是很棒的宠物，有些甚至会说话。</p>
        </div>
        <div class="lang-trigger">
          <svg class="globe" viewBox="0 0 24 24" fill="none" stroke-width="2" stroke-linecap="round">
            <circle cx="12" cy="12" r="9" /><path d="M3 12h18M12 3c2.5 2.7 2.5 15.3 0 18M12 3c-2.5 2.7-2.5 15.3 0 18" />
          </svg>
          中文
          <svg class="chev" viewBox="0 0 24 24" fill="none" stroke-width="2" stroke-linecap="round"><path d="m6 9 6 6 6-6" /></svg>
        </div>
      </div>

      <div class="empty">
        <svg class="icon" viewBox="0 0 24 24" fill="none" stroke-width="1.75" stroke-linecap="round">
          <circle cx="12" cy="12" r="9" /><path d="M3 12h18M12 3c2.5 2.7 2.5 15.3 0 18M12 3c-2.5 2.7-2.5 15.3 0 18" />
        </svg>
        <h2>No products in 中文 yet</h2>
        <p>
          This category has nothing translated into 中文. Nothing has gone wrong — the products exist,
          but not in this language.
        </p>
        <div class="actions">
          <span class="btn">View in English (US)</span>
          <span class="btn btn-outline">Change language</span>
        </div>
      </div>

    </div>
  </body>
</html>
