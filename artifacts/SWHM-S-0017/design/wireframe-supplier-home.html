<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <style>
      * { box-sizing: border-box; }
      body {
        margin: 0;
        background: #ffffff;
        font-family: ui-sans-serif, system-ui, -apple-system, "Segoe UI", sans-serif;
        color: #3f3f46;
      }
      .frame { width: 720px; min-height: 576px; padding: 24px; }
      .note {
        font-size: 10px; letter-spacing: .08em; text-transform: uppercase;
        color: #a1a1aa; margin: 0 0 8px;
      }
      /* repo convention: mx-auto max-w-[672px] p-6 */
      .page { max-width: 672px; margin: 0 auto; padding: 24px; border: 1px dashed #e4e4e7; }
      .h1 { height: 18px; width: 260px; background: #52525b; border-radius: 3px; }
      .h1-cap {
        font-size: 11px; color: #a1a1aa; margin-top: 6px; letter-spacing: .04em;
      }
      .card {
        border: 1px solid #d4d4d8; border-radius: 8px; padding: 16px; margin-top: 20px;
        background: #fafafa;
      }
      .card-head {
        display: flex; align-items: center; justify-content: space-between;
        border-bottom: 1px solid #e4e4e7; padding-bottom: 8px; margin-bottom: 12px;
      }
      .eyebrow {
        font-size: 10px; letter-spacing: .09em; text-transform: uppercase;
        color: #71717a; font-weight: 700;
      }
      .bar { height: 9px; background: #d4d4d8; border-radius: 3px; }
      .bars { display: flex; flex-direction: column; gap: 8px; }
      .w100 { width: 100%; } .w90 { width: 90%; } .w60 { width: 60%; }
      .actions { display: flex; gap: 12px; margin-top: 24px; }
      .btn {
        height: 40px; padding: 0 16px; border-radius: 6px; font-size: 13px; font-weight: 600;
        display: inline-flex; align-items: center; justify-content: center;
      }
      .btn-solid { background: #52525b; color: #ffffff; }
      .btn-outline { border: 1px solid #a1a1aa; background: #ffffff; color: #52525b; }
      .label { font-size: 10px; color: #a1a1aa; margin-top: 6px; }
    </style>
  </head>
  <body>
    <div class="frame">
      <p class="note">Supplier home — /supplier</p>
      <div class="page">
        <div class="h1"></div>
        <div class="h1-cap">Heading — "Supplier"</div>

        <div class="card">
          <div class="card-head">
            <span class="eyebrow">About this module</span>
          </div>
          <div class="bars">
            <div class="bar w100"></div>
            <div class="bar w90"></div>
            <div class="bar w100"></div>
            <div class="bar w60"></div>
          </div>
          <div class="label">Description of the supplier module — its inventory management capabilities</div>
        </div>

        <div class="actions">
          <div class="btn btn-solid">Display Inventory</div>
          <div class="btn btn-outline">Logout</div>
        </div>
        <div class="label">Two form buttons: navigate to inventory screen · end the session</div>
      </div>
    </div>
  </body>
</html>
