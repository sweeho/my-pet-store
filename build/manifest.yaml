    canvas:
      problem: Customers need to submit orders with billing, shipping, and payment information
      solution: Implement order placement workflow accepting customer information, generating unique order IDs, and clearing cart after successful submission
      userStories:
        - As a customer, I want to enter billing and shipping addresses so my order is processed correctly
        - As a customer, I want to enter payment information so I can pay for my order
        - As a customer, I want confirmation of my order so I know it was submitted
      acceptanceCriteria:
        - "Order placement accepts customer contact, address, and credit card information"
        - "Order is assigned unique ID from UniqueIdGenerator (seed 1001)"
        - "Order includes current date as order date"
        - "Line items are created from cart contents with quantity and unit price"
        - "Cart is cleared after successful order placement"
        - "Empty cart triggers ShoppingCartEmptyOrderException"
      outOfScope:
        - Payment authorization or credit card validation
        - Tax calculation
        - Shipping cost estimation
      risksAssumptions: []
      techStack: []
      affectedCode: []
      screens:
        - "Enter Order Information screen: captures billing first/last name, address (2 lines), city, state, postal code, country, phone, email; similar fields for shipping address with option to copy from billing"
        - "Order review and confirmation screen: displays order summary with customer name, billing and shipping addresses, all cart items with quantities and unit prices, cart subtotal, and Confirm Order button"
        - "Order completion confirmation screen: displays order confirmation number, order date, customer email, estimated delivery timeframe, and link to continue shopping or view order history"
    evidence:
      irRefs: [ORDER-PLACEMENT-REQ-0001, ORDER-PLACEMENT-RULE-0001, ORDER-PLACEMENT-RULE-0002, SCREEN-ORDER-INFO-0001, screen-order-info-001, screen-order-review-001, screen-order-complete-001, order-placement-entity-0001, order-placement-requirement-0001, order-placement-relationship-0001, order-placement-creditcard-0001, order-placement-date-format-0001, order-placement-transaction-0001, order-placement-access-control-0001]
