  - slug: shopping-cart
    title: Shopping Cart Management
    order: 6
    dependsOn: [catalog-browsing]
    priority: 0
    change:
      dir: openspec/changes/sx-shopping-cart
      specCapabilities:
        - shopping-cart
    canvas:
      problem: Customers need to add items to a temporary cart before checkout
      solution: Implement in-memory shopping cart with add, remove, update, and subtotal calculation capabilities
      userStories:
        - As a customer, I want to add items to my cart so I can purchase multiple items
        - As a customer, I want to update quantities in my cart so I can change my order before checkout
        - As a customer, I want to see my cart subtotal so I know how much I'm spending
      acceptanceCriteria:
        - "Items can be added to cart with default or specified quantity"
        - "Items can be removed from cart"
        - "Quantities can be updated, with item removal when quantity is 0 or negative"
        - "Cart subtotal is calculated as sum of (unitCost × quantity) for all items"
      outOfScope:
        - Cart persistence across sessions
        - Abandoned cart recovery
        - Cart sharing or wishlists
      risksAssumptions: []
      techStack: []
      affectedCode: []
      screens:
        - "Shopping cart display: shows each item with name, quantity input, unit cost, total per line; displays cart subtotal; provides Update and Remove controls per item"
    evidence:
      irRefs: [CART-REQUIREMENT-0001, CART-REQUIREMENT-0002, CART-REQUIREMENT-0003, XMLDOC-ENTITY-0005, screen-cart-001, shopping-cart-workflow-001, shopping-cart-req-001, shopping-cart-req-002, shopping-cart-req-003, shopping-cart-calc-001, shopping-cart-persist-001]
      reviewedBy: null
      reviewedAt: null

  - slug: order-placement
