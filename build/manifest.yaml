        - "Card type acceptance rules are enforced"
        - "Card expiry validation prevents use of expired cards"
      outOfScope:
        - PCI compliance or secure card storage
        - Real-time payment gateway integration
        - Refund or chargeback handling
      risksAssumptions: []
      techStack: []
      affectedCode: []
    evidence:
      irRefs: [PAY-ENTITY-0001]
      reviewedBy: null
      reviewedAt: null

  - slug: fulfillment-management
    title: Order Fulfillment & Shipping
    order: 9
    dependsOn: [order-placement]
    priority: 0
    change:
      dir: openspec/changes/sx-fulfillment-management
      specCapabilities:
        - fulfillment-management
    canvas:
      problem: Orders need to be tracked through fulfillment and shipping to completion
      solution: Track line item quantities ordered and shipped, support partial shipments, and detect order completion
      userStories:
        - As a fulfillment manager, I want to track shipments against orders so I know what's been delivered
        - As a fulfillment manager, I want to handle partial shipments so I can update tracking as goods ship
