        - "Supplier inventory display screen: displays current inventory items in a table with columns for item ID, product name, category, existing quantity, and reorder level indicator; supports sorting and filtering"
    evidence:
      irRefs: [FULFL-RULE-0001, FULFL-RULE-0002, FULFL-RULE-0003, FULFL-RULE-0004, FULFL-RULE-0005, FULFL-RULE-0006, FULFL-RULE-0007, FULFL-RULE-0008, FULFL-RULE-0009, FULFL-RULE-0010, SCREEN-0001, SCREEN-0002, SCREEN-0003, FUL-ENT-0001, FUL-ENT-0002, FUL-ENT-0003, FUL-BUS-0001, FUL-BUS-0002, FUL-BUS-0003, FUL-BUS-0004, FUL-INT-0001, ENTITY-INV-0001]
