capabilities:
  - slug: user-authentication
    title: User Authentication & Sign-On
    order: 1
    dependsOn: []
    priority: 0
    change:
      dir: openspec/changes/sx-user-authentication
      specCapabilities:
        - user-authentication
    canvas:
      problem: Users need to create accounts and authenticate to access personalized features and protected resources
      solution: Implement username/password authentication with session management, protected resource access control, and username persistence via cookies
      userStories:
        - As a customer, I want to create an account with a username and password so I can access my account later
        - As a customer, I want to sign in with my credentials so I can access protected features
        - As a customer, I want the system to remember my username so I don't have to type it every time
      acceptanceCriteria:
        - "Create new user account — user can register with username and password"
        - "Authenticate user with credentials — correct credentials grant access, incorrect credentials deny access"
        - "Persist username in browser cookie — cookie lasts 30 days when remember checkbox is selected"
        - "Intercept unauthenticated access — unsigned-on users redirected to sign-on page"
        - "Redirect to originally-requested resource — user sent to original URL after successful sign-in"
      outOfScope:
        - OAuth or social login
        - Multi-factor authentication
        - Password reset or recovery flows
        - Role-based access control beyond basic authenticated/unauthenticated
      risksAssumptions: []
      techStack: []
      affectedCode: []
      screens:
        - "Sign-in form: username (text), password (password field), Remember My User Name checkbox, submit button; pre-populates username from bp_signon cookie if present"
        - "Sign-up form: username (text), password (password field), password repeat (password field), submit button"
        - "Sign-on error page: displays error message indicating authentication failed"
        - "User session home page: displays welcome message with authenticated user's profile name and navigation links to account, catalog, shopping cart, and logout"
    evidence:
      irRefs: [AUTH-ENT-0001, AUTH-VALI-0001, AUTH-OPER-0001, AUTH-SCRE-0001, AUTH-SCRE-0002, AUTH-SCRE-0003, AUTH-SCRE-0004]
      reviewedBy: null
      reviewedAt: null

  - slug: account-management
    title: Customer Account & Profile Management
    order: 2
    dependsOn: [user-authentication]
    priority: 0
    change:
      dir: openspec/changes/sx-account-management
      specCapabilities:
        - account-management
    canvas:
      problem: Customers need to manage their profile information, contact details, and preferences
      solution: Provide account management capability for customers to view and update contact information, addresses, credit card details, and language preferences
      userStories:
        - As a customer, I want to update my contact information so my orders ship to the correct address
        - As a customer, I want to manage multiple addresses for billing and shipping
        - As a customer, I want to set my language preference so I see content in my preferred language
      acceptanceCriteria:
        - "Customer account stores contact information, address, and credit card details"
        - "Language preference is stored and applied to subsequent sessions"
        - "Duplicate accounts are rejected with descriptive error message"
      outOfScope:
        - Account suspension or deactivation
        - Change password functionality
        - Address validation against postal services
      risksAssumptions: []
      techStack: []
      affectedCode: []
      screens:
        - "Customer account profile screen: displays and allows editing of contact information (phone, email), billing and shipping addresses, credit card details, and language preference selection from en_US, ja_JP, zh_CN"
    evidence:
      irRefs: [ACCT-REQUIREMENT-0001, ACCOUNT-MGMT-RULE-0001, ACCOUNT-MGMT-SCREEN-0001]
      reviewedBy: null
      reviewedAt: null

  - slug: catalog-browsing
    title: Product Catalog & Search
    order: 3
    dependsOn: []
    priority: 0
    change:
      dir: openspec/changes/sx-catalog-browsing
      specCapabilities:
        - catalog-browsing
    canvas:
      problem: Customers need to discover and browse products organized by category
      solution: Provide a catalog interface supporting category browsing, pagination, multi-locale content, and search
      userStories:
        - As a customer, I want to browse products by category so I can find items I'm interested in
        - As a customer, I want to search for products by name so I can quickly find specific items
        - As a customer, I want to see products in my language so I can understand descriptions
      acceptanceCriteria:
        - "Catalog displays categories, products, and items with locale-specific names and descriptions"
        - "Search returns matching items across name, category, and description fields"
        - "Pagination supports browsing large product sets with configurable page size"
        - "Locale parameter filters content for the requested language"
      outOfScope:
        - Product recommendations
        - Wishlist or favorites functionality
        - Product reviews or ratings
      risksAssumptions: []
      techStack: []
      affectedCode: []
    evidence:
      irRefs: [CAT-ENTITY-0001, CAT-ENTITY-0002, CAT-REQUIREMENT-0001]
      reviewedBy: null
      reviewedAt: null

  - slug: internationalization
    title: Multi-Language Support
    order: 4
    dependsOn: []
    priority: 0
    change:
      dir: openspec/changes/sx-internationalization
      specCapabilities:
        - internationalization
    canvas:
      problem: The application serves customers in multiple countries who speak different languages
      solution: Implement locale-aware content retrieval, user language preference storage, and locale parameter propagation through all layers
      userStories:
        - As a Japanese customer, I want to see the catalog in Japanese so I can understand product information
        - As a customer, I want my language preference saved so it applies to all subsequent visits
      acceptanceCriteria:
        - "System supports en_US, ja_JP, and zh_CN locales"
        - "Catalog queries return language-specific content for the requested locale"
        - "Missing locale data returns null rather than falling back to another language"
        - "User language preference is stored in customer profile and applied by default"
      outOfScope:
        - Currency conversion or localized pricing
        - Date and time formatting by locale
        - Right-to-left language support
      risksAssumptions: []
      techStack: []
      affectedCode: []
    evidence:
      irRefs: [CAT-ENTITY-0003, INTL-SUPPORT-REQ-0001, INTL-SUPPORT-RULE-0001]
      reviewedBy: null
      reviewedAt: null

