records:
  # Customer Entity
  - record_key: acctmgmt-entity-0001
    kind: entity
    capability_key: account-management
    requirement: >
      The system SHALL maintain Customer entities identified by a unique userId (primary key).
      Each Customer MUST be associated with exactly one Account and one Profile.
    confidence: high
    confidence_basis: >
      Both passes can verify userId as primary key from CMP field declarations in ejb-jar.xml
      and the one-to-one relationship declarations. CustomerLocal interface confirms the
      public API.
    risk_class: operational
    basis: >
      CustomerEJB is declared as entity bean (lines 46-89 of ejb-jar.xml) with CMP field
      userId (line 59) and primary key (line 61). CMR relationships to Account (line 273-284)
      and Profile (line 309-326) are both 1:1 from Customer side. CustomerEJB.java ejbPostCreate
      creates Account and Profile on customer creation.
    traces:
      - path: legacy-source/petstore1.3.2/src/components/customer/src/ejb-jar.xml
        line_start: 46
        line_end: 89
        excerpt: |
          <entity>
            <display-name>CustomerEB</display-name>
            <ejb-name>CustomerEJB</ejb-name>
            <cmp-field>
              <field-name>userId</field-name>
            </cmp-field>
            <primkey-field>userId</primkey-field>
            <ejb-local-ref>
              <ejb-ref-name>ejb/Profile</ejb-ref-name>
            </ejb-local-ref>
            <ejb-local-ref>
              <ejb-ref-name>ejb/Account</ejb-ref-name>
            </ejb-local-ref>
          </entity>
      - path: legacy-source/petstore1.3.2/src/components/customer/src/ejb-jar.xml
        line_start: 264
        line_end: 327
        excerpt: |
          <ejb-relation>
            <ejb-relationship-role>
              <ejb-relationship-role-name>CustomerEJB</ejb-relationship-role-name>
              <multiplicity>One</multiplicity>
              <cmr-field>
                <cmr-field-name>account</cmr-field-name>
              </cmr-field>
            </ejb-relationship-role>
            <ejb-relationship-role>
              <ejb-relationship-role-name>AccountEJB</ejb-relationship-role-name>
              <multiplicity>One</multiplicity>
              <cascade-delete />
            </ejb-relationship-role>
          </ejb-relation>
          <ejb-relation>
            <ejb-relationship-role>
              <ejb-relationship-role-name>CustomerEJB</ejb-relationship-role-name>
              <multiplicity>One</multiplicity>
              <cmr-field>
                <cmr-field-name>profile</cmr-field-name>
              </cmr-field>
            </ejb-relationship-role>
            <ejb-relationship-role>
              <ejb-relationship-role-name>ProfileEJB</ejb-relationship-role-name>
              <multiplicity>One</multiplicity>
              <cascade-delete />
            </ejb-relationship-role>
          </ejb-relation>
    stack_metadata:
      ejb.bean: CustomerEJB
      ejb.transaction: Required

  # Account Entity
  - record_key: acctmgmt-entity-0002
    kind: entity
    capability_key: account-management
    requirement: >
      The system SHALL maintain Account entities with a status field that tracks
      the account state. Each Account MUST be associated with one Customer (cascading
      delete when Customer is removed), one CreditCard, and one ContactInfo.
    confidence: high
    confidence_basis: >
      Status field is an explicit CMP field (line 242 ejb-jar.xml). The 1:1 relationship
      with ContactInfo and CreditCard is declared with cascade-delete. AccountEJB getStatus
      and setStatus confirm read/write capability.
    risk_class: operational
    basis: >
      AccountEJB is declared as entity bean (lines 230-262 of ejb-jar.xml) with CMP field
      status (lines 240-243). Relationships to CreditCard (lines 349-369), ContactInfo
      (lines 328-348), and Customer (lines 264-285) with cascade-delete on Account side
      are declared.
    traces:
      - path: legacy-source/petstore1.3.2/src/components/customer/src/ejb-jar.xml
        line_start: 230
        line_end: 262
        excerpt: |
          <entity>
            <display-name>AccountEB</display-name>
            <ejb-name>AccountEJB</ejb-name>
            <cmp-field>
              <field-name>status</field-name>
            </cmp-field>
            <ejb-local-ref>
              <ejb-ref-name>ejb/CreditCard</ejb-ref-name>
            </ejb-local-ref>
            <ejb-local-ref>
              <ejb-ref-name>ejb/ContactInfo</ejb-ref-name>
            </ejb-local-ref>
          </entity>
      - path: legacy-source/petstore1.3.2/src/components/customer/src/com/sun/j2ee/blueprints/customer/account/ejb/AccountLocal.java
        line_start: 44
        line_end: 54
        excerpt: |
          public interface AccountLocal extends javax.ejb.EJBLocalObject {
            public String getStatus();
            public void setStatus(String status);
            public CreditCardLocal getCreditCard();
            public void setCreditCard(CreditCardLocal card);
            public ContactInfoLocal getContactInfo();
            public void setContactInfo(ContactInfoLocal contactInfo);
          }
    stack_metadata:
      ejb.bean: AccountEJB
      ejb.transaction: Required

