  # User identification
  - record_key: auth-entity-0001
    kind: entity
    capability_key: user-authentication
    requirement: >
      The system SHALL identify customers uniquely by userId, which serves as the primary key
      for the Customer entity.
    confidence: high
    confidence_basis: >
      userId is declared as the only CMP field and primary key in ejb-jar.xml (lines 59, 61).
      CustomerLocal interface exposes getUserId() as the only identity accessor.
    risk_class: operational
    basis: >
      CustomerEJB CMP field declaration (line 59) and primkey-field (line 61) in ejb-jar.xml
      establish userId as the sole identifier. CustomerLocal.getUserId() (line 45 in interface)
      confirms it is public API.
    traces:
      - path: legacy-source/petstore1.3.2/src/components/customer/src/ejb-jar.xml
        line_start: 59
        line_end: 61
        excerpt: |
