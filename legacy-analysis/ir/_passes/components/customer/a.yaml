  # Business Rule: Auto-create Account on Customer creation
  - record_key: acctmgmt-rule-0001
    kind: business-rule
    capability_key: account-management
    requirement: >
      When a Customer is created, the system SHALL automatically create an associated Account
      with status "Active".
    confidence: high
    confidence_basis: >
      The ejbPostCreate method in CustomerEJB.java explicitly creates an Account with
      AccountLocalHome.Active status (line 78). This is an invariant enforced at entity creation time.
    risk_class: operational
    basis: >
      CustomerEJB.ejbPostCreate (lines 74-89) performs InitialContext lookup for
      "java:comp/env/ejb/Account", calls alh.create(AccountLocalHome.Active), and
      setAccount(account). The Active constant is implicitly defined in AccountLocalHome.
    traces:
      - path: legacy-source/petstore1.3.2/src/components/customer/src/com/sun/j2ee/blueprints/customer/ejb/CustomerEJB.java
        line_start: 74
        line_end: 89
        excerpt: |
          public void ejbPostCreate(String userId) throws CreateException {
            try {
            InitialContext ic = new InitialContext();
            AccountLocalHome alh = (AccountLocalHome) ic.lookup("java:comp/env/ejb/Account");
            AccountLocal account = alh.create(AccountLocalHome.Active);
            setAccount(account);
            ...
            } catch (NamingException ne) {
                throw new CreateException ("could not lookup ejb. Exception is " + ne.getMessage());
            }
          }
    stack_metadata:
      ejb.bean: CustomerEJB
      ejb.transaction: Required

  # Business Rule: Auto-create Profile with defaults on Customer creation
  - record_key: acctmgmt-rule-0002
    kind: business-rule
    capability_key: account-management
    requirement: >
      When a Customer is created, the system SHALL automatically create an associated Profile
      with default values: preferredLanguage="en_US", favoriteCategory=null, myListPreference=true,
      bannerPreference=true.
    confidence: high
    confidence_basis: >
      CustomerEJB.ejbPostCreate explicitly calls plh.create() with four constants from
      ProfileLocalHome (lines 82-84). ProfileLocalHome.java defines these constants (lines 44-47)
      with exact values.
    risk_class: operational
    basis: >
      CustomerEJB.ejbPostCreate (lines 81-85) performs InitialContext lookup for
      "java:comp/env/ejb/Profile" and calls create() with four arguments from ProfileLocalHome
      constants: DefaultPreferredLanguage, DefaultFavoriteCategory, DefaultMyListPreference,
      DefaultBannerPreference. ProfileLocalHome interface defines these as public static finals.
    traces:
      - path: legacy-source/petstore1.3.2/src/components/customer/src/com/sun/j2ee/blueprints/customer/ejb/CustomerEJB.java
        line_start: 81
