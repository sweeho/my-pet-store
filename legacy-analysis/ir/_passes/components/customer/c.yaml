records:
  - record_key: account-management-entity-customer-0001
    kind: entity
    capability_key: account-management
    requirement: >
      The system SHALL maintain a Customer entity as the root of customer account data,
      identified by a unique userId string. Each Customer entity SHALL have relationships
      to exactly one Account entity and exactly one Profile entity. When a Customer is
      created via ejbCreate(userId), the userId SHALL be stored and upon ejbPostCreate,
      an Account with status "active" and a Profile with default preferences SHALL be
      automatically created.
    confidence: high
    confidence_basis: >
      Declared in ejb-jar.xml as a CMP entity bean with persistence-type Container,
      prim-key-class String. Confirmed by ejbCreate/ejbPostCreate implementation in
      CustomerEJB.java (lines 69-89). The Account creation uses AccountLocalHome.Active
      constant (defined in AccountLocalHome.java line 48 as "active") and Profile is
      created with declared defaults (ProfileLocalHome.java lines 44-47).
    risk_class: operational
    basis: >
      - ejb-jar.xml: lines 46-89 define CustomerEJB as container-managed entity
      - CustomerEJB.java: ejbCreate stores userId (line 70), ejbPostCreate creates Account
        and Profile (lines 81-85)
      - AccountLocalHome.java: line 48 declares Active status constant as "active"
      - ProfileLocalHome.java: lines 44-47 declare all default profile values
    traces:
      - path: legacy-source/petstore1.3.2/src/components/customer/src/ejb-jar.xml
        line_start: 46
        line_end: 89
        excerpt: |
          <entity>
            <display-name>CustomerEB</display-name>
            <ejb-name>CustomerEJB</ejb-name>
            <local-home>com.sun.j2ee.blueprints.customer.ejb.CustomerLocalHome</local-home>
            <local>com.sun.j2ee.blueprints.customer.ejb.CustomerLocal</local>
            <ejb-class>com.sun.j2ee.blueprints.customer.ejb.CustomerEJB</ejb-class>
            <persistence-type>Container</persistence-type>
            <prim-key-class>java.lang.String</prim-key-class>
      - path: legacy-source/petstore1.3.2/src/components/customer/src/com/sun/j2ee/blueprints/customer/ejb/CustomerEJB.java
        line_start: 69
        line_end: 89
        excerpt: |
          public String ejbCreate(String userId) throws CreateException {
              setUserId(userId);
              return null;
          }
          public void ejbPostCreate(String userId) throws CreateException {
              try {
              InitialContext ic = new InitialContext();
              AccountLocalHome alh = (AccountLocalHome) ic.lookup("java:comp/env/ejb/Account");
              AccountLocal account = alh.create(AccountLocalHome.Active);
              setAccount(account);
              ProfileLocalHome plh = (ProfileLocalHome) ic.lookup("java:comp/env/ejb/Profile");
              ProfileLocal profile = plh.create(ProfileLocalHome.DefaultPreferredLanguage,
              ProfileLocalHome.DefaultFavoriteCategory, ProfileLocalHome.DefaultMyListPreference,
              ProfileLocalHome.DefaultBannerPreference);
              setProfile(profile);
    stack_metadata:
      ejb.bean: CustomerEJB
      persistence: container-managed

