  - record_key: payment-processing-entity-creditcard-0001
    kind: entity
    capability_key: payment-processing
    requirement: >
      The system SHALL maintain a CreditCard entity to store customer payment information.
      CreditCard SHALL have three persistent fields: cardNumber (string), cardType (string),
      and expiryDate (string in MM/YYYY format). Valid card types are "Java(TM) Card",
      "Duke Express", and "Meow Card". The CreditCard entity SHALL provide computed
      getter methods getExpiryMonth() and getExpiryYear() that parse the expiryDate string.
    confidence: high
    confidence_basis: >
      Declared in ejb-jar.xml as CMP entity. Card types and persistence declared.
      Expiry date parsing logic is explicitly implemented in CreditCardEJB.java lines 88-107,
      with fallback defaults of "01" for month and "2010" for year if date is null or malformed.
    risk_class: financial
    basis: >
      - ejb-jar.xml: lines 123-149 define CreditCardEJB with three CMP fields
      - CreditCardEJB.java: lines 88-107 show parsing of expiryDate by indexOf("/")
      - create_customer.jsp: lines 143-147 show three card type options
    traces:
      - path: legacy-source/petstore1.3.2/src/components/customer/src/ejb-jar.xml
        line_start: 133
        line_end: 144
        excerpt: |
          <cmp-field>
            <description>no description</description>
            <field-name>cardType</field-name>
          </cmp-field>
          <cmp-field>
            <description>no description</description>
            <field-name>expiryDate</field-name>
          </cmp-field>
          <cmp-field>
            <description>no description</description>
            <field-name>cardNumber</field-name>
          </cmp-field>
      - path: legacy-source/petstore1.3.2/src/components/creditcard/src/com/sun/j2ee/blueprints/creditcard/ejb/CreditCardEJB.java
        line_start: 88
        line_end: 107
        excerpt: |
          public String getExpiryMonth() {
              String dateString = getExpiryDate();
              if (dateString != null) {
                // get the slash and return the text before it
                int slashStart = dateString.indexOf("/");
                if (slashStart != -1) return dateString.substring(0,slashStart);
              }
              return "01";
          }
          public String getExpiryYear() {
              String dateString = getExpiryDate();
              if (dateString != null) {
                // get the slash and return the text after it
                int slashStart = dateString.indexOf("/");
                if (slashStart != -1) return dateString.substring(slashStart +1, dateString.length());
              }
              return "2010";
    stack_metadata:
      ejb.bean: CreditCardEJB
      persistence: container-managed

  - record_key: account-management-workflow-customer-0001
    kind: workflow
    capability_key: account-management
    requirement: >
      GIVEN a user initiates account creation with a userId,
      WHEN the system receives the CREATE action in CustomerEJBAction,
      THEN the system SHALL call scf.createCustomer(userId) to create the Customer entity,
      AND THEN call updateCustomer(ce) which populates the Account's ContactInfo,
      CreditCard, and the Customer's Profile from the CustomerEvent payload.
    confidence: high
    confidence_basis: >
      Explicit implementation in CustomerEJBAction.perform() method (lines 84-89)
      and updateCustomer() method (lines 101-145). The flow creates a Customer,
      then deep-copies contact, credit card, and profile data into the related entities.
    risk_class: operational
    basis: >
      CustomerEJBAction.java implements the EJB Action pattern, responding to CREATE
      and UPDATE events by orchestrating entity creation and field population.
    traces:
      - path: legacy-source/petstore1.3.2/src/apps/petstore/src/com/sun/j2ee/blueprints/petstore/controller/ejb/actions/CustomerEJBAction.java
        line_start: 80
        line_end: 145
        excerpt: |
          public EventResponse perform(Event e) throws EventException {
              CustomerEvent ce = (CustomerEvent)e;
              scf = (ShoppingClientFacadeLocal)machine.getAttribute(PetstoreKeys.SHOPPING_CLIENT_FACADE);
              switch (ce.getActionType()) {
                  case CustomerEvent.CREATE : {
                    String userId = scf.getUserId();
                    scf.createCustomer(userId);
                    updateCustomer(ce);
                    break;
                  }
                  case CustomerEvent.UPDATE : {
                    updateCustomer(ce);
                    break;
                  }
              }
              return null;
          }
          private void updateCustomer(CustomerEvent ce) throws EventException {
              CustomerLocal customer = null;
              try {
                  customer = scf.getCustomer();
              } catch (FinderException fe) {
              }
              AccountLocal account = customer.getAccount();
              ContactInfoLocal contactInfoLocal = account.getContactInfo();
              ContactInfo contactInfo = ce.getContactInfo();
              contactInfoLocal.setFamilyName(contactInfo.getFamilyName());
              contactInfoLocal.setGivenName(contactInfo.getGivenName());
              contactInfoLocal.setTelephone(contactInfo.getPhone());
              contactInfoLocal.setEmail(contactInfo.getEmail());
              Address address = contactInfo.getAddress();
              AddressLocal addressLocal = contactInfoLocal.getAddress();
              addressLocal.setStreetName1(address.getStreetName1());
              addressLocal.setStreetName2(address.getStreetName2());
              addressLocal.setCity(address.getCity());
              addressLocal.setZipCode(address.getZipCode());
              addressLocal.setState(address.getState());
              addressLocal.setCountry(address.getCountry());
              CreditCard creditCard = ce.getCreditCard();
              CreditCardLocal creditCardLocal = account.getCreditCard();
              creditCardLocal.setCardNumber(creditCard.getCardNumber());
              creditCardLocal.setCardType(creditCard.getCardType());
              creditCardLocal.setExpiryDate(creditCard.getExpiryDate());
              ProfileInfo profileInfo = ce.getProfileInfo();
              ProfileLocal profileLocal = customer.getProfile();
              profileLocal.setPreferredLanguage(profileInfo.getPreferredLanguage());
              profileLocal.setFavoriteCategory(profileInfo.getFavoriteCategory());
              profileLocal.setMyListPreference(profileInfo.getMyListPreference());
              profileLocal.setBannerPreference(profileInfo.getBannerPreference());
              Locale locale = I18nUtil.getLocaleFromString(profileInfo.getPreferredLanguage());
              machine.setAttribute("locale", locale);
    stack_metadata:
      framework: waf-event-action
      ejb.transaction: Required

