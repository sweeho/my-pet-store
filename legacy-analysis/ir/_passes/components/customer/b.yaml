  - record_key: account-mgmt-customer-creation-0001
    kind: workflow
    capability_key: account-management
    requirement: >
      The system SHALL support customer account creation. GIVEN a user submits a form with
      contact information, credit card details, and profile preferences, WHEN the system
      processes the create request, THEN the system SHALL create a Customer entity,
      automatically create an associated Account entity, and automatically create an
      associated Profile entity, linking all entities correctly.
    confidence: high
    confidence_basis: >
      The CustomerHTMLAction.perform() method handles "create" action (lines 94-99).
      The CustomerEvent is created with CREATE type. The CustomerEJB.ejbPostCreate
      creates Account and Profile automatically (lines 74-89). The JSP form posts to
      createcustomer.do (line 46).
    risk_class: operational
    basis: >
      CustomerHTMLAction.java implements the extraction and validation of all form fields
      for creation. CustomerEJB.ejbPostCreate demonstrates automatic creation of related
      entities. The JSP form collects all required data.
    traces:
      - path: legacy-source/petstore1.3.2/src/apps/petstore/src/com/sun/j2ee/blueprints/petstore/controller/web/actions/CustomerHTMLAction.java
        line_start: 94
        line_end: 99
        excerpt: |
          if (actionType.equals("create")) {
              ContactInfo info = extractContactInfo(request, "_a");
              CreditCard creditCard = extractCreditCard(request);
              ProfileInfo profileInfo  = extractProfileInfo(request);
              event = new CustomerEvent(CustomerEvent.CREATE, info, profileInfo, creditCard);
      - path: legacy-source/petstore1.3.2/src/components/customer/src/com/sun/j2ee/blueprints/customer/ejb/CustomerEJB.java
        line_start: 74
        line_end: 89
        excerpt: |
          public void ejbPostCreate(String userId) throws CreateException {
              InitialContext ic = new InitialContext();
              AccountLocalHome alh = (AccountLocalHome) ic.lookup("java:comp/env/ejb/Account");
              AccountLocal account = alh.create(AccountLocalHome.Active);
