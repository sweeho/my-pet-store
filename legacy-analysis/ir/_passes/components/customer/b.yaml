  - record_key: account-mgmt-contact-validation-0001
    kind: business-rule
    capability_key: account-management
    requirement: >
      The system SHALL validate that required contact fields are not empty. Required
      fields are: given name, family name, street address (line 1), city, state/province,
      postal code, and telephone number. Email is optional.
    confidence: high
    confidence_basis: >
      ContactInfo extraction logic explicitly checks each required field for empty
      string (lines 185-238). Email is treated differently - it checks for null and
      then trims (lines 241-244), allowing it to be optional. MissingFormDataException
      is raised if any required field is missing (lines 245-248).
    risk_class: operational
    basis: >
      CustomerHTMLAction.extractContactInfo shows field-by-field validation logic.
    traces:
      - path: legacy-source/petstore1.3.2/src/apps/petstore/src/com/sun/j2ee/blueprints/petstore/controller/web/actions/CustomerHTMLAction.java
        line_start: 182
        line_end: 253
        excerpt: |
          private ContactInfo extractContactInfo(HttpServletRequest request, String suffix) {
              ArrayList missingFields = null;
              String familyName =  request.getParameter("family_name" +suffix).trim();
              if (familyName.equals("")) { missingFields.add("Last Name"); }
              String givenName =  request.getParameter("given_name" +suffix).trim();
              if (givenName.equals("")) { missingFields.add("First Name"); }
              String address1 = request.getParameter("address_1" +suffix).trim();
              if (address1.equals("")){ missingFields.add("Street Address"); }
              String city =   request.getParameter("city"  +suffix).trim();
              if (city.equals("")){ missingFields.add("City"); }
              String stateOrProvince = request.getParameter("state_or_province" +suffix).trim();
              if (stateOrProvince.equals("")) { missingFields.add("State or Province"); }
              String postalCode = request.getParameter("postal_code" +suffix).trim();
              if (postalCode.equals("")){ missingFields.add("Postal Code"); }
              String telephone = request.getParameter("telephone_number" +suffix).trim();
              if (telephone.equals("")){ missingFields.add("Telephone Number"); }
              String email = null;
              if (request.getParameter("email"  +suffix) != null) {
                  email = request.getParameter("email" +suffix).trim();
              }
              if (missingFields != null) {
                  MissingFormDataException ex = new MissingFormDataException("Missing Address Data", missingFields);
                  request.setAttribute(PetstoreKeys.MISSING_FORM_DATA_EXCEPTION_KEY, ex);
                  return null;
              }

  - record_key: account-mgmt-creditcard-required-0001
    kind: business-rule
    capability_key: payment-processing
    requirement: >
