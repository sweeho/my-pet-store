  - record_key: account-mgmt-relationship-0001
    kind: business-rule
    capability_key: account-management
    requirement: >
      The system SHALL enforce a one-to-one relationship between a Customer and an
      Account. When a customer is created, a new account SHALL be automatically created
      and linked to the customer. When a customer is deleted, the account SHALL be
      cascade-deleted.
    confidence: high
    confidence_basis: >
      The ejb-jar.xml explicitly declares the one-to-one relationship with cascade-delete
      semantics (lines 265-285). The CustomerEJB.ejbPostCreate method creates an Account
      automatically via AccountLocalHome.create (lines 77-79). Two independent sources
      (declarative and programmatic) confirm this rule.
    risk_class: operational
    basis: >
      ejb-jar.xml defines the CMR relationship with cascade-delete semantic.
      CustomerEJB programmatically enforces the creation of the account link.
    traces:
      - path: legacy-source/petstore1.3.2/src/components/customer/src/ejb-jar.xml
        line_start: 265
        line_end: 285
        excerpt: |
          <ejb-relation>
            <ejb-relationship-role>
              <ejb-relationship-role-name>CustomerEJB</ejb-relationship-role-name>
              <multiplicity>One</multiplicity>
              <cmr-field>
                <cmr-field-name>account</cmr-field-name>
              </cmr-field>
            </ejb-relationship-role>
            <ejb-relationship-role>
              <ejb-relationship-role-name>AccountEJB</ejb-relationship-role-name>
              <multiplicity>One</multiplicity>
              <cascade-delete />
      - path: legacy-source/petstore1.3.2/src/components/customer/src/com/sun/j2ee/blueprints/customer/ejb/CustomerEJB.java
        line_start: 74
        line_end: 89
        excerpt: |
          public void ejbPostCreate(String userId) throws CreateException {
              InitialContext ic = new InitialContext();
              AccountLocalHome alh = (AccountLocalHome) ic.lookup("java:comp/env/ejb/Account");
              AccountLocal account = alh.create(AccountLocalHome.Active);
              setAccount(account);

