    basis: >
      ejb-jar.xml declares AccountEJB as entity with cmp-field status (lines 230-262).
      AccountEJB.java shows two ejbCreate methods with status parameter (lines 70-78).
      CustomerEJB.ejbPostCreate uses AccountLocalHome.Active constant (line 78).
