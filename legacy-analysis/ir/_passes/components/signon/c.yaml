  - record_key: AUTH-OPER-0004
    kind: business-rule
    capability_key: user-authentication
    requirement: >
      The system SHALL provide a "Remember My User Name" checkbox on the sign-in form.
      When checked, the system SHALL store the userName in a cookie named "bp_signon"
      with a 2678400 second (30-day) expiration.
    confidence: high
    confidence_basis: >
      Cookie logic explicitly implemented in SignOnFilter.validateSignOn() with hardcoded
      expiration value and cookie name. Checkbox present in signon.jsp.
    risk_class: operational
    basis: >
      SignOnFilter.validateSignOn() checks for REMEMBER_USERNAME parameter.
      If present, creates a Cookie with COOKIE_NAME ("bp_signon") and userName value.
      Sets maxAge to 2678400 seconds (30 days = 2678400 seconds = 60 * 60 * 24 * 31).
    traces:
      - path: legacy-source/petstore1.3.2/src/components/signon/src/com/sun/j2ee/blueprints/signon/web/SignOnFilter.java
        line_start: 74
        line_end: 79
        excerpt: |
          public static final String REMEMBER_USERNAME = "j_remember_username";
          public static final String USER_NAME = "j_signon_username";
          public static final String SIGNED_ON_USER  = "j_signon";
          public static final String ORIGINAL_URL = "j_signon_original_url";
          public static final String CREATE_USER_URL = "j_create_user";
          public static final String COOKIE_NAME = "bp_signon";
      - path: legacy-source/petstore1.3.2/src/components/signon/src/com/sun/j2ee/blueprints/signon/web/SignOnFilter.java
        line_start: 167
        line_end: 173
        excerpt: |
          if (rememberUserName != null) {
            // set a cookie with the username in it
            Cookie userNameCookie = new Cookie(COOKIE_NAME, userName);
