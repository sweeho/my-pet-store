  - record_key: AUTH-OPER-0001
    kind: workflow
    capability_key: user-authentication
    requirement: >
      The system SHALL authenticate a user by accepting a userName and password,
      verifying the credentials against registered users, and returning success or failure.
    confidence: high
    confidence_basis: >
      Core workflow implemented in SignOnEJB.authenticate() and invoked from SignOnFilter.
      Two independent code paths implement the same logic.
    risk_class: operational
    basis: >
      SignOnEJB.authenticate(String userName, String password) looks up the user by
      userName and calls user.matchPassword(password). Returns true if user found and
      password matches, false if user not found (catches FinderException).
    traces:
      - path: legacy-source/petstore1.3.2/src/components/signon/src/com/sun/j2ee/blueprints/signon/ejb/SignOnEJB.java
        line_start: 71
        line_end: 78
        excerpt: |
          public boolean authenticate(String userName, String password) {
              try {
                  UserLocal user = ulh.findByPrimaryKey(userName);
                  return user.matchPassword(password);
              } catch (FinderException fe) {
                  return false; // User not found, so authentication failed.
              }
          }
    stack_metadata:
      ejb.bean: SignOnEJB
      ejb.transaction: Required

  - record_key: AUTH-OPER-0002
    kind: business-rule
    capability_key: user-authentication
    requirement: >
      Password verification SHALL be performed using exact string matching (case-sensitive).
    confidence: high
    confidence_basis: >
      UserEJB.matchPassword() uses the equals() method directly on the password string,
      with no intermediate transformation or hashing.
    risk_class: operational
    basis: >
      UserEJB.matchPassword(String password) returns the result of
      password.equals(getPassword()), which performs case-sensitive string comparison.
      No hashing, encoding, or other transformation is applied.
    traces:
      - path: legacy-source/petstore1.3.2/src/components/signon/src/com/sun/j2ee/blueprints/signon/user/ejb/UserEJB.java
        line_start: 88
        line_end: 90
        excerpt: |
          public boolean matchPassword(String password) {
              return password.equals(getPassword());
          }
    stack_metadata:
      ejb.bean: UserEJB

  - record_key: AUTH-OPER-0003
    kind: workflow
    capability_key: user-authentication
    requirement: >
      When user authentication fails, the system SHALL redirect the user to a failure page.
      When user authentication succeeds, the system SHALL establish a session and redirect
      to the originally requested resource.
    confidence: high
    confidence_basis: >
      SignOnFilter.validateSignOn() implements explicit redirect logic for both success
      and failure paths. Confirmed in JSP error page content.
    risk_class: operational
    basis: >
      SignOnFilter.validateSignOn() calls authenticate(). On success (line 201),
      sets session attributes and calls hres.sendRedirect(targetURL).
      On failure (line 207), calls hres.sendRedirect(signOnErrorPage).
    traces:
      - path: legacy-source/petstore1.3.2/src/components/signon/src/com/sun/j2ee/blueprints/signon/web/SignOnFilter.java
        line_start: 188
        line_end: 210
        excerpt: |
          //validate against the registered users
          SignOnLocal signOn = getSignOnEjb();
          boolean authenticated = signOn.authenticate(userName, password);
          if (authenticated) {
              // place a true boolean in the session
              if (hreq.getSession().getAttribute(USER_NAME) != null) {
                  hreq.getSession().removeAttribute(USER_NAME);
              }
              hreq.getSession().setAttribute(USER_NAME, userName);
              // remove the sign on user key before putting it back in
              if (hreq.getSession().getAttribute(SIGNED_ON_USER) != null) {
                  hreq.getSession().removeAttribute(SIGNED_ON_USER);
              }
              hreq.getSession().setAttribute(SIGNED_ON_USER, new Boolean(true));
              // redirect to the original destination
              String targetURL = (String)hreq.getSession().getAttribute(ORIGINAL_URL);
              hres.sendRedirect(targetURL);
              return;
          } else {
              hres.sendRedirect(signOnErrorPage);
              return;
          }
    stack_metadata:
      framework: Servlet Filter

