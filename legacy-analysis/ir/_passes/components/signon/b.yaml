    kind: requirement
    capability_key: user-authentication
    requirement: >
      The system SHALL store user authentication state in the HTTP session under the key
      'j_signon' as a Boolean value indicating whether the user is currently signed on.
    confidence: high
    confidence_basis: >
      The session attribute is explicitly named and set in multiple places in SignOnFilter,
      checked on every filter invocation, and follows a clear convention (j_signon prefix for all
      session keys related to sign-on). This is the system's only authentication state storage mechanism.
    risk_class: operational
    basis: >
      SignOnFilter checks hreq.getSession().getAttribute(SIGNED_ON_USER) where SIGNED_ON_USER="j_signon".
      The value is set to Boolean(true) on successful authentication and Boolean(false) otherwise.
      It is checked at the start of every request in the doFilter method.
