  - record_key: UATH-REQ-0002
    kind: requirement
    capability_key: user-authentication
    requirement: >
      The system SHALL authenticate a user by verifying the provided username and password
      against stored user credentials via the SignOnEJB.authenticate() method.
    confidence: high
    confidence_basis: >
      Both the filter code and the EJB interface clearly show this is the single authentication path.
      The authentication logic is deterministic and the invocation point is explicit in SignOnFilter.
    risk_class: operational
    basis: >
      SignOnFilter.validateSignOn invokes signOn.authenticate(userName, password) at lines 190,
      which returns a boolean. The implementation in SignOnEJB finds the user by userName and
      calls matchPassword on the UserLocal entity bean.
    traces:
      - path: legacy-source/petstore1.3.2/src/components/signon/src/com/sun/j2ee/blueprints/signon/web/SignOnFilter.java
        line_start: 157
        line_end: 210
        excerpt: |
          public void validateSignOn(ServletRequest request, ServletResponse response, FilterChain chain)
            throws IOException, ServletException {
            String userName = hreq.getParameter(FORM_USER_NAME);
            String password = hreq.getParameter(FORM_PASSWORD);
            SignOnLocal signOn = getSignOnEjb();
            boolean authenticated = signOn.authenticate(userName, password);
            if (authenticated) {
              hreq.getSession().setAttribute(SIGNED_ON_USER, new Boolean(true));
              hres.sendRedirect(targetURL);
            }
      - path: legacy-source/petstore1.3.2/src/components/signon/src/com/sun/j2ee/blueprints/signon/ejb/SignOnEJB.java
        line_start: 71
        line_end: 78
        excerpt: |
          public boolean authenticate(String userName, String password) {
            try {
              UserLocal user = ulh.findByPrimaryKey(userName);
              return user.matchPassword(password);
            } catch (FinderException fe) {
              return false;
            }

