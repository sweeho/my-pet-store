records:
  - record_key: user-authentication-req-0001
    kind: requirement
    capability_key: user-authentication
    requirement: >
      The system SHALL authenticate a user by verifying that the provided password
      matches the stored password for the given username.
    confidence: high
    confidence_basis: >
      Both authenticate() method in SignOnEJB (business logic) and matchPassword() in UserEJB
      (entity validation) verify this behavior. The implementation is straightforward and consistent.
    risk_class: operational
    basis: >
      SignOnEJB.authenticate() retrieves a UserLocal by username and calls matchPassword() to compare
      the provided password with the stored password. UserEJB.matchPassword() performs an exact string
      equality check (password.equals(getPassword())).
    traces:
      - path: legacy-source/petstore1.3.2/src/components/signon/src/com/sun/j2ee/blueprints/signon/ejb/SignOnEJB.java
        line_start: 71
        line_end: 78
        excerpt: |
          public boolean authenticate(String userName, String password) {
              try {
                  UserLocal user = ulh.findByPrimaryKey(userName);
                  return user.matchPassword(password);
              } catch (FinderException fe) {
                  return false; // User not found, so authentication failed.
              }
          }
      - path: legacy-source/petstore1.3.2/src/components/signon/src/com/sun/j2ee/blueprints/signon/user/ejb/UserEJB.java
        line_start: 88
        line_end: 90
        excerpt: |
          public boolean matchPassword(String password) {
              return password.equals(getPassword());
          }
    stack_metadata:
      ejb.bean: SignOnEJB (Stateless Session)
      ejb.bean: UserEJB (Container-Managed Persistent Entity)
      ejb.transaction: Required

  - record_key: user-authentication-req-0002
    kind: requirement
    capability_key: user-authentication
    requirement: >
      The system SHALL return false when a user attempts to authenticate with a username
      that does not exist in the system.
    confidence: high
    confidence_basis: >
      Exception handling is explicit in the authenticate() method. FinderException is caught
      and the method returns false, indicating the behavior is intentional.
    risk_class: operational
    basis: >
      SignOnEJB.authenticate() catches FinderException when ulh.findByPrimaryKey(userName) fails
      and explicitly returns false with a comment stating "User not found, so authentication failed."
    traces:
      - path: legacy-source/petstore1.3.2/src/components/signon/src/com/sun/j2ee/blueprints/signon/ejb/SignOnEJB.java
        line_start: 71
        line_end: 78
        excerpt: |
          public boolean authenticate(String userName, String password) {
              try {
                  UserLocal user = ulh.findByPrimaryKey(userName);
                  return user.matchPassword(password);
              } catch (FinderException fe) {
                  return false; // User not found, so authentication failed.
              }
          }
    stack_metadata:
      ejb.bean: SignOnEJB

