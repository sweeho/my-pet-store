  - record_key: user-authentication-req-0009
    kind: requirement
    capability_key: user-authentication
    requirement: >
      The system SHALL optionally store the username in a browser cookie (bp_signon)
      when the user selects "remember username" during sign-in, with a maximum age of 2,678,400 seconds (approximately 31 days).
    confidence: high
    confidence_basis: >
      Cookie creation and expiration logic is explicit in SignOnFilter.validateSignOn().
      The constant 2678400 is set as the cookie maxAge. The feature is conditional based on
      the j_remember_username parameter.
    risk_class: presentational
    basis: >
      SignOnFilter checks for j_remember_username parameter. If present, it creates a cookie
      named bp_signon with the username and sets maxAge to 2678400 seconds. If not present,
      it removes the cookie if it exists.
    traces:
      - path: legacy-source/petstore1.3.2/src/components/signon/src/com/sun/j2ee/blueprints/signon/web/SignOnFilter.java
        line_start: 79
        line_end: 79
        excerpt: |
          public static final String COOKIE_NAME = "bp_signon";
      - path: legacy-source/petstore1.3.2/src/components/signon/src/com/sun/j2ee/blueprints/signon/web/SignOnFilter.java
        line_start: 166
        line_end: 186
        excerpt: |
          String rememberUserName = hreq.getParameter(REMEMBER_USERNAME);
          if (rememberUserName != null) {
            // set a cookie with the username in it
            Cookie userNameCookie = new Cookie(COOKIE_NAME, userName);
            // set cookie to last for one month
            userNameCookie.setMaxAge(2678400);
            hres.addCookie(userNameCookie);
          } else {
              // see if the cookie exists and remove accordingly
              Cookie[] cookies = hreq.getCookies();
              if (cookies != null) {
                  for (int loop=0; loop < cookies.length; loop++) {
                      if (cookies[loop].getName().equals(COOKIE_NAME)) {
                          cookies[loop].setMaxAge(0);
                          hres.addCookie(cookies[loop]);
                      }
                  }
              }
          }
    stack_metadata:
      session.scope: HttpSession (Cookie)

  - record_key: user-authentication-req-0010
    kind: requirement
    capability_key: user-authentication
    requirement: >
      The system SHALL intercept HTTP requests to protected resources and redirect
      unsigned-on users to a sign-on page, preserving the original URL for post-authentication redirection.
    confidence: high
    confidence_basis: >
      The SignOnFilter is a servlet filter that intercepts all requests. It checks authentication status
      and conditionally forwards to the sign-on page, storing the original URL in the session.
    risk_class: operational
    basis: >
      SignOnFilter implements the Filter interface and operates as a servlet filter. It checks
      the session for SIGNED_ON_USER attribute. If not signed on and the target URL matches
      a protected resource pattern, it stores ORIGINAL_URL in the session and forwards to the signOnPage.
    traces:
      - path: legacy-source/petstore1.3.2/src/components/signon/src/com/sun/j2ee/blueprints/signon/web/SignOnFilter.java
        line_start: 136
        line_end: 151
        excerpt: |
          Iterator it = null;
          if (protectedResources != null) it = protectedResources.keySet().iterator();
          while ((it != null) && it.hasNext()) {
              String protectedName = (String)it.next();
              ProtectedResource resource  = (ProtectedResource)protectedResources.get(protectedName);
              String urlPattern = resource.getURLPattern();
              // now check agains the targetURL
              if (urlPattern.equals(targetURL)) {
                  // put the orginal url in the session so others can access
                  hreq.getSession().setAttribute(ORIGINAL_URL,  targetURL);
                  config.getServletContext().getRequestDispatcher("/" + signOnPage).forward(request, response);
                  // Jump out of the filter and go to the next page
                  return;
              }
          }
    stack_metadata:
      framework: Servlet Filter

