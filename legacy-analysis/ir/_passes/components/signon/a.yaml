    requirement: >
      The system SHALL maintain user session state in the HTTP session using a
      j_signon boolean attribute to track signed-in status.
    confidence: high
    confidence_basis: >
      Session attribute management is explicit and consistent across SignOnFilter.
      The SIGNED_ON_USER attribute is checked, initialized, and set throughout the filter logic.
    risk_class: operational
    basis: >
      SignOnFilter maintains j_signon boolean attribute in HttpSession. It checks this
      attribute to determine if a user is signed on, initializes it to false if not present,
      and sets it to true upon successful authentication.
    traces:
