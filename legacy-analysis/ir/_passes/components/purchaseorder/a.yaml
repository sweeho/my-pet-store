  - record_key: fulfillment-management-tracking-0001
    kind: business-rule
    capability_key: fulfillment-management
    requirement: >
      The system SHALL track the quantity shipped for each line item within a purchase order.
      GIVEN a line item with ordered quantity, WHEN supplier invoice is received,
      THEN the quantityShipped field SHALL be incremented by the shipped quantity.
    confidence: high
    confidence_basis: >
      The processInvoice method in PurchaseOrderHelper explicitly implements this rule.
      The quantityShipped field is declared as a CMP field in ejb-jar.xml with a setter
      method that enforces Required transaction semantics. The logic is unambiguous and
      reachable from supplier integration points.
    risk_class: operational
    basis: >
      PurchaseOrderHelper.processInvoice is the sole handler for invoice processing.
      It iterates line items and accumulates quantityShipped values. The LineItemEJB
      CMP field and setQuantityShipped method are declared in ejb-jar.xml.
    traces:
      - path: legacy-source/petstore1.3.2/src/components/purchaseorder/src/com/sun/j2ee/blueprints/purchaseorder/ejb/PurchaseOrderHelper.java
        line_start: 80
        line_end: 91
        excerpt: |
          public boolean processInvoice(PurchaseOrderLocal po, Map lineItemIds) {
            Collection liColl = po.getLineItems();
            Iterator liIt = liColl.iterator();
            while((liIt != null) && (liIt.hasNext())) {
              LineItemLocal li = (LineItemLocal) liIt.next();
              if(lineItemIds.containsKey(li.getItemId())) {
                Integer shipped = (Integer) lineItemIds.get(li.getItemId());
                li.setQuantityShipped(li.getQuantityShipped() + shipped.intValue());
              }
            }
      - path: legacy-source/petstore1.3.2/src/components/purchaseorder/src/ejb-jar.xml
        line_start: 269
        line_end: 271
        excerpt: |
          <cmp-field>
            <field-name>quantityShipped</field-name>
          </cmp-field>
    stack_metadata:
      ejb.bean: PurchaseOrderHelper
      framework: EJB 2.x CMP

  - record_key: fulfillment-management-completion-0001
    kind: business-rule
    capability_key: fulfillment-management
    requirement: >
      The system SHALL consider a purchase order completely fulfilled when all line items
      have been shipped in their entirety. GIVEN a purchase order with multiple line items,
      WHEN the system processes invoices, THEN the order is complete if and only if
      quantity == quantityShipped for ALL line items in the order.
    confidence: high
    confidence_basis: >
      The completion logic is explicitly implemented in processInvoice method with
      an exhaustive check that iterates all line items. The method returns false if any
      single line item is incomplete. The logic is reached during supplier fulfillment
      and has no alternative paths.
    risk_class: operational
    basis: >
      The processInvoice method implements the completion check by iterating all line items
      and verifying quantity == quantityShipped. This is the definitive check for order
      completion.
    traces:
      - path: legacy-source/petstore1.3.2/src/components/purchaseorder/src/com/sun/j2ee/blueprints/purchaseorder/ejb/PurchaseOrderHelper.java
        line_start: 93
        line_end: 103
        excerpt: |
          // now loop through all LIs and see if all are shipped completely
          liColl = po.getLineItems();
          liIt = liColl.iterator();
          while((liIt != null) && (liIt.hasNext())) {
            LineItemLocal li = (LineItemLocal) liIt.next();
            if(li.getQuantity() != li.getQuantityShipped()) {
              return false;
            }
          }
          return true;
    stack_metadata:
      ejb.bean: PurchaseOrderHelper

  - record_key: internationalization-locale-0001
    kind: requirement
    capability_key: internationalization
    requirement: >
      The system SHALL store a locale preference with each purchase order.
      The default locale SHALL be en_US. Supported locale values are those that
      can be parsed by XMLDocumentUtils.getLocaleFromString().
    confidence: medium
    confidence_basis: >
      The poLocale field is declared in both ejb-jar.xml and PurchaseOrderEJB.java,
      and the DTD shows locale as an attribute with default "en_US". However, no explicit
      validation list or configuration of supported locales was found. The code converts
      locale strings but does not enumerate valid values.
    risk_class: presentational
    basis: >
      ejb-jar.xml declares poLocale CMP field. PurchaseOrder.java line 74 sets default
      Locale.US. DTD line 41 declares locale attribute with default en_US. Setter method
      accepts locale string and calls XMLDocumentUtils.getLocaleFromString for conversion.
    traces:
      - path: legacy-source/petstore1.3.2/src/components/purchaseorder/src/ejb-jar.xml
        line_start: 76
        line_end: 79
        excerpt: |
          <cmp-field>
            <description>no description</description>
            <field-name>poLocale</field-name>
          </cmp-field>
      - path: legacy-source/petstore1.3.2/src/components/purchaseorder/src/com/sun/j2ee/blueprints/purchaseorder/ejb/PurchaseOrder.java
        line_start: 73
        line_end: 74
        excerpt: |
          private SimpleDateFormat dateFormat = new SimpleDateFormat("yyyy-MM-dd");
          private Locale locale = Locale.US;
      - path: legacy-source/petstore1.3.2/src/components/purchaseorder/src/com/sun/j2ee/blueprints/purchaseorder/rsrc/schemas/PurchaseOrder.dtd
        line_start: 40
        line_end: 42
        excerpt: |
          <!ATTLIST PurchaseOrder
            locale CDATA "en_US"
          >
    stack_metadata:
      framework: J2EE Locale

