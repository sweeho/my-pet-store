            <ejb-relationship-role>
              <ejb-relationship-role-name>purchaseorder-has-lineitems</ejb-relationship-role-name>
              <multiplicity>One</multiplicity>
              <cmr-field>
                <cmr-field-name>lineItems</cmr-field-name>
