records:
  - record_key: order-placement-entity-0001
    kind: entity
    capability_key: order-placement
    requirement: >
      The system SHALL maintain a PurchaseOrder entity with the following persistent fields:
      poId (primary key), poUserId, poEmailId, poDate, poLocale, and poValue (total price).
    confidence: high
    confidence_basis: >
      Both the ejb-jar.xml declarative configuration and PurchaseOrderEJB.java implementation
      declare these CMP fields identically. The DTD schema confirms the same data structure
      with OrderId, UserId, EmailId, OrderDate, and TotalPrice. Data model enforcement
      through Container-Managed Persistence provides highest assurance of persistence.
    risk_class: operational
    basis: >
      ejb-jar.xml lines 48-84 define the PurchaseOrderEJB entity with CMP fields.
      PurchaseOrderEJB.java lines 79-145 declare abstract accessor methods for each field.
      PurchaseOrder.dtd lines 38-56 define XML serialization structure.
    traces:
      - path: legacy-source/petstore1.3.2/src/components/purchaseorder/src/ejb-jar.xml
        line_start: 48
        line_end: 84
        excerpt: |
          <entity>
            <description>PurchaseOrder CMP EJB</description>
            <display-name>PurchaseOrderEB</display-name>
            <ejb-name>PurchaseOrderEJB</ejb-name>
            <ejb-class>com.sun.j2ee.blueprints.purchaseorder.ejb.PurchaseOrderEJB</ejb-class>
            <persistence-type>Container</persistence-type>
            <prim-key-class>java.lang.String</prim-key-class>
            <cmp-field><field-name>poId</field-name></cmp-field>
            <cmp-field><field-name>poUserId</field-name></cmp-field>
            <cmp-field><field-name>poEmailId</field-name></cmp-field>
            <cmp-field><field-name>poDate</field-name></cmp-field>
            <cmp-field><field-name>poLocale</field-name></cmp-field>
            <cmp-field><field-name>poValue</field-name></cmp-field>
            <primkey-field>poId</primkey-field>
      - path: legacy-source/petstore1.3.2/src/components/purchaseorder/src/com/sun/j2ee/blueprints/purchaseorder/ejb/PurchaseOrderEJB.java
        line_start: 79
        line_end: 145
        excerpt: |
          public abstract String getPoId();
          public abstract void setPoId(String id);
          public abstract String getPoUserId();
          public abstract void setPoUserId(String id);
          public abstract String getPoEmailId();
          public abstract void setPoEmailId(String id);
          public abstract long getPoDate();
          public abstract void setPoDate(long orderDate);
          public abstract String getPoLocale();
          public abstract void setPoLocale(String loc);
          public abstract float getPoValue();
          public abstract void setPoValue(float amount);
    stack_metadata:
      ejb.bean: PurchaseOrderEJB
      framework: EJB 2.x CMP

  - record_key: order-placement-requirement-0001
    kind: requirement
    capability_key: order-placement
    requirement: >
      The system SHALL require that every PurchaseOrder contains at least one LineItem.
    confidence: high
    confidence_basis: >
      The DTD schema explicitly enforces this constraint using the '+' quantifier (LineItem+),
      not '*'. This is a structural invariant. The code's processInvoice method assumes
      getLineItems() returns a non-empty collection without defensive checks, consistent
      with this requirement.
    risk_class: operational
    basis: >
      The DTD uses LineItem+ notation, enforcing minimum cardinality of 1. The code
      in getAllItems() and processInvoice() assumes line items exist and iterates them.
    traces:
      - path: legacy-source/petstore1.3.2/src/components/purchaseorder/src/com/sun/j2ee/blueprints/purchaseorder/rsrc/schemas/PurchaseOrder.dtd
        line_start: 38
        line_end: 38
        excerpt: |
          <!ELEMENT PurchaseOrder (OrderId, UserId, EmailId, OrderDate, ShippingInfo, BillingInfo, TotalPrice, CreditCard, LineItem+)>
      - path: legacy-source/petstore1.3.2/src/components/purchaseorder/src/ejb-jar.xml
        line_start: 372
        line_end: 397
        excerpt: |
          <ejb-relation>
