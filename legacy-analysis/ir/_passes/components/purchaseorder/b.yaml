    confidence: high
    confidence_basis: >
      PurchaseOrderEJB.getAllItems() method (lines 246-257) is explicitly designed
      for this purpose as stated in its javadoc (lines 241-244). The method iterates
      line items, calls getData() on each to convert to value objects, and returns
      an ArrayList. This is documented in the javadoc explaining the transaction
      boundary requirement. The implementation is clear and straightforward.
    risk_class: operational
    basis: >
      PurchaseOrderEJB.getAllItems() (lines 246-257) iterates through getLineItems()
      collection, calls getData() on each LineItemLocal to convert to value object,
      and returns ArrayList. Javadoc (lines 241-244) explicitly states: "This gets
      all line items for this po and returns a collection of Value objects. This
      is required because managed objects cant be accessed outside transaction
      bounsaries".
    traces:
      - path: legacy-source/petstore1.3.2/src/components/purchaseorder/src/com/sun/j2ee/blueprints/purchaseorder/ejb/PurchaseOrderEJB.java
        line_start: 240
        line_end: 257
        excerpt: |
          /**
           * This gets all line items for this po and returns a collection of
           * Value objects. This is required because managed objects cant be accessed
           * outside transaction bounsaries
           * @return <Code>Collection</Code> of <Code>LineItem</Code> value objects
           */
          public Collection getAllItems() {
              Collection liColl = getLineItems();
              if(liColl == null)
                  return(null);
              ArrayList retVal = new ArrayList();
              Iterator it = liColl.iterator();
              while((it!=null) && (it.hasNext())) {
                  LineItemLocal loc = (LineItemLocal) it.next();
                  retVal.add(loc.getData());
              }
              return(retVal);
          }
    stack_metadata:
      pattern: Value Object conversion

