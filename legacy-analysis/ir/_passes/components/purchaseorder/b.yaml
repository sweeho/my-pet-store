  - record_key: FUL-BUS-0001
    kind: business-rule
    capability_key: fulfillment-management
    requirement: >
      When processing an invoice for a Purchase Order, the system SHALL update
      the quantityShipped field on each matching LineItem by adding the quantity
      received for that item, and SHALL determine if all line items have been
      completely shipped (quantity shipped equals quantity ordered).
    confidence: high
    confidence_basis: >
      PurchaseOrderHelper.processInvoice() method (lines 80-103) explicitly
      implements this logic. The method iterates line items, adds to quantityShipped,
      then checks if all items are completely shipped. The method has clear
      documentation (lines 69-79) stating its purpose. The logic is straightforward
      and unambiguous in both code and documentation.
    risk_class: operational
    basis: >
      PurchaseOrderHelper.processInvoice() (lines 80-103) accepts a PurchaseOrderLocal
      and a Map of lineItemIds to shipped quantities. It iterates line items,
      finding matches in the map, and adds to quantityShipped (line 89).
      Then it loops again checking if each item's quantity equals quantityShipped
      (line 98), returning false if any mismatch found, true if all complete.
    traces:
      - path: legacy-source/petstore1.3.2/src/components/purchaseorder/src/com/sun/j2ee/blueprints/purchaseorder/ejb/PurchaseOrderHelper.java
        line_start: 69
        line_end: 103
        excerpt: |
          /**
           * This method processes invoice information received from supplier by opc. Its
           * job is to update the LineItem fields for the received invoices.
           * Additionally it checks if all invoices of the given PO are shipped,
           * it will return true to indicate all invoices for a purchase order have
           * been joined together and the order is completely fulfilled.
           *
           * @param <Code>po</Code>
           * @param <Code>lineItemIds</Code>
           *
           * @return true or false to indicate if order is completely done
           */
          public boolean processInvoice(PurchaseOrderLocal po, Map lineItemIds) {

            //set the quantity of line items shipped in the PO
            Collection liColl = po.getLineItems();
            Iterator liIt = liColl.iterator();
            while((liIt != null) && (liIt.hasNext())) {
              LineItemLocal li = (LineItemLocal) liIt.next();
              if(lineItemIds.containsKey(li.getItemId())) {
                          Integer shipped = (Integer) lineItemIds.get(li.getItemId());
                  li.setQuantityShipped(li.getQuantityShipped() + shipped.intValue());
                  }
            }//end while

            // now loop through all LIs and see if all are shipped completely
            liColl = po.getLineItems();
            liIt = liColl.iterator();
            while((liIt != null) && (liIt.hasNext())) {
              LineItemLocal li = (LineItemLocal) liIt.next();
              if(li.getQuantity() != li.getQuantityShipped()) {
                  return false;
                  }
            }//end while
            return true;
          }
    stack_metadata:
      fulfillment_logic: invoice processing
      comparison_type: simple equality

  - record_key: ORD-BUS-0001
    kind: business-rule
    capability_key: order-placement
    requirement: >
      When creating a Purchase Order, the system SHALL accept a PurchaseOrder
      value object containing order ID, user ID, email ID, order date, locale,
      total price, shipping info (ContactInfo), billing info (ContactInfo),
      credit card information, and a collection of line items, and SHALL persist
      all of this data in related entity beans.
    confidence: high
    confidence_basis: >
      The create method signature and implementation in PurchaseOrderEJB
      (lines 197-238) shows this explicitly. The ejbCreate method accepts
      PurchaseOrder and initializes all CMP fields (lines 198-204).
      The ejbPostCreate method creates related entities: ContactInfo, CreditCard,
      and LineItem collection (lines 214-237). Both the entity and value object
      define identical fields. This is consistently implemented.
    risk_class: operational
    basis: >
      PurchaseOrderEJB.ejbCreate() (lines 197-205) accepts PurchaseOrder value
      object and sets all cmp-fields from it: poId, poUserId, poEmailId, poDate,
      poLocale, poValue. PurchaseOrderEJB.ejbPostCreate() (lines 211-238) creates
      associated entities: ContactInfoLocal from getShippingInfo() (line 218),
      CreditCardLocal from getCreditCard() (line 223), and collection of
      LineItemLocal from getLineItems() (lines 227-234).
    traces:
      - path: legacy-source/petstore1.3.2/src/components/purchaseorder/src/com/sun/j2ee/blueprints/purchaseorder/ejb/PurchaseOrderEJB.java
        line_start: 197
        line_end: 238
        excerpt: |
          public String ejbCreate(PurchaseOrder purchaseOrder) throws CreateException {
                setPoId(purchaseOrder.getOrderId());
                setPoUserId(purchaseOrder.getUserId());
                setPoEmailId(purchaseOrder.getEmailId());
                setPoDate(purchaseOrder.getOrderDate().getTime());
                setPoLocale(purchaseOrder.getLocale().toString());
                setPoValue(purchaseOrder.getTotalPrice());
                return null;
          }

          /**
           * the ejb create method
           * @param <Code>purchaseOrder</Code> the Purchase Order details
           */
          public void ejbPostCreate(PurchaseOrder purchaseOrder)
                                                   throws CreateException {
              try {
                  ServiceLocator serviceLocator = new ServiceLocator();
                  ContactInfoLocalHome cinforef = (ContactInfoLocalHome)
                      serviceLocator.getLocalHome(JNDINames.CINFO_EJB);
                  ContactInfoLocal cinfoloc = (ContactInfoLocal)
                      cinforef.create(purchaseOrder.getShippingInfo());
                  setContactInfo(cinfoloc);
                  CreditCardLocalHome cardref = (CreditCardLocalHome)
                      serviceLocator.getLocalHome(JNDINames.CARD_EJB);
                  CreditCardLocal cardloc = (CreditCardLocal)
                      cardref.create(purchaseOrder.getCreditCard());
                  setCreditCard(cardloc);
                  LineItemLocalHome lineItemref = (LineItemLocalHome)
                      serviceLocator.getLocalHome(JNDINames.LI_EJB);
                  Collection litems = purchaseOrder.getLineItems();
                  Iterator it = litems.iterator();
                  while((it != null) && (it.hasNext())) {
                      LineItem li = (LineItem) it.next();
                      LineItemLocal lineItemloc = (LineItemLocal)
                          lineItemref.create(li, 0);
                      addLineItem(lineItemloc);
                  }
              } catch(ServiceLocatorException ne) {
                  throw new CreateException("ServiceLocator Ex while persisting PO CMR :" + ne.getMessage());
              }
          }
    stack_metadata:
      ejb.transaction: Required

