    confidence: high
    confidence_basis: >
      The ejb-jar.xml entity element declares only <local-home> and <local> interfaces.
      No <home> or <remote> interfaces are declared. The interfaces are defined in separate
      files and do not extend EJBObject (remote), only EJBLocalObject.
    risk_class: operational
    basis: >
      ejb-jar.xml (lines 50-51) declares LineItemLocalHome and LineItemLocal.
      No remote interfaces are configured. LineItemLocal interface (line 48) extends
      EJBLocalObject, confirming local-only access.
    traces:
