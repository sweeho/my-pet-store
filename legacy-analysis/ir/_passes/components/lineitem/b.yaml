          public abstract void setLineNumber(String num);
          public abstract int getQuantity();
          public abstract void setQuantity(int qty);
          public abstract float getUnitPrice();
          public abstract void setUnitPrice(float price);
    stack_metadata:
      ejb.bean: LineItemEJB
      field_types: String, int, float

  # Business rules for creation
  - record_key: fulfillment-management-rule-0001
    kind: business-rule
    capability_key: fulfillment-management
    requirement: >
      A line item SHALL be created with category ID, product ID, item ID, line number,
      ordered quantity, unit price, and an initial shipped quantity. The shipped quantity
      tracks fulfilled items and can be independently updated as fulfillment occurs.
    confidence: high
    confidence_basis: >
      The ejbCreate method (lines 141-152) takes all seven parameters and sets them during
      creation. The setQuantityShipped method is explicitly declared as updatable in both
      the local interface and ejb-jar.xml container-transaction declarations. The fact that
      shipped quantity can be set at creation time and later updated independently confirms
      it is a managed fulfillment state, not derived.
    risk_class: operational
    basis: >
      LineItemEJB.ejbCreate method (lines 141-156) shows creation with all seven parameters
      including qtyShipped. LocalHome interface create method (lines 53-55 in LineItemLocalHome.java)
      declares this signature. Container-transaction in ejb-jar.xml (lines 156-166) shows
      setQuantityShipped has its own transaction boundary, indicating it is called independently.
    traces:
      - path: legacy-source/petstore1.3.2/src/components/lineitem/src/com/sun/j2ee/blueprints/lineitem/ejb/LineItemEJB.java
        line_start: 141
        line_end: 169
        excerpt: |
          public Object ejbCreate(String catId, String prodId, String itemId,
                                  String lineNo, int qty, float price, int qtyShipped)
            throws CreateException {
              setCategoryId(catId);
              setProductId(prodId);
              setItemId(itemId);
              setLineNumber(lineNo);
              setQuantity(qty);
              setUnitPrice(price);
              setQuantityShipped(qtyShipped);
              return null;
          }

          public void ejbPostCreate(String catId, String prodId, String itemId,
                                    String lineNo, int qty, float price, int qtyShipped)
                throws CreateException{}

          public Object ejbCreate(LineItem lineItem, int qty) throws CreateException {
            setCategoryId(lineItem.getCategoryId());
            setProductId(lineItem.getProductId());
            setItemId(lineItem.getItemId());
            setLineNumber(lineItem.getLineNumber());
            setQuantity(lineItem.getQuantity());
            setUnitPrice(lineItem.getUnitPrice());
            setQuantityShipped(qty);
            return null;
          }
      - path: legacy-source/petstore1.3.2/src/components/lineitem/src/ejb-jar.xml
        line_start: 156
        line_end: 166
        excerpt: |
          <container-transaction>
           <method>
             <ejb-name>LineItemEJB</ejb-name>
             <method-intf>Local</method-intf>
             <method-name>setQuantityShipped</method-name>
             <method-params>
               <method-param>int</method-param>
             </method-params>
           </method>
           <trans-attribute>Required</trans-attribute>
          </container-transaction>
    stack_metadata:
      ejb.bean: LineItemEJB
      ejb.transaction: Required
      fulfillment_tracking: quantityShipped

  - record_key: fulfillment-management-rule-0002
    kind: business-rule
    capability_key: fulfillment-management
    requirement: >
      A line item MAY be created from a LineItem data transfer object paired with an initial
      shipped quantity value. This creation method copies all fields from the transfer object
      (category ID, product ID, item ID, line number, ordered quantity, unit price) and sets
      the given shipped quantity.
    confidence: high
    confidence_basis: >
      The second ejbCreate overload (lines 158-167) explicitly accepts a LineItem object and
      an int qty parameter, then copies all six fields from the object and sets the shipped
      quantity. This is a distinct creation path visible in both the EJB implementation and
      the LocalHome interface.
    risk_class: operational
    basis: >
      LineItemEJB has two ejbCreate methods: one with seven primitive parameters, one with
      LineItem object and int. LocalHome interface (lines 57 in LineItemLocalHome.java)
      declares both signatures. The second variant constructs the entity from an existing
      LineItem object, suggesting reuse of already-parsed data.
    traces:
      - path: legacy-source/petstore1.3.2/src/components/lineitem/src/com/sun/j2ee/blueprints/lineitem/ejb/LineItemEJB.java
        line_start: 158
        line_end: 170
        excerpt: |
          public Object ejbCreate(LineItem lineItem, int qty) throws CreateException {
            setCategoryId(lineItem.getCategoryId());
            setProductId(lineItem.getProductId());
            setItemId(lineItem.getItemId());
            setLineNumber(lineItem.getLineNumber());
            setQuantity(lineItem.getQuantity());
            setUnitPrice(lineItem.getUnitPrice());
            setQuantityShipped(qty);
            return null;
          }
      - path: legacy-source/petstore1.3.2/src/components/lineitem/src/com/sun/j2ee/blueprints/lineitem/ejb/LineItemLocalHome.java
        line_start: 51
        line_end: 60
        excerpt: |
          public interface LineItemLocalHome extends EJBLocalHome{
            LineItemLocal create(String catId, String prodId, String itemId,
                                 String lineNo, int qty, float price, int qtyShipped)
              throws CreateException;

            LineItemLocal create(LineItem lineItem, int qty) throws CreateException;

            public LineItemLocal findByPrimaryKey(Object key) throws FinderException;
    stack_metadata:
      ejb.bean: LineItemEJB
      ejb.transaction: Required

  # Access control and interface rules
  - record_key: order-placement-rule-0001
    kind: business-rule
    capability_key: order-placement
    requirement: >
      All LineItem EJB methods SHALL be accessible without role-based authorization checks.
      Access is unrestricted and authenticated only by the EJB container.
    confidence: high
    confidence_basis: >
      The ejb-jar.xml assembly-descriptor declares <unchecked /> method permissions for all
      methods on LineItemEJB, indicating no role-based access control is enforced at the
      container level. This is a declarative authorization statement.
    risk_class: operational
    basis: >
      ejb-jar.xml method-permission element (lines 86-92) shows <unchecked /> for all methods
      with method-name="*" on LineItemEJB, meaning no specific roles are required.
    traces:
      - path: legacy-source/petstore1.3.2/src/components/lineitem/src/ejb-jar.xml
        line_start: 85
        line_end: 93
        excerpt: |
          <assembly-descriptor>
            <method-permission>
              <unchecked />
              <method>
                <ejb-name>LineItemEJB</ejb-name>
                <method-name>*</method-name>
              </method>
            </method-permission>
    stack_metadata:
      ejb.bean: LineItemEJB
      security.method_permission: unchecked

