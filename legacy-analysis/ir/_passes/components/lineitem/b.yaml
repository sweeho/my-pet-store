  # Transaction requirements
  - record_key: order-placement-rule-0003
    kind: business-rule
    capability_key: order-placement
    requirement: >
      All LineItem getter methods (getCategoryId, getProductId, getItemId, getLineNumber,
      getQuantity, getUnitPrice, getQuantityShipped) and the getData() method SHALL execute
      within a container-managed transaction with attribute "Required". The setQuantityShipped
      method SHALL also execute with transaction attribute "Required".
    confidence: high
    confidence_basis: >
      The ejb-jar.xml container-transaction elements (lines 93-205) explicitly declare
      transaction attributes for each method. Every declared method has trans-attribute
      set to "Required", indicating the container must create a transaction if none exists.
      This is declarative and enforced by the EJB container.
    risk_class: operational
    basis: >
      ejb-jar.xml defines container-transaction elements for getCategoryId (line 100),
      getProductId (line 109), getItemId (line 118), getLineNumber (line 127),
      getQuantity (line 136), getUnitPrice (line 145), getQuantityShipped (line 154),
      setQuantityShipped (line 165), and getData (line 203), all with trans-attribute "Required".
    traces:
      - path: legacy-source/petstore1.3.2/src/components/lineitem/src/ejb-jar.xml
        line_start: 93
        line_end: 205
        excerpt: |
          <assembly-descriptor>
            <container-transaction>
             <method>
               <ejb-name>LineItemEJB</ejb-name>
               <method-intf>Local</method-intf>
               <method-name>getCategoryId</method-name>
               <method-params />
             </method>
             <trans-attribute>Required</trans-attribute>
            </container-transaction>
            ...
            <container-transaction>
             <method>
