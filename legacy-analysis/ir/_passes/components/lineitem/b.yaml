records:
  # Entity definitions
  - record_key: order-placement-entity-0001
    kind: entity
    capability_key: order-placement
    requirement: >
      The system SHALL represent line items as persistent entities with identifier, product references
      (category ID, product ID, item ID), line number, quantity ordered, unit price, and quantity shipped.
      Each line item belongs to exactly one order and tracks both ordered and fulfilled quantities.
    confidence: high
    confidence_basis: >
      The LineItemEJB CMP entity bean declares all fields explicitly in ejb-jar.xml with corresponding
      abstract accessor methods. The Container-Managed Persistence (CMP 2.x) enforces schema mapping.
      The LineItem.java transfer object mirrors the entity fields, confirming the data structure is
      persistent and accessed consistently.
    risk_class: operational
    basis: >
      LineItemEJB abstract entity bean (lines 50-136 in LineItemEJB.java) declares abstract accessor
      methods for all persistent fields: categoryId, productId, itemId, lineNumber, quantity, unitPrice,
      quantityShipped. ejb-jar.xml (lines 57-78) declares CMP fields matching these accessors.
      LineItem.java (lines 63-68) defines the transfer object with identical field structure.
    traces:
      - path: legacy-source/petstore1.3.2/src/components/lineitem/src/ejb-jar.xml
        line_start: 46
        line_end: 83
        excerpt: |
          <entity>
            <description>LineItem CMP EJB</description>
            <display-name>LineItemEB</display-name>
            <ejb-name>LineItemEJB</ejb-name>
            <local-home>com.sun.j2ee.blueprints.lineitem.ejb.LineItemLocalHome</local-home>
            <local>com.sun.j2ee.blueprints.lineitem.ejb.LineItemLocal</local>
            <ejb-class>com.sun.j2ee.blueprints.lineitem.ejb.LineItemEJB</ejb-class>
            <persistence-type>Container</persistence-type>
            <cmp-version>2.x</cmp-version>
            <abstract-schema-name>LineItem</abstract-schema-name>
            <cmp-field>
              <field-name>categoryId</field-name>
            </cmp-field>
            <cmp-field>
              <field-name>productId</field-name>
            </cmp-field>
            <cmp-field>
              <field-name>itemId</field-name>
            </cmp-field>
            <cmp-field>
              <field-name>lineNumber</field-name>
            </cmp-field>
            <cmp-field>
              <field-name>quantity</field-name>
            </cmp-field>
            <cmp-field>
              <field-name>unitPrice</field-name>
            </cmp-field>
            <cmp-field>
              <field-name>quantityShipped</field-name>
            </cmp-field>
      - path: legacy-source/petstore1.3.2/src/components/lineitem/src/com/sun/j2ee/blueprints/lineitem/ejb/LineItemEJB.java
        line_start: 50
        line_end: 136
        excerpt: |
          public abstract class LineItemEJB implements EntityBean {
            public abstract String getCategoryId();
            public abstract void setCategoryId(String id);
            public abstract String getProductId();
            public abstract void setProductId(String id);
            public abstract String getItemId();
            public abstract void setItemId(String id);
            public abstract String getLineNumber();
            public abstract void setLineNumber(String num);
            public abstract int getQuantity();
            public abstract void setQuantity(int qty);
            public abstract float getUnitPrice();
            public abstract void setUnitPrice(float price);
            public abstract int getQuantityShipped();
            public abstract void setQuantityShipped(int qty);
    stack_metadata:
      ejb.bean: LineItemEJB
      persistence_type: Container
      cmp_version: 2.x
      db.object: LineItem

  - record_key: order-placement-entity-0002
    kind: entity
    capability_key: order-placement
    requirement: >
      Each line item SHALL include category ID, product ID, and item ID that reference the
      product catalog. Line number is a string identifier distinguishing items within an order.
      Unit price is stored as a float value representing the price at order time (not dynamic).
    confidence: high
    confidence_basis: >
      All reference fields are present in the entity definition and transfer object.
      The ejb-jar.xml declares these as CMP fields, making them persistent and enforced
      by container management. String and float types are explicitly declared in both
      the local interface and EJB class.
    risk_class: operational
    basis: >
      LineItemLocal interface (lines 50-52) declares getter methods for categoryId, productId,
      itemId as String returns. LineItemEJB abstract methods (lines 58-88) confirm String type
      for all three ID fields. unitPrice declared as float (line 118).
    traces:
      - path: legacy-source/petstore1.3.2/src/components/lineitem/src/com/sun/j2ee/blueprints/lineitem/ejb/LineItemLocal.java
        line_start: 50
        line_end: 59
        excerpt: |
          public interface LineItemLocal extends EJBLocalObject{
            public String getCategoryId();
            public String getProductId();
            public String getItemId();
            public String getLineNumber();
            public int getQuantity();
            public float getUnitPrice();
            public int getQuantityShipped();
            public void setQuantityShipped(int qty);
            public LineItem getData();
      - path: legacy-source/petstore1.3.2/src/components/lineitem/src/com/sun/j2ee/blueprints/lineitem/ejb/LineItemEJB.java
        line_start: 58
        line_end: 124
        excerpt: |
