  # Data serialization and XML support
  - record_key: shopping-cart-rule-0001
    kind: requirement
    capability_key: shopping-cart
    requirement: >
      A LineItem SHALL be serializable to and from XML format. The XML representation SHALL
      include all core fields: CategoryId, ProductId, ItemId, LineNum, Quantity, and UnitPrice.
      The XML structure SHALL conform to a DTD that defines the element order and content types.
    confidence: high
    confidence_basis: >
      The LineItem.java class includes toDOM() and fromDOM() methods that explicitly
      serialize and deserialize all six core fields to/from XML. The schema file LineItem.dtd
      defines the XML structure and element ordering. The methods directly implement the
      DTD-defined structure.
    risk_class: operational
    basis: >
      LineItem.java toDOM method (lines 137-146) creates elements for all six fields
      in the order: CategoryId, ProductId, ItemId, LineNum, Quantity, UnitPrice.
      fromDOM method (lines 148-162) parses them in the same order.
      LineItem.dtd (line 38) defines the element sequence exactly.
    traces:
      - path: legacy-source/petstore1.3.2/src/components/lineitem/src/com/sun/j2ee/blueprints/lineitem/ejb/LineItem.java
        line_start: 137
        line_end: 162
        excerpt: |
          public Node toDOM(Document document) {
            Element root = document.createElement(XML_LINEITEM);
            XMLDocumentUtils.appendChild(document, root, XML_CATEGORYID, categoryId);
            XMLDocumentUtils.appendChild(document, root, XML_PRODUCTID, productId);
            XMLDocumentUtils.appendChild(document, root, XML_ITEMID, itemId);
            XMLDocumentUtils.appendChild(document, root, XML_LINENUM, lineNumber);
            XMLDocumentUtils.appendChild(document, root, XML_QUANTITY, quantity);
            XMLDocumentUtils.appendChild(document, root, XML_UNITPRICE, unitPrice);
            return root;
          }

          public static LineItem fromDOM(Node node) throws XMLDocumentException {
            Element element;
            if (node.getNodeType() == Node.ELEMENT_NODE && (element = ((Element) node)).getTagName().equals(XML_LINEITEM)) {
              Element child;
              LineItem lineItem = new LineItem();
              lineItem.categoryId = XMLDocumentUtils.getContentAsString(child = XMLDocumentUtils.getFirstChild(element, XML_CATEGORYID, false), false);
              lineItem.productId = XMLDocumentUtils.getContentAsString(child = XMLDocumentUtils.getNextSibling(child, XML_PRODUCTID, false), false);
              lineItem.itemId = XMLDocumentUtils.getContentAsString(child = XMLDocumentUtils.getNextSibling(child, XML_ITEMID, false), false);
              lineItem.lineNumber = XMLDocumentUtils.getContentAsString(child = XMLDocumentUtils.getNextSibling(child, XML_LINENUM, false), false);
              lineItem.quantity = XMLDocumentUtils.getContentAsInt(child = XMLDocumentUtils.getNextSibling(child, XML_QUANTITY, false), false);
              lineItem.unitPrice = XMLDocumentUtils.getContentAsFloat(child = XMLDocumentUtils.getNextSibling(child, XML_UNITPRICE, false), false);
              return lineItem;
      - path: legacy-source/petstore1.3.2/src/components/lineitem/src/com/sun/j2ee/blueprints/lineitem/rsrc/schemas/LineItem.dtd
        line_start: 38
        line_end: 50
        excerpt: |
          <!ELEMENT LineItem (CategoryId, ProductId, ItemId, LineNum, Quantity, UnitPrice)>

          <!ELEMENT CategoryId (#PCDATA)>

          <!ELEMENT ProductId (#PCDATA)>

          <!ELEMENT ItemId (#PCDATA)>

          <!ELEMENT LineNum (#PCDATA)>

          <!ELEMENT Quantity (#PCDATA)>

          <!ELEMENT UnitPrice (#PCDATA)>
    stack_metadata:
      serialization: XML
      xml.dtd: LineItem.dtd

  - record_key: shopping-cart-rule-0002
    kind: requirement
    capability_key: shopping-cart
    requirement: >
      The LineItem data transfer object SHALL provide a getData() method that extracts the
      entity's six core fields (category ID, product ID, item ID, line number, quantity, unit price)
      into a new LineItem object. The quantityShipped field is NOT included in this extraction.
    confidence: high
    confidence_basis: >
      The LineItemLocal interface declares the getData() method (line 58), and LineItemEJB
      implements it (lines 171-180). The method constructs a new LineItem and copies only
      the six core fields, deliberately excluding quantityShipped.
    risk_class: operational
    basis: >
      LineItemEJB.getData (lines 171-180) creates a new LineItem object and sets only
      categoryId, productId, itemId, lineNumber, quantity, and unitPrice. It does not
      set quantityShipped, indicating this field is internal to the EJB and not exposed
      in the transfer object.
    traces:
      - path: legacy-source/petstore1.3.2/src/components/lineitem/src/com/sun/j2ee/blueprints/lineitem/ejb/LineItemEJB.java
        line_start: 171
        line_end: 180
        excerpt: |
          public LineItem getData() {
            LineItem lineItem = new LineItem();
            lineItem.setCategoryId(getCategoryId());
            lineItem.setProductId(getProductId());
            lineItem.setItemId(getItemId());
            lineItem.setLineNumber(getLineNumber());
            lineItem.setQuantity(getQuantity());
            lineItem.setUnitPrice(getUnitPrice());
            return lineItem;
          }
      - path: legacy-source/petstore1.3.2/src/components/lineitem/src/com/sun/j2ee/blueprints/lineitem/ejb/LineItemLocal.java
        line_start: 58
        line_end: 59
        excerpt: |
          public LineItem getData();
    stack_metadata:
      ejb.bean: LineItemEJB
      transfer_object: LineItem

findings:
  - kind: ambiguity
    path: legacy-source/petstore1.3.2/src/components/lineitem
    description: >
      The primary key for LineItem entity is not explicitly defined in the ejb-jar.xml.
      The prim-key-class is declared as "java.lang.Object" (line 54), but no key field
      is identified in either the CMP fields or any key-field declarations. The semantic
      meaning of the primary key is unclear - it may be auto-generated, may be composite
      across the ID fields, or may be derived. This affects how LineItem instances are
      uniquely identified and retrieved.

  - kind: unparseable
    path: legacy-source/petstore1.3.2/src/components/lineitem/src/com/sun/j2ee/blueprints/lineitem/ejb/LineItem.java
    description: >
      The LineItem transfer object class does not have an explicit toXML/fromXML contract
      for how the quantityShipped field is handled. The transfer object stores quantity
      (items ordered) but the EJB entity also stores quantityShipped (items fulfilled).
      The getData() method extracts only the six core fields and omits quantityShipped.
      It is unclear whether quantityShipped should ever be included in XML serialization
      or if the transfer object's omission is intentional API design vs. an oversight.

  - kind: ambiguity
    path: legacy-source/petstore1.3.2/src/components/lineitem/src/ejb-jar.xml
    description: >
      The ejb-jar.xml does not declare any finder methods or query methods for LineItem
      beyond the implicit findByPrimaryKey inherited from EJBLocalHome. No named queries
      or find methods for attributes like "find by product ID" or "find by category" are
      present. The document shows only creation and basic accessor declarations. It is
      unclear whether LineItem entities are expected to be queried, how they are retrieved
      in bulk (e.g., all items for an order), or if retrieval is the responsibility of
      the Order component or a separate manager.
