  - record_key: FULFILL-ENTITY-0001
    kind: entity
    capability_key: fulfillment-management
    requirement: >
      The system SHALL track quantityShipped on each line item to support
      partial fulfillment of orders; a line item begins with quantityShipped=0
      and is updated as goods are shipped.
    confidence: high
    confidence_basis: >
      The quantityShipped field appears in ejb-jar.xml CMP fields, with both
      a getter and a dedicated setter in the bean interface. The SupplierOrderEJB
      demonstrates setting quantityShipped to 0 on creation, establishing the
      contract for this field.
    risk_class: operational
    basis: >
      ejb-jar.xml line 77 declares quantityShipped as a CMP field; LineItemEJB
      lines 130-136 provide getter and setter. SupplierOrderEJB demonstrates
      initialization to 0 on line item creation (SupplierOrderEJB.java, setting
      initial state for tracking).
    traces:
      - path: legacy-source/petstore1.3.2/src/components/lineitem/src/ejb-jar.xml
        line_start: 76
        line_end: 78
        excerpt: |
          <cmp-field>
            <field-name>quantityShipped</field-name>
          </cmp-field>
      - path: legacy-source/petstore1.3.2/src/components/lineitem/src/com/sun/j2ee/blueprints/lineitem/ejb/LineItemEJB.java
        line_start: 126
        line_end: 136
        excerpt: |
          /**
           * Accessor for line item's qty that is shipped
           * @return int the qty already shipped
           */
          public abstract int getQuantityShipped();
          /**
           * Setter for line item's quantity that is already shipped
           * @param int the qty already shipped
           */
          public abstract void setQuantityShipped(int qty);
  - record_key: CART-ENTITY-0001
    kind: entity
    capability_key: shopping-cart
    requirement: >
      The system SHALL support line items as shopping cart items containing
      product reference (category, product, item identifiers) and order quantity.
    confidence: high
    confidence_basis: >
      The three identifier fields (categoryId, productId, itemId) and quantity
      field are present and used by both PurchaseOrder and SupplierOrder,
      indicating this structure is stable across buyer and supplier workflows.
    risk_class: operational
    basis: >
      LineItem class implements getters for categoryId, productId, itemId
      (LineItem.java lines 83-93) and quantity (lines 99-101), used in cart
      contexts via PurchaseOrder.
    traces:
      - path: legacy-source/petstore1.3.2/src/components/lineitem/src/com/sun/j2ee/blueprints/lineitem/ejb/LineItem.java
        line_start: 63
        line_end: 81
        excerpt: |
          private String categoryId;
          private String productId;
          private String itemId;
          private String lineNumber;
          private int    quantity;
          private float  unitPrice;
          public LineItem(String categoryId, String productId, String itemId, String lineNumber,
                          int quantity, float unitPrice) {
            this.categoryId = categoryId;
            this.productId = productId;
            this.itemId = itemId;
            this.lineNumber = lineNumber;
            this.quantity = quantity;
            this.unitPrice = unitPrice;
          }
  - record_key: ORDER-BUSINESS-0001
    kind: business-rule
    capability_key: order-placement
    requirement: >
      The system SHALL create a line item entity by providing all seven
      attributes (categoryId, productId, itemId, lineNumber, quantity,
      unitPrice, quantityShipped) in a single create call.
    confidence: high
    confidence_basis: >
      The ejb-jar.xml container-transaction configuration at lines 171-182
      defines the exact method signature with seven method-param elements,
      matching ejbCreate signature at LineItemEJB lines 141-152.
    risk_class: operational
    basis: >
      ejb-jar.xml lines 168-183 declare container-transaction for
      LocalHome.create(String, String, String, String, int, float, int);
      LineItemEJB.ejbCreate implements this signature lines 141-152.
    traces:
      - path: legacy-source/petstore1.3.2/src/components/lineitem/src/ejb-jar.xml
        line_start: 167
        line_end: 183
        excerpt: |
          <container-transaction>
            <method>
              <ejb-name>LineItemEJB</ejb-name>
              <method-intf>LocalHome</method-intf>
              <method-name>create</method-name>
              <method-params>
                <method-param>java.lang.String</method-param>
                <method-param>java.lang.String</method-param>
                <method-param>java.lang.String</method-param>
                <method-param>java.lang.String</method-param>
                <method-param>int</method-param>
                <method-param>float</method-param>
                <method-param>int</method-param>
              </method-params>
            </method>
            <trans-attribute>Required</trans-attribute>
          </container-transaction>
      - path: legacy-source/petstore1.3.2/src/components/lineitem/src/com/sun/j2ee/blueprints/lineitem/ejb/LineItemEJB.java
        line_start: 141
        line_end: 152
        excerpt: |
          public Object ejbCreate(String catId, String prodId, String itemId,
                                  String lineNo, int qty, float price, int qtyShipped)
            throws CreateException {
              setCategoryId(catId);
              setProductId(prodId);
              setItemId(itemId);
              setLineNumber(lineNo);
              setQuantity(qty);
              setUnitPrice(price);
              setQuantityShipped(qtyShipped);
              return null;
          }
  - record_key: FULFILL-BUSINESS-0001
    kind: business-rule
    capability_key: fulfillment-management
    requirement: >
      The system SHALL support an alternative line item creation method that
      takes a LineItem value object and an initial quantityShipped value,
      copying all product and quantity details from the value object while
      setting quantityShipped to the provided value.
    confidence: high
    confidence_basis: >
      The ejb-jar.xml container-transaction lines 184-195 declares the
      LineItem-parameter signature; LineItemEJB implements it at lines
      158-167. Both passes will discover this second factory method.
    risk_class: operational
    basis: >
      ejb-jar.xml lines 184-195 declare container-transaction for
      LocalHome.create(LineItem, int); LineItemEJB.ejbCreate implements
      this lines 158-167, copying fields from the value object.
    traces:
      - path: legacy-source/petstore1.3.2/src/components/lineitem/src/ejb-jar.xml
        line_start: 184
        line_end: 195
        excerpt: |
          <container-transaction>
            <method>
              <ejb-name>LineItemEJB</ejb-name>
              <method-intf>LocalHome</method-intf>
              <method-name>create</method-name>
              <method-params>
                <method-param>com.sun.j2ee.blueprints.lineitem.ejb.LineItem</method-param>
                <method-param>int</method-param>
              </method-params>
            </method>
            <trans-attribute>Required</trans-attribute>
          </container-transaction>
      - path: legacy-source/petstore1.3.2/src/components/lineitem/src/com/sun/j2ee/blueprints/lineitem/ejb/LineItemEJB.java
        line_start: 158
        line_end: 169
        excerpt: |
          public Object ejbCreate(LineItem lineItem, int qty) throws CreateException {
            setCategoryId(lineItem.getCategoryId());
            setProductId(lineItem.getProductId());
            setItemId(lineItem.getItemId());
            setLineNumber(lineItem.getLineNumber());
            setQuantity(lineItem.getQuantity());
            setUnitPrice(lineItem.getUnitPrice());
            setQuantityShipped(qty);
            return null;
          }
