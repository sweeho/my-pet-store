  - record_key: SECURITY-BUSINESS-0001
    kind: business-rule
    capability_key: user-authentication
    requirement: >
      The system SHALL grant unchecked (unrestricted) access to all LineItem
      methods; no role-based authorization check is enforced at the bean level.
    confidence: medium
    confidence_basis: >
      The ejb-jar.xml declares unchecked access (line 87 <unchecked />) for
      all methods on LineItemEJB, but this is a component-level permission
      that may be refined by calling code (PurchaseOrder, SupplierOrder) or
      higher-level authorization. The rule is enforced at this layer only.
    risk_class: operational
    basis: >
      ejb-jar.xml lines 86-92 state <unchecked /> for all methods on
      LineItemEJB; no method-permission restrictions are defined.
    traces:
      - path: legacy-source/petstore1.3.2/src/components/lineitem/src/ejb-jar.xml
        line_start: 85
        line_end: 92
        excerpt: |
          <method-permission>
            <unchecked />
            <method>
              <ejb-name>LineItemEJB</ejb-name>
              <method-name>*</method-name>
            </method>
          </method-permission>
