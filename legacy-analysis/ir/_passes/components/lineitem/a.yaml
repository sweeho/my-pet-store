records:
  - record_key: ORDER-ENTITY-0001
    kind: entity
    capability_key: order-placement
    requirement: >
      The system SHALL represent line items as persistent entities with fields
      for product identification (categoryId, productId, itemId), line number,
      ordered quantity, and unit price.
    confidence: high
    confidence_basis: >
      The entity definition is declared in ejb-jar.xml with all CMP fields
      enumerated, and the LineItem.java and LineItemEJB.java implementations
      enforce this structure across both value object and container-managed bean.
      Both passes will see the same schema.
    risk_class: operational
    basis: >
      ejb-jar.xml lines 58-75 declare seven CMP fields; LineItemEJB.java lines
      58-136 provide getters and setters; LineItem.java lines 63-68 define the
      value-object state.
    traces:
