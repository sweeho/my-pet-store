  - record_key: UIDGEN-BIZRULE-0005
    kind: business-rule
    capability_key: order-placement
    requirement: >
      The UniqueIdGeneratorEJB SHALL be a stateless session bean with container-managed
      transactions. The bean SHALL use EJB local references to access the Counter entity,
      and SHALL not maintain any conversational state across method calls.
    confidence: high
    confidence_basis: >
      The session bean type and transaction management are declared in ejb-jar.xml.
      The implementation confirms statelessness: all methods are state-independent and
      the bean only looks up counter entities through JNDI at creation time. This is
      enforced both declaratively and in code.
    risk_class: operational
    basis: >
      The ejb-jar.xml declares UniqueIdGeneratorEJB as a Stateless session bean with
      Container-managed transaction type. The implementation initializes the counter
      home in ejbCreate() via JNDI lookup and uses it for all method calls. No instance
      variables store request-specific data.
    traces:
      - path: legacy-source/petstore1.3.2/src/components/uidgen/src/ejb-jar.xml
        line_start: 71
        line_end: 90
        excerpt: |
          <session>
            <display-name>UniqueIdGeneratorEB</display-name>
            <ejb-name>UniqueIdGeneratorEJB</ejb-name>
            <local-home>com.sun.j2ee.blueprints.uidgen.ejb.UniqueIdGeneratorLocalHome</local-home>
            <local>com.sun.j2ee.blueprints.uidgen.ejb.UniqueIdGeneratorLocal</local>
            <ejb-class>com.sun.j2ee.blueprints.uidgen.ejb.UniqueIdGeneratorEJB</ejb-class>
            <session-type>Stateless</session-type>
            <transaction-type>Container</transaction-type>
      - path: legacy-source/petstore1.3.2/src/components/uidgen/src/com/sun/j2ee/blueprints/uidgen/ejb/UniqueIdGeneratorEJB.java
        line_start: 51
        line_end: 63
        excerpt: |
          public class UniqueIdGeneratorEJB implements javax.ejb.SessionBean {
              private  InitialContext ic;
              private  CounterLocalHome clh;
              public void ejbCreate() {
                try {
                  ic = new InitialContext();
                  clh = (CounterLocalHome) ic.lookup("java:comp/env/ejb/Counter");
                } catch (NamingException ne) {
                   throw new EJBException("UniqueIdGeneratorEJB Got naming exception! " + ne.getMessage());
                }
              }
    stack_metadata:
      ejb.bean: UniqueIdGeneratorEJB
      session.scope: Stateless

findings:
  - kind: ambiguity
    path: legacy-source/petstore1.3.2/src/components/uidgen/src/com/sun/j2ee/blueprints/uidgen/ejb/UniqueIdGeneratorLocal.java
    description: >
      The interface declares a parameter named idPrfix (line 43) which appears to be a
      typo for idPrefix. The actual implementation uses the correct parameter name
      idPrefix. It is unclear whether this typo exists in the deployed interface
      definition or is a documentation artifact. No functional impact identified, but
      this inconsistency should be verified during integration.

  - kind: unparseable
    path: legacy-source/petstore1.3.2/src/components/uidgen/src/com/sun/j2ee/blueprints/uidgen/ejb/UniqueIdGeneratorEJB.java
    description: >
      The naming exception handler at line 60-61 throws an EJBException with the message
      "UniqueIdGeneratorEJB Got naming exception!" but does not explicitly state what
      happens to JNDI lookups that fail. It is unclear whether this exception terminates
      the entire bean initialization or if there is a fallback mechanism. The component
      appears to have no graceful degradation documented for JNDI failures.

  - kind: ambiguity
    path: legacy-source/petstore1.3.2/src/components/uidgen/src/com/sun/j2ee/blueprints/uidgen/counter/ejb/CounterEJB.java
    description: >
      The counter field is an int (32-bit integer) with no explicit maximum value
      constraint documented. After 2,147,483,647 increments the counter will overflow.
      It is not specified whether this behavior is acceptable or whether counters should
      be reset/recycled. This is relevant to long-running systems that may generate
      many unique IDs over their lifetime.
