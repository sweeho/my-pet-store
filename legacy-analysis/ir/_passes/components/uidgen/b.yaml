                <method-param>java.lang.String</method-param>
              </method-params>
            </method>
            <trans-attribute>Required</trans-attribute>
          </container-transaction>

  - record_key: order-placement-requirement-0004
    kind: requirement
    capability_key: order-placement
    requirement: >
      Access to the unique identifier generation service SHALL be unrestricted by role-based
      authorization; all users with basic application access can invoke the service.
    confidence: medium
    confidence_basis: >
      All methods on both UniqueIdGeneratorEJB and CounterEJB are marked with unchecked
      authorization in the method-permission sections of ejb-jar.xml. However, the presence
      of use-caller-identity suggests that some broader authentication is assumed to occur
      at the application boundary before reaching this service.
    risk_class: operational
    basis: >
      ejb-jar.xml contains multiple method-permission sections with unchecked elements for all
      public methods of both beans, indicating no role-based access control is enforced at the
      EJB level. The use-caller-identity directive in security-identity means the bean
      propagates caller identity but doesn't perform its own authorization checks.
    traces:
      - path: legacy-source/petstore1.3.2/src/components/uidgen/src/ejb-jar.xml
        line_start: 93
        line_end: 151
        excerpt: |
          <assembly-descriptor>
            <method-permission>
              <unchecked />
              <method>
                <ejb-name>CounterEJB</ejb-name>
                <method-intf>Local</method-intf>
                <method-name>getPrimaryKey</method-name>
      - path: legacy-source/petstore1.3.2/src/components/uidgen/src/ejb-jar.xml
        line_start: 66
        line_end: 69
        excerpt: |
          <security-identity>
            <description></description>
            <use-caller-identity></use-caller-identity>
          </security-identity>

