    confidence: high
    confidence_basis: >
      The CounterEJB is explicitly configured as a CMP 2.x entity bean with abstract getter/setter
      methods for persistent fields. The container-managed persistence model is the dominant
      pattern used and would be discovered by any analyzer of this J2EE application.
    risk_class: operational
    basis: >
      ejb-jar.xml declares the CounterEJB with persistence-type="Container" and cmp-version="2.x".
      The CounterEJB class contains only abstract methods for field access; it contains no SQL,
      no ORM annotations, and no direct database interaction code. The container generates the
      persistence implementation.
