  - record_key: fulfillment-management-integration-0001
    kind: integration
    capability_key: fulfillment-management
    requirement: >
      All SupplierOrder, ContactInfo, Address, and LineItem methods SHALL execute
      with EJB transaction attribute "Required", ensuring transactional consistency
      for all operations on supplier purchase order data.
    confidence: high
    confidence_basis: >
      The ejb-jar.xml assembly-descriptor contains explicit container-transaction
      definitions for all public methods across all four entity beans, with
      trans-attribute set to "Required". This enforces transactional semantics
      at the container level.
    risk_class: operational
    basis: >
      ejb-jar.xml assembly-descriptor (lines 318-973) defines container-transaction
      declarations for all public methods of SupplierOrderEJB, ContactInfoEJB,
      AddressEJB, and LineItemEJB with trans-attribute = "Required".
    traces:
      - path: legacy-source/petstore1.3.2/src/components/supplierpo/src/ejb-jar.xml
        line_start: 349
        line_end: 360
        excerpt: |
          <container-transaction>
           <method>
             <ejb-name>SupplierOrderEJB</ejb-name>
             <method-intf>Local</method-intf>
             <method-name>getPoId</method-name>
             <method-params />
           </method>
           <trans-attribute>Required</trans-attribute>
          </container-transaction>
      - path: legacy-source/petstore1.3.2/src/components/supplierpo/src/ejb-jar.xml
        line_start: 318
        line_end: 347
        excerpt: |
          <assembly-descriptor>
            <method-permission>
              <unchecked />
              <method>
                <ejb-name>SupplierOrderEJB</ejb-name>
                <method-name>*</method-name>
              </method>
            </method-permission>
    stack_metadata:
      ejb.bean: all
      ejb.transaction: Required

  - record_key: fulfillment-management-business-rule-0005
    kind: business-rule
    capability_key: fulfillment-management
