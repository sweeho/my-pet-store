  - record_key: fulfillment-management-entity-0001
    kind: entity
    capability_key: fulfillment-management
    requirement: >
      The system SHALL store supplier purchase orders with a unique identifier,
      order date, current status, associated shipping contact information, and
      a collection of line items.
    confidence: high
    confidence_basis: >
      The SupplierOrderEJB is a CMP entity bean with explicit field declarations
      (poId, poDate, poStatus) and relationships to ContactInfo and LineItem beans
      defined in ejb-jar.xml. The data model is enforced at both the EJB and
      database schema level through CMP persistence.
    risk_class: operational
    basis: >
      SupplierOrderEJB is declared as a CMP entity bean with abstract accessor methods
      for poId (primary key), poDate, poStatus, contactInfo (1:1), and lineItems (1:*).
      The ejb-jar.xml declares three CMP fields and two relationship definitions.
    traces:
      - path: legacy-source/petstore1.3.2/src/components/supplierpo/src/ejb-jar.xml
        line_start: 48
        line_end: 105
        excerpt: |
          <entity>
            <description>SupplierOrder CMP EJB</description>
            <display-name>SupplierOrderEB</display-name>
            <ejb-name>SupplierOrderEJB</ejb-name>
            <cmp-field>
              <field-name>poId</field-name>
            </cmp-field>
            <cmp-field>
              <field-name>poDate</field-name>
            </cmp-field>
            <cmp-field>
              <field-name>poStatus</field-name>
            </cmp-field>
            <primkey-field>poId</primkey-field>
      - path: legacy-source/petstore1.3.2/src/components/supplierpo/src/com/sun/j2ee/blueprints/supplierpo/ejb/SupplierOrderEJB.java
        line_start: 73
        line_end: 138
        excerpt: |
          public abstract class SupplierOrderEJB implements EntityBean {
            public abstract String getPoId();
            public abstract void setPoId(String id);
            public abstract long getPoDate();
            public abstract void setPoDate(long orderDate);
            public abstract String getPoStatus();
            public abstract void setPoStatus(String stat);
            public abstract ContactInfoLocal getContactInfo();
            public abstract void setContactInfo(ContactInfoLocal addr);
            public abstract Collection getLineItems();
            public abstract void setLineItems(Collection litems);
    stack_metadata:
      ejb.bean: SupplierOrderEJB
      persistence_type: CMP 2.x
      prim_key_class: java.lang.String

  - record_key: fulfillment-management-workflow-0001
    kind: workflow
    capability_key: fulfillment-management
    requirement: >
      GIVEN a supplier purchase order is created, WHEN the order is persisted,
      THEN the system SHALL initialize the order status to PENDING.
    confidence: high
    confidence_basis: >
      The ejbCreate method explicitly sets status to OrderStatusNames.PENDING
      during object creation. This is enforced in application code at the
      entity bean creation point.
    risk_class: operational
    basis: >
      The SupplierOrderEJB.ejbCreate() method calls setPoStatus(OrderStatusNames.PENDING)
      to initialize the order status on creation.
    traces:
      - path: legacy-source/petstore1.3.2/src/components/supplierpo/src/com/sun/j2ee/blueprints/supplierpo/ejb/SupplierOrderEJB.java
        line_start: 151
        line_end: 156
        excerpt: |
          public String ejbCreate(SupplierOrder supplierOrder) throws CreateException {
            setPoId(supplierOrder.getOrderId());
            setPoDate(supplierOrder.getOrderDate().getTime());
            setPoStatus(OrderStatusNames.PENDING);
            return null;
          }
    stack_metadata:
      ejb.bean: SupplierOrderEJB
      ejb.lifecycle_callback: ejbCreate

  - record_key: fulfillment-management-business-rule-0001
    kind: business-rule
    capability_key: fulfillment-management
    requirement: >
      The system SHALL support purchase order status values of PENDING, APPROVED,
      DENIED, and COMPLETED. The valid state transitions are:
      PENDING -> APPROVED -> COMPLETED, or PENDING -> DENIED.
    confidence: high
    confidence_basis: >
      OrderStatusNames class defines exactly four status constants with clear
      documentation of the intended state machine (pending->approved->completed
      or pending->denied). This is the sole source of truth for status values
      in the application.
    risk_class: operational
    basis: >
      OrderStatusNames.java defines four public static final String constants:
      PENDING, APPROVED, DENIED, COMPLETED. The class comment explicitly documents
      the two valid state sequences.
    traces:
      - path: legacy-source/petstore1.3.2/src/components/supplierpo/src/com/sun/j2ee/blueprints/supplierpo/ejb/OrderStatusNames.java
        line_start: 41
        line_end: 62
        excerpt: |
          /**
           * This class is the central location to store the names of the
           * status that an order can be in.
           * The states an order goes through are:
           * pending->approved->completed   or
           * pending->denied
           */
          public class OrderStatusNames {
            /** for orders that have been placed but not yet approved */
            public static final String PENDING = "PENDING";
            /** for orders that have been approved */
            public  static final String APPROVED = "APPROVED";
            /** for orders that have been denied */
            public  static final String DENIED = "DENIED";
            /** for orders that have been completed*/
            public  static final String COMPLETED = "COMPLETED";
          }
    stack_metadata:
      ejb.bean: SupplierOrderEJB

