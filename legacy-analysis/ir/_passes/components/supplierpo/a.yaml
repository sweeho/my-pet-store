  - record_key: fulfillment-management-business-rule-0002
    kind: business-rule
    capability_key: fulfillment-management
    requirement: >
      A supplier purchase order SHALL maintain a one-to-one relationship with
      a contact information record, which is created and associated during order
      creation and cascade-deleted when the order is removed.
    confidence: high
    confidence_basis: >
      The ejb-jar.xml relationship definitions explicitly declare a one-to-one
      relationship between SupplierOrder and ContactInfo with cascade-delete.
      The ejbPostCreate method explicitly creates the ContactInfo during order
      creation.
    risk_class: operational
    basis: >
      ejb-jar.xml defines a SupplierOrder-ContactInfo relationship (lines 234-258)
      with multiplicity One on both sides and cascade-delete on the ContactInfo side.
      SupplierOrderEJB.ejbPostCreate() creates a ContactInfoLocal and associates it
      via setContactInfo().
    traces:
      - path: legacy-source/petstore1.3.2/src/components/supplierpo/src/ejb-jar.xml
        line_start: 234
        line_end: 258
        excerpt: |
          <ejb-relation>
            <ejb-relation-name>SupplierOrder-ContactInfo</ejb-relation-name>
            <ejb-relationship-role>
              <ejb-relationship-role-name>purchaseorder-has-address</ejb-relationship-role-name>
              <multiplicity>One</multiplicity>
              <relationship-role-source>
                <ejb-name>SupplierOrderEJB</ejb-name>
              </relationship-role-source>
              <cmr-field>
                <cmr-field-name>contactInfo</cmr-field-name>
              </cmr-field>
            </ejb-relationship-role>
            <ejb-relationship-role>
              <ejb-relationship-role-name>address-for-purchaseorder</ejb-relationship-role-name>
              <multiplicity>One</multiplicity>
              <cascade-delete />
              <relationship-role-source>
                <ejb-name>ContactInfoEJB</ejb-name>
              </relationship-role-source>
            </ejb-relationship-role>
          </ejb-relation>
      - path: legacy-source/petstore1.3.2/src/components/supplierpo/src/com/sun/j2ee/blueprints/supplierpo/ejb/SupplierOrderEJB.java
        line_start: 162
        line_end: 170
        excerpt: |
          public void ejbPostCreate(SupplierOrder supplierOrder)
                                                            throws CreateException {
            try {
              ServiceLocator serviceLocator = new ServiceLocator();
              ContactInfoLocalHome cinforef = (ContactInfoLocalHome)
                  serviceLocator.getLocalHome(JNDINames.CINFO_EJB);
              ContactInfoLocal cinfoloc = (ContactInfoLocal)
                              cinforef.create(supplierOrder.getShippingInfo());
              setContactInfo(cinfoloc);
    stack_metadata:
      ejb.bean: SupplierOrderEJB
      relationship: SupplierOrder-ContactInfo

  - record_key: fulfillment-management-business-rule-0003
    kind: business-rule
    capability_key: fulfillment-management
    requirement: >
      A supplier purchase order SHALL maintain a one-to-many relationship with
      line item records, which are created and associated during order creation
      and cascade-deleted when the order is removed.
    confidence: high
    confidence_basis: >
      The ejb-jar.xml relationship definitions explicitly declare a one-to-many
      relationship between SupplierOrder and LineItem with cascade-delete.
      The ejbPostCreate method creates LineItem records for each item in the
      incoming order and associates them via addLineItem().
    risk_class: operational
    basis: >
      ejb-jar.xml defines a SupplierOrder-LineItem relationship (lines 289-314)
      with multiplicity One on SupplierOrder side and Many on LineItem side,
      with cascade-delete on LineItem. SupplierOrderEJB.ejbPostCreate() iterates
      through incoming lineItems and creates LineItemLocal objects for each.
    traces:
      - path: legacy-source/petstore1.3.2/src/components/supplierpo/src/ejb-jar.xml
        line_start: 289
        line_end: 314
        excerpt: |
          <ejb-relation>
            <ejb-relation-name>SupplierOrder-LineItem</ejb-relation-name>
            <ejb-relationship-role>
              <ejb-relationship-role-name>purchaseorder-has-lineitems</ejb-relationship-role-name>
              <multiplicity>One</multiplicity>
              <relationship-role-source>
                <ejb-name>SupplierOrderEJB</ejb-name>
              </relationship-role-source>
              <cmr-field>
                <cmr-field-name>lineItems</cmr-field-name>
                <cmr-field-type>java.util.Collection</cmr-field-type>
              </cmr-field>
            </ejb-relationship-role>
            <ejb-relationship-role>
              <ejb-relationship-role-name>lineItem-for-purchaseorder</ejb-relationship-role-name>
              <multiplicity>Many</multiplicity>
              <cascade-delete />
              <relationship-role-source>
                <ejb-name>LineItemEJB</ejb-name>
              </relationship-role-source>
            </ejb-relationship-role>
          </ejb-relation>
      - path: legacy-source/petstore1.3.2/src/components/supplierpo/src/com/sun/j2ee/blueprints/supplierpo/ejb/SupplierOrderEJB.java
        line_start: 162
        line_end: 184
        excerpt: |
          public void ejbPostCreate(SupplierOrder supplierOrder)
                                                            throws CreateException {
            try {
              ServiceLocator serviceLocator = new ServiceLocator();
              ContactInfoLocalHome cinforef = (ContactInfoLocalHome)
                  serviceLocator.getLocalHome(JNDINames.CINFO_EJB);
              ContactInfoLocal cinfoloc = (ContactInfoLocal)
                              cinforef.create(supplierOrder.getShippingInfo());
              setContactInfo(cinfoloc);
              LineItemLocalHome lineItemref = (LineItemLocalHome)
                  serviceLocator.getLocalHome(JNDINames.LI_EJB);
              Collection litems = supplierOrder.getLineItems();
              Iterator it = litems.iterator();
              while((it != null) && (it.hasNext())) {
                LineItem li = (LineItem) it.next();
                LineItemLocal lineItemloc = (LineItemLocal) lineItemref.create(li, 0);
                addLineItem(lineItemloc);
              }
    stack_metadata:
      ejb.bean: SupplierOrderEJB
      relationship: SupplierOrder-LineItem

