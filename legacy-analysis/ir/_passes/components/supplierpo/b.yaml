  - record_key: FULFILLMENT-BUSINESS-RULE-0006
    kind: business-rule
    capability_key: fulfillment-management
    requirement: >
      The system SHALL provide an getAllItems() method that returns a non-transactional
      copy of line items as an ArrayList of LineItem data objects (not EJB local objects).
    confidence: medium
    confidence_basis: >
      Implemented in SupplierOrderEJB.getAllItems(). The method comment states this is
      required because the web tier cannot access CMR fields without transaction. No
      configuration enforces this pattern.
    risk_class: operational
    basis: >
      SupplierOrderEJB implements getAllItems() which iterates over getLineItems() (CMR
      collection) and converts each LineItemLocal to its data representation via getData().
    traces:
      - path: legacy-source/petstore1.3.2/src/components/supplierpo/src/com/sun/j2ee/blueprints/supplierpo/ejb/SupplierOrderEJB.java
        line_start: 186
        line_end: 203
        excerpt: |
          /**
           * Method gets a collection of all line items for this PO. This is required
           * because web tier cannot access CMR fields that return managed objects
           * without a transaction
           * @return <Code>Collection</Code> Colleciton of lineitems
           */
          public Collection getAllItems() {
            Collection liColl = getLineItems();
            if(liColl == null)
              return(null);
            ArrayList retVal = new ArrayList();
            Iterator it = liColl.iterator();
            while((it!=null) && (it.hasNext())) {
              LineItemLocal loc = (LineItemLocal) it.next();
              retVal.add(loc.getData());
            }
            return(retVal);

