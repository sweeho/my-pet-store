  - record_key: FULFILLMENT-BUSINESS-RULE-0001
    kind: business-rule
    capability_key: fulfillment-management
    requirement: >
      When a SupplierOrder is created, its initial poStatus SHALL be set to PENDING.
    confidence: high
    confidence_basis: >
      Explicitly set in ejbCreate method of SupplierOrderEJB; no alternative paths found
      in the source code.
    risk_class: operational
    basis: >
      SupplierOrderEJB.ejbCreate() calls setPoStatus(OrderStatusNames.PENDING) before returning
      the primary key.
    traces:
      - path: legacy-source/petstore1.3.2/src/components/supplierpo/src/com/sun/j2ee/blueprints/supplierpo/ejb/SupplierOrderEJB.java
        line_start: 151
