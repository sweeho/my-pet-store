  - record_key: FULFILLMENT-ENTITY-0001
    kind: entity
    capability_key: fulfillment-management
    requirement: >
      The system SHALL maintain a SupplierOrder entity as a Container-Managed Persistence
      (CMP) entity bean with primary key poId (String).
    confidence: high
    confidence_basis: >
      Declared in ejb-jar.xml as CMP 2.x entity with primary key field explicitly mapped.
      Confirmed by SupplierOrderLocal and SupplierOrderLocalHome interfaces. Both ejb-jar.xml
      and Java source code converge on this structure.
    risk_class: operational
    basis: >
      ejb-jar.xml defines SupplierOrderEJB as entity bean with persistence-type=Container
      and prim-key-class=java.lang.String, with primkey-field=poId.
