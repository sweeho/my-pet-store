  - record_key: FULFILLMENT-WORKFLOW-0001
    kind: workflow
    capability_key: fulfillment-management
    requirement: >
      A SupplierOrder follows one of two workflow paths: (A) PENDING -> APPROVED -> COMPLETED,
      or (B) PENDING -> DENIED. The status field (poStatus) determines the current position in
      the workflow.
    confidence: medium
    confidence_basis: >
      OrderStatusNames defines exactly four status values and includes a comment documenting
      the two paths. No enforcement of state transitions is visible in the source code, so
      the workflow is implicit in the enumerated values rather than explicitly enforced.
    risk_class: operational
    basis: >
      OrderStatusNames.java defines PENDING, APPROVED, DENIED, and COMPLETED as static final
      String constants. A comment in the class states the two paths explicitly.
    traces:
      - path: legacy-source/petstore1.3.2/src/components/supplierpo/src/com/sun/j2ee/blueprints/supplierpo/ejb/OrderStatusNames.java
        line_start: 41
        line_end: 61
        excerpt: |
          /**
           * This class is the central location to store the names of the
           * status that an order can be in.
           * The states an order goes through are:
           * pending->approved->completed   or
           * pending->denied
           */
          public class OrderStatusNames {
              /** for orders that have been placed but not yet approved */
              public static final String PENDING = "PENDING";
              /** for orders that have been approved */
              public  static final String APPROVED = "APPROVED";
              /** for orders that have been denied */
              public  static final String DENIED = "DENIED";
              /** for orders that have been completed*/
              public  static final String COMPLETED = "COMPLETED";

