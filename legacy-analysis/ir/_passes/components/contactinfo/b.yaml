    kind: entity
    capability_key: account-management
    requirement: >
      The system SHALL store contact information consisting of given name, family name,
      email address, and telephone number as an entity.
    confidence: high
    confidence_basis: >
      ContactInfoEJB is defined as a CMP 2.x entity bean with abstract accessor methods
      for these exact four fields (givenName, familyName, email, telephone). The field
      definitions appear in both ejb-jar.xml (lines 57-72) and the Java implementation
      (lines 59-69 of ContactInfoEJB.java). Both the declarative configuration and
      programmatic API enforce these fields at the entity layer.
    risk_class: operational
    basis: >
      ejb-jar.xml defines four CMP fields: telephone (line 59), familyName (line 63),
      email (line 67), givenName (line 71). ContactInfoEJB abstract class defines
      abstract methods for each (lines 59-69). ContactInfoLocal interface exposes
      getter/setter pairs for each field (lines 45-58).
