      ContactInfoEJB.java lines 129-137 implement getData() constructing a ContactInfo
      value object by calling all field getters and the address CMR getter.
    risk_class: operational
    basis: >
      ContactInfoLocal.java line 60 declares ContactInfo getData().
      ContactInfoEJB.java lines 129-137 implement it by constructing a ContactInfo
      object and populating all fields including the address.
    traces:
