  - record_key: account-management-creation-0001
    kind: business-rule
    capability_key: account-management
    requirement: >
      GIVEN a ContactInfo entity is being created, WHEN no parameters are provided,
      THEN a new Address SHALL be automatically created and associated.
    confidence: medium
    confidence_basis: >
      The no-argument create() method is declared in ContactInfoLocalHome (line 47)
      and ejbCreate() is implemented in ContactInfoEJB (lines 77-79). The
      ejbPostCreate() hook (lines 81-91) creates an Address via ServiceLocator. This
      is programmatic evidence that automatic address creation is the intended behavior
      for the no-argument constructor, though the ejb-jar.xml does not explicitly state
      this rule — it is inferred from the implementation logic.
    risk_class: operational
    basis: >
      ContactInfoLocalHome.java line 47 declares create() with no parameters.
      ContactInfoEJB.java lines 77-79 implement ejbCreate() returning null.
      ContactInfoEJB.java lines 81-91 implement ejbPostCreate() which looks up
      AddressLocalHome via ServiceLocator and creates an Address, then calls
      setAddress(address). This automatic address creation is not declared in the
      XML configuration — it is pure implementation logic.
    traces:
      - path: legacy-source/petstore1.3.2/src/components/contactinfo/src/com/sun/j2ee/blueprints/contactinfo/ejb/ContactInfoLocalHome.java
        line_start: 47
        line_end: 47
        excerpt: |
          public ContactInfoLocal create() throws CreateException;
      - path: legacy-source/petstore1.3.2/src/components/contactinfo/src/com/sun/j2ee/blueprints/contactinfo/ejb/ContactInfoEJB.java
        line_start: 81
        line_end: 91
        excerpt: |
          public void ejbPostCreate () throws CreateException {
            try {
              ServiceLocator serviceLocator = new ServiceLocator();
              AddressLocalHome adh = (AddressLocalHome)
                  serviceLocator.getLocalHome(JNDINames.ADDR_EJB);
              AddressLocal address = adh.create();
              setAddress(address);
            } catch (ServiceLocatorException ne) {
              throw new CreateException("ContactInfoEJB error: ServiceLocator exception looking up address");
            }
          }
    stack_metadata:
      ejb.bean: EntityBean
      framework: EJB 2.0 with ServiceLocator pattern

  - record_key: account-management-creation-0002
    kind: business-rule
    capability_key: account-management
    requirement: >
      GIVEN a ContactInfo entity is being created WITH contact details and an Address,
      WHEN the parameterized create(String, String, String, String, AddressLocal) is invoked,
      THEN all fields SHALL be populated in the order: givenName, familyName, telephone,
      email, and the provided Address reference SHALL be set.
    confidence: high
    confidence_basis: >
      The parameterized create method is declared in ContactInfoLocalHome (lines 49-50)
      with exact parameter ordering. ContactInfoEJB implements ejbCreate (lines 93-101)
      and ejbPostCreate (lines 103-107) with matching signatures. The field assignment
      order is explicit in the code (givenName, familyName, telephone, email), and
      setAddress is called in ejbPostCreate. Both the interface and implementation are
      consistent and complete.
    risk_class: operational
    basis: >
      ContactInfoLocalHome.java lines 49-50 declare the five-parameter create method.
      ContactInfoEJB.java lines 93-101 implement ejbCreate with setters in order:
      setGivenName, setFamilyName, setTelephone, setEmail.
      ContactInfoEJB.java lines 103-107 implement ejbPostCreate calling setAddress.
    traces:
      - path: legacy-source/petstore1.3.2/src/components/contactinfo/src/com/sun/j2ee/blueprints/contactinfo/ejb/ContactInfoLocalHome.java
        line_start: 49
        line_end: 50
        excerpt: |
          public ContactInfoLocal create(String givenName, String familyName,
                                         String telephone, String email, AddressLocal address) throws CreateException;
      - path: legacy-source/petstore1.3.2/src/components/contactinfo/src/com/sun/j2ee/blueprints/contactinfo/ejb/ContactInfoEJB.java
        line_start: 93
        line_end: 107
        excerpt: |
          public Object ejbCreate(String givenName, String familyName,
                                  String telephone, String email, AddressLocal address)
                                  throws CreateException {
            setGivenName(givenName);
            setFamilyName(familyName);
            setTelephone(telephone);
            setEmail(email);
            return null;
          }

          public void ejbPostCreate(String givenName, String familyName,
                                    String telephone, String email,
                                    AddressLocal address) throws CreateException {
            setAddress(address);
          }

  - record_key: account-management-creation-0003
    kind: business-rule
    capability_key: account-management
    requirement: >
      GIVEN a ContactInfo value object is provided to create a ContactInfo entity,
      WHEN the create(ContactInfo) method is invoked, THEN the values from the
      value object (givenName, familyName, phone, email) SHALL be extracted and
      populated, and a new Address SHALL be created from the ContactInfo's address.
    confidence: high
    confidence_basis: >
      ContactInfoLocalHome.java line 52 declares create(ContactInfo).
      ContactInfoEJB.java lines 109-115 implement ejbCreate extracting fields.
      ContactInfoEJB.java lines 117-127 implement ejbPostCreate creating the Address
      via ServiceLocator with the value object's address. The code is explicit and
      complete.
    risk_class: operational
    basis: >
      ContactInfoLocalHome.java line 52 declares the value-object overload.
      ContactInfoEJB.java lines 109-127 implement both ejbCreate and ejbPostCreate.
      The implementation calls contactInfo.getGivenName(), getFamilyName(), getPhone(),
      getEmail(), and getAddress() to extract values.
    traces:
      - path: legacy-source/petstore1.3.2/src/components/contactinfo/src/com/sun/j2ee/blueprints/contactinfo/ejb/ContactInfoLocalHome.java
        line_start: 52
        line_end: 52
        excerpt: |
          public ContactInfoLocal create(ContactInfo contactInfo) throws CreateException;
      - path: legacy-source/petstore1.3.2/src/components/contactinfo/src/com/sun/j2ee/blueprints/contactinfo/ejb/ContactInfoEJB.java
        line_start: 109
        line_end: 127
        excerpt: |
          public Object ejbCreate(ContactInfo contactInfo) throws CreateException {
            setGivenName(contactInfo.getGivenName());
            setFamilyName(contactInfo.getFamilyName());
            setTelephone(contactInfo.getPhone());
            setEmail(contactInfo.getEmail());
            return null;
          }

          public void ejbPostCreate(ContactInfo contactInfo) throws CreateException {
            try {
              ServiceLocator serviceLocator = new ServiceLocator();
              AddressLocalHome adh = (AddressLocalHome)
                  serviceLocator.getLocalHome(JNDINames.ADDR_EJB);
              AddressLocal address = adh.create(contactInfo.getAddress());
              setAddress(address);

  - record_key: account-management-data-retrieval-0001
    kind: business-rule
    capability_key: account-management
