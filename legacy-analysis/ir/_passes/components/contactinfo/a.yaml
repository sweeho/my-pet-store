      ContactInfo entity SHALL hold the following properties: family name, given name, email address, telephone number, and an associated Address.
    confidence: high
    confidence_basis: >
      The ContactInfo POJO directly declares all five fields (familyName, givenName, email, phone, address) with public accessors. ContactInfoEJB implements CMP persistence for these fields. The DTD strictly requires all five elements in sequence.
