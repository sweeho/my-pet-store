  - record_key: ACCTMGMT-REQUIREMENT-0001
    kind: requirement
    capability_key: account-management
    requirement: >
      The system SHALL support creating a ContactInfo record with all required properties: given name, family name, telephone, email, and an existing Address reference.
    confidence: high
    confidence_basis: >
      The create method with five parameters (String givenName, String familyName, String telephone, String email, AddressLocal address) is explicitly defined in both the home interface and the EJB implementation. The method is declared in the ejb-jar.xml assembly descriptor.
    risk_class: operational
    basis: >
      ContactInfoLocalHome.java lines 49-50 define the five-parameter create method. ContactInfoEJB.java lines 93-107 implement ejbCreate and ejbPostCreate with the same signature.
    traces:
      - path: legacy-source/petstore1.3.2/src/components/contactinfo/src/com/sun/j2ee/blueprints/contactinfo/ejb/ContactInfoLocalHome.java
        line_start: 49
        line_end: 50
        excerpt: |
          public ContactInfoLocal create(String givenName, String familyName,
                                         String telephone, String email, AddressLocal address) throws CreateException;
      - path: legacy-source/petstore1.3.2/src/components/contactinfo/src/com/sun/j2ee/blueprints/contactinfo/ejb/ContactInfoEJB.java
        line_start: 93
        line_end: 107
        excerpt: |
          public Object ejbCreate(String givenName, String familyName,
                                  String telephone, String email, AddressLocal address)
