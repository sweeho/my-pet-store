  # Business rule: Exception conversion
  - record_key: notifications-business-0004
    kind: business-rule
    capability_key: notifications
    requirement: >
      The system SHALL catch any exception occurring during JMS operations (including messaging
      exceptions and NamingException during resource lookup) and convert them to EJBException
      with descriptive error messages. This ensures consistent exception handling across the
      message sending operation.
    confidence: medium
    confidence_basis: >
      Both ejbCreate (resource lookup) and sendAMessage (message sending) implement catch-all
      exception handling that converts to EJBException. The ejbCreate uses ServiceLocatorException
      which wraps NamingException. However, the basis shows inconsistent error message wording
      ("askMDBToSendAMessage" in sendAMessage catch block does not match the method name),
      suggesting the exception handling may be copy-pasted or template-based. This is a pattern
      rather than a single authoritatively-documented rule.
    risk_class: operational
    basis: >
      AsyncSenderEJB.ejbCreate catches ServiceLocatorException and throws EJBException.
      AsyncSenderEJB.sendAMessage catches all Exceptions and throws EJBException with
      message "askMDBToSendAMessage: Error!" (note: method is sendAMessage, not askMDB...).
      Stack trace printing (e.printStackTrace()) indicates development-era error handling.
    traces:
      - path: legacy-source/petstore1.3.2/src/components/asyncsender/src/com/sun/j2ee/blueprints/asyncsender/ejb/AsyncSenderEJB.java
        line_start: 58
        line_end: 66
        excerpt: |
          public void ejbCreate( ) throws CreateException {
            try {
              ServiceLocator serviceLocator = new ServiceLocator();
              qFactory = serviceLocator.getQueueConnectionFactory(JNDINames.QUEUE_CONNECTION_FACTORY);
              q = serviceLocator.getQueue(JNDINames.ASYNC_SENDER_QUEUE);
            } catch (ServiceLocatorException sle) {
              throw new EJBException("AsyncSenderEJB.ejbCreate failed", sle);
            }
          }
      - path: legacy-source/petstore1.3.2/src/components/asyncsender/src/com/sun/j2ee/blueprints/asyncsender/ejb/AsyncSenderEJB.java
        line_start: 80
        line_end: 82
        excerpt: |
          }catch  (Exception e) {
            e.printStackTrace();
            throw new EJBException("askMDBToSendAMessage: Error!",e);
    stack_metadata:
      exception.handling: EJBException

  # Business rule: Resource lifecycle
  - record_key: notifications-business-0005
    kind: business-rule
    capability_key: notifications
    requirement: >
      The system SHALL initialize JMS resources (QueueConnectionFactory and Queue reference)
      once during EJB instantiation via the ejbCreate lifecycle method, using the ServiceLocator
      pattern for JNDI lookup. Repeated resource lookup per message send operation is not performed.
    confidence: high
    confidence_basis: >
      The ejbCreate method performs resource initialization using ServiceLocator. The sendAMessage
      method uses the cached qFactory and q references without re-lookup. This is confirmed by
      inspection of the implementation: qFactory and q are instance variables initialized exactly
      once and reused. This pattern is standard for J2EE components.
    risk_class: operational
    basis: >
      Instance variables qFactory and q are declared in AsyncSenderEJB class and populated
      only in ejbCreate. sendAMessage method uses these cached references directly via
      qFactory.createQueueConnection() and session.createSender(q).
    traces:
      - path: legacy-source/petstore1.3.2/src/components/asyncsender/src/com/sun/j2ee/blueprints/asyncsender/ejb/AsyncSenderEJB.java
        line_start: 49
        line_end: 66
        excerpt: |
          public class AsyncSenderEJB implements SessionBean {
            private SessionContext sc;
            private Queue q;
            private QueueConnectionFactory qFactory;
            public AsyncSenderEJB() {}
            public void ejbCreate( ) throws CreateException {
              try {
                ServiceLocator serviceLocator = new ServiceLocator();
                qFactory = serviceLocator.getQueueConnectionFactory(JNDINames.QUEUE_CONNECTION_FACTORY);
                q = serviceLocator.getQueue(JNDINames.ASYNC_SENDER_QUEUE);
              } catch (ServiceLocatorException sle) {
                throw new EJBException("AsyncSenderEJB.ejbCreate failed", sle);
              }
            }
      - path: legacy-source/petstore1.3.2/src/components/asyncsender/src/com/sun/j2ee/blueprints/asyncsender/ejb/AsyncSenderEJB.java
        line_start: 74
        line_end: 76
        excerpt: |
          qConnect = qFactory.createQueueConnection();
          session = qConnect.createQueueSession(true,0);
          qSender = session.createSender(q);
    stack_metadata:
      ejb.bean: AsyncSenderEJB
      pattern: service-locator

  # Workflow/integration point
  - record_key: notifications-workflow-0001
    kind: workflow
    capability_key: notifications
    requirement: >
      The system SHALL support a message sending workflow where a caller obtains an AsyncSender
      EJB local home via JNDI lookup, creates a new bean instance, invokes sendAMessage with
      a String message, and the bean asynchronously sends the message through JMS. The operation
      is atomic: either the message is successfully sent within the transaction, or the entire
      operation rolls back.
    confidence: medium
    confidence_basis: >
      The local-home and local interfaces are declared, and the sendAMessage public method is
      part of the AsyncSender interface. However, actual caller code is not visible in this
      component. The workflow is inferred from EJB contract (AsyncSenderLocalHome.create() ->
      AsyncSender.sendAMessage()), method permissions (unchecked), and transaction attributes.
      The described workflow is standard EJB usage pattern but not explicitly documented.
    risk_class: operational
    basis: >
      ejb-jar.xml defines local-home and local interfaces. AsyncSenderLocalHome interface
      (lines 45-47) provides create() method. AsyncSender interface (lines 44-47) defines
      sendAMessage(String) public method. All methods are marked unchecked in method-permission.
    traces:
      - path: legacy-source/petstore1.3.2/src/components/asyncsender/src/ejb-jar.xml
        line_start: 49
        line_end: 50
        excerpt: |
          <local-home>com.sun.j2ee.blueprints.asyncsender.ejb.AsyncSenderLocalHome</local-home>
          <local>com.sun.j2ee.blueprints.asyncsender.ejb.AsyncSender</local>
