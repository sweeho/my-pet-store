records:
  # Integration requirements
  - record_key: notifications-integration-0001
    kind: integration
    capability_key: notifications
    requirement: >
      The system SHALL support asynchronous message sending via JMS Queue for notification delivery.
      Messages are formatted as JMS TextMessage and sent through a shared QueueConnectionFactory
      to a dedicated AsyncSenderQueue. The message content is passed as a plain String parameter.
    confidence: high
    confidence_basis: >
      The JMS integration is enforced declaratively in ejb-jar.xml through resource-ref and
      resource-env-ref declarations for QueueConnectionFactory and AsyncSenderQueue. The
      AsyncSenderEJB.java implementation shows the concrete implementation pattern: QueueConnection
      and QueueSession creation from factory, TextMessage creation and population, and send via
      QueueSender. The ServiceLocator pattern is used for resource lookup. No alternative
      implementation path exists in the component.
    risk_class: operational
    basis: >
      ejb-jar.xml declares two JMS resource references with specific JNDI names and types.
      AsyncSenderEJB.sendAMessage method (lines 68-90) implements the send pattern:
      creates connection from factory, creates session with transactional behavior (true, 0),
      creates TextMessage, sets text, and sends. Connection is explicitly closed in finally block.
    traces:
      - path: legacy-source/petstore1.3.2/src/components/asyncsender/src/ejb-jar.xml
        line_start: 58
        line_end: 67
        excerpt: |
          <resource-ref>
            <res-ref-name>jms/QueueConnectionFactory</res-ref-name>
            <res-type>javax.jms.QueueConnectionFactory</res-type>
            <res-auth>Container</res-auth>
            <res-sharing-scope>Shareable</res-sharing-scope>
          </resource-ref>
          <resource-env-ref>
            <resource-env-ref-name>jms/AsyncSenderQueue</resource-env-ref-name>
            <resource-env-ref-type>javax.jms.Queue</resource-env-ref-type>
          </resource-env-ref>
      - path: legacy-source/petstore1.3.2/src/components/asyncsender/src/com/sun/j2ee/blueprints/asyncsender/ejb/AsyncSenderEJB.java
        line_start: 68
        line_end: 90
        excerpt: |
          public void sendAMessage(String msg)  {
            QueueSession session = null;
            QueueConnection qConnect = null;
            QueueSender qSender = null;
            try {
              qConnect = qFactory.createQueueConnection();
              session = qConnect.createQueueSession(true,0);
              qSender = session.createSender(q);
              TextMessage jmsMsg = session.createTextMessage();
              jmsMsg.setText(msg);
              qSender.send(jmsMsg);
            }catch  (Exception e) {
              e.printStackTrace();
              throw new EJBException("askMDBToSendAMessage: Error!",e);
            } finally {
              try {
                if( qConnect != null ) {
                  qConnect.close();
                }
              } catch(Exception e) {}
            }
          }
    stack_metadata:
      ejb.bean: AsyncSenderEJB
      ejb.transaction: Required
      jms.queue: AsyncSenderQueue
      jms.connection_factory: QueueConnectionFactory

  # Business rule: Transaction semantics
  - record_key: notifications-business-0001
    kind: business-rule
    capability_key: notifications
    requirement: >
      The system SHALL ensure that message sending operations execute within a container-managed
      transaction with Required semantics. If a message send fails, the entire transaction is rolled
      back, preventing partial message delivery and maintaining consistency.
    confidence: high
    confidence_basis: >
      The transaction requirement is explicitly declared in the EJB assembly descriptor using
      declarative transaction control (not programmatic). The ejb-jar.xml container-transaction
      element maps the sendAMessage method to Required transaction attribute. This is enforced
      by the EJB container, not by application code, making it a business invariant rather than
      implementation detail.
    risk_class: operational
    basis: >
      ejb-jar.xml assembly-descriptor section declares container-transaction with
      trans-attribute: Required for the sendAMessage method. The QueueSession is created
      with transactional flag set to true (first parameter in createQueueSession call).
    traces:
      - path: legacy-source/petstore1.3.2/src/components/asyncsender/src/ejb-jar.xml
        line_start: 122
        line_end: 132
        excerpt: |
          <container-transaction>
            <method>
              <ejb-name>AsyncSenderEJB</ejb-name>
              <method-intf>Local</method-intf>
              <method-name>sendAMessage</method-name>
              <method-params>
                <method-param>java.lang.String</method-param>
              </method-params>
            </method>
            <trans-attribute>Required</trans-attribute>
          </container-transaction>
      - path: legacy-source/petstore1.3.2/src/components/asyncsender/src/com/sun/j2ee/blueprints/asyncsender/ejb/AsyncSenderEJB.java
        line_start: 75
        line_end: 75
        excerpt: |
          session = qConnect.createQueueSession(true,0);
    stack_metadata:
      ejb.transaction: Required

  # Business rule: Stateless bean pooling
  - record_key: notifications-business-0002
    kind: business-rule
    capability_key: notifications
    requirement: >
      The AsyncSender component SHALL be implemented as a stateless session EJB to enable
      scalable resource pooling. Each bean instance can be reused for multiple client requests,
      and the container may activate and passivate instances based on load.
    confidence: high
    confidence_basis: >
      The session-type is explicitly declared as Stateless in the EJB descriptor.
      The implementation class declares empty ejbActivate() and ejbPassivate() methods with
      comments indicating they are empty for stateless EJBs, confirming the intended pooling model.
      No bean state is maintained across method calls (no instance variables other than transient
      references initialized in ejbCreate).
    risk_class: operational
    basis: >
      ejb-jar.xml declares session-type: Stateless. AsyncSenderEJB.java shows no state
      persistence: the qFactory and q references are initialized once in ejbCreate (via
      ServiceLocator) and reused. No per-request state is stored in instance variables.
    traces:
      - path: legacy-source/petstore1.3.2/src/components/asyncsender/src/ejb-jar.xml
        line_start: 52
        line_end: 52
        excerpt: |
          <session-type>Stateless</session-type>
      - path: legacy-source/petstore1.3.2/src/components/asyncsender/src/com/sun/j2ee/blueprints/asyncsender/ejb/AsyncSenderEJB.java
        line_start: 49
        line_end: 99
        excerpt: |
          public class AsyncSenderEJB implements SessionBean {
            private SessionContext sc;
            private Queue q;
            private QueueConnectionFactory qFactory;
            public AsyncSenderEJB() {}
            public void ejbCreate( ) throws CreateException { ... }
            public void ejbActivate() { }
            public void ejbPassivate() { }
    stack_metadata:
      ejb.bean: AsyncSenderEJB
      session.scope: stateless

  # Business rule: Container-managed transactions
  - record_key: notifications-business-0003
    kind: business-rule
    capability_key: notifications
    requirement: >
      The system SHALL use container-managed transactions exclusively (transaction-type: Container).
      Transaction demarcation is controlled by declarative transaction descriptors, not by
      application code. The sendAMessage method must not contain explicit transaction
      management calls.
    confidence: high
    confidence_basis: >
      The transaction-type is declared as Container in ejb-jar.xml. The implementation contains
      no UserTransaction lookups or begin/commit/rollback calls, confirming application relies
      on container transaction management. This is enforced by the EJB specification and
      container semantics, making it a reliable invariant.
    risk_class: operational
    basis: >
      ejb-jar.xml declares transaction-type: Container for the AsyncSenderEJB. The
      AsyncSenderEJB.java implementation (lines 68-90) contains only business logic and
      exception handling, no transaction control code.
    traces:
