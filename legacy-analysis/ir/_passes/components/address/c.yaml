records:
  - record_key: account-management-entity-0001
    kind: entity
    capability_key: account-management
    requirement: >
      The system SHALL maintain an Address entity with six address components:
      street address line 1, street address line 2 (optional), city, state,
      postal code, and country.
    confidence: high
    confidence_basis: >
      Address structure is defined in two independent places: (1) ejb-jar.xml
      declares six CMP fields (streetName1, streetName2, state, zipCode, city,
      country), and (2) AddressLocal interface exposes getter/setter methods for
      all six fields. The structure is enforced by the container-managed
      persistence layer.
    risk_class: operational
    basis: >
      ejb-jar.xml declares six CMP fields that form the persistent state of the
      AddressEJB entity. Address.java defines the structure as a simple data
      holder with six private fields. AddressLocal interface exposes the complete
      set of getter and setter methods.
    traces:
      - path: legacy-source/petstore1.3.2/src/components/address/src/ejb-jar.xml
        line_start: 57
        line_end: 80
        excerpt: |
          <cmp-field>
            <description>no description</description>
            <field-name>zipCode</field-name>
          </cmp-field>
          <cmp-field>
            <description>no description</description>
            <field-name>streetName2</field-name>
          </cmp-field>
          <cmp-field>
            <description>no description</description>
            <field-name>state</field-name>
          </cmp-field>
          <cmp-field>
            <description>no description</description>
            <field-name>streetName1</field-name>
          </cmp-field>
          <cmp-field>
            <description>no description</description>
            <field-name>city</field-name>
          </cmp-field>
          <cmp-field>
            <description>no description</description>
            <field-name>country</field-name>
          </cmp-field>
      - path: legacy-source/petstore1.3.2/src/components/address/src/com/sun/j2ee/blueprints/address/ejb/Address.java
        line_start: 62
        line_end: 67
        excerpt: |
          private String streetName1;
          private String streetName2;
          private String city;
          private String state;
          private String zipCode;
          private String country;
    stack_metadata:
      ejb.bean: AddressEJB
      persistence_type: Container-Managed (CMP 2.x)
      db.object: Address entity table

  - record_key: account-management-requirement-0001
    kind: requirement
    capability_key: account-management
    requirement: >
      The system SHALL allow creation of an Address entity by providing all six
      address components (street 1, street 2, city, state, postal code, country)
      in a single operation.
    confidence: high
    confidence_basis: >
      All three create methods are declared in AddressLocalHome interface, and
      implementation is provided in AddressEJB.ejbCreate() methods. The
      six-parameter create method is explicitly tested via both local home
      interface and EJB implementation.
    risk_class: operational
    basis: >
      AddressLocalHome declares a create() method with six String parameters.
      AddressEJB provides the corresponding ejbCreate(String streetName1,
      String streetName2, String city, String state, String zipCode,
      String country) method that assigns all parameters to CMP fields.
    traces:
      - path: legacy-source/petstore1.3.2/src/components/address/src/com/sun/j2ee/blueprints/address/ejb/AddressLocalHome.java
        line_start: 45
        line_end: 46
        excerpt: |
          public AddressLocal create(String streetName1, String streetName2, String city,
                                     String state, String zipCode, String country) throws CreateException;
      - path: legacy-source/petstore1.3.2/src/components/address/src/com/sun/j2ee/blueprints/address/ejb/AddressEJB.java
        line_start: 73
        line_end: 82
        excerpt: |
          public Object ejbCreate(String streetName1, String streetName2, String city,
                                  String state, String zipCode, String country) throws CreateException {
                                    setStreetName1(streetName1);
                                    setStreetName2(streetName2);
                                    setCity(city);
                                    setState(state);
                                    setZipCode(zipCode);
                                    setCountry(country);
                                    return null;
          }
    stack_metadata:
      ejb.bean: AddressEJB

  - record_key: account-management-requirement-0002
