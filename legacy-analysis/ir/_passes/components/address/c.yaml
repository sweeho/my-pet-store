    capability_key: account-management
    requirement: >
      The system SHALL allow creation of an Address entity by providing an
      Address object (transfer object) in a single operation.
    confidence: high
    confidence_basis: >
      Alternative create method is declared in AddressLocalHome and implemented
      in AddressEJB, alongside the six-parameter variant. Both are traceable
      to the same sources.
    risk_class: operational
    basis: >
      AddressLocalHome declares create(Address address) method. AddressEJB
      provides corresponding ejbCreate() that copies fields from the provided
      Address object to CMP fields via setter methods.
    traces:
