          <abstract-schema-name>Address</abstract-schema-name>
    stack_metadata:
      ejb.bean: AddressEJB
      ejb.persistence: container
      ejb.cmp_version: "2.x"

  - record_key: ADDR-RULE-0001
    kind: business-rule
    capability_key: account-management
    requirement: >
      The system SHALL apply container-managed transaction attribute "Required"
      to all Address entity bean methods, ensuring each method invocation
      participates in a transaction. GIVEN an Address method is invoked WHEN
      there is no active transaction THEN the container SHALL create a new
      transaction that will be committed upon method return.
    confidence: high
    confidence_basis: >
      The declarative configuration in ejb-jar.xml explicitly specifies
      container-transaction elements for every Address method with trans-attribute
      "Required" (lines 250-387). This is comprehensive declarative enforcement.
    risk_class: operational
    basis: >
      Container-transaction elements in ejb-jar.xml declare trans-attribute
      "Required" for all Address methods. Examples include getCountry (line 257),
      setStreetName2 (line 268), getZipCode (line 288), etc. The pattern is
      consistent across all getter and setter methods.
    traces:
      - path: legacy-source/petstore1.3.2/src/components/address/src/ejb-jar.xml
        line_start: 250
        line_end: 310
        excerpt: |
          <container-transaction>
            <method>
              <ejb-name>AddressEJB</ejb-name>
              <method-intf>Local</method-intf>
              <method-name>getCountry</method-name>
              <method-params />
            </method>
            <trans-attribute>Required</trans-attribute>
          </container-transaction>
          <container-transaction>
            <method>
              <ejb-name>AddressEJB</ejb-name>
              <method-intf>Local</method-intf>
              <method-name>setStreetName2</method-name>
              <method-params>
                <method-param>java.lang.String</method-param>
              </method-params>
            </method>
            <trans-attribute>Required</trans-attribute>
          </container-transaction>
          [... repeated for all methods ...]
    stack_metadata:
      ejb.transaction: Required

  - record_key: ADDR-RULE-0002
    kind: business-rule
    capability_key: account-management
    requirement: >
      The system SHALL allow unchecked (unauthenticated) access to all
      Address entity bean methods. GIVEN any principal invokes an Address method
      THEN the container SHALL grant access without checking authentication status
      or authorization roles.
    confidence: high
    confidence_basis: >
      The ejb-jar.xml method-permission section (lines 88-249) declares all
      Address methods with <unchecked /> elements, indicating no authentication
      requirement. This is a single authoritative declarative configuration.
    risk_class: operational
    basis: >
      Method-permission elements in ejb-jar.xml declare <unchecked /> for all
      Address methods (see lines 89, and repeated in all method permission
      declarations). This unusual posture suggests the Address component is
      intended as a shared utility without per-method access control; access
      control is likely enforced at higher layers (e.g., on the order or
      customer entities that use addresses).
    traces:
      - path: legacy-source/petstore1.3.2/src/components/address/src/ejb-jar.xml
        line_start: 88
        line_end: 249
        excerpt: |
          <method-permission>
            <unchecked />
            <method>
              <ejb-name>AddressEJB</ejb-name>
              <method-intf>Local</method-intf>
              <method-name>getCity</method-name>
              <method-params />
            </method>
            [... 39 more methods with <unchecked /> ...]
    stack_metadata:
      ejb.security: use-caller-identity

  - record_key: ADDR-REQ-0002
    kind: requirement
    capability_key: account-management
    requirement: >
      The system SHALL support creating an Address entity with three distinct
      creation signatures: (1) CREATE with six string parameters
      (streetName1, streetName2, city, state, zipCode, country), (2) CREATE with
      an Address value object, and (3) CREATE with no parameters.
    confidence: high
    confidence_basis: >
      Three ejbCreate methods are defined in AddressEJB.java (lines 73-103) and
      matched by three create() methods in AddressLocalHome.java (lines 45-50).
      Both the bean implementation and the home interface agree on all three
      signatures.
    risk_class: operational
    basis: >
      AddressEJB defines three ejbCreate overloads at lines 73, 87, and 99.
      AddressLocalHome declares corresponding create() method signatures that
      the container will generate. The no-parameter variant (line 99-101) creates
      an empty Address that must have fields set via setters afterward.
    traces:
      - path: legacy-source/petstore1.3.2/src/components/address/src/com/sun/j2ee/blueprints/address/ejb/AddressEJB.java
        line_start: 73
        line_end: 103
        excerpt: |
          public Object ejbCreate(String streetName1, String streetName2, String city,
                                  String state, String zipCode, String country) throws CreateException {
            setStreetName1(streetName1);
            setStreetName2(streetName2);
            setCity(city);
            setState(state);
            setZipCode(zipCode);
            setCountry(country);
            return null;
          }
          public void ejbPostCreate(String streetName1, String streetName2, String city,
                                    String state, String zipCode, String country) throws CreateException { }
          public Object ejbCreate(Address address) throws CreateException {
            setStreetName1(address.getStreetName1());
            setStreetName2(address.getStreetName2());
            setCity(address.getCity());
            setState(address.getState());
            setZipCode(address.getZipCode());
            setCountry(address.getCountry());
            return null;
          }
          public void ejbPostCreate(Address address) throws CreateException { }
          public Object ejbCreate() throws CreateException {
            return null;
          }
          public void ejbPostCreate() throws CreateException { }
      - path: legacy-source/petstore1.3.2/src/components/address/src/com/sun/j2ee/blueprints/address/ejb/AddressLocalHome.java
        line_start: 45
        line_end: 50
        excerpt: |
          public AddressLocal create(String streetName1, String streetName2, String city,
                                     String state, String zipCode, String country) throws CreateException;
          public AddressLocal create(Address address) throws CreateException;
          public AddressLocal create() throws CreateException;
    stack_metadata:
      ejb.bean: AddressEJB
      ejb.factory_methods: 3

  - record_key: ADDR-REQ-0003
    kind: requirement
    capability_key: account-management
    requirement: >
      The system SHALL serialize an Address entity to an XML DOM tree with
      elements: Address root containing child elements StreetName (required,
      may appear twice), City (required), State (required), ZipCode (required),
      and Country (optional).
    confidence: high
    confidence_basis: >
      The toDOM() method in Address.java (lines 144-155) implements serialization
      using the declared DTD schema (Address.dtd lines 38-43). Both the DTD
      (declarative) and the toDOM implementation (programmatic) agree on the
      element structure. The DTD shows Country is optional.
    risk_class: presentational
    basis: >
      Address.toDOM() creates an Address root element and appends all fields as
      XML child elements. StreetName2 is conditionally appended only if not null
      or empty (line 147-149). The Address.dtd schema (lines 38-43) declares
      the formal structure with Country marked optional (unspecified in DTD means
      required unless marked with ?).
    traces:
      - path: legacy-source/petstore1.3.2/src/components/address/src/com/sun/j2ee/blueprints/address/ejb/Address.java
        line_start: 144
        line_end: 155
        excerpt: |
          public Node toDOM(Document document) {
            Element root = document.createElement(XML_ADDRESS);
            XMLDocumentUtils.appendChild(document, root, XML_STREET_NAME, streetName1);
            if (streetName2 != null && !streetName2.equals("")) {
              XMLDocumentUtils.appendChild(document, root, XML_STREET_NAME, streetName2);
            }
            XMLDocumentUtils.appendChild(document, root, XML_CITY, city);
            XMLDocumentUtils.appendChild(document, root, XML_STATE, state);
            XMLDocumentUtils.appendChild(document, root, XML_ZIPCODE, zipCode);
            XMLDocumentUtils.appendChild(document, root, XML_COUNTRY, country);
            return root;
          }
      - path: legacy-source/petstore1.3.2/src/components/address/src/com/sun/j2ee/blueprints/address/rsrc/schemas/Address.dtd
        line_start: 38
        line_end: 43
        excerpt: |
          <!ELEMENT Address (StreetName, StreetName?, City, State, ZipCode, Country?)>
          <!ELEMENT StreetName (#PCDATA)>
          <!ELEMENT City (#PCDATA)>
          <!ELEMENT State (#PCDATA)>
          <!ELEMENT ZipCode (#PCDATA)>
          <!ELEMENT Country (#PCDATA)>
    stack_metadata:
      xml.dtd: Address.dtd

  - record_key: ADDR-REQ-0004
    kind: requirement
    capability_key: account-management
    requirement: >
      The system SHALL deserialize an XML DOM tree to an Address object,
      extracting StreetName (first occurrence sets streetName1, optional second
      occurrence sets streetName2), City, State, ZipCode, and Country (optional).
      GIVEN an XML node with structure matching Address.dtd WHEN fromDOM() is
      called THEN a populated Address object SHALL be returned.
    confidence: high
    confidence_basis: >
      The fromDOM() static method in Address.java (lines 157-180) implements the
      full deserialization logic. The implementation handles the optional
      streetName2 and Country fields explicitly. Both the DTD and implementation
      are present and consistent.
    risk_class: presentational
    basis: >
      fromDOM() parses StreetName elements using getFirstChild() and optional
      getNextSibling() (lines 162-168), explicitly handling the optional second
      StreetName. Country is appended unconditionally (line 176), but may be set
      to null if missing. An XMLDocumentException is thrown if the root element
      is not "Address" (line 179).
    traces:
      - path: legacy-source/petstore1.3.2/src/components/address/src/com/sun/j2ee/blueprints/address/ejb/Address.java
        line_start: 157
        line_end: 180
        excerpt: |
          public static Address fromDOM(Node node) throws XMLDocumentException {
            Element element;
            if (node.getNodeType() == Node.ELEMENT_NODE && (element = ((Element) node)).getTagName().equals(XML_ADDRESS)) {
              Element child;
              Address address = new Address();
              child = XMLDocumentUtils.getFirstChild(element, XML_STREET_NAME, false);
              address.streetName1 = XMLDocumentUtils.getContentAsString(child, false);
              Element optionalChild = XMLDocumentUtils.getNextSibling(child, XML_STREET_NAME, true);
              if (optionalChild != null) {
                address.streetName2 = XMLDocumentUtils.getContentAsString(optionalChild, false);
                child = optionalChild;
              }
              child = XMLDocumentUtils.getNextSibling(child, XML_CITY, false);
              address.city = XMLDocumentUtils.getContentAsString(child, false);
              child = XMLDocumentUtils.getNextSibling(child, XML_STATE, false);
              address.state = XMLDocumentUtils.getContentAsString(child, false);
              child = XMLDocumentUtils.getNextSibling(child, XML_ZIPCODE, false);
              address.zipCode = XMLDocumentUtils.getContentAsString(child, false);
              child = XMLDocumentUtils.getNextSibling(child, XML_COUNTRY, false);
              address.country = XMLDocumentUtils.getContentAsString(child, false);
              return address;
            }
            throw new XMLDocumentException(XML_ADDRESS + " element expected.");
          }
    stack_metadata:
      xml.dtd: Address.dtd

  - record_key: ADDR-REQ-0005
