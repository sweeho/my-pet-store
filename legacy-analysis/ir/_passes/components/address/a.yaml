records:
  - record_key: ADDR-ENTITY-0001
    kind: entity
    capability_key: account-management
    requirement: >
      The system SHALL define an Address entity with fields for street address,
      city, state, zip code, and country information.
    confidence: high
    confidence_basis: >
      The entity is defined across three independent sources: (1) declarative
      configuration in ejb-jar.xml with explicit CMP field declarations, (2)
      abstract getter/setter methods in AddressEJB.java, and (3) the Address
      value object in Address.java with all six fields. All three agree on the
      field names and presence.
    risk_class: operational
    basis: >
      The AddressEJB entity bean declares six CMP fields in ejb-jar.xml:
      streetName1, streetName2, city, state, zipCode, country. These are
      implemented as abstract methods in AddressEJB.java (lines 53-69) and as
      instance variables in the Address value object class (lines 62-67).
