  - record_key: ADDR-RULE-0004
    kind: business-rule
    capability_key: account-management
    requirement: >
      The system SHALL treat country field as optional in Address serialization.
      GIVEN an Address is serialized to XML WHEN country is null THEN the
      Country XML element SHALL be omitted or set to null content.
    confidence: medium
    confidence_basis: >
      The DTD declares Country? (optional, line 38). However, the toDOM()
      implementation unconditionally appends country (line 153) without a null
      check, so it will be included even if null. This represents a conflict
      between the declared optional schema and the actual serialization behavior.
      The conflict is flagged as a finding below.
    risk_class: operational
    basis: >
      The DTD at line 38 marks Country as optional ("Country?"). However,
      Address.toDOM() (line 153) does not conditionally check country before
      appending, unlike the handling of streetName2 (lines 147-149). This means
      the actual serialization may include null or empty Country elements even
      though the schema allows omission.
    traces:
      - path: legacy-source/petstore1.3.2/src/components/address/src/com/sun/j2ee/blueprints/address/rsrc/schemas/Address.dtd
        line_start: 38
        line_end: 38
        excerpt: |
          <!ELEMENT Address (StreetName, StreetName?, City, State, ZipCode, Country?)>
      - path: legacy-source/petstore1.3.2/src/components/address/src/com/sun/j2ee/blueprints/address/ejb/Address.java
        line_start: 153
        line_end: 153
        excerpt: |
          XMLDocumentUtils.appendChild(document, root, XML_COUNTRY, country);
    stack_metadata:
      xml.dtd: Address.dtd

findings:
  - kind: conflict
    path: legacy-source/petstore1.3.2/src/components/address/src/com/sun/j2ee/blueprints/address/ejb/Address.java
    description: >
      XML serialization behavior for Country field conflicts with DTD schema.
      The DTD declares Country as optional (Country?), but the toDOM() method
      at line 153 unconditionally appends the country field to the XML without
      a null or empty check, unlike the handling of streetName2 which checks
      for null/empty at lines 147-149. This means serialized XML will include
      Country elements with null or empty content when the schema suggests they
      should be omitted. The fromDOM() method (line 176) reads Country with a
      non-optional flag, which would fail to parse XML that omits Country.
      Either the toDOM() implementation should be updated to conditionally
      append Country (matching the DTD), or the DTD should be updated to mark
      Country as required, or the fromDOM() implementation should mark Country
      as optional in the parsing logic.

  - kind: ambiguity
    path: legacy-source/petstore1.3.2/src/components/address/src/com/sun/j2ee/blueprints/address/ejb/Address.java
    description: >
      The semantics of the no-parameter create() method (ejbCreate at line 99)
      are not documented. It creates an empty Address with null fields. It is
      unclear whether this is intended for incremental building via setters,
      whether clients are expected to call this, or whether it exists solely
      for container framework compliance. The method has no postcreate logic
      and no comment explaining its purpose.
