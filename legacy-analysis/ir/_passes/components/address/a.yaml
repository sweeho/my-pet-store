  - record_key: ADDR-REQ-0001
    kind: requirement
    capability_key: account-management
    requirement: >
      The system SHALL persist Address data using container-managed persistence
      (CMP 2.x) managed by the application server.
    confidence: high
    confidence_basis: >
      The declarative configuration in ejb-jar.xml explicitly declares CMP 2.x
      persistence for the AddressEJB entity bean (line 55: cmp-version 2.x,
      line 52: persistence-type Container). This is a single authoritative
      source for the persistence model.
    risk_class: operational
    basis: >
      The ejb-jar.xml descriptor declares the persistence type as "Container"
      with CMP version 2.x, which indicates container-managed persistence.
    traces:
      - path: legacy-source/petstore1.3.2/src/components/address/src/ejb-jar.xml
        line_start: 52
        line_end: 56
        excerpt: |
          <persistence-type>Container</persistence-type>
          <prim-key-class>java.lang.Object</prim-key-class>
          <reentrant>False</reentrant>
