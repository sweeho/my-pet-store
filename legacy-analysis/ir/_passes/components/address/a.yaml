  - record_key: ADDR-RULE-0003
    kind: business-rule
    capability_key: account-management
    requirement: >
      The system SHALL treat streetName2 field as optional. GIVEN an Address
      is created or updated WHEN streetName2 is null or empty string THEN it
      SHALL be stored or serialized conditionally (omitted from XML if empty).
    confidence: high
    confidence_basis: >
      The optional nature of streetName2 is consistent across three independent
      sources: (1) DTD declares StreetName? (lines 38), (2) toDOM() conditionally
      appends it only if not null and not empty (line 147), and (3) fromDOM()
      uses getNextSibling() with optional flag true (line 164).
    risk_class: operational
    basis: >
      The DTD element declaration "StreetName?" at line 38 marks the second
      StreetName element as optional. The toDOM() method explicitly checks
      streetName2 before appending (line 147-149). The fromDOM() method treats
      the second StreetName as optional via the optional flag in getNextSibling()
      (line 164).
    traces:
      - path: legacy-source/petstore1.3.2/src/components/address/src/com/sun/j2ee/blueprints/address/rsrc/schemas/Address.dtd
        line_start: 38
        line_end: 38
        excerpt: |
          <!ELEMENT Address (StreetName, StreetName?, City, State, ZipCode, Country?)>
      - path: legacy-source/petstore1.3.2/src/components/address/src/com/sun/j2ee/blueprints/address/ejb/Address.java
        line_start: 147
        line_end: 149
        excerpt: |
          if (streetName2 != null && !streetName2.equals("")) {
            XMLDocumentUtils.appendChild(document, root, XML_STREET_NAME, streetName2);
          }
      - path: legacy-source/petstore1.3.2/src/components/address/src/com/sun/j2ee/blueprints/address/ejb/Address.java
        line_start: 164
        line_end: 168
        excerpt: |
          Element optionalChild = XMLDocumentUtils.getNextSibling(child, XML_STREET_NAME, true);
          if (optionalChild != null) {
            address.streetName2 = XMLDocumentUtils.getContentAsString(optionalChild, false);
            child = optionalChild;
          }
    stack_metadata:
