  - record_key: fulfillment-management-business-rule-0003
    kind: business-rule
    capability_key: fulfillment-management
    requirement: >
      TPA Supplier Orders and Invoices SHALL support validation against both DTD and XSD schemas. The system SHALL allow switching between DTD and XSD validation modes.
    confidence: high
    confidence_basis: >
      Both TPASupplierOrderXDE and TPAInvoiceXDE implement the setSupportingXSD method and maintain both DTD_PUBLIC_ID/DTD_SYSTEM_ID and XSD_PUBLIC_ID/XSD_SYSTEM_ID constants (e.g., lines 58-63 in TPASupplierOrderXDE). The serialization method conditionally uses XSD or DTD based on the supportingXSD flag. This is not just infrastructure code; it reflects a deliberate design choice to support both validation modes.
    risk_class: operational
    basis: >
      TPASupplierOrderXDE.java lines 58-63 define both DTD and XSD identifiers. Lines 94-96 set the validation mode. Lines 127-129 in copyDocument use the isSupportingXSD flag to select which validation approach to use. The same pattern appears in TPAInvoiceXDE.
    traces:
      - path: legacy-source/petstore1.3.2/src/components/xmldocuments/src/com/sun/j2ee/blueprints/xmldocuments/tpa/TPASupplierOrderXDE.java
        line_start: 58
        line_end: 63
        excerpt: |
          public static final String DTD_PUBLIC_ID = "-//Sun Microsystems, Inc. - J2EE Blueprints Group//DTD TPA-SupplierOrder 1.0//EN";
          public static final String XSD_PUBLIC_ID = "http://blueprints.j2ee.sun.com/TPASupplierOrder";
          public static final String XML_NAMESPACE = "http://blueprints.j2ee.sun.com/TPASupplierOrder";
          public static final String XML_PREFIX = "tpaso";
          public static final String DTD_SYSTEM_ID = "/com/sun/j2ee/blueprints/xmldocuments/rsrc/schemas/TPASupplierOrder.dtd";
          public static final String XSD_SYSTEM_ID = "/com/sun/j2ee/blueprints/xmldocuments/rsrc/schemas/TPASupplierOrder.xsd";

  - record_key: fulfillment-management-business-rule-0004
    kind: business-rule
    capability_key: fulfillment-management
    requirement: >
      XML documents from this component SHALL be encoded in UTF-8.
    confidence: high
    confidence_basis: >
      The XMLDocumentUtils class defines DEFAULT_ENCODING as a constant "UTF-8" (line 56). This constant is used as the default encoding throughout serialization methods (serialize, toXML, getDocumentAsString). No other encoding is used in the codebase; UTF-8 is enforced as the only encoding option.
    risk_class: operational
    basis: >
      XMLDocumentUtils.java line 56 defines DEFAULT_ENCODING = "UTF-8". This is used in the serialize method (line 378), toXML methods (lines 390-436), and in TPASupplierOrderXDE/TPAInvoiceXDE's getDocumentAsString methods.
    traces:
      - path: legacy-source/petstore1.3.2/src/components/xmldocuments/src/com/sun/j2ee/blueprints/xmldocuments/XMLDocumentUtils.java
        line_start: 56
        line_end: 56
        excerpt: |
          public static final String DEFAULT_ENCODING = "UTF-8";

  - record_key: fulfillment-management-integration-0001
    kind: integration
    capability_key: fulfillment-management
    requirement: >
      The system SHALL support entity catalog resolution for XML schema/DTD references. When an entity URI is provided, the system SHALL attempt to map it using an entity catalog before falling back to direct URL resolution.
    confidence: high
    confidence_basis: >
      The CustomEntityResolver class is purpose-built for this integration point. It loads entity mappings from a properties file (ENTITY_CATALOG at line 50) and provides mapEntityURI and resolveEntity methods. Both TPA document editor classes accept an optional entityCatalogURL parameter. The CustomEntityResolver is used consistently throughout the XMLDocumentUtils parsing and serialization methods.
    risk_class: operational
    basis: >
      CustomEntityResolver.java lines 47-217 implement entity catalog resolution. XMLDocumentUtils methods (toXML, deserialize, transform) accept optional entityCatalogURL parameters and create CustomEntityResolver instances to handle mapping. TPASupplierOrderXDE and TPAInvoiceXDE constructors accept entityCatalogURL and pass it to CustomEntityResolver.
    traces:
      - path: legacy-source/petstore1.3.2/src/components/xmldocuments/src/com/sun/j2ee/blueprints/xmldocuments/CustomEntityResolver.java
        line_start: 47
        line_end: 62
        excerpt: |
          public class CustomEntityResolver implements EntityResolver {
            public static final boolean TRACE = false;
            public static final String ENTITY_CATALOG
            = "/com/sun/j2ee/blueprints/xmldocuments/rsrc/EntityCatalog.properties";
            private Properties entityCatalog = null;
            private EntityResolver parentResolver = null;
            public CustomEntityResolver() {
              this((EntityResolver) null);
              return;
            }

  - record_key: fulfillment-management-workflow-0001
    kind: workflow
    capability_key: fulfillment-management
    requirement: >
      To create a TPA Supplier Order document, the system SHALL: (1) instantiate a TPASupplierOrderXDE, (2) call newDocument to initialize, (3) set OrderId via setOrderId, (4) set OrderDate via setOrderDate with a Date object, (5) set ShippingAddress via setShippingAddress with required address components, (6) add one or more LineItems via addLineItem, (7) serialize to output via copyDocument or getDocumentAsString.
    confidence: medium
    confidence_basis: >
      The TPASupplierOrderXDE class API directly implements this workflow (constructor at line 89, newDocument at line 110, setOrderId at line 149, setOrderDate at line 154, setShippingAddress at line 160, addLineItem at line 175, copyDocument at line 119, getDocumentAsString at line 139). The main method at lines 185-200 demonstrates this exact workflow. The code is well-structured for this sequence, though the workflow itself is inferred from the class design rather than explicitly documented as a requirement.
    risk_class: operational
    basis: >
      TPASupplierOrderXDE.java class structure and main method demonstrate the document creation workflow. The newDocument method initializes elements, setter methods populate them, and copyDocument/getDocumentAsString serialize.
    traces:
      - path: legacy-source/petstore1.3.2/src/components/xmldocuments/src/com/sun/j2ee/blueprints/xmldocuments/tpa/TPASupplierOrderXDE.java
        line_start: 185
        line_end: 200
        excerpt: |
          public static void main(String[] args) {
            try {
              TPASupplierOrderXDE builder = new TPASupplierOrderXDE(null, true);
              builder.newDocument();
              builder.setOrderId("007");
              builder.setShippingAddress("James", "Bond", "Seventh Street", "London", "LD", "Great Britain",
                                         "77007", "james.bond@mi6.uk.gov", "700 777 7777");
              builder.setOrderDate(new Date());
              builder.addLineItem("GUN", "BERETTA", "007", "001", 1, 1000);
              System.out.println(builder.getDocumentAsString());
              System.exit(0);

  - record_key: fulfillment-management-workflow-0002
