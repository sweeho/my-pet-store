records:
  - record_key: fulfillment-management-entity-0001
    kind: entity
    capability_key: fulfillment-management
    requirement: >
      A TPA Supplier Order document SHALL contain an OrderId element, an OrderDate element, a ShippingAddress complex element, and a LineItems element containing one or more LineItem elements. Each Supplier Order is serialized to XML with the namespace http://blueprints.j2ee.sun.com/TPASupplierOrder.
    confidence: high
    confidence_basis: >
      This is directly specified in the TPASupplierOrderXDE class implementation and corresponding XSD schema. The class methods (setOrderId, setOrderDate, setShippingAddress, addLineItem) and the XSD element definitions at TPASupplierOrder.xsd lines 11-30 directly enforce this structure.
    risk_class: operational
    basis: >
      TPASupplierOrderXDE.java defines the document structure with createElement and appendChild calls. TPASupplierOrder.xsd lines 11-30 specify the exact element composition and types.
    traces:
      - path: legacy-source/petstore1.3.2/src/components/xmldocuments/src/com/sun/j2ee/blueprints/xmldocuments/tpa/TPASupplierOrderXDE.java
        line_start: 119
        line_end: 131
        excerpt: |
          public void copyDocument(Result result) throws XMLDocumentException {
            Element supplierOrderElement = supplierOrderDocument.createElementNS(XML_NAMESPACE, XML_SUPPLIERORDER);
            supplierOrderElement.setAttributeNS("http://www.w3.org/2000/xmlns/", "xmlns:" + XML_PREFIX, XML_NAMESPACE);
            supplierOrderElement.appendChild(orderIdElement);
            supplierOrderElement.appendChild(orderDateElement);
            supplierOrderElement.appendChild(shippingAddressElement);
            supplierOrderElement.appendChild(lineItemsElement);
            supplierOrderDocument.appendChild(supplierOrderElement);

  - record_key: fulfillment-management-entity-0002
    kind: entity
    capability_key: fulfillment-management
    requirement: >
      A TPA Invoice document SHALL contain an OrderId element, a UserId element, an OrderDate element, a ShippingDate element, and a LineItems element containing one or more LineItem elements. Each Invoice is serialized to XML with the namespace http://blueprints.j2ee.sun.com/TPAInvoice.
    confidence: high
    confidence_basis: >
      The TPAInvoiceXDE class explicitly defines these elements as instance variables and the copyDocument method assembles them in order. The XSD schema at TPAInvoice.xsd lines 11-31 enforces this structure. Two independent declarations (code and schema) confirm the requirement.
    risk_class: operational
    basis: >
      TPAInvoiceXDE.java defines fields for each element (orderIdElement, userIdElement, orderDateElement, shippingDateElement, lineItemsElement). TPAInvoice.xsd lines 11-31 specify the element sequence and types.
    traces:
      - path: legacy-source/petstore1.3.2/src/components/xmldocuments/src/com/sun/j2ee/blueprints/xmldocuments/tpa/TPAInvoiceXDE.java
        line_start: 113
        line_end: 126
        excerpt: |
          public void copyDocument(Result result) throws XMLDocumentException {
            Element invoiceElement = invoiceDocument.createElementNS(XML_NAMESPACE, XML_INVOICE);
            invoiceElement.setAttributeNS("http://www.w3.org/2000/xmlns/", "xmlns:" + XML_PREFIX, XML_NAMESPACE);
            invoiceElement.appendChild(orderIdElement);
            invoiceElement.appendChild(userIdElement);
            invoiceElement.appendChild(orderDateElement);
            invoiceElement.appendChild(shippingDateElement);
            invoiceElement.appendChild(lineItemsElement);
            invoiceDocument.appendChild(invoiceElement);

  - record_key: fulfillment-management-entity-0003
    kind: entity
    capability_key: fulfillment-management
    requirement: >
      A TPA LineItem SHALL contain the following required attributes: categoryId (string), productId (string), itemId (string), lineNo (non-negative integer), quantity (positive integer), and unitPrice (positive decimal >= 0.0). LineItems within an order SHALL have unique itemId attributes.
    confidence: high
    confidence_basis: >
      The XSD schema specifies all attributes as required with type restrictions (TPALineItem.xsd lines 11-17). The uniqueness constraint is enforced at the order level via xsd:unique in both TPASupplierOrder.xsd and TPAInvoice.xsd. No conflicting implementation found in code; the code correctly adds line items with all required attributes.
    risk_class: operational
    basis: >
      TPALineItem.xsd lines 11-24 define the lineItem complexType with required attributes and the positiveDecimal type restriction. TPASupplierOrder.xsd lines 23-26 and TPAInvoice.xsd lines 24-27 enforce itemId uniqueness with xsd:unique constraints.
    traces:
      - path: legacy-source/petstore1.3.2/src/components/xmldocuments/src/com/sun/j2ee/blueprints/xmldocuments/rsrc/schemas/TPALineItem.xsd
        line_start: 10
        line_end: 24
        excerpt: |
          <xsd:complexType name="lineItem">
            <xsd:attribute name="categoryId" type="xsd:string" use="required" />
            <xsd:attribute name="productId" type="xsd:string" use="required" />
            <xsd:attribute name="itemId" type="xsd:string" use="required" />
            <xsd:attribute name="lineNo" type="xsd:nonNegativeInteger" use="required" />
            <xsd:attribute name="quantity" type="xsd:positiveInteger" use="required" />
            <xsd:attribute name="unitPrice" type="positiveDecimal" use="required" />
          </xsd:complexType>
          <xsd:simpleType name="positiveDecimal">
            <xsd:restriction base="xsd:decimal">
              <xsd:minInclusive value="0.0" />
            </xsd:restriction>
          </xsd:simpleType>

  - record_key: fulfillment-management-entity-0004
    kind: entity
    capability_key: fulfillment-management
    requirement: >
      A Shipping Address entity SHALL contain the following required string elements: FirstName, LastName, Street, City, State, Country, ZipCode, Email, and Phone.
    confidence: high
    confidence_basis: >
      The XSD schema explicitly defines the address complexType with all elements as xsd:string (TPASupplierOrder.xsd lines 32-44). The Java code directly populates these fields via appendChild calls (TPASupplierOrderXDE.java lines 163-171). Both sources consistently specify these nine required fields.
    risk_class: operational
    basis: >
      TPASupplierOrder.xsd lines 32-44 define the address complexType. TPASupplierOrderXDE.java lines 160-173 show the setShippingAddress method constructing the element with all nine required fields.
    traces:
      - path: legacy-source/petstore1.3.2/src/components/xmldocuments/src/com/sun/j2ee/blueprints/xmldocuments/rsrc/schemas/TPASupplierOrder.xsd
        line_start: 32
        line_end: 44
        excerpt: |
          <xsd:complexType name="address">
            <xsd:sequence>
              <xsd:element name="FirstName" type="xsd:string" />
              <xsd:element name="LastName" type="xsd:string" />
              <xsd:element name="Street" type="xsd:string" />
              <xsd:element name="City" type="xsd:string" />
              <xsd:element name="State" type="xsd:string" />
              <xsd:element name="Country" type="xsd:string" />
              <xsd:element name="ZipCode" type="xsd:string" />
              <xsd:element name="Email" type="xsd:string" />
              <xsd:element name="Phone" type="xsd:string" />
            </xsd:sequence>
          </xsd:complexType>

  - record_key: order-approval-entity-0001
    kind: entity
    capability_key: order-approval
    requirement: >
      An OrderApproval document SHALL contain one or more Order elements. Each Order SHALL contain an OrderId element and an OrderStatus element. Both OrderId and OrderStatus contain text content.
    confidence: high
    confidence_basis: >
      The DTD at OrderApproval.dtd lines 38-45 explicitly defines this structure. The OrderApproval.java and ChangedOrder.java classes directly implement this structure with data member access (orderId and orderStatus). Schema and code agree on the structure.
    risk_class: operational
    basis: >
      OrderApproval.dtd lines 38-45 specify the element structure. OrderApproval.java lines 78-85 show the OrderApproval class managing a list of ChangedOrder objects. ChangedOrder.java lines 45-64 show the orderId and orderStatus fields that populate the XML elements.
    traces:
      - path: legacy-source/petstore1.3.2/src/components/xmldocuments/src/rsrc/schemas/OrderApproval.dtd
        line_start: 38
        line_end: 46
        excerpt: |
          <!ELEMENT OrderApproval (Order+)>
          <!ELEMENT Order (OrderId, OrderStatus)>
          <!ELEMENT OrderId (#PCDATA)>
          <!ELEMENT OrderStatus (#PCDATA)>

  - record_key: fulfillment-management-business-rule-0001
    kind: business-rule
    capability_key: fulfillment-management
    requirement: >
      When creating a TPA Supplier Order, the OrderDate SHALL be formatted in yyyy-MM-dd format.
    confidence: high
    confidence_basis: >
      The TPASupplierOrderXDE class explicitly uses a SimpleDateFormat with the pattern "yyyy-MM-dd" (line 78). This is the only date format used in the class and is applied in the setOrderDate method, making this a mandatory constraint on all supplier orders created by this component.
    risk_class: operational
    basis: >
      TPASupplierOrderXDE.java line 78 defines the dateFormat as SimpleDateFormat("yyyy-MM-dd"). This formatter is used in setOrderDate at lines 154-158, which is the only method that populates the OrderDate element.
    traces:
      - path: legacy-source/petstore1.3.2/src/components/xmldocuments/src/com/sun/j2ee/blueprints/xmldocuments/tpa/TPASupplierOrderXDE.java
        line_start: 78
        line_end: 78
        excerpt: |
          private final SimpleDateFormat dateFormat = new SimpleDateFormat("yyyy-MM-dd");
      - path: legacy-source/petstore1.3.2/src/components/xmldocuments/src/com/sun/j2ee/blueprints/xmldocuments/tpa/TPASupplierOrderXDE.java
        line_start: 154
        line_end: 158
        excerpt: |
          public void setOrderDate(Date orderDate) {
            orderDateElement = XMLDocumentUtils.createElement(supplierOrderDocument, XML_NAMESPACE, XML_ORDERDATE,
                                                              dateFormat.format(orderDate));
            return;

  - record_key: fulfillment-management-business-rule-0002
    kind: business-rule
    capability_key: fulfillment-management
    requirement: >
      When creating a TPA Invoice, both OrderDate and ShippingDate SHALL be formatted in yyyy-MM-dd format.
    confidence: high
    confidence_basis: >
      The TPAInvoiceXDE class uses the same SimpleDateFormat with pattern "yyyy-MM-dd" (line 70). Both setOrderDate and setShippingDate methods use this formatter. This is the only date format in the class and applies to all invoice creation.
    risk_class: operational
    basis: >
      TPAInvoiceXDE.java line 70 defines dateFormat as SimpleDateFormat("yyyy-MM-dd"). This is used in setOrderDate (lines 154-158) and setShippingDate (lines 160-164).
    traces:
      - path: legacy-source/petstore1.3.2/src/components/xmldocuments/src/com/sun/j2ee/blueprints/xmldocuments/tpa/TPAInvoiceXDE.java
        line_start: 70
        line_end: 70
