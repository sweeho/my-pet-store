      To create a TPA Invoice document, the system SHALL: (1) instantiate a TPAInvoiceXDE, (2) call newDocument to initialize, (3) set OrderId via setOrderId, (4) set UserId via setUserId, (5) set OrderDate via setOrderDate with a Date object, (6) set ShippingDate via setShippingDate with a Date object, (7) add one or more LineItems via addLineItem, (8) serialize to output via copyDocument or getDocumentAsString.
    confidence: medium
    confidence_basis: >
      The TPAInvoiceXDE class implements this workflow with the same structure as TPASupplierOrderXDE. The main method at lines 176-191 demonstrates the exact workflow. No conflicting implementations exist. The workflow is inferred from class design and demonstrated usage rather than explicitly stated, hence medium confidence.
    risk_class: operational
    basis: >
      TPAInvoiceXDE.java class API and main method (lines 176-191) demonstrate the invoice creation workflow. The class provides all necessary methods in the required sequence.
    traces:
