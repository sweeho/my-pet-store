      Defined in TPASupplierOrder.xsd and TPAInvoice.xsd using xsd:unique constraint
      with xpath selector on itemId attribute. XSD validation enforces this constraint
      at parse time.
    risk_class: operational
    basis: >
      Both TPASupplierOrder.xsd and TPAInvoice.xsd define a named uniqueness constraint
      that selects all LineItem elements and requires the itemId attribute to be unique.
    traces:
