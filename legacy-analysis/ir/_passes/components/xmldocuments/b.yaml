records:
  - record_key: XMLDOC-ENTITY-0001
    kind: entity
    capability_key: order-placement
    requirement: >
      The system SHALL support a PurchaseOrder XML document structure containing OrderId,
      UserId, EmailId, OrderDate, ShipAddress, BillAddress, TotalPrice, CreditCard details
      (CardNumber, ExpiryDate, CardType), and one or more LineItems.
    confidence: high
    confidence_basis: >
      The requirement is explicitly defined in PurchaseOrder.dtd and TPASupplierOrder.xsd.
      The structure is enforced at parse time by XMLDocumentUtils and by both DTD and XSD
      validators. Both declarative (DTD/XSD) and programmatic (OrderApproval.fromDOM,
      TPASupplierOrderXDE.setShippingAddress) implementations exist.
    risk_class: operational
    basis: >
      The PurchaseOrder.dtd defines the complete element structure; TPASupplierOrder.xsd
      defines address structure with required fields (FirstName, LastName, Street, City,
      State, Country, ZipCode, Email, Phone). Order details in TPASupplierOrder include
      OrderId (xsd:string), OrderDate (xsd:date).
    traces:
      - path: legacy-source/petstore1.3.2/src/components/xmldocuments/src/rsrc/schemas/PurchaseOrder.dtd
        line_start: 38
        line_end: 85
        excerpt: |
          <!ELEMENT PurchaseOrder (OrderId, UserId, EmailId, OrderDate, ShipAddress, BillAddress, TotalPrice, CreditCard, LineItem+)>
          <!ELEMENT CreditCard (CardNumber, ExpiryDate, CardType)>
      - path: legacy-source/petstore1.3.2/src/components/xmldocuments/src/com/sun/j2ee/blueprints/xmldocuments/rsrc/schemas/TPASupplierOrder.xsd
        line_start: 11
        line_end: 30
        excerpt: |
          <xsd:element name="SupplierOrder">
            <xsd:complexType>
              <xsd:sequence>
                <xsd:element name="OrderId" type="xsd:string" />
                <xsd:element name="OrderDate" type="xsd:date" />
                <xsd:element name="ShippingAddress" type="address" />
    stack_metadata:
      declarative_validator: DTD, XSD
      framework: JAXP

  - record_key: XMLDOC-ENTITY-0002
    kind: entity
    capability_key: order-placement
    requirement: >
      The system SHALL support an OrderApproval XML document structure containing one or
      more Order elements, each with OrderId and OrderStatus.
    confidence: high
    confidence_basis: >
      Defined in OrderApproval.dtd and implemented in OrderApproval.java with factory
      methods (fromXML, toXML, fromDOM, toDOM) that enforce the structure. Both DTD
      validation and programmatic parsing verify this structure.
    risk_class: operational
    basis: >
      OrderApproval.dtd line 38-45 defines the root element and Order structure.
      OrderApproval.java implements DOM serialization (toDOM) and deserialization
      (fromDOM) with explicit element validation.
    traces:
      - path: legacy-source/petstore1.3.2/src/components/xmldocuments/src/rsrc/schemas/OrderApproval.dtd
        line_start: 38
        line_end: 45
        excerpt: |
          <!ELEMENT OrderApproval (Order+)>
          <!ELEMENT Order (OrderId, OrderStatus)>
          <!ELEMENT OrderId (#PCDATA)>
          <!ELEMENT OrderStatus (#PCDATA)>
      - path: legacy-source/petstore1.3.2/src/components/xmldocuments/src/com/sun/j2ee/blueprints/xmldocuments/OrderApproval.java
        line_start: 156
        line_end: 170
        excerpt: |
          public static OrderApproval fromDOM(Node node) throws XMLDocumentException {
            Element element;
            if (node.getNodeType() == Node.ELEMENT_NODE && (element = ((Element) node)).getTagName().equals(XML_ORDERAPPROVAL)) {
              Element child;
              OrderApproval orderApproval = new OrderApproval();
              orderApproval.orderList = new ArrayList();
              for (child = XMLDocumentUtils.getFirstChild(element, ChangedOrder.XML_ORDER, false);
                   child != null;
                   child = XMLDocumentUtils.getNextSibling(child, ChangedOrder.XML_ORDER, true)) {
                orderApproval.orderList.add(ChangedOrder.fromDOM(child));
              }
    stack_metadata:
      declarative_validator: DTD
      framework: JAXP

