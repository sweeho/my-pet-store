  - record_key: XMLDOC-BUSINESS-0002
    kind: business-rule
    capability_key: order-placement
    requirement: >
      The system SHALL enforce that LineItems in PurchaseOrder, Invoice, and SupplierOrder
      documents must contain one or more line items (minOccurs="1", maxOccurs="unbounded").
    confidence: high
    confidence_basis: >
      Defined in DTD with "+" cardinality operator (one or more) and in XSD with
      minOccurs="1" maxOccurs="unbounded". This is enforced by all schema validators
      during document parsing.
    risk_class: operational
    basis: >
      PurchaseOrder.dtd, Invoice.dtd, and SupplierOrder.dtd all specify LineItem+ in
      their element declarations. TPASupplierOrder.xsd and TPAInvoice.xsd specify
      minOccurs="1" maxOccurs="unbounded".
    traces:
