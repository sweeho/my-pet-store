  - record_key: XMLDOC-ENTITY-0005
    kind: entity
    capability_key: shopping-cart
    requirement: >
      The system SHALL support a LineItem element structure containing CategoryId,
      ProductId, ItemId, LineNum, Quantity, and UnitPrice.
    confidence: high
    confidence_basis: >
      Defined in LineItem.dtd and TPALineItem.xsd with both DTD and XSD enforcement.
      LineItem is referenced as a component in PurchaseOrder, Invoice, and SupplierOrder
      documents. TPALineItemUtils.addLineItem implements programmatic line item creation.
    risk_class: operational
    basis: >
      LineItem.dtd defines the base structure. TPALineItem.xsd adds constraints:
      lineNo as xsd:nonNegativeInteger, quantity as xsd:positiveInteger,
      unitPrice as positiveDecimal (>= 0).
    traces:
      - path: legacy-source/petstore1.3.2/src/components/xmldocuments/src/rsrc/schemas/LineItem.dtd
        line_start: 38
        line_end: 50
        excerpt: |
