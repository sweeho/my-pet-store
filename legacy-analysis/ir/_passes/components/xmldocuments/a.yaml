records:
  - record_key: ORDER-ENTITY-0001
    kind: entity
    capability_key: order-placement
    requirement: >
      The system SHALL maintain Purchase Order documents containing OrderId, UserId,
      EmailId, OrderDate, ShipAddress, BillAddress, TotalPrice, CreditCard details,
      and one or more LineItems.
    confidence: high
    confidence_basis: >
      High confidence: Both DTD definition and Java serialization code confirm this
      structure. DTD is enforced at parse time; Java classes implement DOM-based
      (de)serialization with matching element names.
    risk_class: operational
    basis: >
      PurchaseOrder.dtd declares exact structure with required elements for
      customer order information and payment details. XMLDocumentUtils provides
      validated element retrieval and serialization.
    traces:
      - path: legacy-source/petstore1.3.2/src/components/xmldocuments/src/rsrc/schemas/PurchaseOrder.dtd
        line_start: 38
        line_end: 83
        excerpt: |
          <!ELEMENT PurchaseOrder (OrderId, UserId, EmailId, OrderDate, ShipAddress, BillAddress, TotalPrice, CreditCard, LineItem+)>
    stack_metadata:
      db.object: PurchaseOrder XML document

  - record_key: PAYMENT-ENTITY-0001
    kind: entity
    capability_key: payment-processing
    requirement: >
      The system SHALL store credit card information in PurchaseOrder documents
      containing CardNumber, ExpiryDate, and CardType.
    confidence: high
    confidence_basis: >
      High confidence: DTD explicitly mandates CreditCard element with three child
      elements. No conditional logic—card element is required in every purchase order.
    risk_class: financial
    basis: >
      PurchaseOrder.dtd defines CreditCard element with mandatory CardNumber,
      ExpiryDate, and CardType child elements.
    traces:
      - path: legacy-source/petstore1.3.2/src/components/xmldocuments/src/rsrc/schemas/PurchaseOrder.dtd
        line_start: 74
        line_end: 80
        excerpt: |
          <!ELEMENT CreditCard (CardNumber, ExpiryDate, CardType)>
          <!ELEMENT CardNumber (#PCDATA)>
          <!ELEMENT ExpiryDate (#PCDATA)>
          <!ELEMENT CardType (#PCDATA)>
    stack_metadata:
      db.object: CreditCard XML element in PurchaseOrder

  - record_key: FULFILL-ENTITY-0001
    kind: entity
    capability_key: fulfillment-management
    requirement: >
      The system SHALL maintain SupplierOrder documents containing orderid, orderdate,
      shipaddress, and one or more lineitem elements.
    confidence: high
    confidence_basis: >
      High confidence: DTD schema is authoritative and enforced at parse time.
      SupplierOrder is a dedicated document type with fixed structure.
    risk_class: operational
    basis: >
      SupplierOrder.dtd defines supplier-facing purchase order format with required
      address and line item elements for order fulfillment.
    traces:
      - path: legacy-source/petstore1.3.2/src/components/xmldocuments/src/rsrc/schemas/SupplierOrder.dtd
        line_start: 38
        line_end: 65
        excerpt: |
          <!ELEMENT SupplierOrder (orderid, orderdate, shipaddress, lineitem+)>
          <!ELEMENT orderid (#PCDATA)>
          <!ELEMENT orderdate (#PCDATA)>
          <!ENTITY % Address "firstname, lastname, street, city, state, country, zip">
          <!ELEMENT shipaddress (%Address;)>
    stack_metadata:
      db.object: SupplierOrder XML document

  - record_key: FULFILL-ENTITY-0002
    kind: entity
    capability_key: fulfillment-management
    requirement: >
      The system SHALL define LineItem as a reusable component containing CategoryId,
      ProductId, ItemId, LineNum, Quantity, and UnitPrice.
    confidence: high
    confidence_basis: >
      High confidence: LineItem.dtd is a standalone entity parameter used in multiple
      documents (PurchaseOrder, Invoice, SupplierOrder). Reuse is declared via
      ENTITY parameter.
    risk_class: operational
    basis: >
      LineItem.dtd is included in PurchaseOrder.dtd, Invoice.dtd, and SupplierOrder.dtd
      via DTD entity reference. Consistent element names across all inclusion points.
    traces:
      - path: legacy-source/petstore1.3.2/src/components/xmldocuments/src/rsrc/schemas/LineItem.dtd
        line_start: 38
        line_end: 50
        excerpt: |
          <!ELEMENT LineItem (CategoryId, ProductId, ItemId, LineNum, Quantity, UnitPrice)>
          <!ELEMENT CategoryId (#PCDATA)>
          <!ELEMENT ProductId (#PCDATA)>
          <!ELEMENT ItemId (#PCDATA)>
          <!ELEMENT LineNum (#PCDATA)>
          <!ELEMENT Quantity (#PCDATA)>
          <!ELEMENT UnitPrice (#PCDATA)>
      - path: legacy-source/petstore1.3.2/src/components/xmldocuments/src/rsrc/schemas/PurchaseOrder.dtd
        line_start: 82
        line_end: 83
        excerpt: |
          <!ENTITY % LineItem PUBLIC "-//Sun Microsystems, Inc. - J2EE Blueprints Group//DTD Line Item 1.0//EN" "LineItem.dtd">
          %LineItem;
    stack_metadata:
      db.object: LineItem XML element (shared)

