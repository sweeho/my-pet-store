        line_start: 52
        line_end: 70
        excerpt: |
          <!ENTITY % Address "FirstName, LastName, Street, City, State, Country, ZipCode">
          <!ELEMENT FirstName (#PCDATA)>
          <!ELEMENT LastName (#PCDATA)>
          <!ELEMENT Street (#PCDATA)>
          <!ELEMENT City (#PCDATA)>
          <!ELEMENT State (#PCDATA)>
          <!ELEMENT Country (#PCDATA)>
          <!ELEMENT ZipCode (#PCDATA)>
          <!ELEMENT ShipAddress (%Address;)>
          <!ELEMENT BillAddress (%Address;)>
    stack_metadata:
