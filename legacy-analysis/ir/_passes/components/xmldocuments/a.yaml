  - record_key: ORDER-ENTITY-0003
    kind: entity
    capability_key: order-placement
    requirement: >
      The system SHALL maintain Invoice documents containing OrderId, UserId,
      OrderDate, ShippingDate, and one or more LineItems, with locale defaulting to en_US.
    confidence: high
    confidence_basis: >
      High confidence: Invoice.dtd declares structure and locale default. XSD variants
      (TPAInvoice) with explicit namespace support confirm this is a core document type.
    risk_class: operational
    basis: >
      Invoice.dtd defines required elements for order tracking and fulfillment.
      ATTLIST declares locale attribute with default value en_US.
    traces:
      - path: legacy-source/petstore1.3.2/src/components/xmldocuments/src/rsrc/schemas/Invoice.dtd
        line_start: 41
        line_end: 54
        excerpt: |
          <!ELEMENT Invoice (OrderId, UserId, OrderDate, ShippingDate, LineItem+)>
          <!ATTLIST Invoice
            locale CDATA "en_US"
          >
    stack_metadata:
      db.object: Invoice XML document

