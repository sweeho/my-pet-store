      - path: legacy-source/petstore1.3.2/src/components/xmldocuments/src/rsrc/schemas/Invoice.dtd
        line_start: 43
        line_end: 45
        excerpt: |
          <!ATTLIST Invoice
            locale CDATA "en_US"
          >
    stack_metadata:
