  - record_key: INTEG-BUSINESS-0001
    kind: business-rule
    capability_key: fulfillment-management
    requirement: >
      Third-party application integrations SHALL use namespace-qualified XML documents
      (TPASupplierOrder, TPAInvoice) with support for both DTD and XSD validation.
    confidence: medium
    confidence_basis: >
      Medium confidence: TPA classes exist and are instantiable, but integration usage
      paths are not documented in the component itself. XSD support is declared but
      optional (isSupportingXSD() method). Reachability from callers is not confirmed.
    risk_class: operational
    basis: >
      TPASupplierOrderXDE and TPAInvoiceXDE extend XMLDocumentEditor.DefaultXDE.
      Both support XSD validation via isSupportingXSD() flag. Namespace declarations
      are hardcoded (XML_NAMESPACE constants). Entity catalog references TPA DTDs.
    traces:
      - path: legacy-source/petstore1.3.2/src/components/xmldocuments/src/com/sun/j2ee/blueprints/xmldocuments/tpa/TPASupplierOrderXDE.java
        line_start: 57
        line_end: 108
        excerpt: |
          public class TPASupplierOrderXDE extends XMLDocumentEditor.DefaultXDE {
            public static final String DTD_PUBLIC_ID = "-//Sun Microsystems, Inc. - J2EE Blueprints Group//DTD TPA-SupplierOrder 1.0//EN";
            public static final String XSD_PUBLIC_ID = "http://blueprints.j2ee.sun.com/TPASupplierOrder";
            public static final String XML_NAMESPACE = "http://blueprints.j2ee.sun.com/TPASupplierOrder";
            public static final boolean isSupportingXSD() {
              return supportingXSD;
            }
      - path: legacy-source/petstore1.3.2/src/components/xmldocuments/src/rsrc/schemas/EntityCatalog.properties
        line_start: 10
        line_end: 12
        excerpt: |
          #New TPA DTDs
          -//Sun\ Microsystems,\ Inc.\ -\ J2EE\ Blueprints\ Group//DTD\ TPA-LineItem\ 1.0//EN: /com/sun/j2ee/blueprints/xmldocuments/rsrc/schemas/TPALineItem.dtd
          -//Sun\ Microsystems,\ Inc.\ -\ J2EE\ Blueprints\ Group//DTD\ TPA-SupplierOrder\ 1.0//EN: /com/sun/j2ee/blueprints/xmldocuments/rsrc/schemas/TPASupplierOrder.dtd
    stack_metadata:
      framework: J2EE XML document processing

  - record_key: INTEG-BUSINESS-0002
    kind: business-rule
    capability_key: fulfillment-management
    requirement: >
      TPA SupplierOrder documents SHALL contain shipping address with contact details
      (FirstName, LastName, Street, City, State, Country, ZipCode, Email, Phone).
    confidence: medium
    confidence_basis: >
      Medium confidence: TPASupplierOrderXDE.setShippingAddress() accepts all nine
      parameters and appends to XML, but DTD enforcement depends on external schema.
      No programmatic validation of these fields exists in the code.
    risk_class: operational
    basis: >
      TPASupplierOrderXDE defines setShippingAddress() with nine parameters
      (firstName through phone) and appends each to shippingAddressElement.
    traces:
      - path: legacy-source/petstore1.3.2/src/components/xmldocuments/src/com/sun/j2ee/blueprints/xmldocuments/tpa/TPASupplierOrderXDE.java
        line_start: 160
        line_end: 173
        excerpt: |
          public void setShippingAddress(String firstName, String lastName, String street, String city,
                                         String state, String country, String zipCode, String email, String phone) {
            shippingAddressElement = supplierOrderDocument.createElementNS(XML_NAMESPACE, XML_SHIPPINGADDRESS);
            XMLDocumentUtils.appendChild(supplierOrderDocument, shippingAddressElement, XML_FIRSTNAME, firstName);
            XMLDocumentUtils.appendChild(supplierOrderDocument, shippingAddressElement, XML_LASTNAME, lastName);
            XMLDocumentUtils.appendChild(supplierOrderDocument, shippingAddressElement, XML_STREET, street);
            ...
            XMLDocumentUtils.appendChild(supplierOrderDocument, shippingAddressElement, XML_EMAIL, email);
            XMLDocumentUtils.appendChild(supplierOrderDocument, shippingAddressElement, XML_PHONE, phone);
    stack_metadata:
      framework: TPA SupplierOrder builder

  - record_key: INTEG-BUSINESS-0003
    kind: business-rule
    capability_key: fulfillment-management
    requirement: >
      TPA LineItem SHALL be added to SupplierOrder and Invoice documents via
      addLineItem() method accepting categoryId, productId, itemId, lineNo,
      quantity, and unitPrice.
    confidence: high
    confidence_basis: >
      High confidence: Both TPASupplierOrderXDE and TPAInvoiceXDE implement identical
      addLineItem() signatures. TPALineItemUtils centralizes line item creation with
      namespace and attribute handling. Method is public and explicitly designed for
      builder pattern.
    risk_class: operational
    basis: >
      TPASupplierOrderXDE.addLineItem() and TPAInvoiceXDE.addLineItem() both delegate
      to TPALineItemUtils.addLineItem(). TPALineItemUtils creates namespaced LineItem
      element with six attributes (categoryId, productId, itemId, lineNo, quantity, unitPrice).
    traces:
      - path: legacy-source/petstore1.3.2/src/components/xmldocuments/src/com/sun/j2ee/blueprints/xmldocuments/tpa/TPASupplierOrderXDE.java
        line_start: 175
        line_end: 183
        excerpt: |
          public void addLineItem(String categoryId, String productId, String itemId, String lineNo,
                                  int quantity, float unitPrice) {
            if (lineItemsElement == null) {
              lineItemsElement = supplierOrderDocument.createElementNS(XML_NAMESPACE, XML_LINEITEMS);
            }
            TPALineItemUtils.addLineItem(supplierOrderDocument, lineItemsElement,
                                         categoryId, productId, itemId, lineNo, quantity, unitPrice);
      - path: legacy-source/petstore1.3.2/src/components/xmldocuments/src/com/sun/j2ee/blueprints/xmldocuments/tpa/TPALineItemUtils.java
        line_start: 64
        line_end: 78
        excerpt: |
          public static void addLineItem(Document document, Element lineItemsElement,
                                         String categoryId, String productId, String itemId, String lineNo,
                                         int quantity, float unitPrice) {
            Element lineItemElement = document.createElementNS(XML_NAMESPACE, XML_LINEITEM);
            lineItemElement.setAttributeNS(XML_NAMESPACE, XML_CATEGORYID, categoryId);
            lineItemElement.setAttributeNS(XML_NAMESPACE, XML_PRODUCTID, productId);
            lineItemElement.setAttributeNS(XML_NAMESPACE, XML_ITEMID, itemId);
            lineItemElement.setAttributeNS(XML_NAMESPACE, XML_LINENO, lineNo);
            lineItemElement.setAttributeNS(XML_NAMESPACE, XML_QUANTITY, Long.toString(quantity));
    stack_metadata:
      framework: TPA LineItem builder

  - record_key: SCHEMA-REQUIREMENT-0001
    kind: requirement
    capability_key: order-placement
    requirement: >
      XML documents SHALL be validated against DTD schemas during parsing.
      DTDs are provided in EntityCatalog.properties with public identifiers mapped
      to system identifiers.
    confidence: high
    confidence_basis: >
      High confidence: XMLDocumentUtils.deserialize() calls checkDocumentType()
      to validate against DTD public ID. CustomEntityResolver uses EntityCatalog to
      map public IDs to system paths. EntityCatalog.properties exhaustively lists
      all DTD mappings.
    risk_class: operational
    basis: >
      XMLDocumentUtils checks document type via checkDocumentType(document, dtdPublicId).
      CustomEntityResolver loads EntityCatalog.properties to resolve entity URIs.
      Entity catalog lists all DTD public IDs and their mapped system paths.
    traces:
      - path: legacy-source/petstore1.3.2/src/components/xmldocuments/src/com/sun/j2ee/blueprints/xmldocuments/XMLDocumentUtils.java
        line_start: 626
        line_end: 634
        excerpt: |
          public static boolean checkDocumentType(Document document, String dtdPublicId) {
            DocumentType documentType = document.getDoctype();
            if (documentType != null) {
              String publicId = documentType.getPublicId();
              return publicId != null && publicId.equals(dtdPublicId);
            }
            return true;
          }
      - path: legacy-source/petstore1.3.2/src/components/xmldocuments/src/rsrc/schemas/EntityCatalog.properties
        line_start: 1
        line_end: 7
        excerpt: |
          #Old DTDs
          -//Sun\ Microsystems,\ Inc.\ -\ J2EE\ Blueprints\ Group//DTD\ Invoice\ 1.0//EN: /schemas/Invoice.dtd
          -//Sun\ Microsystems,\ Inc.\ -\ J2EE\ Blueprints\ Group//DTD\ OPC\ Mail\ 1.0//EN: /com/sun/j2ee/blueprints/mailer/rsrc/schemas/Mail.dtd
    stack_metadata:
      db.object: DTD validation

  - record_key: SCHEMA-REQUIREMENT-0002
    kind: requirement
    capability_key: fulfillment-management
    requirement: >
      TPA document formats SHALL support both DTD and XSD schema validation modes,
      configurable at document builder instantiation.
    confidence: medium
    confidence_basis: >
      Medium confidence: TPA classes expose isSupportingXSD() and setSupportingXSD()
      methods, and DTD_PUBLIC_ID/XSD_PUBLIC_ID constants are defined. However, the
      system behavior under each mode and validation enforcement is not documented
      in the component.
    risk_class: operational
    basis: >
      TPASupplierOrderXDE and TPAInvoiceXDE constructors accept xsdValidation flag
      and store it via setSupportingXSD(). Serialization method passes flag to
      XMLDocumentUtils.serialize() which uses it to select DTD vs. XSD output format.
    traces:
      - path: legacy-source/petstore1.3.2/src/components/xmldocuments/src/com/sun/j2ee/blueprints/xmldocuments/tpa/TPASupplierOrderXDE.java
        line_start: 94
        line_end: 108
        excerpt: |
          public TPASupplierOrderXDE(URL entityCatalogURL, boolean xsdValidation) throws XMLDocumentException {
            setEntityCatalogURL(entityCatalogURL);
            setSupportingXSD(xsdValidation);
            try {
              CustomEntityResolver entityResolver = new CustomEntityResolver(entityCatalogURL);
              String systemId = entityResolver.mapEntityURI(isSupportingXSD() ? XSD_PUBLIC_ID : DTD_PUBLIC_ID);
              this.systemId = (systemId != null) ? systemId : (isSupportingXSD() ? XSD_SYSTEM_ID : DTD_SYSTEM_ID);
    stack_metadata:
      framework: TPA XML schema validation

  - record_key: DATE-FORMAT-0001
    kind: business-rule
    capability_key: order-placement
    requirement: >
      TPA document dates (OrderDate, ShippingDate) SHALL be formatted as yyyy-MM-dd
      in XML output.
    confidence: high
    confidence_basis: >
      High confidence: Both TPASupplierOrderXDE and TPAInvoiceXDE declare identical
      SimpleDateFormat("yyyy-MM-dd") and use it in setOrderDate() and setShippingDate().
      This is the only date formatting mechanism in the TPA builders.
    risk_class: operational
    basis: >
      TPASupplierOrderXDE (line 78) and TPAInvoiceXDE (line 70) both initialize
      dateFormat with "yyyy-MM-dd" pattern. setOrderDate() and setShippingDate()
      call dateFormat.format() before appending to XML.
    traces:
      - path: legacy-source/petstore1.3.2/src/components/xmldocuments/src/com/sun/j2ee/blueprints/xmldocuments/tpa/TPASupplierOrderXDE.java
        line_start: 78
        line_end: 80
        excerpt: |
          private final SimpleDateFormat dateFormat = new SimpleDateFormat("yyyy-MM-dd");
      - path: legacy-source/petstore1.3.2/src/components/xmldocuments/src/com/sun/j2ee/blueprints/xmldocuments/tpa/TPASupplierOrderXDE.java
        line_start: 154
        line_end: 158
        excerpt: |
          public void setOrderDate(Date orderDate) {
            orderDateElement = XMLDocumentUtils.createElement(supplierOrderDocument, XML_NAMESPACE, XML_ORDERDATE,
                                                              dateFormat.format(orderDate));
    stack_metadata:
      framework: Date formatting

  - record_key: WORKFLOW-PROCESS-0001
    kind: workflow
    capability_key: order-approval
    requirement: >
      Order approval workflow SHALL support batch status updates via OrderApproval
      documents that group multiple order status changes (OrderId + OrderStatus pairs)
      in a single XML document.
    confidence: high
    confidence_basis: >
      High confidence: OrderApproval class explicitly contains ArrayList of
      ChangedOrder objects. addOrder() adds to list; getOrdersList() retrieves.
      toDOM() iterates over all orders. DTD mandates Order+ (one or more).
    risk_class: operational
    basis: >
      OrderApproval.java maintains orderList (ArrayList) and implements
      addOrder(ChangedOrder), getOrdersList(), and DOM serialization that
      iterates over all orders. OrderApproval.dtd requires one or more Order elements.
    traces:
      - path: legacy-source/petstore1.3.2/src/components/xmldocuments/src/com/sun/j2ee/blueprints/xmldocuments/OrderApproval.java
        line_start: 66
        line_end: 105
        excerpt: |
          public class OrderApproval {
            private ArrayList orderList = new ArrayList();
            public OrderApproval() {}
            public void addOrder(ChangedOrder order) {
              orderList.add(order);
            }
            public Collection getOrdersList() {
              return orderList;
            }
            public Node toDOM(Document document) {
              Element root = document.createElement(XML_ORDERAPPROVAL);
              for (Iterator i = orderList.iterator(); i.hasNext();) {
                ChangedOrder changedOrder = (ChangedOrder) i.next();
                root.appendChild(changedOrder.toDOM(document));
    stack_metadata:
      framework: Order batch workflow

findings:
  - kind: ambiguity
    path: legacy-source/petstore1.3.2/src/components/xmldocuments/src/rsrc/schemas/OrderApproval.dtd
    description: >
      OrderApproval.dtd contains a comment "FIXME should be attribute" on line 44 for
      OrderStatus element. It is currently a child element but the comment suggests it
      should be an XML attribute instead. This is a design decision that remains unresolved.
      No configuration or version history explains the reasoning.

  - kind: ambiguity
    path: legacy-source/petstore1.3.2/src/components/xmldocuments/src/com/sun/j2ee/blueprints/xmldocuments/XMLDocumentUtils.java
    description: >
      XMLDocumentUtils.checkDocumentType() returns true by default when documentType
      is null (line 633), and also returns true when xsdSupport is enabled (deserialized
      at line 453-457 comment). This means validation may silently succeed for documents
      without explicit DOCTYPE declarations when XSD is not supported. Caller cannot
      distinguish between validated and unvalidated documents.

  - kind: unparseable
    path: legacy-source/petstore1.3.2/src/components/xmldocuments/src/com/sun/j2ee/blueprints/xmldocuments/tpa/TPALineItemUtils.java
    description: >
      TPALineItemUtils stores lineNo as an attribute (setAttributeNS) but the base
      LineItem.dtd defines LineNum as a child element (line 46). The TPA variant
      represents it differently (attribute vs. element). The schema catalog does not
      clarify whether TPA schema files (TPALineItem.dtd/xsd) override base definitions
      or whether this is an intentional dual representation.
