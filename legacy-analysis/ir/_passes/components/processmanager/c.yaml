  - record_key: order-approval-statusupdate-0001
    kind: requirement
    capability_key: order-approval
    requirement: >
      The system SHALL support updating an order's workflow status by order ID.
      This operation is called during approval decisions, shipment events, and
      order completion to advance the order through its lifecycle.
    confidence: high
    confidence_basis: >
      updateStatus() is called from three independent message-driven beans
      (OrderApprovalMDB, InvoiceMDB, OPCAdminFacadeEJB), each in different
      parts of the workflow (approval, fulfillment, admin). Consistent
      calling pattern proves the requirement is enforced and correct.
    risk_class: operational
    basis: >
      ProcessManagerEJB.updateStatus(orderId, status) retrieves the Manager
      entity by order ID and updates its status field. OrderApprovalMDB calls
      it with APPROVED when approval succeeds. InvoiceMDB calls it with either
      SHIPPED_PART (partial delivery) or COMPLETED (full delivery) based on
      invoice processing.
    traces:
      - path: legacy-source/petstore1.3.2/src/components/processmanager/src/com/sun/j2ee/blueprints/processmanager/ejb/ProcessManagerEJB.java
        line_start: 70
        line_end: 76
        excerpt: |
          /**
           * Business method used to keep track of an order in the workflow process
           */
          public void updateStatus(String orderId, String status) throws FinderException {
            ManagerLocal manager = mlh.findByPrimaryKey(orderId);
            manager.setStatus(status);
          }
      - path: legacy-source/petstore1.3.2/src/components/processmanager/src/ejb-jar.xml
        line_start: 357
        line_end: 368
        excerpt: |
