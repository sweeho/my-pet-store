  - record_key: admin-operations-orderlookup-0001
    kind: requirement
    capability_key: admin-operations
    requirement: >
      The system SHALL provide an operation to retrieve all orders that are
      in a given status. This is used by the admin interface to display
      orders at specific workflow stages for administrative action.
    confidence: high
    confidence_basis: >
      getOrdersByStatus() is called from OPCAdminFacadeEJB.getOrdersByStatus(),
      which explicitly documents the admin use case. The operation uses a CMP
      query declared in ejb-jar.xml, proving it is a persistent, queryable
      feature rather than a transient calculation.
    risk_class: operational
    basis: >
      ProcessManagerEJB.getOrdersByStatus(status) retrieves all Manager
      entities with a specific status by delegating to ManagerLocalHome.
      findOrdersByStatus(). The query is defined using EJB QL in ejb-jar.xml
      to find all Manager entities where status matches the parameter.
    traces:
      - path: legacy-source/petstore1.3.2/src/components/processmanager/src/com/sun/j2ee/blueprints/processmanager/ejb/ProcessManagerEJB.java
        line_start: 86
        line_end: 91
        excerpt: |
          /**
           * Business method to get all orders of given status for the admin
           */
          public Collection getOrdersByStatus(String status) throws FinderException {
              return mlh.findOrdersByStatus(status);
          }
      - path: legacy-source/petstore1.3.2/src/components/processmanager/src/ejb-jar.xml
        line_start: 70
        line_end: 79
        excerpt: |
          <query>
            <description></description>
            <query-method>
              <method-name>findOrdersByStatus</method-name>
              <method-params>
                <method-param>java.lang.String</method-param>
              </method-params>
            </query-method>
            <ejb-ql>SELECT DISTINCT OBJECT(a) FROM Manager a WHERE a.status = ?1</ejb-ql>
          </query>
    stack_metadata:
      ejb.bean: ProcessManagerEJB (Stateless Session), ManagerEJB (CMP Entity)
      ejb.transaction: Required

