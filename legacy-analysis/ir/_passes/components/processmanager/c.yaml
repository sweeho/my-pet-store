  - record_key: order-approval-transitions-0001
    kind: requirement
    capability_key: order-approval
    requirement: >
      The system SHALL support transition delegates that can execute
      workflow transitions triggered by order events. Each transition
      may be associated with custom logic defined in a delegate class.
    confidence: medium
    confidence_basis: >
      TransitionDelegate interface and TransitionDelegateFactory are
      present and referenced in order processing MDBs (e.g., PurchaseOrderMDB
      instantiates PurchaseOrderTD). However, the actual implementation
      details of specific transitions are not visible in this component —
      the factory uses reflection to load delegate classes dynamically.
      This proves the capability exists but leaves the full transition
      logic in other components. Marked medium because the framework is
      clear but the business logic implementation is external.
    risk_class: operational
    basis: >
      TransitionDelegate is an interface with setup() and doTransition()
      methods. TransitionDelegateFactory uses reflection to instantiate
      delegate classes by name. PurchaseOrderMDB creates an instance of
      PurchaseOrderTD (which implements TransitionDelegate) during
      initialization. The actual transition business logic is not in
      this component.
    traces:
      - path: legacy-source/petstore1.3.2/src/components/processmanager/src/com/sun/j2ee/blueprints/processmanager/transitions/TransitionDelegate.java
        line_start: 40
        line_end: 50
        excerpt: |
          /**
            * This is the interface that all transition delegates must implement
            */
          public interface TransitionDelegate {

             public void setup() throws TransitionException;

             public void doTransition(TransitionInfo info) throws TransitionException;

          }
      - path: legacy-source/petstore1.3.2/src/components/processmanager/src/com/sun/j2ee/blueprints/processmanager/transitions/TransitionDelegateFactory.java
        line_start: 43
        line_end: 57
        excerpt: |
          public class TransitionDelegateFactory {

            public TransitionDelegateFactory() { }

            public TransitionDelegate getTransitionDelegate(String className) throws TransitionException {
              TransitionDelegate td = null;
              try {
                td = (TransitionDelegate)Class.forName(className).newInstance();
              } catch(Exception e) {
                throw new TransitionException(e);
              }
              return td;
            }

          }
    stack_metadata:
      ejb.bean: not applicable (interface/factory)
      design_pattern: Strategy (TransitionDelegate)

