records:
  - record_key: order-approval-workflow-0001
    kind: workflow
    capability_key: order-approval
    requirement: >
      The system SHALL manage order workflow state transitions through
      a lifecycle of: PENDING → APPROVED → SHIPPED_PART/COMPLETED, or
      PENDING → DENIED. The workflow tracks which status an order is in
      at any point.
    confidence: high
    confidence_basis: >
      Workflow states are explicitly documented in OrderStatusNames class
      with clear documentation of the state machine. The ManagerEJB entity
      bean persists the status, and multiple callers (PurchaseOrderMDB,
      OrderApprovalMDB, InvoiceMDB, OPCAdminFacadeEJB) independently use
      these transitions in the order processing flow, proving high consistency.
    risk_class: operational
    basis: >
      OrderStatusNames.java defines five static constants (PENDING, APPROVED,
      DENIED, SHIPPED_PART, COMPLETED) with comments explicitly documenting
      the state transitions. ProcessManagerEJB methods updateStatus(),
      getStatus(), and createManager() implement the state management.
    traces:
      - path: legacy-source/petstore1.3.2/src/components/processmanager/src/com/sun/j2ee/blueprints/processmanager/ejb/OrderStatusNames.java
        line_start: 44
        line_end: 66
        excerpt: |
          /**
           * This class is the central location to store the names of the
           * status that an order can be in.
           * The states an order goes through are:
           * pending->approved->shippedPart(shipped part of order)->completed(whole order shipped)  or
           * pending->denied
           */
          public class OrderStatusNames {

              /** for orders that have been placed but not yet approved */
              public static final String PENDING = "PENDING";

              /** for orders that have been approved */
              public  static final String APPROVED = "APPROVED";

              /** for orders that have been denied */
              public  static final String DENIED = "DENIED";


              /** for orders that have been partially completed*/
              public  static final String SHIPPED_PART = "SHIPPED_PART";


              /** for orders that have been completed*/
              public  static final String COMPLETED = "COMPLETED";
          }
      - path: legacy-source/petstore1.3.2/src/components/processmanager/src/ejb-jar.xml
        line_start: 56
        line_end: 65
        excerpt: |
          <cmp-field>
            <description>no description</description>
            <field-name>status</field-name>
          </cmp-field>
          <cmp-field>
            <description>no description</description>
            <field-name>orderId</field-name>
          </cmp-field>
          <primkey-field>orderId</primkey-field>
    stack_metadata:
      ejb.bean: ManagerEJB (CMP Entity)
      ejb.transaction: Required
      ejb.bean_type: EntityBean

  - record_key: order-approval-creation-0001
    kind: requirement
    capability_key: order-approval
    requirement: >
      The system SHALL create a workflow tracking record when a new purchase
      order is received. This operation initializes the order in PENDING status.
    confidence: high
    confidence_basis: >
      The createManager() operation is called directly from PurchaseOrderMDB
      during purchase order processing. Its contract is simple and directly
      verifiable from the call site and method implementation. No ambiguity
      found in the cross-component usage.
    risk_class: operational
    basis: >
      ProcessManagerEJB.createManager(orderId, status) creates a new Manager
      entity with the given order ID and initial status. PurchaseOrderMDB
      calls this immediately after creating a PurchaseOrder entity, passing
      OrderStatusNames.PENDING as the initial status.
