    kind: requirement
    capability_key: admin-operations
    requirement: >
      The system SHALL support JNDI lookup of local EJB homes to enable resource
      discovery for enterprise bean invocation.
    confidence: high
    confidence_basis: >
      Both EJB and web tier implementations provide identical method signatures for
      local home lookup, indicating this is a core capability. The method is present
      in both production code paths and the implementation uses standard JNDI APIs
      with exception handling in place.
    risk_class: operational
    basis: >
      EJB ServiceLocator.getLocalHome() casts JNDI lookup result to EJBLocalHome.
      Web tier ServiceLocator implements identical method with caching layer.
      Comment at line 78-79 (EJB) states purpose: "will get the ejb Local home factory".
    traces:
      - path: legacy-source/petstore1.3.2/src/components/servicelocator/src/com/sun/j2ee/blueprints/servicelocator/ejb/ServiceLocator.java
        line_start: 83
        line_end: 93
        excerpt: |
          public EJBLocalHome getLocalHome(String jndiHomeName) throws ServiceLocatorException {
            EJBLocalHome home = null;
            try {
                home = (EJBLocalHome) ic.lookup(jndiHomeName);
             } catch (NamingException ne) {
                  throw new ServiceLocatorException(ne);
             } catch (Exception e) {
                  throw new ServiceLocatorException(e);
             }
             return home;
          }
      - path: legacy-source/petstore1.3.2/src/components/servicelocator/src/com/sun/j2ee/blueprints/servicelocator/web/ServiceLocator.java
        line_start: 106
        line_end: 121
        excerpt: |
          public EJBLocalHome getLocalHome(String jndiHomeName) throws ServiceLocatorException {
            EJBLocalHome home = null;
            try {
              if (cache.containsKey(jndiHomeName)) {
                  home = (EJBLocalHome) cache.get(jndiHomeName);
              } else {
                  home = (EJBLocalHome) ic.lookup(jndiHomeName);
                  cache.put(jndiHomeName, home);
              }
             } catch (NamingException ne) {
                  throw new ServiceLocatorException(ne);
             } catch (Exception e) {
                  throw new ServiceLocatorException(e);
             }
             return home;
          }

  - record_key: admin-operations-req-0002
    kind: requirement
    capability_key: admin-operations
    requirement: >
      The system SHALL support JNDI lookup of remote EJB homes with PortableRemoteObject
      type narrowing to enable remote enterprise bean invocation across server boundaries.
    confidence: high
    confidence_basis: >
      Both EJB and web tier implementations provide identical functionality using
      the standard J2EE pattern of PortableRemoteObject.narrow(). The implementation
      is consistent across both tiers, indicating it is a core capability.
    risk_class: operational
    basis: >
      EJB ServiceLocator.getRemoteHome() performs JNDI lookup and calls
      PortableRemoteObject.narrow() to cast the result to the requested type.
      Web tier provides identical logic with caching.
    traces:
      - path: legacy-source/petstore1.3.2/src/components/servicelocator/src/com/sun/j2ee/blueprints/servicelocator/ejb/ServiceLocator.java
        line_start: 101
        line_end: 113
        excerpt: |
          public EJBHome getRemoteHome(String jndiHomeName, Class className) throws ServiceLocatorException {
            EJBHome home = null;
            try {
                  Object objref = ic.lookup(jndiHomeName);
                  Object obj = PortableRemoteObject.narrow(objref, className);
                  home = (EJBHome)obj;
            } catch (NamingException ne) {
                  throw new ServiceLocatorException(ne);
            } catch (Exception e) {
                  throw new ServiceLocatorException(e);
            }
             return home;
          }
      - path: legacy-source/petstore1.3.2/src/components/servicelocator/src/com/sun/j2ee/blueprints/servicelocator/web/ServiceLocator.java
        line_start: 129
        line_end: 147
        excerpt: |
          public EJBHome getRemoteHome(String jndiHomeName, Class className) throws ServiceLocatorException {
            EJBHome home = null;
            try {
              if (cache.containsKey(jndiHomeName)) {
                  home = (EJBHome) cache.get(jndiHomeName);
              } else {
                  Object objref = ic.lookup(jndiHomeName);
                  Object obj = PortableRemoteObject.narrow(objref, className);
                  home = (EJBHome)obj;
                  cache.put(jndiHomeName, home);
              }
             } catch (NamingException ne) {
                  throw new ServiceLocatorException(ne);
             } catch (Exception e) {
                  throw new ServiceLocatorException(e);
             }
             return home;
          }

