  - record_key: admin-operations-br-0015
    kind: business-rule
    capability_key: admin-operations
    requirement: >
      ServiceLocatorException SHALL support wrapped exceptions, allowing recovery
      of the root cause exception and construction of exception chains for detailed
      error reporting.
    confidence: high
    confidence_basis: >
      ServiceLocatorException class provides multiple constructors for wrapping
      exceptions and a getRootCause() method that recursively traverses the chain.
      The feature is explicitly implemented and documented in the exception class.
    risk_class: operational
    basis: >
      ServiceLocatorException.java lines 54-76: Constructor signatures support
      wrapping exceptions. Lines 92-97: getRootCause() method recursively finds
      the root cause. Line 99-104: toString() method handles wrapped exceptions.
    traces:
      - path: legacy-source/petstore1.3.2/src/components/servicelocator/src/com/sun/j2ee/blueprints/servicelocator/ServiceLocatorException.java
        line_start: 46
        line_end: 97
        excerpt: |
          public class ServiceLocatorException extends Exception {
            private Exception exception;

            /**
             * Creates a new ServiceLocatorException wrapping another exception, and with a detail message.
             * @param message the detail message.
             * @param exception the wrapped exception.
             */
            public ServiceLocatorException(String message, Exception exception) {
              super(message);
              this.exception = exception;
              return;
            }

            /**
             * Creates a ServiceLocatorException with the specified detail message.
             * @param message the detail message.
             */
            public ServiceLocatorException(String message) {
              this(message, null);
              return;
            }

            /**
             * Creates a new ServiceLocatorException wrapping another exception, and with no detail message.
             * @param exception the wrapped exception.
             */
            public ServiceLocatorException(Exception exception) {
              this(null, exception);
              return;
            }

            /**
             * Gets the wrapped exception.
             *
             * @return the wrapped exception.
             */
            public Exception getException() {
              return exception;
            }

            /**
             * Retrieves (recursively) the root cause exception.
             *
             * @return the root cause exception.
             */
            public Exception getRootCause() {
              if (exception instanceof ServiceLocatorException) {
                return ((ServiceLocatorException) exception).getRootCause();
              }
              return exception == null ? this : exception;
            }

