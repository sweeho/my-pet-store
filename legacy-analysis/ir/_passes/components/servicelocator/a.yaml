  - record_key: SL-INTEGRATION-0012
    kind: requirement
    capability_key: notifications
    requirement: >
      The system SHALL cache JNDI-looked-up resources in the web tier for
      reuse, checking the cache before performing a new JNDI lookup and
      storing results after successful lookup for subsequent requests.
    confidence: high
    confidence_basis: >
      Caching logic is implemented identically in all lookup methods in
      web/ServiceLocator (not present in ejb/ServiceLocator). The cache
      is initialized as Collections.synchronizedMap(new HashMap()) to
      ensure thread safety. Every lookup method follows the same pattern:
      check cache, return if present, lookup if absent, store in cache.
    risk_class: operational
    basis: >
      web/ServiceLocator declares cache at line 70 and initializes it at
      line 86. All lookup methods (getLocalHome, getRemoteHome, getQueueConnectionFactory,
      getQueue, getTopicConnectionFactory, getTopic, getDataSource) implement
      caching check before JNDI lookup. Example at lines 109-114 for getLocalHome.
    traces:
      - path: legacy-source/petstore1.3.2/src/components/servicelocator/src/com/sun/j2ee/blueprints/servicelocator/web/ServiceLocator.java
        line_start: 68
        line_end: 92
        excerpt: |
          private InitialContext ic;
          private Map cache; //used to hold references to EJBHomes/JMS Resources for re-use

          private static ServiceLocator me;

          static {
            try {
              me = new ServiceLocator();
            } catch(ServiceLocatorException se) {
              System.err.println(se);
              se.printStackTrace(System.err);
            }
          }

          private ServiceLocator() throws ServiceLocatorException  {
            try {
              ic = new InitialContext();
              cache = Collections.synchronizedMap(new HashMap());
            } catch (NamingException ne) {
                  throw new ServiceLocatorException(ne);
            } catch (Exception e) {
                  throw new ServiceLocatorException(e);
             }
          }
      - path: legacy-source/petstore1.3.2/src/components/servicelocator/src/com/sun/j2ee/blueprints/servicelocator/web/ServiceLocator.java
        line_start: 106
        line_end: 121
        excerpt: |
          public EJBLocalHome getLocalHome(String jndiHomeName) throws ServiceLocatorException {
            EJBLocalHome home = null;
            try {
              if (cache.containsKey(jndiHomeName)) {
                  home = (EJBLocalHome) cache.get(jndiHomeName);
              } else {
                  home = (EJBLocalHome) ic.lookup(jndiHomeName);
                  cache.put(jndiHomeName, home);
              }
             } catch (NamingException ne) {
                  throw new ServiceLocatorException(ne);
             } catch (Exception e) {
                  throw new ServiceLocatorException(e);
             }
             return home;
          }
    stack_metadata:
      framework: J2EE

