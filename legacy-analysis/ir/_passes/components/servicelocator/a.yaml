findings:
  - kind: conflict
    path: legacy-source/petstore1.3.2/src/components/servicelocator
    description: >
      Two distinct implementations of ServiceLocator exist: one for EJB tier
      (ejb/ServiceLocator.java) and one for web tier (web/ServiceLocator.java).
      The web tier version adds caching and singleton pattern, while EJB tier
      version is stateless. The instructions do not clarify when each should be
      used, and both are independently deployable. A single application might
      use one or both. No single unified locator pattern is enforced, which
      could lead to inconsistent resource management strategies if both are
      used in the same application.
