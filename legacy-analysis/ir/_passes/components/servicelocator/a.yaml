records:
  - record_key: SL-INTEGRATION-0001
    kind: requirement
    capability_key: notifications
    requirement: >
      The system SHALL wrap lower-level exceptions (NamingException, general Exception)
      in a ServiceLocatorException that preserves the original exception for inspection
      and supports recursive root cause retrieval.
    confidence: high
    confidence_basis: >
      Both EJB and web ServiceLocator implementations use identical exception handling
      pattern across all JNDI lookup methods, and the exception class is explicitly
      designed with getRootCause() method for exception chain traversal. Multiple
      independent code paths enforce this pattern.
    risk_class: operational
    basis: >
      ServiceLocatorException class wraps exceptions in constructor (line 54-58),
      provides getException() accessor (line 83-85), and implements getRootCause()
      (line 92-97) with recursive unwrapping. Both ServiceLocator implementations
      catch NamingException and Exception at every JNDI lookup point and wrap
      them in ServiceLocatorException.
    traces:
      - path: legacy-source/petstore1.3.2/src/components/servicelocator/src/com/sun/j2ee/blueprints/servicelocator/ServiceLocatorException.java
        line_start: 54
        line_end: 76
        excerpt: |
          public ServiceLocatorException(String message, Exception exception) {
            super(message);
            this.exception = exception;
            return;
          }

          public ServiceLocatorException(String message) {
            this(message, null);
            return;
          }

          public ServiceLocatorException(Exception exception) {
            this(null, exception);
            return;
          }
      - path: legacy-source/petstore1.3.2/src/components/servicelocator/src/com/sun/j2ee/blueprints/servicelocator/ServiceLocatorException.java
        line_start: 92
        line_end: 97
        excerpt: |
          public Exception getRootCause() {
            if (exception instanceof ServiceLocatorException) {
              return ((ServiceLocatorException) exception).getRootCause();
            }
            return exception == null ? this : exception;
          }
      - path: legacy-source/petstore1.3.2/src/components/servicelocator/src/com/sun/j2ee/blueprints/servicelocator/ejb/ServiceLocator.java
        line_start: 83
        line_end: 93
        excerpt: |
          public EJBLocalHome getLocalHome(String jndiHomeName) throws ServiceLocatorException {
            EJBLocalHome home = null;
            try {
                home = (EJBLocalHome) ic.lookup(jndiHomeName);
             } catch (NamingException ne) {
                  throw new ServiceLocatorException(ne);
             } catch (Exception e) {
                  throw new ServiceLocatorException(e);
             }
             return home;
          }
    stack_metadata:
      framework: J2EE

