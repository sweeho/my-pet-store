  - record_key: SL-INTEGRATION-0003
    kind: requirement
    capability_key: notifications
    requirement: >
      The system SHALL support JNDI lookup of remote EJB Home interfaces by
      name and class type, applying PortableRemoteObject narrowing before
      returning the home to the caller.
    confidence: high
    confidence_basis: >
      Method signature and narrowing pattern are identical across both EJB and
      web ServiceLocator implementations. PortableRemoteObject.narrow() is a
      standard RMI-IIOP technique for remote object type casting and appears
      consistently in both versions.
    risk_class: operational
    basis: >
      getRemoteHome(String jndiHomeName, Class className) method in both
      ejb/ServiceLocator (line 101-113) and web/ServiceLocator (line 129-147).
      Both call PortableRemoteObject.narrow() to cast the JNDI lookup result
      before returning as EJBHome.
    traces:
      - path: legacy-source/petstore1.3.2/src/components/servicelocator/src/com/sun/j2ee/blueprints/servicelocator/ejb/ServiceLocator.java
        line_start: 101
        line_end: 113
        excerpt: |
          public EJBHome getRemoteHome(String jndiHomeName, Class className) throws ServiceLocatorException {
            EJBHome home = null;
            try {
                  Object objref = ic.lookup(jndiHomeName);
                  Object obj = PortableRemoteObject.narrow(objref, className);
                  home = (EJBHome)obj;
            } catch (NamingException ne) {
                  throw new ServiceLocatorException(ne);
            } catch (Exception e) {
                  throw new ServiceLocatorException(e);
            }
             return home;
          }
    stack_metadata:
      framework: J2EE

