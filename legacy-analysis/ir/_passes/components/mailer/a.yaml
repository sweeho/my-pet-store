        line_start: 83
        line_end: 83
        excerpt: |
          msg.setHeader("X-Mailer", "JavaMailer");

  - record_key: NOTIF-REQUIREMENT-0004
    kind: requirement
    capability_key: notifications
    requirement: >
      The system SHALL set the sent-date timestamp on each email message to the
      current system time at the moment of sending, using the system's default
      time zone.
    confidence: high
    confidence_basis: >
      The code uses new Date() which returns the current time in the JVM's
      default time zone. This is straightforward and will be observed the same
      way by both passes.
    risk_class: operational
    basis: >
      MailHelper.java line 84 calls msg.setSentDate(new Date()), which sets the
      sent-date header to the current system time when the email is sent.
    traces:
      - path: legacy-source/petstore1.3.2/src/components/mailer/src/com/sun/j2ee/blueprints/mailer/ejb/MailHelper.java
        line_start: 84
        line_end: 84
        excerpt: |
          msg.setSentDate(new Date());

