records:
  - record_key: NOTIF-ENTITY-0001
    kind: entity
    capability_key: notifications
    requirement: >
      The system SHALL represent email messages as entities with three required
      fields: recipient address, subject line, and content. Content SHALL be sent
      as HTML and messages SHALL be transmitted via asynchronous JMS queue.
    confidence: high
    confidence_basis: >
      The Mail.dtd (declarative schema) and Mail.java (value object) both enforce
      the three-field structure across both passes. The DTD declares all three
      elements as required with no optional indicators; MailHelper enforces
      text/html content type unconditionally.
    risk_class: operational
    basis: >
      Mail.dtd lines 38-41 define the XML schema with three mandatory elements.
      Mail.java lines 59-61 define corresponding instance fields; constructor
      (lines 66-71) requires all three. MailHelper.java line 79 hard-codes
      text/html content type. ejb-jar.xml lines 46-64 define MailerMDB as a
      message-driven bean consuming from a JMS Queue.
    traces:
      - path: legacy-source/petstore1.3.2/src/components/mailer/src/com/sun/j2ee/blueprints/mailer/rsrc/schemas/Mail.dtd
        line_start: 38
        line_end: 41
        excerpt: |
          <!ELEMENT Mail (Address, Subject, Content)>
          <!ELEMENT Address (#PCDATA)>
          <!ELEMENT Subject (#PCDATA)>
          <!ELEMENT Content (#PCDATA)>
      - path: legacy-source/petstore1.3.2/src/components/mailer/src/com/sun/j2ee/blueprints/mailer/ejb/Mail.java
        line_start: 59
        line_end: 71
        excerpt: |
          private String address = null;
          private String subject  = null;
          private String content = null;

          private Mail() {}

          public Mail(String address, String subject, String content) {
            this.address = address;
            this.subject = subject;
            this.content = content;
            return;
          }
      - path: legacy-source/petstore1.3.2/src/components/mailer/src/com/sun/j2ee/blueprints/mailer/ejb/MailHelper.java
        line_start: 79
        line_end: 82
        excerpt: |
          String contentType = "text/html";
              StringBuffer sb = new StringBuffer(mailContent);
            msg.setDataHandler(new DataHandler(
                                new ByteArrayDataSource(sb.toString(), contentType)));
    stack_metadata:
      ejb.bean: MailerMDB
      ejb.type: message-driven
      jms.destination: javax.jms.Queue
      mail.contentType: text/html

  - record_key: NOTIF-WORKFLOW-0001
    kind: workflow
    capability_key: notifications
    requirement: >
      The system SHALL process incoming email notifications asynchronously via
      a JMS queue. Messages SHALL be consumed by MailerMDB, parsed from XML,
      validated, and delivered using the JavaMail API. Failures in mail delivery
      SHALL be caught and logged but not propagated to prevent queue deadlock.
    confidence: high
    confidence_basis: >
      The JMS/MDB pattern is declaratively configured in ejb-jar.xml with
      both passes able to observe it. The error handling is explicitly coded
      in MailerMDB.onMessage (lines 83-85) where MailerAppException is caught
      and ignored. Both implementations will see this same pattern.
    risk_class: operational
    basis: >
      ejb-jar.xml lines 48-64 declare MailerMDB as a message-driven bean
      listening on javax.jms.Queue. MailerMDB.java lines 74-91 show the
      onMessage method that receives TextMessage, extracts XML, creates Mail
      object, and calls sendMail. Lines 83-85 catch and ignore
      MailerAppException. MailHelper.java lines 70-90 shows the mail sending
      logic using JavaMail API with exception handling that throws
      MailerAppException.
    traces:
      - path: legacy-source/petstore1.3.2/src/components/mailer/src/ejb-jar.xml
        line_start: 46
        line_end: 65
        excerpt: |
          <message-driven>
            <description>opc node to process PurchaseOrders from the Java Pet Store</description>
            <display-name>MailerMDB</display-name>
            <ejb-name>MailerMDB</ejb-name>
            <ejb-class>com.sun.j2ee.blueprints.mailer.ejb.MailerMDB</ejb-class>
            <transaction-type>Container</transaction-type>
            <message-driven-destination>
              <destination-type>javax.jms.Queue</destination-type>
            </message-driven-destination>
          </message-driven>
      - path: legacy-source/petstore1.3.2/src/components/mailer/src/com/sun/j2ee/blueprints/mailer/ejb/MailerMDB.java
        line_start: 74
        line_end: 91
        excerpt: |
          public void onMessage(Message recvMsg) {
            TextMessage textMessage = null;
            String xmlMailMessage = null;
            Mail recMail = null;
            try {
              textMessage = (TextMessage)recvMsg;
              xmlMailMessage = textMessage.getText();
              recMail = Mail.fromXML(xmlMailMessage);
              sendMail(recMail.getAddress(), recMail.getSubject(), recMail.getContent(),  Locale.getDefault());
            } catch (MailerAppException me) {
              //throw new EJBException("MailerMDB.onMessage" + me);
              //ignore since user probably forgot to set up mail server
            } catch (XMLDocumentException xde) {
              throw new EJBException("MailerMDB.onMessage" + xde);
            } catch(JMSException je) {
              throw new EJBException("MailerMDB.onMessage" + je);
            }
          }

  - record_key: NOTIF-REQUIREMENT-0001
    kind: requirement
    capability_key: notifications
    requirement: >
      The system SHALL send email notifications with the sender address unset
      (message.setFrom() called without arguments), allowing the mail server to
      populate the From header with the default sender address configured in the
      JavaMail session.
    confidence: medium
    confidence_basis: >
      The setFrom() call without arguments is visible in the source, but the
      expected behavior depends on the JavaMail API contract and the server
      configuration, which cannot be fully verified from the code alone. The
      pattern is clear but the intent inferred from method naming and JavaMail
      conventions.
    risk_class: presentational
    basis: >
      MailHelper.java line 75 calls msg.setFrom() without arguments. The
      JavaMail API specification indicates this instructs the provider to use
      the default sender address from the Session; however, the actual from
      address depends on the container configuration, which is not visible in
      this component.
    traces:
      - path: legacy-source/petstore1.3.2/src/components/mailer/src/com/sun/j2ee/blueprints/mailer/ejb/MailHelper.java
        line_start: 74
        line_end: 78
        excerpt: |
          Message msg = new MimeMessage(session);
              msg.setFrom();
              msg.setRecipients(Message.RecipientType.TO,
                       InternetAddress.parse(emailAddress, false));

  - record_key: NOTIF-REQUIREMENT-0002
    kind: requirement
    capability_key: notifications
    requirement: >
      The system SHALL encode email content in UTF-8 when converting the message
      body from String to bytes for transmission, ensuring proper character
      encoding for non-ASCII characters in international contexts.
    confidence: high
    confidence_basis: >
      UTF-8 encoding is explicitly declared in ByteArrayDataSource line 66
      with error handling for UnsupportedEncodingException. This pattern is
      standard and will be observed by both passes identically.
    risk_class: operational
    basis: >
      ByteArrayDataSource.java lines 64-69 show the constructor that receives
      message data as a String and explicitly encodes it to UTF-8 bytes. The
      call to data.getBytes("UTF-8") is wrapped in a try-catch that silently
      ignores UnsupportedEncodingException, though UTF-8 support is guaranteed
      in all Java implementations.
    traces:
      - path: legacy-source/petstore1.3.2/src/components/mailer/src/com/sun/j2ee/blueprints/mailer/ejb/ByteArrayDataSource.java
        line_start: 64
        line_end: 69
        excerpt: |
          ByteArrayDataSource(String data, String type) {
              try {
                 this.data = data.getBytes("UTF-8");
              } catch (UnsupportedEncodingException uex) { }
              this.type = type;
          }

  - record_key: NOTIF-REQUIREMENT-0003
    kind: requirement
    capability_key: notifications
    requirement: >
      The system SHALL set the X-Mailer header to "JavaMailer" on all outgoing
      email messages to identify the mail service that sent the message.
    confidence: high
