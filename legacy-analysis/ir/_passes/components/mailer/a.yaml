  - record_key: NOTIF-REQUIREMENT-0006
    kind: requirement
    capability_key: notifications
    requirement: >
      The system SHALL handle mail service exceptions by wrapping them as
      MailerAppException and throwing to the caller, allowing higher-level
      error handling to determine retry or escalation policy.
    confidence: high
    confidence_basis: >
      MailHelper.java explicitly catches all exceptions in a catch-all block and
      throws MailerAppException. This pattern is clear and enforced by the code.
    risk_class: operational
    basis: >
      MailHelper.java lines 86-89 catch generic Exception and throw
      MailerAppException("Failure while sending mail"), providing a uniform
      exception interface for the mail service.
    traces:
      - path: legacy-source/petstore1.3.2/src/components/mailer/src/com/sun/j2ee/blueprints/mailer/ejb/MailHelper.java
        line_start: 86
        line_end: 90
        excerpt: |
          } catch (Exception e) {
              System.err.print("createAndSendMail exception : " + e);
              throw new MailerAppException("Failure while sending mail");
          }

  - record_key: NOTIF-TRANSACTION-0001
    kind: requirement
    capability_key: notifications
    requirement: >
      The system SHALL process mail messages with container-managed
      transactions using the Required transaction attribute, ensuring that
      each onMessage call either commits or rolls back as a single atomic unit.
    confidence: high
    confidence_basis: >
      Transaction management is declaratively configured in ejb-jar.xml with
      the Required attribute explicitly set. This is the highest-confidence
      source for J2EE applications.
    risk_class: operational
    basis: >
      ejb-jar.xml lines 71-80 define container-transaction assembly-descriptor
      for MailerMDB.onMessage with trans-attribute Required. This ensures that
      each message is processed within a container-managed transaction.
    traces:
      - path: legacy-source/petstore1.3.2/src/components/mailer/src/ejb-jar.xml
        line_start: 71
        line_end: 80
        excerpt: |
          <assembly-descriptor>
            <container-transaction>
              <method>
                <ejb-name>MailerMDB</ejb-name>
                <method-name>onMessage</method-name>
                <method-params>
                  <method-param>javax.jms.Message</method-param>
                </method-params>
              </method>
              <trans-attribute>Required</trans-attribute>
            </container-transaction>
           </assembly-descriptor>

  - record_key: NOTIF-RESOURCE-0001
    kind: requirement
    capability_key: notifications
    requirement: >
      The system SHALL obtain a JavaMail Session via JNDI lookup of
      java:comp/env/mail/MailSession, allowing the container to manage mail
      server configuration and connection pooling.
    confidence: high
    confidence_basis: >
      The JNDI name is declared in both ejb-jar.xml resource-ref and
      JNDINames.java constant, providing two independent sources for the same
      configuration. Both passes will observe the same name.
    risk_class: operational
    basis: >
      ejb-jar.xml lines 58-63 declare a resource-ref for mail/MailSession.
      JNDINames.java line 50 defines the JNDI name as "java:comp/env/mail/MailSession".
      MailHelper.java line 73 performs the InitialContext lookup using this name.
    traces:
      - path: legacy-source/petstore1.3.2/src/components/mailer/src/ejb-jar.xml
        line_start: 58
        line_end: 63
        excerpt: |
          <resource-ref>
             <res-ref-name>mail/MailSession</res-ref-name>
             <res-type>javax.mail.Session</res-type>
             <res-auth>Container</res-auth>
             <res-sharing-scope>Shareable</res-sharing-scope>
           </resource-ref>
      - path: legacy-source/petstore1.3.2/src/components/mailer/src/com/sun/j2ee/blueprints/mailer/util/JNDINames.java
        line_start: 49
        line_end: 50
        excerpt: |
          public static final String MAIL_SESSION =
                "java:comp/env/mail/MailSession";

findings:
  - kind: ambiguity
    path: legacy-source/petstore1.3.2/src/components/mailer/src/com/sun/j2ee/blueprints/mailer/ejb/MailerMDB.java
    description: >
      MailerMDB.onMessage catches MailerAppException and explicitly ignores it
      with an inline comment stating "ignore since user probably forgot to set up
      mail server" (lines 84-85). This suggests the error handling is intentional
      to tolerate misconfiguration, but the upstream caller's expectations are
      not visible—whether the queue processes silently fails or whether some
      external monitoring/retry mechanism depends on this behavior. A human needs
      to clarify: is silent failure the intended design, or is this defensive
      coding around a missing infrastructure requirement?

  - kind: unparseable
    path: legacy-source/petstore1.3.2/src/components/mailer/src/com/sun/j2ee/blueprints/mailer/ejb/ByteArrayDataSource.java
    description: >
      ByteArrayDataSource line 80 throws IOException("cannot do this") when
      getOutputStream() is called, but the usage pattern in MailHelper does not
      call getOutputStream—only getInputStream. This is a deliberate restriction
      on the DataSource interface, but the intent (whether to enforce immutability
      or to document an unsupported operation) is not explicit. A human should
      clarify whether this is a data model invariant that should be enforced
      elsewhere.
