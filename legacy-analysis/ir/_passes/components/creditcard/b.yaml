  - record_key: payment-processing-requirement-0006
    kind: requirement
    capability_key: payment-processing
    requirement: >
      All credit card entity bean methods SHALL be accessible without explicit
      authorization checks (unchecked permission).
    confidence: high
    confidence_basis: >
      ejb-jar.xml <unchecked /> declaration explicitly opens all methods. The bean
      uses use-caller-identity for security context propagation, meaning authorization
      is delegated to callers, not enforced at the bean level.
    risk_class: operational
    basis: >
      ejb-jar.xml <method-permission><unchecked /></method-permission> on all
      CreditCardEJB methods. Security identity is use-caller-identity.
    traces:
      - path: legacy-source/petstore1.3.2/src/components/creditcard/src/ejb-jar.xml
        line_start: 69
        line_end: 82
        excerpt: |
          <security-identity>
            <description></description>
            <use-caller-identity></use-caller-identity>
          </security-identity>
        </entity>
      <assembly-descriptor>
        <method-permission>
          <unchecked />
          <method>
            <ejb-name>CreditCardEJB</ejb-name>
            <method-name>*</method-name>
          </method>
        </method-permission>
    stack_metadata:
