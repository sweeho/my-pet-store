        line_start: 49
        line_end: 59
        excerpt: |
          public class Category implements java.io.Serializable {
              private String id;
              private String name;
              private String description;
              public Category(String id, String name, String description) {
      - path: legacy-source/petstore1.3.2/src/apps/petstore/src/docroot/CatalogDAOSQL.xml
        line_start: 64
        line_end: 69
        excerpt: |
          <SQLStatement method="GET_CATEGORY">
              <SQLFragment parameterNb="2">
                  select name, descn
                      from (category a join category_details b on a.catid=b.catid)
                      where locale = ? and a.catid = ?
    stack_metadata:
