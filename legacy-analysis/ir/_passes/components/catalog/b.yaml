  - record_key: catalog-browsing-req-0002
    kind: requirement
    capability_key: catalog-browsing
    requirement: >
      The system SHALL retrieve all categories as a paginated list in a specified locale,
      ordered by category name, with a given start position and maximum count.
      Each result page SHALL include a hasNext flag indicating whether more results follow.
    confidence: high
    confidence_basis: >
      The getCategories method uses result set positioning (absolute call to position at
      start + 1) and count-based iteration. hasNext is set by checking resultSet.next()
      after consuming the requested count. This logic is consistent across all pagination
      methods in the DAO.
    risk_class: operational
    basis: >
      CatalogEJB.getCategories (lines 94-101) delegates to DAO.
      GenericCatalogDAO.getCategories (lines 182-210) implements pagination:
      resultSet.absolute(start + 1) positions cursor, loop counts down while resultSet.next(),
      hasNext set on line 201.
      SQL orders by name (CatalogDAOSQL.xml line 75).
    traces:
      - path: legacy-source/petstore1.3.2/src/components/catalog/src/com/sun/j2ee/blueprints/catalog/dao/GenericCatalogDAO.java
        line_start: 182
        line_end: 210
        excerpt: |
          public Page getCategories(int start, int count, Locale locale) throws CatalogDAOSysException {
              Connection connection = null;
              PreparedStatement statement = null;
              ResultSet resultSet = null;
              try {
                  connection = getDataSource().getConnection();
                  String[] parameterValues = new String[] { locale.toString() };
                  statement = buildSQLStatement(connection, sqlStatements, XML_GET_CATEGORIES, parameterValues);
                  resultSet = statement.executeQuery();
                  if (start >= 0 && resultSet.absolute(start + 1)) {
                      boolean hasNext = false;
                      List categories = new ArrayList();
                      do {
                          categories.add(new Category(resultSet.getString(1).trim(),
                                                      resultSet.getString(2),
                                                      resultSet.getString(3)));
                      } while ((hasNext = resultSet.next()) && (--count > 0));
                      return new Page(categories, start, hasNext);
                  }
                  return Page.EMPTY_PAGE;
    stack_metadata:
      ejb.bean: CatalogEJB
      ejb.transaction: Required

