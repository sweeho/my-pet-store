  # Business rules
  - record_key: catalog-browsing-rule-0001
    kind: business-rule
    capability_key: catalog-browsing
    requirement: >
      Pagination SHALL use a start position (0-based index) and count (maximum results per page).
      The start position SHALL be validated as non-negative; if start < 0, the DAO SHALL
      return an empty page.
    confidence: high
    confidence_basis: >
      All pagination methods check `start >= 0` before positioning the result set
      (GenericCatalogDAO lines 194, 248, 314, 371). A negative start causes early return
      of Page.EMPTY_PAGE without executing the query. This is consistently applied across
      all paginated retrieval methods.
    risk_class: operational
    basis: >
      GenericCatalogDAO.getCategories line 194: `if (start >= 0 && resultSet.absolute(start + 1))`
      GenericCatalogDAO.getProducts line 248: identical check
      GenericCatalogDAO.getItems line 314: identical check
      GenericCatalogDAO.searchItems line 371: identical check
    traces:
      - path: legacy-source/petstore1.3.2/src/components/catalog/src/com/sun/j2ee/blueprints/catalog/dao/GenericCatalogDAO.java
        line_start: 182
        line_end: 210
        excerpt: |
          if (start >= 0 && resultSet.absolute(start + 1)) {
              boolean hasNext = false;
              List categories = new ArrayList();
              do {
                  categories.add(new Category(resultSet.getString(1).trim(),
                                              resultSet.getString(2),
                                              resultSet.getString(3)));
              } while ((hasNext = resultSet.next()) && (--count > 0));
              return new Page(categories, start, hasNext);
          }
          return Page.EMPTY_PAGE;

  - record_key: catalog-browsing-rule-0002
    kind: business-rule
    capability_key: catalog-browsing
    requirement: >
      Empty search queries (queries containing no tokens after whitespace tokenization)
      SHALL return an empty page without executing a database query.
    confidence: high
    confidence_basis: >
      GenericCatalogDAO.searchItems explicitly checks `if (keywordSet.isEmpty())`
      on line 350 and returns Page.EMPTY_PAGE immediately, bypassing all database
      operations. This is an early-exit guard with no database cost.
    risk_class: operational
    basis: >
      GenericCatalogDAO.searchItems lines 345-352 shows tokenization and empty check.
    traces:
      - path: legacy-source/petstore1.3.2/src/components/catalog/src/com/sun/j2ee/blueprints/catalog/dao/GenericCatalogDAO.java
        line_start: 343
        line_end: 352
        excerpt: |
          Collection keywordSet = new HashSet();
          StringTokenizer tokenizer = new StringTokenizer(searchQuery);
