  - record_key: catalog-browsing-req-0007
    kind: requirement
    capability_key: catalog-browsing
    requirement: >
      The system SHALL search for items by keyword in a specified locale.
      Search query input SHALL be tokenized on whitespace.
      Each keyword SHALL be matched against product name, category identifier, and item description
      using case-insensitive LIKE pattern matching with wildcards before and after the keyword.
      Multiple keywords SHALL be combined with OR logic.
    confidence: high
    confidence_basis: >
      The searchItems method in GenericCatalogDAO explicitly implements tokenization
      (lines 345-349), constructs OR conditions with three LIKE clauses per keyword
      (lines 359-365), and uses the VARIABLE occurrence fragment to build the dynamic SQL.
      The keyword wrapping with wildcards is hardcoded (lines 362-364).
      Both database dialects implement identical search logic.
    risk_class: operational
    basis: >
      CatalogEJB.searchItems (lines 141-149) delegates to DAO.
      GenericCatalogDAO.searchItems (lines 343-398) shows tokenization on line 346
      (StringTokenizer), wildcard wrapping on lines 362-364 ("%" + keyword + "%"),
      and VARIABLE fragment assembly.
      SQL template in CatalogDAOSQL.xml (lines 112-127) shows three-clause OR pattern
      repeated for each keyword.
    traces:
      - path: legacy-source/petstore1.3.2/src/components/catalog/src/com/sun/j2ee/blueprints/catalog/dao/GenericCatalogDAO.java
        line_start: 343
        line_end: 398
        excerpt: |
          public Page searchItems(String searchQuery, int start, int count, Locale locale)
              throws CatalogDAOSysException {
              Collection keywordSet = new HashSet();
              StringTokenizer tokenizer = new StringTokenizer(searchQuery);
              while (tokenizer.hasMoreTokens()) {
                  keywordSet.add(tokenizer.nextToken());
              }
              if (keywordSet.isEmpty()) {
                  return Page.EMPTY_PAGE;
              }
              String[] keywords = (String[]) keywordSet.toArray(new String[0]);
              ...
              for (int i = 0; i < keywords.length; i++) {
                  parameterValues[(i * 3) + 1] = "%" + keywords[i] + "%";
                  parameterValues[(i * 3) + 2] = "%" + keywords[i] + "%";
                  parameterValues[(i * 3) + 3] = "%" + keywords[i] + "%";
              }
      - path: legacy-source/petstore1.3.2/src/apps/petstore/src/docroot/CatalogDAOSQL.xml
        line_start: 112
        line_end: 127
        excerpt: |
          <SQLStatement method="SEARCH_ITEMS">
              <SQLFragment parameterNb="4">
                  select catid, a.productid, name, a.itemid, b.image, b.descn, attr1,
                          attr2, attr3, attr4, attr5, listprice, unitcost
                      from (((item a join item_details b on a.itemid=b.itemid)
                          join product_details c on a.productid=c.productid)
                          join product d on d.productid=c.productid and b.locale = c.locale)
                      where b.locale = ? and ((lower(name) like ? or lower(catid) like ? or lower(b.descn) like ?)
              <SQLFragment parameterNb="3" occurrence="VARIABLE">
                  or (lower(name) like ? or lower(catid) like ? or lower(b.descn) like ?)
              </SQLFragment>
    stack_metadata:
      ejb.bean: CatalogEJB
      ejb.transaction: Required

  - record_key: catalog-browsing-req-0008
    kind: requirement
    capability_key: catalog-browsing
    requirement: >
      The system SHALL support the Fast Lane Reader pattern, allowing direct DAO access
      to the catalog without routing through the EJB layer. This supports two access paths:
      stateless EJB invocation (via CatalogLocal) and direct JDBC DAO access.
    confidence: medium
    confidence_basis: >
      The CatalogHelper class explicitly contains a useFastLane boolean (line 76) and
      conditionally routes all calls through either EJB or DAO (e.g., line 155-157).
      The DAO is independently accessible via CatalogDAOFactory.getDAO() (line 181),
      and the ejb-jar.xml declares this as an optional configuration rather than a
      mandatory requirement. This is a deployment-time choice, not a data invariant.
    risk_class: operational
    basis: >
      CatalogHelper.java (lines 76-91) declares useFastLane mode and routing logic.
      Default constructor sets useFastLane = true (line 90).
      All accessor methods check useFastLane and route accordingly
      (e.g., searchItems lines 155-157).
      ejb-jar.xml declares both EJB and JDBC configurations.
    traces:
      - path: legacy-source/petstore1.3.2/src/components/catalog/src/com/sun/j2ee/blueprints/catalog/client/CatalogHelper.java
        line_start: 72
        line_end: 91
        excerpt: |
          public class CatalogHelper implements java.io.Serializable {
              private CatalogDAO dao;
              private boolean useFastLane = false;
              ...
              public CatalogHelper(boolean useFastLane) {
                  this.useFastLane = useFastLane;
              }
              public CatalogHelper() {
                  useFastLane = true;
              }
      - path: legacy-source/petstore1.3.2/src/components/catalog/src/com/sun/j2ee/blueprints/catalog/client/CatalogHelper.java
