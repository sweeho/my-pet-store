  - record_key: catalog-browsing-entity-0004
    kind: entity
    capability_key: catalog-browsing
    requirement: >
      The catalog system SHALL represent search results and paginated lists as Page entities
      containing a collection of result objects, a start position, and a flag indicating whether
      additional results are available after the current page.
    confidence: high
    confidence_basis: >
      The Page class is used consistently across all retrieval methods that return multiple
      results. The hasNext field is set by DAO logic in all pagination paths. The design
      allows efficient pagination without knowing the total count.
    risk_class: operational
    basis: >
      Page.java defines the pagination structure with hasNext flag (lines 52-56).
      All retrieval methods return Page objects: getCategories, getProducts, getItems,
      searchItems (CatalogEJB.java lines 85-149).
    traces:
      - path: legacy-source/petstore1.3.2/src/components/catalog/src/com/sun/j2ee/blueprints/catalog/model/Page.java
        line_start: 45
        line_end: 81
        excerpt: |
          public class Page implements Serializable {
              List objects;
              int start;
              boolean hasNext;
              public Page(List l, int s, boolean hasNext) {
                  objects = new ArrayList(l);
                  start = s;
                  this.hasNext = hasNext;
              }
              public boolean isNextPageAvailable() {
                  return hasNext;
              }
              public boolean isPreviousPageAvailable() {
                  return start > 0;
              }
    stack_metadata:
      ejb.bean: CatalogEJB

