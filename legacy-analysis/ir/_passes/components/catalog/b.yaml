  # Entity definitions
  - record_key: catalog-browsing-entity-0001
    kind: entity
    capability_key: catalog-browsing
    requirement: >
      The catalog system SHALL represent categories as entities with identifier, localized name,
      and localized description attributes. Categories are the top-level organizational units
      in the product catalog.
    confidence: high
    confidence_basis: >
      Both the data model (Category.java) and SQL queries confirm the entity structure.
      The ejb-jar.xml declares a stateless session EJB that exposes category retrieval
      methods with container-managed transactions. The CatalogDAOSQL.xml provides
      two independent database implementations (Cloudscape and Oracle) querying the same
      schema structure, confirming this is an enforced invariant.
    risk_class: operational
    basis: >
      Category model class with id, name, description fields (lines 51-52 in Category.java).
      SQL queries join category and category_details tables (CatalogDAOSQL.xml lines 67, 74).
      Locale parameter passed to all queries confirms localization support.
