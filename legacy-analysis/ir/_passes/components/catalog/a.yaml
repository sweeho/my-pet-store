  - record_key: catalog-browsing-requirement-0001
    kind: requirement
    capability_key: catalog-browsing
    requirement: >
      The system SHALL support pagination when retrieving categories, products, or items.
      Results are returned in a Page object containing a list of objects, the starting index,
      and a boolean indicating whether a next page is available. Navigation between pages
      uses the start index and count parameters.
    confidence: high
    confidence_basis: >
      The Page class is explicitly modeled with pagination logic. All DAO query methods
      (getCategories, getProducts, getItems, searchItems) use identical pagination
      implementation: absolute positioning to start position, iterating while decrementing count
      and checking for hasNext. The EJB declaratively wraps these methods with Required
      transactions. This pattern is enforced across the entire catalog browsing tier.
    risk_class: operational
    basis: >
      Page.java defines pagination with objects, start, and hasNext (lines 55-81).
      GenericCatalogDAO implements pagination consistently across all list operations
      using resultSet.absolute(start + 1) and counting down while hasNext (lines 182-210
      for getCategories, 236-264 for getProducts, 302-341 for getItems, 343-398 for searchItems).
      EJB-jar.xml declares all paginated methods with Required transaction scope.
    traces:
      - path: legacy-source/petstore1.3.2/src/components/catalog/src/com/sun/j2ee/blueprints/catalog/model/Page.java
        line_start: 45
        line_end: 95
        excerpt: |
          public class Page implements Serializable {
              List objects;
              int start;
              boolean hasNext;
              public Page(List l, int s, boolean hasNext) {
                  objects = new ArrayList(l);
                  start = s;
                  this.hasNext = hasNext;
              }
              public List getList() { return objects; }
              public boolean isNextPageAvailable() {
                  return hasNext;
              }
              public boolean isPreviousPageAvailable() {
                  return start > 0;
              }
              public int getStartOfNextPage() { return start + objects.size(); }
              public int getStartOfPreviousPage() {
                  return Math.max(start-objects.size(), 0);
              }
              public int getSize() { return objects.size(); }
          }
      - path: legacy-source/petstore1.3.2/src/components/catalog/src/com/sun/j2ee/blueprints/catalog/dao/GenericCatalogDAO.java
        line_start: 182
        line_end: 210
        excerpt: |
          public Page getCategories(int start, int count, Locale locale) throws CatalogDAOSysException {
              Connection connection = null;
              PreparedStatement statement = null;
              ResultSet resultSet = null;
              try {
                  connection = getDataSource().getConnection();
                  String[] parameterValues = new String[] { locale.toString() };
                  statement = buildSQLStatement(connection, sqlStatements, XML_GET_CATEGORIES, parameterValues);
                  resultSet = statement.executeQuery();
                  if (start >= 0 && resultSet.absolute(start + 1)) {
                      boolean hasNext = false;
                      List categories = new ArrayList();
                      do {
                          categories.add(new Category(resultSet.getString(1).trim(),
                                                      resultSet.getString(2),
                                                      resultSet.getString(3)));
                      } while ((hasNext = resultSet.next()) && (--count > 0));
                      return new Page(categories, start, hasNext);
                  }
                  return Page.EMPTY_PAGE;
              } catch (SQLException exception) {
                  throw new CatalogDAOSysException("SQLException: " + exception.getMessage());
              } finally {
                  closeAll(connection, statement, resultSet);
              }
          }

