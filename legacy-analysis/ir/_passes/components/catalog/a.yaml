          public Item getItem(String itemID, Locale locale) throws CatalogDAOSysException {
              Connection connection = null;
              PreparedStatement statement = null;
              ResultSet resultSet = null;
              try {
                  connection = getDataSource().getConnection();
                  String[] parameterValues = new String[] { locale.toString(), itemID };
                  statement = buildSQLStatement(connection, sqlStatements, XML_GET_ITEM, parameterValues);
                  resultSet = statement.executeQuery();
                  if (resultSet.first()) {
                      int i = 1;
                      return new Item(resultSet.getString(i++).trim(), // category
                                      resultSet.getString(i++).trim(), // productId
                                      resultSet.getString(i++),        // productName
                                      itemID,
                                      resultSet.getString(i++).trim(), // imageLocation
                                      resultSet.getString(i++),        // description
                                      resultSet.getString(i++),        // attribute1
                                      resultSet.getString(i++),        // attribute2
                                      resultSet.getString(i++),        // attribute3
