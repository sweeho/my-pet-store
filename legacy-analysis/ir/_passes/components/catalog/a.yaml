  - record_key: catalog-browsing-requirement-0008
    kind: requirement
    capability_key: catalog-browsing
    requirement: >
      The system SHALL support full-text search across items. The search accepts a query string,
      tokenizes it into keywords (whitespace-separated), and returns paginated Item results
      matching any keyword in item name, description, or attributes.
    confidence: high
    confidence_basis: >
      The searchItems(String searchQuery, int start, int count, Locale l) method is
      explicitly declared with Required transactions in ejb-jar.xml. GenericCatalogDAO
      implements search by tokenizing the query (lines 345-349), building dynamic SQL
      with LIKE patterns for each keyword across 3 columns, and returning paginated
      Item results with all attributes.
    risk_class: operational
    basis: >
      EJB-jar.xml declares searchItems() with Required transaction (lines 103-116).
      GenericCatalogDAO implements it at lines 343-398 by tokenizing searchQuery with
      StringTokenizer, building parameterValues array with % -wrapped keywords for each
      of 3 columns (3 parameters per keyword), executing SEARCH_ITEMS SQL, and building
      Item objects from results.
    traces:
      - path: legacy-source/petstore1.3.2/src/components/catalog/src/ejb-jar.xml
        line_start: 103
        line_end: 116
        excerpt: |
          <container-transaction>
              <method>
                  <ejb-name>CatalogEJB</ejb-name>
                  <method-intf>Local</method-intf>
                  <method-name>searchItems</method-name>
                  <method-params>
                      <method-param>java.lang.String</method-param>
                      <method-param>int</method-param>
                      <method-param>int</method-param>
                      <method-param>java.util.Locale</method-param>
                  </method-params>
              </method>
              <trans-attribute>Required</trans-attribute>
          </container-transaction>
      - path: legacy-source/petstore1.3.2/src/components/catalog/src/com/sun/j2ee/blueprints/catalog/dao/GenericCatalogDAO.java
        line_start: 343
        line_end: 368
        excerpt: |
          public Page searchItems(String searchQuery, int start, int count, Locale locale)
            throws CatalogDAOSysException {
              Collection keywordSet = new HashSet();
              StringTokenizer tokenizer = new StringTokenizer(searchQuery);
              while (tokenizer.hasMoreTokens()) {
                  keywordSet.add(tokenizer.nextToken());
              }
              if (keywordSet.isEmpty()) {
                  return Page.EMPTY_PAGE;
              }
              String[] keywords = (String[]) keywordSet.toArray(new String[0]);
              Connection connection = null;
              PreparedStatement statement = null;
              ResultSet resultSet = null;
              try {
                  connection = getDataSource().getConnection();
                  String[] parameterValues = new String[1 + (keywords.length * 3)];
                  parameterValues[0] = locale.toString();
                  for (int i = 0; i < keywords.length; i++) {
                      parameterValues[(i * 3) + 1] = "%" + keywords[i] + "%";
                      parameterValues[(i * 3) + 2] = "%" + keywords[i] + "%";
                      parameterValues[(i * 3) + 3] = "%" + keywords[i] + "%";
                  }

