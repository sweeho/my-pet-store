  - record_key: AUTH-REQ-0001
    kind: requirement
    capability_key: user-authentication
    requirement: >
      The system SHALL require form-based authentication with username and password
      for all users accessing administrative functions.
    confidence: high
    confidence_basis: >
      Form-based login is declaratively configured in web.xml and JSP pages implement it.
      This configuration is the only access point to admin functions and both passes should
      agree on this fundamental requirement.
    risk_class: operational
    basis: >
      web.xml declares <auth-method>FORM</auth-method> at line 91 with form login and
      error pages defined. AdminRequestProcessor servlet is protected by security-constraint
      requiring "administrator" role (lines 75-88).
