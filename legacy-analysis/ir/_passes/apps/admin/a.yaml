  - record_key: ADMIN-OPS-WF-0003
    kind: workflow
    capability_key: admin-operations
    requirement: >
      When updating order status, the system SHALL accept one or more orders with
      OrderId and new OrderStatus values and asynchronously send order approval
      notifications via message queue.
    confidence: high
    confidence_basis: >
      The update workflow is fully implemented: OrderApproval object is constructed from
      request, then passed to AsyncSender EJB for async processing via JMS queue.
      Both request parsing and async invocation are explicit in code.
    risk_class: operational
    basis: >
      ApplRequestProcessor.updateOrders() at lines 205-237 parses order updates and
      constructs OrderApproval object. AdminRequestBD.updateOrders() at lines 115-130
      looks up AsyncSender EJB and invokes sendAMessage() with serialized XML.
    traces:
      - path: legacy-source/petstore1.3.2/src/apps/admin/src/admin/com/sun/j2ee/blueprints/admin/web/ApplRequestProcessor.java
        line_start: 205
        line_end: 237
        excerpt: |
          String updateOrders(Element root) {
              OrderApproval oa = new OrderApproval();
              NodeList nl = root.getElementsByTagName("Order");
              for (int i = 0; i < nl.getLength(); i++) {
                  Element e = (Element) nl.item(i);
                  String orderId =
                      getValue((Element) e.getElementsByTagName("OrderId").item(0));
                  String orderStatus =
                      getValue((Element) e.getElementsByTagName("OrderStatus").item(0));
                  if (orderId != null && orderStatus != null) {
                      oa.addOrder(new ChangedOrder(orderId, orderStatus));
                  }
              }
              try {
                  AdminRequestBD bd = new AdminRequestBD();
                  bd.updateOrders(oa);
                  return replyHeader + "<Type>UPDATEORDERS</Type>\n"
                      + "<Status>SUCCESS</Status>\n"
                      + "</Response>\n";
              } catch (AdminBDException e) {
                  return replyHeader
                      + "<Error>Exception while processing :  " + e.getMessage()
                      + ". Please try again</Error>\n</Response>\n";
              }
          }

  - record_key: ADMIN-OPS-WF-0004
    kind: workflow
    capability_key: admin-operations
    requirement: >
      When generating reports, the system SHALL accept a request type (REVENUE or ORDERS),
      date range (start and end dates), and optional category filter, then return aggregated
      data with per-category totals and a sum (TotalSales).
    confidence: high
    confidence_basis: >
      Report generation logic is complete in ApplRequestProcessor.getChartInfo().
      REVENUE reports return float amounts, ORDERS reports return integer quantities.
      Date range and category filtering are fully implemented.
    risk_class: operational
    basis: >
      ApplRequestProcessor.getChartInfo() at lines 239-305 processes REVENUE and ORDERS
      requests. Lines 265-280 show REVENUE handling with float amounts and TotalSales sum.
      Lines 282-297 show ORDERS handling with integer quantities. Date and category are
      extracted and passed to backend at lines 244-255.
    traces:
      - path: legacy-source/petstore1.3.2/src/apps/admin/src/admin/com/sun/j2ee/blueprints/admin/web/ApplRequestProcessor.java
        line_start: 239
        line_end: 305
        excerpt: |
          String getChartInfo(Element root, String request) {
              try {
                  Map chartInfo = null;
                  String category = null;
                  String start = getValue(root.getElementsByTagName("Start").item(0));
                  String end = getValue(root.getElementsByTagName("End").item(0));
                  AdminRequestBD bd = new AdminRequestBD();
                  category =
                      getValue(root.getElementsByTagName("ReqCategory").item(0));
                  chartInfo = bd.getChartInfo(request,
                                              getProperDate(start),
                                              getProperDate(end),
                                              category);
                  StringBuffer responseBuffer = new StringBuffer(replyHeader);
                  String xmlElement = (category == null) ? "Category" : "Item";
                  responseBuffer.append("<Type>" + request + "</Type>\n");
                  responseBuffer.append("<Start>" + start + "</Start>\n");
                  responseBuffer.append("<End>" + end + "</End>\n");
                  responseBuffer.append(((category == null) ?
                                         ("<ReqCategory/>\n") :
                                         ("<ReqCategory>" + category + "</ReqCategory>\n")));
                  if (request.equals("REVENUE")) {
                      float totalAmount = 0f;
                      for (Iterator it = chartInfo.entrySet().iterator();
                           it.hasNext(); ) {
                          Map.Entry e = (Map.Entry) it.next();
                          float amount = ((Float) e.getValue()).floatValue();
                          totalAmount += amount;
                          responseBuffer.append("<" + xmlElement + " name=\""
                                                + e.getKey() + "\">");
                          responseBuffer.append(amount);
                          responseBuffer.append("</" + xmlElement + ">\n");
                      }
                      responseBuffer.append("<TotalSales>");
                      responseBuffer.append(totalAmount);
                      responseBuffer.append("</TotalSales>\n");
                  }
                  else {
                      int totalQuantity = 0;
                      for (Iterator it = chartInfo.entrySet().iterator();
                           it.hasNext(); ) {
                          Map.Entry e = (Map.Entry) it.next();
                          int quantity = ((Integer) e.getValue()).intValue();
                          totalQuantity += quantity;
                          responseBuffer.append("<" + xmlElement + " name=\""
                                                + e.getKey() + "\">");
                          responseBuffer.append(quantity);
                          responseBuffer.append("</" + xmlElement + ">\n");
                      }
                      responseBuffer.append("<TotalSales>");
                      responseBuffer.append(totalQuantity);
                      responseBuffer.append("</TotalSales>\n");
                  }
                  responseBuffer.append("</Response>\n");
                  return responseBuffer.toString();

  - record_key: ADMIN-OPS-BIZ-0001
    kind: business-rule
    capability_key: admin-operations
    requirement: >
      Date values for report generation SHALL be parsed in mm/dd/yyyy format and converted
      to a Date object for backend processing.
    confidence: medium
    confidence_basis: >
      Date parsing logic is explicit in getProperDate() but the format string is inferred
      from tokenization pattern. No configuration or test found that explicitly documents
      this format requirement.
    risk_class: operational
    basis: >
      ApplRequestProcessor.getProperDate() at lines 319-326 uses StringTokenizer with "/"
      delimiter and constructs Date using year-1900, month-1, day format. This implies
      mm/dd/yyyy input format based on standard Date constructor behavior.
    traces:
      - path: legacy-source/petstore1.3.2/src/apps/admin/src/admin/com/sun/j2ee/blueprints/admin/web/ApplRequestProcessor.java
        line_start: 319
        line_end: 326
        excerpt: |
          Date getProperDate(String inpDate) {
              StringTokenizer tokens = new StringTokenizer(inpDate, "/");
              Integer month = new Integer((String)tokens.nextElement());
              Integer day = new Integer((String)tokens.nextElement());
              Integer year = new Integer((String)tokens.nextElement());
              return(new Date(year.intValue()-1900, month.intValue()-1,
                              day.intValue()));
          }

  - record_key: ADMIN-OPS-BIZ-0002
    kind: business-rule
    capability_key: admin-operations
    requirement: >
      Session validity is required for the ApplRequestProcessor servlet. If a request
      arrives with no valid session, the system SHALL return an error message "Session Timed Out;
      Please exit and login as admin from the login page".
    confidence: high
    confidence_basis: >
      Session check is explicitly implemented in ApplRequestProcessor.doPost() at lines 94-99.
      This is defensive programming that catches expired sessions.
    risk_class: operational
    basis: >
      ApplRequestProcessor.doPost() at lines 88-115 checks session validity at lines 94-99.
      If session is null, error message is returned directly to the client.
    traces:
      - path: legacy-source/petstore1.3.2/src/apps/admin/src/admin/com/sun/j2ee/blueprints/admin/web/ApplRequestProcessor.java
        line_start: 88
        line_end: 115
        excerpt: |
          public void doPost(HttpServletRequest req, HttpServletResponse resp)
              throws java.io.IOException, javax.servlet.ServletException {
              HttpSession session = req.getSession(false);
              ServletOutputStream out = resp.getOutputStream();
              if(session == null) {
                  out.println(replyHeader +
                              "<Error>Session Timed Out; Please exit and " +
                              "login as admin from the login page</Error>\n" +
                              "</Response>\n");
              } else {
                  String sId = session.getId();
                  resp.setContentType("text/xml");
                  BufferedReader inp = req.getReader();
                  StringBuffer strbuf = new StringBuffer("");
                  while(true) {
                      String str = inp.readLine();
                      if(str == null)
                          break;
                      strbuf.append(str+"\n");
                  }
                  inp.close();
                  out.println(processRequest(strbuf.toString()));
              }
              out.flush();
              out.close();
          }

