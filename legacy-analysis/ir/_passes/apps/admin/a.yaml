  - record_key: ADMIN-INTEG-0003
    kind: integration
    capability_key: admin-operations
    requirement: >
      The admin module SHALL use Java WebStart (JNLP) technology to deploy a rich client
      application for order management to administrators' desktop systems.
    confidence: medium
    confidence_basis: >
      JNLP file generation is implemented in AdminRequestProcessor.buildJNLP() but the
      actual Java WebStart deployment mechanism is implicit. The code generates the manifest
      but does not show how the client application itself is deployed or updated.
    risk_class: operational
    basis: >
      AdminRequestProcessor.buildJNLP() at lines 63-95 dynamically generates a JNLP manifest
      with resources and application descriptor pointing to AdminApp.jar and other client
      JARs. The servlet responds with content type "application/x-java-jnlp-file" at line 113,
      triggering WebStart client launch.
    traces:
      - path: legacy-source/petstore1.3.2/src/apps/admin/src/admin/com/sun/j2ee/blueprints/admin/web/AdminRequestProcessor.java
        line_start: 63
        line_end: 120
        excerpt: |
          protected String buildJNLP(HttpServletRequest req) throws ServletException {
              String serverName = req.getServerName();
              int serverPort = req.getServerPort();
              StringBuffer jnlp = new StringBuffer();
              jnlp.append("<?xml version=\"1.0\" encoding=\"UTF-8\"?>\n"); // Append xmlHeader
              jnlp.append("<jnlp codebase=\"http://").append(serverName).append(":").append(serverPort).append("/admin\">\n"); // Append codebase
              // append appInfo
              jnlp.append("<information>\n").append("<title>Pet Store Admin Rich Client</title>\n");
              jnlp.append("<vendor>J2EE BluePrints</vendor>\n");
              jnlp.append("<description>Example of Java Web Start Enabled Rich Client For a J2EE application</description>\n");
              jnlp.append("<description kind=\"short\"></description>\n");
              jnlp.append("</information>\n");
              // append rsrcInfo
              jnlp.append("<resources>\n");
              jnlp.append("<j2se version=\"1.4\"/>\n");
              jnlp.append("<j2se version=\"1.3\"/>\n");
