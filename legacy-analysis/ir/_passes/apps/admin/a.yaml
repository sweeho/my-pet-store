  - record_key: ADMIN-OPS-WF-0001
    kind: workflow
    capability_key: admin-operations
    requirement: >
      The system SHALL support an order management workflow where administrators can:
      1. View pending orders by status
      2. Approve or deny orders
      3. Generate revenue and order reports by date range and category
    confidence: high
    confidence_basis: >
      Workflow is implemented across multiple Java classes (AdminRequestBD, ApplRequestProcessor)
      with request types GETORDERS, UPDATESTATUS, REVENUE, ORDERS. Logic appears complete
      and reachable via the servlet request dispatcher.
    risk_class: financial
    basis: >
      ApplRequestProcessor.processRequest() (lines 122-164) dispatches to three handler methods:
      getOrders() for GETORDERS requests, updateOrders() for UPDATESTATUS, and getChartInfo()
      for REVENUE/ORDERS chart data.
    traces:
      - path: legacy-source/petstore1.3.2/src/apps/admin/src/admin/com/sun/j2ee/blueprints/admin/web/ApplRequestProcessor.java
        line_start: 122
        line_end: 164
        excerpt: |
          String processRequest(String xmlString) {
              try {
                  InputSource source =
                      new InputSource(new ByteArrayInputStream(xmlString.
                                                               getBytes()));
                  DocumentBuilder db =
                      DocumentBuilderFactory.newInstance().newDocumentBuilder();
                  Element root =
                      db.parse(source).getDocumentElement();
                  String reqType = getValue(root.getElementsByTagName("Type")
                                            .item(0));
                  if (reqType.equals("GETORDERS")) {
                      return getOrders(root);
                  }
                  else if (reqType.equals("UPDATESTATUS")) {
                      return updateOrders(root);
                  }
                  else if (reqType.equals("REVENUE") || reqType.equals("ORDERS")) {
                      return getChartInfo(root, reqType);
                  }
                  else {
                      return replyHeader +
                          "<Error>Unable to process request : " +
                          "Unknown request type - " + reqType +
                          "</Error>\n</Response>\n";
                  }
              }

