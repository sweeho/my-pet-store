  - record_key: AUTH-REQ-0002
    kind: requirement
    capability_key: user-authentication
    requirement: >
      The system SHALL restrict access to /AdminRequestProcessor
      to users possessing the "administrator" role.
    confidence: high
    confidence_basis: >
      Security constraint in web.xml explicitly defines role-based access
      control at the declarative level. This is enforced by the J2EE
      container at request time before any servlet code executes.
    risk_class: operational
    basis: >
      web.xml lines 75-88 define a security-constraint limiting
      /AdminRequestProcessor to the "administrator" role via auth-constraint.
    traces:
      - path: legacy-source/petstore1.3.2/src/apps/admin/src/docroot/WEB-INF/web.xml
        line_start: 75
        line_end: 88
        excerpt: |
          <security-constraint>
            <web-resource-collection>
              <web-resource-name>MySecureBit0</web-resource-name>
              <url-pattern>/AdminRequestProcessor</url-pattern>
              <http-method>GET</http-method>
              <http-method>POST</http-method>
            </web-resource-collection>
            <auth-constraint>
              <role-name>administrator</role-name>
            </auth-constraint>
            <user-data-constraint>
              <transport-guarantee>NONE</transport-guarantee>
            </user-data-constraint>
          </security-constraint>

