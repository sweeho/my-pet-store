  - record_key: ORDERAPP-WF-0001
    kind: workflow
    capability_key: order-approval
    requirement: >
      GIVEN an administrator is viewing the Orders Approval screen,
      WHEN the administrator selects one or more pending orders,
      AND clicks the Approve button or Deny button to change their status,
      THEN the status SHALL be updated in the UI immediately,
      AND WHEN the administrator clicks the Commit button,
      THEN all pending orders with changed status (APPROVED or DENIED)
      SHALL be transmitted to the server as an atomic update,
      AND the UI SHALL refresh with the server's current state.
    confidence: high
    confidence_basis: >
      The complete workflow is implemented across multiple components:
      OrdersApprovePanel defines the UI and buttons, DataSource implements
      the commit logic with server communication, and the process is
      observable in code paths that show local update followed by
      batch server transmission.
    risk_class: operational
    basis: >
      OrdersApprovePanel.java lines 92-138 define approve/deny/commit buttons
      and their action listeners. Lines 100-108 show approve button updates
      status column directly. Lines 127-136 show commit button calls
      tableModel.commit(). DataSource.java lines 422-498 show OrdersApproveTableModel.commit()
      method which collects approved and denied orders and sends them to
      server via updateStatus() calls (lines 467-474).
    traces:
      - path: legacy-source/petstore1.3.2/src/apps/admin/src/client/com/sun/j2ee/blueprints/admin/client/OrdersApprovePanel.java
        line_start: 100
        line_end: 138
        excerpt: |
          approveButton.addActionListener(new ActionListener() {
              public void actionPerformed(ActionEvent e) {
                  int[] rows = orderTable.getSelectedRows();
                  for (int i = 0; i < rows.length; i++) {
                      sorter.setValueAt(PetStoreProxy.Order.APPROVED, rows[i], 4);
                      orderTable.repaint();
                  }
              }
          });
          // ... similar for denyButton ...
          commitButton.addActionListener(new ActionListener() {
              public void actionPerformed(ActionEvent e) {
                  tableModel.commit();
              }
          });
      - path: legacy-source/petstore1.3.2/src/apps/admin/src/client/com/sun/j2ee/blueprints/admin/client/DataSource.java
        line_start: 422
        line_end: 474
        excerpt: |
          public void commit() {
              Vector approvedRows = new Vector();
              Vector deniedRows = new Vector();
              for (int i = 0; i < getRowCount(); i++) {
                  if (PetStoreProxy.Order.APPROVED.equals((String)getValueAt(i, 4))) {
                      approvedRows.add(new Integer(i));
                  } else if (PetStoreProxy.Order.DENIED.equals((String)getValueAt(i, 4))) {
                      deniedRows.add(new Integer(i));
                  }
              }
              // ...
              ServerAction action = new ServerAction() {
                  protected Object request(ActionEvent e) {
                      if (approvedOrders.length > 0) {
                          server.updateStatus(approvedOrders, PetStoreProxy.Order.APPROVED);
                      }
                      if (deniedOrders.length > 0) {
                          server.updateStatus(deniedOrders, PetStoreProxy.Order.DENIED);
                      }
                      return getServerOrderData();
                  }

  - record_key: ORDERAPP-BR-0001
    kind: business-rule
    capability_key: order-approval
    requirement: >
      The system SHALL warn the user if they attempt to refresh order data
      while uncommitted changes exist in the Orders Approval table
      (orders with status changed from PENDING to APPROVED or DENIED
      that have not yet been committed).
    confidence: medium
    confidence_basis: >
      The warning logic is implemented in DataSource.RefreshAction.actionPerformed()
      with explicit detection of uncommitted changes. However, the warning
      is only shown when initiating a refresh; there is no persistent validation
      preventing loss of uncommitted work through other means (e.g., closing
      the application or switching tabs). This is a quality-of-life feature
      rather than a hard constraint.
    risk_class: operational
    basis: >
      DataSource.java lines 220-241 in RefreshAction.actionPerformed() check
      ordersApproveTableModel for rows where status is not PENDING, and if
      found, display a warning dialog asking the user to confirm before
      proceeding with the refresh.
    traces:
      - path: legacy-source/petstore1.3.2/src/apps/admin/src/client/com/sun/j2ee/blueprints/admin/client/DataSource.java
        line_start: 220
        line_end: 241
        excerpt: |
          public void actionPerformed(final ActionEvent action) {
              boolean isUncommitted = false;
              for (int i = 0; i < ordersApproveTableModel.getRowCount(); i++) {
                  if (!PetStoreProxy.Order.PENDING.equals(
                  ordersApproveTableModel.getValueAt(i, 4))) {
                      isUncommitted = true;
                      break;
                  }
              }
              int result = JOptionPane.OK_OPTION;
              if (isUncommitted) {
                  result = JOptionPane.showConfirmDialog(parent,
                  PetStoreAdminClient.getString("RefreshWarningDialog.message"),
                  PetStoreAdminClient.getString("RefreshWarningDialog.title"),
                  JOptionPane.OK_CANCEL_OPTION,
                  JOptionPane.WARNING_MESSAGE);
              }
              if (result == JOptionPane.OK_OPTION) {
                  pcs.firePropertyChange(DISABLE_ACTIONS, null, null);

