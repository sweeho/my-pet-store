  - record_key: JNLP-REQ-0001
    kind: requirement
    capability_key: admin-operations
    requirement: >
      The system SHALL generate and serve a dynamic JNLP file
      to enable Java Web Start deployment of the rich client,
      embedding the current HTTP session ID to maintain authentication
      across the client/server boundary.
    confidence: high
    confidence_basis: >
      Declarative endpoint configuration in web.xml with servlet mapping,
      combined with explicit JNLP generation code in AdminRequestProcessor.
      Session ID embedding is clearly coded in the buildJNLP method.
    risk_class: operational
    basis: >
      AdminRequestProcessor.java lines 63-95 implement buildJNLP() method
      which dynamically constructs JNLP XML and embeds req.getSession().getId()
      at line 91. Servlet is mapped to /AdminRequestProcessor in web.xml lines 58-60.
    traces:
      - path: legacy-source/petstore1.3.2/src/apps/admin/src/admin/com/sun/j2ee/blueprints/admin/web/AdminRequestProcessor.java
        line_start: 63
        line_end: 95
        excerpt: |
          protected String buildJNLP(HttpServletRequest req) throws ServletException {
              String serverName = req.getServerName();
              int serverPort = req.getServerPort();
              StringBuffer jnlp = new StringBuffer();
              jnlp.append("<?xml version=\"1.0\" encoding=\"UTF-8\"?>\n");
              // ... JNLP construction code ...
              jnlp.append("<argument>").append(req.getSession().getId()).append("</argument>\n");
              // ... more JNLP code ...
              return(jnlp.toString());
          }

