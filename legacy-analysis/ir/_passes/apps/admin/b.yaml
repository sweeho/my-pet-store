  - record_key: AUTH-REQ-0001
    kind: requirement
    capability_key: user-authentication
    requirement: >
      The system SHALL authenticate users via form-based login
      using username and password credentials submitted to j_security_check.
    confidence: high
    confidence_basis: >
      Declarative authentication mechanism specified in web.xml login-config
      with form-login-page pointing to login.jsp. This is standard J2EE
      form-based authentication, enforced at the servlet container level.
    risk_class: operational
    basis: >
      web.xml lines 90-97 define the login configuration with login.jsp
      as the form-login-page. login.jsp lines 52-82 implement the form
      with j_security_check endpoint and j_username/j_password fields.
    traces:
