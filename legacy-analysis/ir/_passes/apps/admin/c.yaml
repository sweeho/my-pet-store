  - record_key: admin-ops-0002
    kind: requirement
    capability_key: admin-operations
    requirement: >
      The system SHALL retrieve pending or approved orders and display order details
      including order ID, user ID, order date, order amount, and order status.
    confidence: high
    confidence_basis: >
      Order retrieval is enforced in two independent layers: business logic (AdminRequestBD.getOrdersByStatus)
      and rich client handler (ApplRequestProcessor.getOrders), both implementing the same
      contract. Output structure is consistent across both.
    risk_class: operational
    basis: >
      AdminRequestBD delegates to OPCAdminFacade EJB to retrieve orders by status.
      ApplRequestProcessor calls AdminRequestBD.getOrdersByStatus and marshals results
      into XML with fixed fields: OrderId, UserId, OrderDate, OrderAmount, OrderStatus.
      Rich client calls GETORDERS request type to fetch orders of specific status.
    traces:
