  - record_key: admin-auth-0001
    kind: requirement
    capability_key: user-authentication
    requirement: >
      The system SHALL require administrators to authenticate using form-based login
      with username and password before accessing the admin interface.
    confidence: high
    confidence_basis: >
      Enforced by declarative web.xml security-constraint (role-name=administrator),
      form-based login-config with login page, and session check in ApplRequestProcessor.
      Authentication is verified in two independent places (web.xml and servlet code).
    risk_class: operational
    basis: >
      web.xml defines security-constraint requiring administrator role and form-based
      login using login.jsp. ApplRequestProcessor checks for valid session and returns
      error if session is null, enforcing that unauthenticated clients cannot access
      the rich client API.
    traces:
