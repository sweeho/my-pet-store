          String getOrders(Element root) {
              try {
                  AdminRequestBD bd = new AdminRequestBD();
                  NodeList nl = root.getElementsByTagName("Status");
                  String status = getValue(nl.item(0));
                  OrdersTO orders = bd.getOrdersByStatus(status);
