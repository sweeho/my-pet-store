  - record_key: admin-ops-0003
    kind: requirement
    capability_key: admin-operations
    requirement: >
      The system SHALL update the status of one or more orders in a single operation,
      accepting order IDs and a new status value.
    confidence: high
    confidence_basis: >
      Order status update is declared in two independent sources: the rich client
      proxy (updateStatus methods) and the server handler (updateOrders). Both
      confirm the operation signature and semantics.
    risk_class: operational
    basis: >
      AdminRequestBD.updateOrders wraps OrderApproval XML and delegates to AsyncSender
      EJB for asynchronous processing. ApplRequestProcessor.updateOrders parses incoming
      XML to extract order IDs and status, creating ChangedOrder objects. Rich client
      HttpPostPetStoreProxy.updateStatus sends UPDATESTATUS request with batch of orders
      and a single status value.
    traces:
      - path: legacy-source/petstore1.3.2/src/apps/admin/src/admin/com/sun/j2ee/blueprints/admin/web/AdminRequestBD.java
        line_start: 115
        line_end: 130
        excerpt: |
          public void updateOrders(OrderApproval oa) throws AdminBDException {
              try {
                  AsyncSenderLocalHome home = (AsyncSenderLocalHome)
                      ServiceLocator.getInstance().getLocalHome(JNDINames.ASYNCSENDER_LOCAL_EJB_HOME);
                  AsyncSender sender= home.create();
                  sender.sendAMessage(oa.toXML());
              } catch (ServiceLocatorException sle) {
                  sle.printStackTrace();
                  throw new AdminBDException(sle.getMessage());
              } catch (XMLDocumentException xde) {
                  xde.printStackTrace();
                  throw new AdminBDException(xde.getMessage());
              }  catch (CreateException ce) {
                  throw new AdminBDException(ce.getMessage());
              }
          }
      - path: legacy-source/petstore1.3.2/src/apps/admin/src/admin/com/sun/j2ee/blueprints/admin/web/ApplRequestProcessor.java
        line_start: 205
        line_end: 237
        excerpt: |
          String updateOrders(Element root) {

              // a better solution would be using a style sheet to convert from
              // one schema to the other

              OrderApproval oa = new OrderApproval();

              NodeList nl = root.getElementsByTagName("Order");
              for (int i = 0; i < nl.getLength(); i++) {
                  Element e = (Element) nl.item(i);

                  // Assumes values of OrderStatus are the same for both schemas
                  String orderId =
                      getValue((Element) e.getElementsByTagName("OrderId").item(0));
                  String orderStatus =
                      getValue((Element) e.getElementsByTagName("OrderStatus").item(0));
                  if (orderId != null && orderStatus != null) {
                      oa.addOrder(new ChangedOrder(orderId, orderStatus));
                  }
              }

              try {
                  AdminRequestBD bd = new AdminRequestBD();
                  bd.updateOrders(oa);
                  return replyHeader + "<Type>UPDATEORDERS</Type>\n"
                      + "<Status>SUCCESS</Status>\n"
                      + "</Response>\n";
              } catch (AdminBDException e) {
                  return replyHeader
                      + "<Error>Exception while processing :  " + e.getMessage()
                      + ". Please try again</Error>\n</Response>\n";
              }
          }
