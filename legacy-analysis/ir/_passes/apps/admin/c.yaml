  - record_key: admin-ops-0001
    kind: workflow
    capability_key: admin-operations
    requirement: >
      The system SHALL provide an administrator workflow consisting of: login to admin
      interface, access admin home page, launch Java Web Start rich client application,
      and use rich client for order and sales management.
    confidence: medium
    confidence_basis: >
      Multiple sources (web.xml, JSP, servlet) describe the workflow. However, the
      endpoint configuration in the client is obtained through reverse-engineering the
      buildJNLP method and HttpPostPetStoreProxy.setup, so the exact flow is inferred
      rather than documented.
    risk_class: operational
    basis: >
      AdminRequestProcessor.doGet redirects to index.jsp (admin home). index.jsp presents
      form to launch rich client (manageorders screen). AdminRequestProcessor.doPost
      generates JNLP file for Java Web Start launch when currentScreen=manageorders.
      HttpPostPetStoreProxy demonstrates the rich client connects via POST to
      /admin/ApplRequestProcessor.
    traces:
      - path: legacy-source/petstore1.3.2/src/apps/admin/src/admin/com/sun/j2ee/blueprints/admin/web/AdminRequestProcessor.java
        line_start: 97
        line_end: 119
        excerpt: |
          public void doGet(HttpServletRequest req, HttpServletResponse resp)
          throws IOException, ServletException {
              getServletConfig().getServletContext().getRequestDispatcher("/index.jsp").forward(req, resp);
          }

          public void doPost(HttpServletRequest req, HttpServletResponse resp)
          throws IOException, ServletException {
              String curScreen = req.getParameter("currentScreen");
              if (curScreen == null) {
                  return;
              }
              curScreen = curScreen.trim();
              if(curScreen.equals("logout")) {
                  getServletConfig().getServletContext().getRequestDispatcher("/logout.jsp").forward(req, resp);
              }
              if(curScreen.equals("manageorders")) {
                  resp.setContentType("application/x-java-jnlp-file");
                  ServletOutputStream out = resp.getOutputStream();
                  out.println(buildJNLP(req));
                  out.flush();
                  out.close();
              }
          }
