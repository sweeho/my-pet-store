    requirement: >
      The system SHALL generate revenue reports showing total sales by category or
      item for a specified date range, with optional filtering by product category.
    confidence: high
    confidence_basis: >
      Revenue reporting is implemented consistently across three independent sources:
      the EJB facade (getChartInfo), the server request handler (getChartInfo), and
      the rich client (getRevenue). All three implement the same contract with date
      range and optional category filtering.
    risk_class: operational
    basis: >
      AdminRequestBD delegates to OPCAdminFacade.getChartInfo with request type "REVENUE",
      start date, end date, and category. ApplRequestProcessor.getChartInfo marshals
      results into XML with revenue amounts and total sales. Rich client HttpPostPetStoreProxy.getRevenue
      sends REVENUE request type with date range and category, receiving revenue amounts.
