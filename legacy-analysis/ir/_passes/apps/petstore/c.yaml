  - record_key: ORDER-REQUIREMENT-0003
    kind: requirement
    capability_key: order-placement
    requirement: >
      The system SHALL calculate the order total as the sum of (unitPrice * quantity) for
      each line item in the cart. Order total is a float calculated before order submission
      and stored in the purchase order record.
    confidence: high
    confidence_basis: >
      OrderEJBAction (lines 122-145) iterates cart items, calculates cost * quantity for each,
      and sums to totalCost. This totalCost is set on purchaseOrder (line 146). Matches cart
      subtotal logic but performed at order time, not cart time.
    risk_class: financial
    basis: >
      OrderEJBAction iterates through cart items, multiplies item.getUnitCost() by item.getQuantity(),
      sums to totalCost float, and sets on purchaseOrder via setTotalPrice().
    traces:
      - path: legacy-source/petstore1.3.2/src/apps/petstore/src/com/sun/j2ee/blueprints/petstore/controller/ejb/actions/OrderEJBAction.java
        line_start: 122
        line_end: 146
        excerpt: |
          int lineItemCount = 0;
          float totalCost = 0;
          ShoppingCartLocal cart = scf.getShoppingCart();
          Locale locale = (Locale)machine.getAttribute(PetstoreKeys.LOCALE);
          purchaseOrder.setLocale(locale);
          Collection items = cart.getItems();
          Iterator it = items.iterator();
          while (it.hasNext()) {
            CartItem item = (CartItem)it.next();
            float cost = new Float(item.getUnitCost()).floatValue();
            totalCost += (cost*item.getQuantity());
            purchaseOrder.addLineItem(new LineItem(item.getCategory(),
                                                   item.getProductId(),
                                                   item.getItemId(),
                                                   (lineItemCount++) + "",
                                                   item.getQuantity(),
                                                   cost));
          }
          purchaseOrder.setTotalPrice(totalCost);

  - record_key: ORDER-REQUIREMENT-0004
