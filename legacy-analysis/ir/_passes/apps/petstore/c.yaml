      primary identifier for the order throughout its lifecycle.
    confidence: high
    confidence_basis: >
      OrderEJBAction (lines 98-110) explicitly calls uidgen.getUniqueId("1001") and stores
      result in orderIdString. This is set on purchaseOrder before submission. No order ID
      modification logic found. Seed "1001" is hard-coded.
    risk_class: operational
    basis: >
      OrderEJBAction retrieves UniqueIdGeneratorLocal via service locator and calls
      getUniqueId("1001"), storing result in orderIdString. This is set as purchaseOrder.setOrderId().
    traces:
      - path: legacy-source/petstore1.3.2/src/apps/petstore/src/com/sun/j2ee/blueprints/petstore/controller/ejb/actions/OrderEJBAction.java
        line_start: 98
        line_end: 116
        excerpt: |
          UniqueIdGeneratorLocal uidgen = null;
          try {
            ServiceLocator sl = new ServiceLocator();
            UniqueIdGeneratorLocalHome home =
              (UniqueIdGeneratorLocalHome)sl.getLocalHome(JNDINames.UIDG_EJBHOME);
