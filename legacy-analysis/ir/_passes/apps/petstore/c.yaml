findings:
  - kind: ambiguity
    path: legacy-source/petstore1.3.2/src/components/creditcard/src/com/sun/j2ee/blueprints/creditcard/ejb/CreditCardEJB.java
    description: >
      CreditCardEJB has hardcoded default expiryYear value of "2010" returned when parsing
      expiryDate fails. This appears to be placeholder test data. Whether this is used in
      production or if card validation occurs elsewhere (in a decorator or validator) is
      unclear from code inspection. The payment-processing capability list mentions
      "card type acceptance rules" but no type validation found.

  - kind: ambiguity
    path: legacy-source/petstore1.3.2/src/apps/petstore/src/docroot/populate/PopulateSQL.xml
    description: >
      The capabilities list mentions "card-expiry-validation" but CreditCardEJB does not
      enforce expiry date format, does not check whether a date is in the past, and does not
      validate the date as reachable. The system stores expiryDate as a string and parses it
      opportunistically; validation rules (if any) are not evident in the Java code examined.

  - kind: unparseable
    path: legacy-source/petstore1.3.2/src/apps/opc/src/com/sun/j2ee/blueprints/opc/ejb/OrderApprovalMDB.java
    description: >
      OrderApprovalMDB references a TransitionDelegate that is loaded dynamically via
      TransitionDelegateFactory (lines 122-125). The actual approval decision logic (what
      criteria determine if an order is APPROVED vs DENIED) is not in OrderApprovalMDB; it
      arrives in the JMS message as a ChangedOrder.getOrderStatus(). The system appears to
      delegate approval decisions to an external system (possibly the admin client), but the
      approval request/response protocol and triggering system are not visible in petstore app code.
