  - record_key: APP-WORKFLOW-0001
    kind: workflow
    capability_key: order-approval
    requirement: >
      GIVEN an order in PENDING state, WHEN an approval message is received containing the
      order ID and new status (APPROVED or DENIED), THEN the system SHALL transition the
      order to the specified status and prevent any further status transitions. WHEN the new
      status is APPROVED, THEN the system SHALL create a supplier purchase order and queue it
      for fulfillment. In both cases (APPROVED or DENIED), the system SHALL queue an approval
      notification for customer relations to send to the customer.
    confidence: high
    confidence_basis: >
      OrderApprovalMDB.onMessage() (lines 146-165) and doWork() (lines 185-228) implement this
      workflow. Line 205 checks "if(!curStatus.equals(OrderStatusNames.PENDING)) continue"
      preventing re-processing. Line 216 calls processManager.updateStatus(). Lines 218-223
      conditionally create supplier PO for APPROVED orders. Lines 212 and 226 add to mail list
      for both outcomes. No automatic approval criteria found; all approvals are external decisions.
    risk_class: operational
    basis: >
      OrderApprovalMDB processes JMS TextMessages containing OrderApproval XML. For each
      ChangedOrder in the message, checks current status is PENDING, updates status via
      ProcessManager, and routes to appropriate queues based on new status.
    traces:
      - path: legacy-source/petstore1.3.2/src/apps/opc/src/com/sun/j2ee/blueprints/opc/ejb/OrderApprovalMDB.java
        line_start: 199
        line_end: 224
        excerpt: |
          while(it!= null && it.hasNext()) {
            ChangedOrder co = (ChangedOrder) it.next();
            // only PENDING orders can be updated
            //if order alreay APPROVED or DENIED or COMPLETED, then order
            //already processed so dont process again
            String curStatus = processManager.getStatus(co.getOrderId());
            if(!curStatus.equals(OrderStatusNames.PENDING)) {
              continue;
            }
            oaMailList.addOrder(co);
            processManager.updateStatus(co.getOrderId(), co.getOrderStatus());
            //for all approved orders, send a PO to supplier
            if(co.getOrderStatus().equals(OrderStatusNames.APPROVED)) {
              po = poHome.findByPrimaryKey(co.getOrderId());
              String xmlPO = getXmlPO(po, supplierOrderXDE);
              supplierPoList.add(xmlPO);
            }
          }

  - record_key: APP-REQUIREMENT-0001
    kind: business-rule
    capability_key: order-approval
    requirement: >
      An order in APPROVED state SHALL remain approved. An order in DENIED state SHALL remain
      denied. An order in COMPLETED state SHALL remain completed. No transition back from these
      terminal states to PENDING is allowed, and no status change is permitted for any order
      not in PENDING state.
    confidence: high
    confidence_basis: >
      OrderApprovalMDB (lines 204-207) implements this as a guard: any order not in PENDING
      state is skipped (continue) without updating. OrderStatusNames defines states but no
      transition table; the guard check is the enforcement mechanism. No documented way to
      override or re-open an order.
    risk_class: operational
    basis: >
      OrderApprovalMDB explicitly checks processManager.getStatus(orderId) and only processes
      if status equals PENDING. Implicitly, APPROVED/DENIED/COMPLETED are terminal states.
    traces:
      - path: legacy-source/petstore1.3.2/src/apps/opc/src/com/sun/j2ee/blueprints/opc/ejb/OrderApprovalMDB.java
        line_start: 199
        line_end: 207
        excerpt: |
          while(it!= null && it.hasNext()) {
            ChangedOrder co = (ChangedOrder) it.next();
            // only PENDING orders can be updated
            //if order alreay APPROVED or DENIED or COMPLETED, then order
            //already processed so dont process again
            String curStatus = processManager.getStatus(co.getOrderId());
            if(!curStatus.equals(OrderStatusNames.PENDING)) {
              continue;
            }

  - record_key: NOTIF-REQUIREMENT-0001
    kind: requirement
    capability_key: notifications
    requirement: >
      The system SHALL notify the customer by email when an order is approved or denied.
      Notifications are batched and sent asynchronously via the customer relations department
      mail queue. Each order approval/denial generates one notification message queued for
      delivery.
    confidence: medium
    confidence_basis: >
      OrderApprovalMDB (lines 237-240) calls doTransition with xmlMailOrderApprovals.
      OrderApprovalTD.sendMail() (lines 116-118) sends to mailQueue. OrderApprovalMDB adds
      all processed orders (both approved and denied) to oaMailList (line 212). No explicit
      guarantee of delivery or retry logic found in code; notification is JMS-based.
    risk_class: operational
    basis: >
      OrderApprovalMDB.doWork() creates an OrderApproval XML with all processed orders
      (line 194) and adds each (approved or denied) via oaMailList.addOrder(co) (line 212).
      This is passed to doTransition() which sends to customer relations queue via OrderApprovalTD.
    traces:
      - path: legacy-source/petstore1.3.2/src/apps/opc/src/com/sun/j2ee/blueprints/opc/ejb/OrderApprovalMDB.java
        line_start: 185
        line_end: 227
        excerpt: |
          OrderApproval oaMailList = new OrderApproval();
          String xmlMailOrderApprovals = null;
          Collection coll = approval.getOrdersList();
          Iterator it = coll.iterator();

          while(it!= null && it.hasNext()) {
            ChangedOrder co = (ChangedOrder) it.next();
            String curStatus = processManager.getStatus(co.getOrderId());
            if(!curStatus.equals(OrderStatusNames.PENDING)) {
              continue;
            }
            oaMailList.addOrder(co);
            processManager.updateStatus(co.getOrderId(), co.getOrderStatus());
            if(co.getOrderStatus().equals(OrderStatusNames.APPROVED)) {
              po = poHome.findByPrimaryKey(co.getOrderId());
              String xmlPO = getXmlPO(po, supplierOrderXDE);
              supplierPoList.add(xmlPO);
            }
          }

  - record_key: NOTIF-REQUIREMENT-0002
    kind: requirement
    capability_key: notifications
    requirement: >
      The system SHALL send a notification to customers when their order is placed, containing
      the order ID and customer email address. Order placement notifications are sent asynchronously
      via the AsyncSender component before the order confirmation response is returned.
    confidence: medium
    confidence_basis: >
      OrderEJBAction (lines 147-164) calls AsyncSender.sendAMessage(purchaseOrder.toXML())
      after creating the order but before emptying the cart. Exception handling shows errors
