records:
  - record_key: CAT-ENTITY-0001
    kind: entity
    capability_key: catalog-browsing
    requirement: >
      The system SHALL maintain a catalog entity model with categories, products, and items,
      where each item belongs to exactly one product, and each product belongs to exactly one
      category. The primary identifier for an item is itemid (char(10), NOT NULL, PRIMARY KEY).
    confidence: high
    confidence_basis: >
      Both DDL schema (PopulateSQL.xml lines 125-140, 254-268) and SQL queries (CatalogDAOSQL.xml)
      enforce this constraint via foreign keys and primary keys. The relationship is consistently
      enforced across two database dialects (Cloudscape and Oracle).
    risk_class: operational
    basis: >
      PopulateSQL.xml defines item table with primary key (itemid) and foreign key constraint
      fk_item_1 referencing product(productid). Item_details table extends item with locale-specific
      pricing and description (lines 146-161).
    traces:
      - path: legacy-source/petstore1.3.2/src/apps/petstore/src/docroot/populate/PopulateSQL.xml
        line_start: 125
        line_end: 140
        excerpt: |
          create table item (
            itemid char(10) not null,
            productid char(10) not null,
            constraint pk_item primary key (itemid),
              constraint fk_item_1 foreign key (productid)
              references product (productid)
          )

  - record_key: CAT-ENTITY-0002
    kind: entity
    capability_key: catalog-browsing
    requirement: >
      The system SHALL maintain item_details records with mandatory fields listprice and
      unitcost (both DECIMAL(10,2), NOT NULL). Each item_details record maps exactly one
      item to one locale, with composite primary key (itemid, locale).
    confidence: high
    confidence_basis: >
      DDL explicitly declares NOT NULL constraints and composite primary key. Used consistently
      in SQL queries for catalog retrieval (CatalogDAOSQL.xml). Two dialects match exactly on
      this constraint.
    risk_class: financial
    basis: >
      PopulateSQL.xml item_details table (lines 146-161) declares listprice and unitcost as
      NOT NULL DECIMAL(10,2). These are the canonical price fields used in cart calculations.
    traces:
      - path: legacy-source/petstore1.3.2/src/apps/petstore/src/docroot/populate/PopulateSQL.xml
        line_start: 146
        line_end: 161
        excerpt: |
          create table item_details (
            itemid char(10) not null,
            listprice decimal(10,2) not null,
            unitcost decimal(10,2) not null,
            locale char(10) not null,
            image char(255) not null,
            descn varchar(255) not null,
            attr1 varchar(80) null,
            attr2 varchar(80) null,
            attr3 varchar(80) null,
            attr4 varchar(80) null,
            attr5 varchar(80) null,
            constraint pk_item_details primary key (itemid, locale),
                constraint fk_item_details_1 foreign key (itemid)
                references item (itemid)
          )

  - record_key: CAT-ENTITY-0003
    kind: entity
    capability_key: internationalization
    requirement: >
      The system SHALL support multi-locale product information, with each product, category,
      and item maintaining locale-specific name, description, and image fields. Locales are
      stored as char(10) values (e.g. en_US, ja_JP, zh_CN). Locale is part of the primary
      key for *_details tables.
    confidence: high
    confidence_basis: >
      DDL declares locale as composite primary key on category_details (line 69), product_details
      (line 110), and item_details (line 158). Catalog queries (CatalogDAOSQL.xml) filter
      consistently by locale parameter. Frontend specifies en_US, ja_JP, zh_CN (web.xml line 110).
    risk_class: operational
    basis: >
      PopulateSQL.xml defines three *_details tables, each with (id, locale) composite primary key
      and NOT NULL locale field. CatalogDAOSQL.xml all queries include "where locale = ?" parameter.
      Web.xml TemplateServlet configures supported locales.
    traces:
      - path: legacy-source/petstore1.3.2/src/apps/petstore/src/docroot/populate/PopulateSQL.xml
        line_start: 66
        line_end: 72
        excerpt: |
          create table category_details (catid char(10) not null,
            name varchar(80) not null, image varchar(255) null,
            descn varchar(255) null, locale char(10) not null,
            constraint pk_category_details primary key (catid, locale),
              constraint fk_category_details_1 foreign key (catid)
              references category (catid))
      - path: legacy-source/petstore1.3.2/src/apps/petstore/src/docroot/WEB-INF/web.xml
        line_start: 109
        line_end: 115
        excerpt: |
          <init-param>
            <param-name>locales</param-name>
            <param-value>en_US,ja_JP,zh_CN</param-value>
          </init-param>

  - record_key: CAT-REQUIREMENT-0001
    kind: requirement
    capability_key: catalog-browsing
    requirement: >
      The system SHALL support search across item catalog by name, category ID, and description,
      allowing partial string matching on any of these fields (case-insensitive). Search terms
      may be combined with OR logic across multiple items.
    confidence: medium
    confidence_basis: >
      CatalogDAOSQL.xml defines SEARCH_ITEMS statement with variable-occurrence SQLFragments
      (lines 112-127) building dynamic OR clauses. However, searchability across attribute
      fields (attr1-attr5) is present in schema but not demonstrated in the SQL. No declarative
      search configuration file found to confirm this is the only search scope.
    risk_class: presentational
    basis: >
      CatalogDAOSQL.xml SEARCH_ITEMS method (lines 112-127) builds parameterized queries with
      "lower(name) like ?" and "lower(catid) like ?" and "lower(b.descn) like ?" with
      VARIABLE occurrence fragments for dynamic OR chains.
    traces:
      - path: legacy-source/petstore1.3.2/src/apps/petstore/src/docroot/CatalogDAOSQL.xml
        line_start: 112
        line_end: 127
        excerpt: |
          <SQLStatement method="SEARCH_ITEMS">
            <SQLFragment parameterNb="4">
              select catid, a.productid, name, a.itemid, b.image, b.descn, attr1,
                      attr2, attr3, attr4, attr5, listprice, unitcost
                  from (((item a join item_details b on a.itemid=b.itemid)
                      join product_details c on a.productid=c.productid)
                      join product d on d.productid=c.productid and b.locale = c.locale)
                  where b.locale = ? and ((lower(name) like ? or lower(catid) like ? or lower(b.descn) like ?)
            </SQLFragment>
            <SQLFragment parameterNb="3" occurrence="VARIABLE">
              or (lower(name) like ? or lower(catid) like ? or lower(b.descn) like ?)
            </SQLFragment>

  - record_key: CART-REQUIREMENT-0001
    kind: requirement
    capability_key: shopping-cart
    requirement: >
      The system SHALL allow a customer to add items to their shopping cart, specifying a
      quantity for each item (minimum quantity is 1). A single item ID may appear in the cart
      once, with quantity representing the number of that item ordered.
    confidence: high
    confidence_basis: >
      ShoppingCartLocalEJB.addItem methods (lines 111-117) accept itemID and optional qty
      parameter, storing in HashMap. updateItemQuantity (line 123-127) validates newQty > 0
      and removes item if qty <= 0. No upper limit on quantity found in code.
    risk_class: operational
    basis: >
      ShoppingCartLocalEJB implements addItem(itemID) and addItem(itemID, qty), plus
      updateItemQuantity(itemID, newQty) with guard "if (newQty > 0)". Cart stored in HashMap
      with itemID as key and Integer qty as value.
    traces:
      - path: legacy-source/petstore1.3.2/src/components/cart/src/com/sun/j2ee/blueprints/cart/ejb/ShoppingCartLocalEJB.java
        line_start: 111
        line_end: 127
        excerpt: |
          public void addItem (String itemID) {
              cart.put(itemID, new Integer(1));
          }
          public void addItem (String itemID,int qty) {
              cart.put(itemID, new Integer(qty));
          }
          public void updateItemQuantity (String itemID, int newQty) {
              cart.remove(itemID);
              if (newQty > 0) cart.put(itemID, new Integer(newQty));
          }

  - record_key: CART-REQUIREMENT-0002
    kind: requirement
    capability_key: shopping-cart
    requirement: >
      The system SHALL calculate the shopping cart subtotal as the sum of (unitCost * quantity)
      for all items in the cart. Cart subtotal is stored as a Double and includes all items
      currently in the cart.
    confidence: high
    confidence_basis: >
      ShoppingCartLocalEJB.getSubTotal() (lines 133-144) iterates items and sums
      (i.getUnitCost() * i.getQuantity()). This logic is used to display cart totals in cart.jsp
      (line 97). The calculation is straightforward without surcharges or discounts.
    risk_class: financial
    basis: >
      ShoppingCartLocalEJB.getSubTotal() method retrieves all cart items, iterates them,
      multiplies unitCost by quantity, and sums to double. cart.jsp displays this as currency.
    traces:
      - path: legacy-source/petstore1.3.2/src/components/cart/src/com/sun/j2ee/blueprints/cart/ejb/ShoppingCartLocalEJB.java
        line_start: 133
        line_end: 144
        excerpt: |
          public Double getSubTotal() {
              Collection items = getItems();
              if (items == null) return null;
              double ret = 0.0d;
              for (Iterator it =items.iterator(); it.hasNext(); ) {
                  CartItem i = (CartItem) it.next();
                  ret += (i.getUnitCost() * i.getQuantity()) ;
              }
              return new Double(ret);
          }

  - record_key: CART-REQUIREMENT-0003
    kind: requirement
    capability_key: shopping-cart
    requirement: >
      The system SHALL allow a customer to remove an item from the shopping cart entirely.
      Removing an item removes it from the customer's current cart and makes it unavailable
      for purchase in that transaction.
    confidence: high
    confidence_basis: >
      ShoppingCartLocalEJB.deleteItem() (line 119) removes item from HashMap. cart.jsp
      provides a "Remove" link (line 75-77) for each cart item. No soft-delete or archive
      logic found; removal is immediate.
    risk_class: operational
    basis: >
      ShoppingCartLocalEJB exposes deleteItem(itemID) which calls cart.remove(). cart.jsp
      provides user-facing "Remove" link per line item.
    traces:
      - path: legacy-source/petstore1.3.2/src/components/cart/src/com/sun/j2ee/blueprints/cart/ejb/ShoppingCartLocalEJB.java
        line_start: 119
        line_end: 121
        excerpt: |
          public void deleteItem (String itemID) {
              cart.remove(itemID);
          }

  - record_key: ORDER-REQUIREMENT-0001
    kind: requirement
    capability_key: order-placement
    requirement: >
      The system SHALL require that a shopping cart contain at least one item before an order
      can be placed. An order attempt with an empty cart SHALL result in a ShoppingCartEmptyOrderException
      being thrown.
    confidence: high
    confidence_basis: >
      OrderEJBAction.perform() (line 130-132) explicitly checks items.size() == 0 and throws
      ShoppingCartEmptyOrderException. Exception is declared in mappings.xml (line 110) and
      has its own error screen. No documented way to bypass this check.
    risk_class: operational
    basis: >
      OrderEJBAction checks cart size before order creation: "if (items.size() == 0) {
      throw new ShoppingCartEmptyOrderException(...)". mappings.xml maps this exception
      to cart_empty_order_error.screen.
    traces:
      - path: legacy-source/petstore1.3.2/src/apps/petstore/src/com/sun/j2ee/blueprints/petstore/controller/ejb/actions/OrderEJBAction.java
        line_start: 128
        line_end: 132
        excerpt: |
          // if the cart is empty throw an exception saying so
          if (items.size() == 0) {
            throw new ShoppingCartEmptyOrderException("Shopping cart is empty");
          }

  - record_key: ORDER-REQUIREMENT-0002
