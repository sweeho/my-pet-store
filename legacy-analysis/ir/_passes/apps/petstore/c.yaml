  - record_key: PAY-ENTITY-0001
    kind: entity
    capability_key: payment-processing
    requirement: >
      The system SHALL store credit card information with fields cardNumber (String),
      cardType (String), and expiryDate (String). The expiryDate field is stored as a
      slash-separated string in MM/YYYY format.
    confidence: medium
    confidence_basis: >
      CreditCardEJB (lines 50-58) defines getter/setter for cardNumber, cardType, expiryDate.
      getExpiryMonth() and getExpiryYear() (lines 88-107) parse expiryDate by finding "/" delimiter.
      No validation or format enforcement found in Java code; format is inferred from parsing logic.
    risk_class: financial
    basis: >
      CreditCardEJB declares three abstract properties: cardNumber, cardType, expiryDate.
      getExpiryMonth() searches for "/" and returns text before it; getExpiryYear() returns
      text after it. Default month "01" and year "2010" returned if "/" not found.
    traces:
      - path: legacy-source/petstore1.3.2/src/components/creditcard/src/com/sun/j2ee/blueprints/creditcard/ejb/CreditCardEJB.java
        line_start: 50
        line_end: 58
        excerpt: |
          public abstract String getCardNumber();
          public abstract void setCardNumber(String cardNumber);

          public abstract String getCardType();
          public abstract void setCardType(String cardType);

          public abstract String getExpiryDate();
          public abstract void setExpiryDate(String expiryDate);
      - path: legacy-source/petstore1.3.2/src/components/creditcard/src/com/sun/j2ee/blueprints/creditcard/ejb/CreditCardEJB.java
        line_start: 88
        line_end: 107
        excerpt: |
          public String getExpiryMonth() {
            String dateString = getExpiryDate();
            if (dateString != null) {
              int slashStart = dateString.indexOf("/");
              if (slashStart != -1) return dateString.substring(0,slashStart);
            }
            return "01";
          }

          public String getExpiryYear() {
            String dateString = getExpiryDate();
            if (dateString != null) {
              int slashStart = dateString.indexOf("/");
              if (slashStart != -1) return dateString.substring(slashStart +1, dateString.length());
            }
            return "2010";
          }

  - record_key: ORDER-REQUIREMENT-0005
    kind: requirement
    capability_key: order-placement
