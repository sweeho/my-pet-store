  - record_key: ORDER-PLACEMENT-RULE-0001
    kind: business-rule
    capability_key: order-placement
    requirement: >
      The system SHALL NOT allow order placement when the shopping cart is empty; instead,
      it SHALL throw a ShoppingCartEmptyOrderException.
    confidence: high
    confidence_basis: >
      Rule is explicitly enforced in code with dedicated exception type. The check is immediate
      and unambiguous. Exception is mapped to cart_empty_order_error.screen for user feedback.
    risk_class: operational
    basis: >
      OrderEJBAction.java lines 130-132 check cart.getItems().size() and throw
      ShoppingCartEmptyOrderException. This is mapped in mappings.xml line 110 to
      cart_empty_order_error.screen error screen.
    traces:
      - path: legacy-source/petstore1.3.2/src/apps/petstore/src/com/sun/j2ee/blueprints/petstore/controller/ejb/actions/OrderEJBAction.java
        line_start: 128
        line_end: 132
        excerpt: |
