  - record_key: WORKFLOW-ORDER-0001
    kind: workflow
    capability_key: order-placement
    requirement: >
      The order placement workflow SHALL follow this sequence:
      GIVEN a customer with items in their shopping cart and a valid account,
      WHEN the customer submits order information with billing, shipping, and payment details,
      THEN the system SHALL generate a unique order ID, create a PurchaseOrder object,
      capture all order details, send the order asynchronously for processing,
      empty the cart, and return order confirmation with the order ID and email address.
    confidence: medium
    confidence_basis: >
      Workflow is derived from OrderEJBAction implementation which shows all steps explicitly.
      However, async order processing details (queue name, retry logic, failure handling) are
      not visible in the petstore module alone, so confidence is medium rather than high.
      The workflow is complete within the module scope.
    risk_class: operational
    basis: >
      OrderEJBAction.java lines 90-170 show the complete workflow: create PurchaseOrder,
      get unique ID from uidgen, populate with order details, send via AsyncSender,
      empty cart, return OrderEventResponse. Line 168 shows the response with order ID
      and email confirmation.
    traces:
      - path: legacy-source/petstore1.3.2/src/apps/petstore/src/com/sun/j2ee/blueprints/petstore/controller/ejb/actions/OrderEJBAction.java
        line_start: 88
        line_end: 170
        excerpt: |
          public EventResponse perform(Event e) throws EventException {
            OrderEvent oe = (OrderEvent)e;
            PurchaseOrder purchaseOrder = new PurchaseOrder();
            ContactInfo billTo = oe.getBillTo();
            ContactInfo shipTo = oe.getShipTo();
            CreditCard creditCard = oe.getCreditCard();
            String orderIdString = null;

            // get the UniqueIdGenerator EJB
            UniqueIdGeneratorLocal uidgen = null;
            try {
              ServiceLocator sl = new ServiceLocator();
              UniqueIdGeneratorLocalHome home =
                (UniqueIdGeneratorLocalHome)sl.getLocalHome(JNDINames.UIDG_EJBHOME);
              uidgen = home.create();
            } catch (javax.ejb.CreateException cx) {
              cx.printStackTrace();
            } catch (ServiceLocatorException slx) {
              slx.printStackTrace();
            }
            orderIdString = uidgen.getUniqueId("1001");
            // get ther userId
            ShoppingClientFacadeLocal scf = null;
            scf = (ShoppingClientFacadeLocal)machine.getAttribute(PetstoreKeys.SHOPPING_CLIENT_FACADE);
            String userId = scf.getUserId();
            purchaseOrder.setOrderId(orderIdString);
            purchaseOrder.setUserId(userId);
            purchaseOrder.setEmailId(billTo.getEmail());
            purchaseOrder.setOrderDate(new Date());
            purchaseOrder.setShippingInfo(shipTo);
            purchaseOrder.setBillingInfo(billTo);
            purchaseOrder.setCreditCard(creditCard);
    stack_metadata:
      ejb.bean: ShoppingControllerEJB
      framework: J2EE

