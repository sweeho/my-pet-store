  - record_key: SHOPPING-CART-RULE-0001
    kind: business-rule
    capability_key: shopping-cart
    requirement: >
      The system SHALL calculate the total cost of items in the shopping cart by summing
      the product of unit cost and quantity for each line item.
    confidence: high
    confidence_basis: >
      Business logic is explicit and unambiguous in OrderEJBAction where total cost is calculated
      during order placement. The calculation is straightforward arithmetic with no edge cases
      or conditions discovered in the source.
    risk_class: financial
    basis: >
      OrderEJBAction.java lines 137-138 show the cost calculation: cost is retrieved per item,
      multiplied by quantity, and accumulated into totalCost. OrderEJBAction line 146 sets
      the totalCost on the PurchaseOrder object.
    traces:
      - path: legacy-source/petstore1.3.2/src/apps/petstore/src/com/sun/j2ee/blueprints/petstore/controller/ejb/actions/OrderEJBAction.java
        line_start: 134
        line_end: 146
        excerpt: |
          Iterator it = items.iterator();
          while (it.hasNext()) {
            CartItem item = (CartItem)it.next();
            float cost = new Float(item.getUnitCost()).floatValue();
            totalCost += (cost*item.getQuantity());
            purchaseOrder.addLineItem(new LineItem(item.getCategory(),
                                                   item.getProductId(),
                                                   item.getItemId(),
                                                   (lineItemCount++) + "",
                                                   item.getQuantity(),
                                                   cost));
          }
          purchaseOrder.setTotalPrice(totalCost);
    stack_metadata:
      ejb.bean: ShoppingControllerEJB
      ejb.transaction: Required

