records:
  # ===== CATALOG BROWSING & SEARCH =====
  - record_key: catalog-browsing-entity-001
    kind: entity
    capability_key: catalog-browsing
    requirement: >
      The system SHALL maintain a structured product catalog organized by categories,
      products, and items, where each level supports multi-locale descriptive metadata.
    confidence: high
    confidence_basis: >
      DDL schema explicitly defines category, category_details (localized),
      product, product_details (localized), item, and item_details (localized) tables.
      Foreign key constraints enforce the hierarchy.
    risk_class: operational
    basis: >
      PopulateSQL.xml defines the catalog schema with foreign keys linking
      category → product → item, and _details tables with locale as a key component.
    traces:
      - path: legacy-source/petstore1.3.2/src/apps/petstore/src/docroot/populate/PopulateSQL.xml
        line_start: 46
        line_end: 171
        excerpt: |
          <TableStatements table="category">
            <CreateStatement>
              create table category (catid char(10) not null,
                constraint pk_category primary key (catid))
            </CreateStatement>
          </TableStatements>
          <TableStatements table="category_details">
            <CreateStatement>
              create table category_details (catid char(10) not null,
                name varchar(80) not null, image varchar(255) null,
                descn varchar(255) null, locale char(10) not null,
                constraint pk_category_details primary key (catid, locale))
            </CreateStatement>
          </TableStatements>

  - record_key: catalog-browsing-req-002
    kind: requirement
    capability_key: catalog-browsing
    requirement: >
      Items SHALL maintain dual pricing: listprice and unitcost, both as decimal(10,2),
      with locale-specific details including image, description, and five custom attributes.
    confidence: high
    confidence_basis: >
      Item_details schema explicitly declares listprice, unitcost, image, descn,
      and attr1-attr5 fields, with locale as part of the composite key.
    risk_class: financial
    basis: >
      The schema enforces a localized item model with both pricing tiers and
      flexible attributes for product variations across languages.
    traces:
      - path: legacy-source/petstore1.3.2/src/apps/petstore/src/docroot/populate/PopulateSQL.xml
        line_start: 141
        line_end: 171
        excerpt: |
          <TableStatements table="item_details">
            <CreateStatement>
              create table item_details (
                itemid char(10) not null,
                listprice decimal(10,2) not null,
                unitcost decimal(10,2) not null,
                locale char(10) not null,
                image char(255) not null,
                descn varchar(255) not null,
                attr1 varchar(80) null,
                attr2 varchar(80) null,
                attr3 varchar(80) null,
                attr4 varchar(80) null,
                attr5 varchar(80) null,
                constraint pk_item_details primary key (itemid, locale)
              )
            </CreateStatement>
          </TableStatements>

  # ===== SHOPPING CART MANAGEMENT =====
  - record_key: shopping-cart-workflow-001
    kind: workflow
    capability_key: shopping-cart
    requirement: >
      The system SHALL support shopping cart operations: ADD_ITEM to add an item,
      DELETE_ITEM to remove an item, and UPDATE_ITEMS to modify quantities of items.
    confidence: high
    confidence_basis: >
      CartEJBAction.perform() method explicitly handles three action types via
      a switch statement with no conditional dependencies, confirming all three
      operations are available and implemented.
    risk_class: operational
    basis: >
      The CartEJBAction class receives CartEvent with action types and delegates
      to the ShoppingCartLocal EJB for addItem, deleteItem, and updateItemQuantity.
    traces:
      - path: legacy-source/petstore1.3.2/src/apps/petstore/src/com/sun/j2ee/blueprints/petstore/controller/ejb/actions/CartEJBAction.java
        line_start: 57
        line_end: 92
        excerpt: |
          switch (ce.getActionType()) {
              case  CartEvent.ADD_ITEM  : {
                  cart.addItem(ce.getItemId());
              }
              break;
              case  CartEvent.DELETE_ITEM : {
                  cart.deleteItem(ce.getItemId());
              }
              break;
              case  CartEvent.UPDATE_ITEMS : {
                  Map items = ce.getItems();
                  Iterator it = null;
                  if (items != null) it = items.keySet().iterator();
                  while ((it != null) && it.hasNext()) {
                      String itemId = (String)it.next();
                      int quantity = ((Integer)items.get(itemId)).intValue();
                      cart.updateItemQuantity(itemId, quantity);
                  }
              }
              break;
          }

  - record_key: shopping-cart-req-003
    kind: requirement
    capability_key: shopping-cart
    requirement: >
      The shopping cart SHALL calculate a subtotal by displaying cart items with
      their unit costs and quantities, allowing the customer to update quantities
      and remove items before proceeding to checkout.
    confidence: high
    confidence_basis: >
      Cart.jsp explicitly iterates over cart.items, shows item quantity and unitCost,
      provides an input field for quantity updates, and displays the cart.subTotal.
    risk_class: operational
    basis: >
      The cart display template shows each item with quantity, unit cost, update form,
      and an "Update Cart" button, plus a line for total calculation.
    traces:
      - path: legacy-source/petstore1.3.2/src/apps/petstore/src/docroot/cart.jsp
        line_start: 42
        line_end: 100
        excerpt: |
          <c:forEach var="item" items="${cart.items}" >
          <tr>
           <td width="50%" class="petstore_listing">
            <a href='...'>
             <c:out value="${item.attribute}" />
             <c:out value="${item.name}" />
            </a>
           </td>
           <td class="petstore_listing">
            <a href='<c:out value="${removeURL}"/>'>Remove</a>
           </td>
           <td class="petstore_listing" align="right">
            <waf:input type="text" maxlength="10" size="3">
            <waf:name>itemQuantity_<c:out value="${item.itemId}"/></waf:name>
            <waf:value><c:out value="${item.quantity}" /></waf:value></waf:input>
           </td>
           <td class="petstore_listing" align="right"> @
            <fmt:formatNumber value="${item.unitCost}" type="currency" />
           </td>
          </tr>
          </c:forEach>

  # ===== ACCOUNT MANAGEMENT =====
  - record_key: account-management-entity-001
    kind: entity
    capability_key: account-management
    requirement: >
      The system SHALL maintain customer account data with contact information
      (name, email, phone), address (street, city, state, postal code, country),
      and credit card details (number, type, expiry date).
    confidence: high
    confidence_basis: >
      CustomerEJBAction.updateCustomer() method demonstrates deep copies of
      ContactInfo, Address, CreditCard, and ProfileInfo data from events to EJBs.
      Code explicitly sets all fields.
    risk_class: operational
    basis: >
      The updateCustomer method shows the complete account structure through
      setter calls on ContactInfoLocal, AddressLocal, CreditCardLocal, and ProfileLocal.
    traces:
      - path: legacy-source/petstore1.3.2/src/apps/petstore/src/com/sun/j2ee/blueprints/petstore/controller/ejb/actions/CustomerEJBAction.java
        line_start: 101
        line_end: 145
        excerpt: |
          ContactInfoLocal contactInfoLocal = account.getContactInfo();
          ContactInfo contactInfo = ce.getContactInfo();
          contactInfoLocal.setFamilyName(contactInfo.getFamilyName());
          contactInfoLocal.setGivenName(contactInfo.getGivenName());
          contactInfoLocal.setTelephone(contactInfo.getPhone());
          contactInfoLocal.setEmail(contactInfo.getEmail());
          Address address = contactInfo.getAddress();
          AddressLocal addressLocal = contactInfoLocal.getAddress();
          addressLocal.setStreetName1(address.getStreetName1());
          addressLocal.setStreetName2(address.getStreetName2());
          addressLocal.setCity(address.getCity());
          addressLocal.setZipCode(address.getZipCode());
          addressLocal.setState(address.getState());
          addressLocal.setCountry(address.getCountry());
          CreditCard creditCard = ce.getCreditCard();
          CreditCardLocal creditCardLocal = account.getCreditCard();
          creditCardLocal.setCardNumber(creditCard.getCardNumber());
          creditCardLocal.setCardType(creditCard.getCardType());
          creditCardLocal.setExpiryDate(creditCard.getExpiryDate());

  - record_key: account-management-req-002
    kind: requirement
    capability_key: account-management
    requirement: >
      Customer account SHALL include a profile with preferred language, favorite category,
      my list preference, and banner preference settings.
    confidence: high
    confidence_basis: >
      CustomerEJBAction.updateCustomer() explicitly sets these four profile properties
      via setPreferredLanguage, setFavoriteCategory, setMyListPreference, setBannerPreference.
    risk_class: operational
    basis: >
      Profile data is deep-copied and stored within the customer entity, with
      preferred language affecting the current locale.
    traces:
      - path: legacy-source/petstore1.3.2/src/apps/petstore/src/com/sun/j2ee/blueprints/petstore/controller/ejb/actions/CustomerEJBAction.java
        line_start: 135
        line_end: 144
        excerpt: |
          ProfileInfo profileInfo = ce.getProfileInfo();
          ProfileLocal profileLocal = customer.getProfile();
          profileLocal.setPreferredLanguage(profileInfo.getPreferredLanguage());
          profileLocal.setFavoriteCategory(profileInfo.getFavoriteCategory());
          profileLocal.setMyListPreference(profileInfo.getMyListPreference());
          profileLocal.setBannerPreference(profileInfo.getBannerPreference());
          Locale locale = I18nUtil.getLocaleFromString(profileInfo.getPreferredLanguage());
          machine.setAttribute("locale", locale);

  # ===== USER AUTHENTICATION & AUTHORIZATION =====
