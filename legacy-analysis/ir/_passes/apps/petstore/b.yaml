    capability_key: user-authentication
    requirement: >
      The system SHALL enforce a sign-on workflow requiring username and password
      for protected resources: customer.screen, customer.do, enter_order_information.screen,
      and signon_welcome.screen.
    confidence: high
    confidence_basis: >
      signon-config.xml declares four security-constraint blocks with web-resource-collection
      entries, each specifying a URL pattern requiring authentication.
    risk_class: regulated
    basis: >
      The framework defines protected resources at deployment time with form-based
      sign-on configured to use signon.screen for login and signon_error.screen for failures.
    traces:
      - path: legacy-source/petstore1.3.2/src/apps/petstore/src/docroot/WEB-INF/signon-config.xml
        line_start: 38
        line_end: 81
        excerpt: |
          <signon-form-login-page>
           signon.screen
          </signon-form-login-page>
          <signon-form-error-page>
           signon_error.screen
          </signon-form-error-page>
