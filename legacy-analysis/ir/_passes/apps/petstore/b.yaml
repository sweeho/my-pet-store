  # ===== ORDER PLACEMENT & CHECKOUT =====
  - record_key: order-placement-workflow-001
    kind: workflow
    capability_key: order-placement
    requirement: >
      The system SHALL execute an order placement workflow that collects billing
      information, shipping information, and credit card details, then creates
      a purchase order and clears the shopping cart.
    confidence: high
    confidence_basis: >
      The enter_order_information.jsp renders two address sections (billing and shipping)
      with matching fields, and OrderEJBAction.perform() creates a PurchaseOrder with
      both addresses and credit card, then empties the cart.
    risk_class: financial
    basis: >
      OrderEJBAction constructs a PurchaseOrder with setBillingInfo, setShippingInfo,
      and setCreditCard, then calls cart.empty() after order submission.
    traces:
      - path: legacy-source/petstore1.3.2/src/apps/petstore/src/com/sun/j2ee/blueprints/petstore/controller/ejb/actions/OrderEJBAction.java
        line_start: 88
        line_end: 169
        excerpt: |
          PurchaseOrder purchaseOrder = new PurchaseOrder();
          ContactInfo billTo = oe.getBillTo();
          ContactInfo shipTo = oe.getShipTo();
          CreditCard creditCard = oe.getCreditCard();
          ...
          purchaseOrder.setOrderId(orderIdString);
          purchaseOrder.setUserId(userId);
          purchaseOrder.setEmailId(billTo.getEmail());
          purchaseOrder.setOrderDate(new Date());
          purchaseOrder.setShippingInfo(shipTo);
          purchaseOrder.setBillingInfo(billTo);
          purchaseOrder.setCreditCard(creditCard);
          ...
          cart.empty();
          return new OrderEventResponse(billTo.getEmail(), orderIdString);

  - record_key: order-placement-req-002
    kind: requirement
    capability_key: order-placement
    requirement: >
      The system SHALL reject order placement if the shopping cart is empty,
      raising a ShoppingCartEmptyOrderException.
    confidence: high
    confidence_basis: >
      OrderEJBAction explicitly checks items.size() == 0 and throws
      ShoppingCartEmptyOrderException with message "Shopping cart is empty".
    risk_class: operational
    basis: >
      This validation occurs before line item processing, preventing invalid orders.
    traces:
      - path: legacy-source/petstore1.3.2/src/apps/petstore/src/com/sun/j2ee/blueprints/petstore/controller/ejb/actions/OrderEJBAction.java
        line_start: 128
        line_end: 132
        excerpt: |
          Collection items = cart.getItems();
          if (items.size() == 0) {
            throw new ShoppingCartEmptyOrderException("Shopping cart is empty");
