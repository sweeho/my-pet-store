  - record_key: order-placement-req-004
    kind: requirement
    capability_key: order-placement
    requirement: >
      Each order line item SHALL store the category, product ID, item ID, line number,
      quantity, and unit cost, with line item cost calculated as unit cost multiplied
      by quantity.
    confidence: high
    confidence_basis: >
      OrderEJBAction iterates cart items and creates LineItem with all specified fields.
      The code multiplies cost * quantity: totalCost += (cost*item.getQuantity()).
    risk_class: financial
    basis: >
      Line items are constructed from cart items with explicit cost calculation.
    traces:
      - path: legacy-source/petstore1.3.2/src/apps/petstore/src/com/sun/j2ee/blueprints/petstore/controller/ejb/actions/OrderEJBAction.java
        line_start: 133
        line_end: 146
        excerpt: |
          Iterator it = items.iterator();
          while (it.hasNext()) {
            CartItem item = (CartItem)it.next();
            float cost = new Float(item.getUnitCost()).floatValue();
            totalCost += (cost*item.getQuantity());
            purchaseOrder.addLineItem(new LineItem(item.getCategory(),
                                                   item.getProductId(),
                                                   item.getItemId(),
                                                   (lineItemCount++) + "",
                                                   item.getQuantity(),
                                                   cost));
          }
          purchaseOrder.setTotalPrice(totalCost);

