  - record_key: order-placement-req-003
    kind: requirement
    capability_key: order-placement
    requirement: >
      The order SHALL be assigned a unique order ID via the UniqueIdGenerator EJB
      with seed value "1001", and include the current date as the order date.
    confidence: high
    confidence_basis: >
      OrderEJBAction calls uidgen.getUniqueId("1001") and purchaseOrder.setOrderDate(new Date()).
    risk_class: operational
    basis: >
      The order receives a deterministic unique ID and a timestamp reflecting order creation.
    traces:
      - path: legacy-source/petstore1.3.2/src/apps/petstore/src/com/sun/j2ee/blueprints/petstore/controller/ejb/actions/OrderEJBAction.java
        line_start: 99
        line_end: 118
        excerpt: |
          UniqueIdGeneratorLocal uidgen = null;
          try {
            ServiceLocator sl = new ServiceLocator();
            UniqueIdGeneratorLocalHome home =
              (UniqueIdGeneratorLocalHome)sl.getLocalHome(JNDINames.UIDG_EJBHOME);
            uidgen = home.create();
          } catch (javax.ejb.CreateException cx) {
            cx.printStackTrace();
          }
