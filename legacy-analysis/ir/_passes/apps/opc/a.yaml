    kind: workflow
    capability_key: order-approval
    requirement: >
      The system SHALL implement a multi-stage order fulfillment workflow with the following states:
      PENDING (initial) → APPROVED or DENIED → SHIPPED_PART or COMPLETED. Orders progress through
      this workflow via message-driven processing.
    confidence: high
    confidence_basis: >
      Declared in OrderStatusNames enum usage across three independent MDBs (PurchaseOrderMDB,
      OrderApprovalMDB, InvoiceMDB) and explicitly set in container transaction methods
      in ejb-jar.xml. ProcessManager EJB enforces state transitions.
    risk_class: operational
    basis: >
      OrderStatusNames are used to track workflow progression. PurchaseOrderMDB calls
      processManager.createManager(..., OrderStatusNames.PENDING). OrderApprovalMDB calls
      processManager.updateStatus() to transition to APPROVED/DENIED. InvoiceMDB transitions
      to COMPLETED or SHIPPED_PART based on invoice processing.
