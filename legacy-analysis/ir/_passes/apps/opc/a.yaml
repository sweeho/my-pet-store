  - record_key: OPC-ANALYTICS-0001
    kind: business-rule
    capability_key: admin-operations
    requirement: >
      Revenue aggregation SHALL calculate (quantity × unit price) for each line item.
      Results can be aggregated by category (null categ parameter) or by specific item
      within a category (non-null categ parameter). The aggregation SHALL be performed
      for all orders placed between the start and end dates.
    confidence: high
    confidence_basis: >
      The calculation is explicit in getChartInfo() at lines 199-204 (category-level revenue)
      and lines 210-212 (item-level revenue within category). The aggregation logic is
      deterministic: loop through line items and sum (quantity * unitPrice).
    risk_class: operational
    basis: >
      OPCAdminFacadeEJB.getChartInfo() iterates through line items and for REVENUE requests
      calculates quantity * unitPrice. When categ is null, it groups by category ID.
      When categ is provided, it filters to that category and groups by item ID.
    traces:
      - path: legacy-source/petstore1.3.2/src/apps/opc/src/com/sun/j2ee/blueprints/opc/admin/ejb/OPCAdminFacadeEJB.java
        line_start: 193
        line_end: 217
        excerpt: |
          if(request.equals("REVENUE")) {
              if(categ == null) {
                  id = loc.getCategoryId();
                  if(chartDetails.containsKey(id)) {
                      tmpValue = (Float) chartDetails.get(id);
                      chartDetails.put(id,
                           new Float(tmpValue.floatValue() +
                           (loc.getQuantity()*loc.getUnitPrice())));
                  } else {
                      chartDetails.put(id, new Float((loc.getQuantity()*
                                              loc.getUnitPrice())));
                  }
              } else {
