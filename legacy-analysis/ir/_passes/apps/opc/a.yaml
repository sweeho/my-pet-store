  - record_key: OPC-APPROVAL-0001
    kind: business-rule
    capability_key: order-approval
    requirement: >
      Small orders SHALL be automatically approved based on locale and total price. Specifically,
      orders from US locale with total price less than 500 USD, and orders from Japan locale
      with total price less than 50,000 JPY SHALL be automatically approved. All other orders
      SHALL be marked PENDING and await administrator approval.
    confidence: high
    confidence_basis: >
      The business rule is encoded in the canIApprove() method which is called during
      purchase order ingestion. The thresholds are explicit literals with no configuration
      or comments, making them clearly intentional. This is the sole place where automatic
      approval is determined.
    risk_class: financial
    basis: >
      PurchaseOrderMDB checks canIApprove() which compares purchaseOrder.getTotalPrice() against
      hardcoded thresholds of 500 for US locale and 50000 for Japan locale. If true, it creates
      an OrderApproval and immediately transitions to doTransition.
    traces:
      - path: legacy-source/petstore1.3.2/src/apps/opc/src/com/sun/j2ee/blueprints/opc/ejb/PurchaseOrderMDB.java
        line_start: 183
        line_end: 191
        excerpt: |
          private boolean canIApprove(PurchaseOrder purchaseOrder) {
            Locale locale = purchaseOrder.getLocale();
            if (locale.equals(Locale.US)) {
              if (purchaseOrder.getTotalPrice() < 500) return true;
            } else if (locale.equals(Locale.JAPAN))  {
              if (purchaseOrder.getTotalPrice() < 50000) return true;
            }
            return false;
          }
    stack_metadata:
      ejb.bean: PurchaseOrderMDB
      method: canIApprove

  - record_key: OPC-APPROVAL-0002
    kind: business-rule
    capability_key: order-approval
    requirement: >
      Only purchase orders in PENDING status SHALL be eligible for administrator approval or denial.
      Orders already in state APPROVED, DENIED, or COMPLETED SHALL be rejected and not re-processed.
    confidence: high
    confidence_basis: >
      The guard condition is explicit in OrderApprovalMDB at line 205, with a continue statement
      that skips any non-PENDING order. This prevents duplicate processing and race conditions.
      It is the only place where order status is validated before processing.
    risk_class: operational
    basis: >
      OrderApprovalMDB.doWork() iterates through orders and explicitly checks
      processManager.getStatus(co.getOrderId()) before processing. Non-PENDING orders cause
      a continue to skip them entirely.
    traces:
      - path: legacy-source/petstore1.3.2/src/apps/opc/src/com/sun/j2ee/blueprints/opc/ejb/OrderApprovalMDB.java
        line_start: 204
        line_end: 207
        excerpt: |
          String curStatus = processManager.getStatus(co.getOrderId());
          if(!curStatus.equals(OrderStatusNames.PENDING)) {
            continue;
          }
    stack_metadata:
      ejb.bean: OrderApprovalMDB
      method: doWork

  - record_key: OPC-FULFILLMENT-0001
    kind: business-rule
    capability_key: fulfillment-management
    requirement: >
      When an order is approved, a supplier purchase order SHALL be generated and sent to the
      supplier queue for fulfillment. The supplier PO SHALL include order ID, order date,
      shipping address (given name, family name, street, city, state, country, zip code, email,
      telephone), and all line items (category ID, product ID, item ID, line number, quantity,
      unit price).
    confidence: high
    confidence_basis: >
      The supplier PO generation logic is explicitly implemented in OrderApprovalMDB.getXmlPO()
      which is called only for APPROVED orders. The method is non-trivial with clear intent.
      It is declared in ejb-jar.xml as part of the OrderApprovalMDB and always results in
      a supplier queue transition.
    risk_class: operational
    basis: >
      OrderApprovalMDB.doWork() calls getXmlPO() only when co.getOrderStatus().equals(APPROVED).
      The resulting XML is added to supplierPoList and passed to doTransition which sends
      via OrderApprovalTD to the supplier queue.
    traces:
      - path: legacy-source/petstore1.3.2/src/apps/opc/src/com/sun/j2ee/blueprints/opc/ejb/OrderApprovalMDB.java
        line_start: 218
        line_end: 223
        excerpt: |
          if(co.getOrderStatus().equals(OrderStatusNames.APPROVED)) {
            po = poHome.findByPrimaryKey(co.getOrderId());
            String xmlPO = getXmlPO(po, supplierOrderXDE);
            supplierPoList.add(xmlPO);
          }
      - path: legacy-source/petstore1.3.2/src/apps/opc/src/com/sun/j2ee/blueprints/opc/ejb/OrderApprovalMDB.java
        line_start: 248
        line_end: 267
        excerpt: |
          private String getXmlPO(PurchaseOrderLocal po, TPASupplierOrderXDE supplierOrderXDE) throws XMLDocumentException{
            supplierOrderXDE.newDocument();
            supplierOrderXDE.setOrderId(po.getPoId());
            Date tmpDate = new Date(po.getPoDate());
            supplierOrderXDE.setOrderDate(tmpDate);
            ContactInfoLocal cinfo = po.getContactInfo();
            AddressLocal addr = cinfo.getAddress();
            supplierOrderXDE.setShippingAddress(cinfo.getGivenName(), cinfo.getFamilyName(),
                                                addr.getStreetName1(), addr.getCity(),
                                                addr.getState(), addr.getCountry(),
                                                addr.getZipCode(), cinfo.getEmail(), cinfo.getTelephone());
            Collection liColl = po.getData().getLineItems();
            Iterator liIt = liColl.iterator();
            while((liIt != null) && (liIt.hasNext())) {
              LineItem li = (LineItem) liIt.next();
              supplierOrderXDE.addLineItem(li.getCategoryId(), li.getProductId(), li.getItemId(),
                                           li.getLineNumber(), li.getQuantity(), li.getUnitPrice());
            }
            return supplierOrderXDE.getDocumentAsString();
          }
    stack_metadata:
      ejb.bean: OrderApprovalMDB
      method: getXmlPO

  - record_key: OPC-SHIPMENT-0001
    kind: business-rule
    capability_key: fulfillment-management
    requirement: >
      When an invoice is received from a supplier, the system SHALL process the invoice line items
      and update the order status. If all line items have been shipped, the order status SHALL be
      set to COMPLETED. If only some line items have been shipped, the order status SHALL be set to
      SHIPPED_PART. The system SHALL determine completion based on whether all items in the purchase
      order have been received in the invoice.
    confidence: high
    confidence_basis: >
      The invoice processing logic in InvoiceMDB.doWork() calls PurchaseOrderHelper.processInvoice()
      which returns a boolean indicating order completion. The status update is deterministic based
      on this boolean. InvoiceMDB is declared in ejb-jar.xml with Required transaction attribute.
    risk_class: operational
    basis: >
      InvoiceMDB receives an invoice message, extracts the line item IDs, and passes them to
      PurchaseOrderHelper.processInvoice(). Based on the return value (orderDone), it sets
      status to COMPLETED or SHIPPED_PART via processManager.updateStatus().
    traces:
      - path: legacy-source/petstore1.3.2/src/apps/opc/src/com/sun/j2ee/blueprints/opc/ejb/InvoiceMDB.java
        line_start: 157
        line_end: 173
        excerpt: |
          private String doWork(String xmlInvoice) throws XMLDocumentException, FinderException {
            String completedOrder = null;
            PurchaseOrderHelper poHelper = new PurchaseOrderHelper();
            invoiceXDE.setDocument(xmlInvoice);
            PurchaseOrderLocal po = poHome.findByPrimaryKey(invoiceXDE.getOrderId());
            boolean orderDone = poHelper.processInvoice(po, invoiceXDE.getLineItemIds());
            if(orderDone) {
              processManager.updateStatus(invoiceXDE.getOrderId(), OrderStatusNames.COMPLETED);
              completedOrder = invoiceXDE.getOrderId();
            } else {
              processManager.updateStatus(invoiceXDE.getOrderId(), OrderStatusNames.SHIPPED_PART);
            }
            return completedOrder;
          }
    stack_metadata:
      ejb.bean: InvoiceMDB
      method: doWork

  - record_key: OPC-NOTIFICATIONS-0001
    kind: business-rule
    capability_key: notifications
    requirement: >
      When an order approval or denial is made, a notification SHALL be sent to the customer
      relations system for email generation and delivery. The notification SHALL include the
      order ID, order status (APPROVED or DENIED), and associated order details. The system
      SHALL respect a SendApprovalMail configuration flag to enable/disable approval notifications.
    confidence: medium
    confidence_basis: >
      The notification routing is explicit in OrderApprovalMDB which builds xmlMailOrderApprovals
      and passes it to mailQueueHelper. However, the MailOrderApprovalMDB has a sendConfirmationMail
      flag loaded from ServiceLocator.getBoolean() which may control whether the mail is actually
      sent, though this is not directly visible in the OrderApprovalMDB code. The overall flow is
      high confidence; the flag's effect is medium confidence.
    risk_class: operational
    basis: >
      OrderApprovalMDB.doWork() populates oaMailList with all orders that were processed, converts
      to XML, and passes to doTransition which sends to mailQueue via OrderApprovalTD. MailOrderApprovalMDB
      has env-entry param/SendApprovalMail and param/xml/validation/OrderApproval flags in ejb-jar.xml.
    traces:
