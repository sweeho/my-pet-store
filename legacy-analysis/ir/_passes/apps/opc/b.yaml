  - record_key: OPC-STATUS-GUARD-0001
    kind: business-rule
    capability_key: order-approval
    requirement: >
      Only orders in PENDING status SHALL be eligible for approval or denial. Orders
      that have already been processed to APPROVED, DENIED, or COMPLETED status SHALL be
      rejected and not reprocessed. The system SHALL skip non-PENDING orders during
      approval processing.
    confidence: high
    confidence_basis: >
      The guard condition is explicit in OrderApprovalMDB.doWork() where the code
      checks processManager.getStatus() and executes a continue statement to skip
      non-PENDING orders. This is the only place where status validation occurs
      before processing.
    risk_class: operational
    basis: >
      OrderApprovalMDB iterates through the orders in the incoming approval message.
      For each order, it retrieves the current status via processManager and skips
      processing if the status is not PENDING.
    traces:
      - path: legacy-source/petstore1.3.2/src/apps/opc/src/com/sun/j2ee/blueprints/opc/ejb/OrderApprovalMDB.java
        line_start: 199
        line_end: 207
        excerpt: |
          while(it!= null && it.hasNext()) {
            ChangedOrder co = (ChangedOrder) it.next();
            String curStatus = processManager.getStatus(co.getOrderId());
            if(!curStatus.equals(OrderStatusNames.PENDING)) {
              continue;
            }
    stack_metadata:
      ejb.bean: OrderApprovalMDB
      method: doWork

  - record_key: OPC-SUPPLIER-PO-GEN-0001
    kind: business-rule
    capability_key: fulfillment-management
    requirement: >
      When an order is approved, the system SHALL generate a supplier purchase order
      containing order ID, order date, shipping address (given name, family name, street,
      city, state, country, zip code, email, telephone), and all line items (category ID,
      product ID, item ID, line number, quantity, unit price). The supplier PO SHALL be
      sent to the supplier fulfillment system.
    confidence: high
    confidence_basis: >
      The getXmlPO() method in OrderApprovalMDB explicitly constructs the supplier PO by
      extracting and organizing all required fields. The method is called only for
      APPROVED orders and the XML is added to the supplier queue transmission.
    risk_class: operational
    basis: >
      OrderApprovalMDB.doWork() checks if order status equals APPROVED, then calls
      getXmlPO() which populates a TPASupplierOrderXDE with all required fields extracted
      from the PurchaseOrderLocal.
    traces:
      - path: legacy-source/petstore1.3.2/src/apps/opc/src/com/sun/j2ee/blueprints/opc/ejb/OrderApprovalMDB.java
        line_start: 219
        line_end: 223
        excerpt: |
          if(co.getOrderStatus().equals(OrderStatusNames.APPROVED)) {
            po = poHome.findByPrimaryKey(co.getOrderId());
            String xmlPO = getXmlPO(po, supplierOrderXDE);
            supplierPoList.add(xmlPO);
          }
      - path: legacy-source/petstore1.3.2/src/apps/opc/src/com/sun/j2ee/blueprints/opc/ejb/OrderApprovalMDB.java
        line_start: 248
        line_end: 268
        excerpt: |
          private String getXmlPO(PurchaseOrderLocal po, TPASupplierOrderXDE supplierOrderXDE) throws XMLDocumentException{
            supplierOrderXDE.newDocument();
            supplierOrderXDE.setOrderId(po.getPoId());
            Date tmpDate = new Date(po.getPoDate());
            supplierOrderXDE.setOrderDate(tmpDate);
            ContactInfoLocal cinfo = po.getContactInfo();
            AddressLocal addr = cinfo.getAddress();
            supplierOrderXDE.setShippingAddress(cinfo.getGivenName(), cinfo.getFamilyName(),
                                                addr.getStreetName1(), addr.getCity(),
                                                addr.getState(), addr.getCountry(),
                                                addr.getZipCode(), cinfo.getEmail(), cinfo.getTelephone());
            Collection liColl = po.getData().getLineItems();
            Iterator liIt = liColl.iterator();
            while((liIt != null) && (liIt.hasNext())) {
              LineItem li = (LineItem) liIt.next();
              supplierOrderXDE.addLineItem(li.getCategoryId(), li.getProductId(), li.getItemId(),
                                           li.getLineNumber(), li.getQuantity(), li.getUnitPrice());
            }
            return supplierOrderXDE.getDocumentAsString();
          }
    stack_metadata:
      ejb.bean: OrderApprovalMDB
      method: getXmlPO

