  - record_key: OPC-ADMIN-QUERY-0001
    kind: requirement
    capability_key: admin-operations
    requirement: >
      The system SHALL provide an administrative query interface (OPCAdminFacadeEJB)
      that allows authorized administrators to retrieve orders by status. The
      getOrdersByStatus() method SHALL return a collection of OrderDetails objects
      containing order ID, user ID, order date, order value, and status for all orders
      matching the requested status.
    confidence: high
    confidence_basis: >
      OPCAdminFacadeEJB is declared as a Stateless Session Bean in ejb-jar.xml with
      remote interface. The getOrdersByStatus method is explicitly defined with clear
      signature and implementation.
    risk_class: operational
    basis: >
      OPCAdminFacadeEJB.getOrdersByStatus() calls ProcessManager.getOrdersByStatus()
      to retrieve a collection of manager records, then fetches PurchaseOrderLocal
      objects and constructs OrderDetails objects with the required fields.
    traces:
      - path: legacy-source/petstore1.3.2/src/apps/opc/src/com/sun/j2ee/blueprints/opc/admin/ejb/OPCAdminFacadeEJB.java
        line_start: 131
        line_end: 156
        excerpt: |
          public OrdersTO getOrdersByStatus(String status)
                                                        throws OPCAdminFacadeException {
              OrdersTO.MutableOrdersTO retVal = new OrdersTO.MutableOrdersTO();
              PurchaseOrderLocal po;
              ProcessManagerLocal mgr = getProcMgr();
              try {
                  PurchaseOrderLocalHome pohome = getPO();
                  Collection orders = mgr.getOrdersByStatus(status);
                  Iterator it = orders.iterator();
                  while((it!= null) && (it.hasNext())) {
                      ManagerLocal mgrEjb = (ManagerLocal) it.next();
                      po = pohome.findByPrimaryKey(mgrEjb.getOrderId());
                      Date gotDate = new Date(po.getPoDate());
                      String podate = (gotDate.getMonth()+1) + "/" +
                          gotDate.getDate() + "/" + (gotDate.getYear()+1900);
                      retVal.add(new OrderDetails(po.getPoId(), po.getPoUserId(),
                                                  podate, po.getPoValue(), status));
                  }
    stack_metadata:
      ejb.bean: OPCAdminFacadeEJB
      session.scope: Stateless
      method: getOrdersByStatus

  - record_key: OPC-ANALYTICS-AGGREGATION-0001
    kind: business-rule
    capability_key: admin-operations
    requirement: >
      The system SHALL support administrative analytics queries to aggregate order data
      by revenue or order count. For REVENUE requests, the system SHALL calculate
      (quantity × unit price) for each line item. For ORDERS requests, the system SHALL
      aggregate item quantities. Aggregation SHALL be performed across all orders placed
      within a specified date range and MAY be grouped by category or by specific item
      within a category based on the request parameter.
    confidence: high
    confidence_basis: >
      The aggregation logic is explicitly implemented in OPCAdminFacadeEJB.getChartInfo()
      with separate branches for REVENUE and ORDERS requests, and further branching for
      category-level vs. item-level aggregation based on the categ parameter.
    risk_class: operational
    basis: >
      OPCAdminFacadeEJB.getChartInfo() iterates through PurchaseOrders found within the
      date range, then through line items of each order. For REVENUE, it sums
      (quantity * unitPrice). For ORDERS, it sums quantity. Grouping is by category ID
      when categ is null, or by item ID within a category when categ is provided.
    traces:
      - path: legacy-source/petstore1.3.2/src/apps/opc/src/com/sun/j2ee/blueprints/opc/admin/ejb/OPCAdminFacadeEJB.java
        line_start: 169
        line_end: 246
        excerpt: |
          public Map getChartInfo(String request,
                                  Date start,
                                  Date end,
                                  String categ)
              throws OPCAdminFacadeException {
              String id;
              Float tmpValue;
              Integer tmpQty;
              PurchaseOrderLocal po;
              Map chartDetails = new HashMap();
              try {
                  PurchaseOrderLocalHome pohome = getPO();
                  Collection poColl = pohome.findPOBetweenDates(start.getTime(), end.getTime());
                  Iterator it = poColl.iterator();
                  while((it!= null) && (it.hasNext())) {
                      po = (PurchaseOrderLocal) it.next();
                      Collection liColl = po.getAllItems();
                      Iterator lit = liColl.iterator();
                      while((lit!=null) && (lit.hasNext())) {
                          LineItem loc = (LineItem) lit.next();
                          if(request.equals("REVENUE")) {
                              if(categ == null) {
                                  id = loc.getCategoryId();
                                  if(chartDetails.containsKey(id)) {
                                      tmpValue = (Float) chartDetails.get(id);
                                      chartDetails.put(id,
                                           new Float(tmpValue.floatValue() +
                                           (loc.getQuantity()*loc.getUnitPrice())));
    stack_metadata:
      ejb.bean: OPCAdminFacadeEJB
      method: getChartInfo

  - record_key: OPC-WORKFLOW-STATES-0001
    kind: workflow
    capability_key: order-approval
    requirement: >
      The order fulfillment workflow SHALL progress through the following states:
      PENDING (initial) → APPROVED or DENIED → optional SHIPPED_PART → COMPLETED.
      Orders originate in PENDING status when received from the petstore. Small orders
      may immediately transition to APPROVED. Administrator decisions transition orders
      to APPROVED or DENIED. Supplier invoices trigger transitions to SHIPPED_PART
      (if partial) or COMPLETED (if all items shipped).
    confidence: high
    confidence_basis: >
      The workflow states are explicitly referenced via OrderStatusNames enum across
      PurchaseOrderMDB, OrderApprovalMDB, and InvoiceMDB. ProcessManager.createManager()
