  - record_key: OPC-ORDER-COMPLETION-0001
    kind: business-rule
    capability_key: fulfillment-management
    requirement: >
      When an invoice is received indicating shipped items, the system SHALL determine
      order completion by comparing shipped line items with the purchase order. If all
      line items have been shipped, the order status SHALL be set to COMPLETED. If only
      some line items have been shipped, the order status SHALL be set to SHIPPED_PART.
    confidence: high
    confidence_basis: >
      InvoiceMDB.doWork() calls PurchaseOrderHelper.processInvoice() which returns a
      boolean indicating whether all items are complete. The status update is based
      directly on this boolean value. This is the deterministic logic for order
      completion.
    risk_class: operational
    basis: >
      InvoiceMDB receives invoice XML, extracts line item IDs, and passes them to
      PurchaseOrderHelper.processInvoice(). Based on the return value (orderDone),
      it calls processManager.updateStatus() with either COMPLETED or SHIPPED_PART.
    traces:
      - path: legacy-source/petstore1.3.2/src/apps/opc/src/com/sun/j2ee/blueprints/opc/ejb/InvoiceMDB.java
        line_start: 157
        line_end: 172
        excerpt: |
          private String doWork(String xmlInvoice) throws XMLDocumentException, FinderException {
            String completedOrder = null;
            PurchaseOrderHelper poHelper = new PurchaseOrderHelper();
            invoiceXDE.setDocument(xmlInvoice);
            PurchaseOrderLocal po = poHome.findByPrimaryKey(invoiceXDE.getOrderId());
            boolean orderDone = poHelper.processInvoice(po, invoiceXDE.getLineItemIds());
            if(orderDone) {
              processManager.updateStatus(invoiceXDE.getOrderId(), OrderStatusNames.COMPLETED);
              completedOrder = invoiceXDE.getOrderId();
            } else {
              processManager.updateStatus(invoiceXDE.getOrderId(), OrderStatusNames.SHIPPED_PART);
            }
            return completedOrder;
          }
    stack_metadata:
      ejb.bean: InvoiceMDB
      method: doWork

