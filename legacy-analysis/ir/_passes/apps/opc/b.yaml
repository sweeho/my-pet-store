  - record_key: OPC-AUTO-APPROVAL-0001
    kind: business-rule
    capability_key: order-approval
    requirement: >
      Small purchase orders SHALL be automatically approved based on locale and order
      total. Orders from US locale with total less than 500 currency units, and orders
      from Japan locale with total less than 50000 currency units, SHALL be marked
      APPROVED and sent directly to order approval processing. All other orders SHALL
      remain in PENDING status awaiting manual administrator approval.
    confidence: high
    confidence_basis: >
      The approval logic is implemented in the canIApprove() method which is the sole
      place where automatic approval is determined. The thresholds are explicit literals
      with clear locale-based branching. The method is called during purchase order
      ingestion in PurchaseOrderMDB.doWork().
    risk_class: financial
    basis: >
      PurchaseOrderMDB.doWork() calls canIApprove() which checks purchaseOrder.getLocale()
      against Locale.US and Locale.JAPAN, then compares purchaseOrder.getTotalPrice()
      against hardcoded thresholds. If approved, it creates an OrderApproval and returns
      XML for transmission.
    traces:
      - path: legacy-source/petstore1.3.2/src/apps/opc/src/com/sun/j2ee/blueprints/opc/ejb/PurchaseOrderMDB.java
        line_start: 183
        line_end: 191
        excerpt: |
          private boolean canIApprove(PurchaseOrder purchaseOrder) {
            Locale locale = purchaseOrder.getLocale();
            if (locale.equals(Locale.US)) {
              if (purchaseOrder.getTotalPrice() < 500) return true;
            } else if (locale.equals(Locale.JAPAN))  {
              if (purchaseOrder.getTotalPrice() < 50000) return true;
            }
            return false;
          }
    stack_metadata:
      ejb.bean: PurchaseOrderMDB
      method: canIApprove

