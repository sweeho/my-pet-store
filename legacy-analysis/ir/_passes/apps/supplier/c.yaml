  - record_key: FULFL-RULE-0004
    kind: business-rule
    capability_key: fulfillment-management
    requirement: >
      GIVEN a line item in a purchase order,
      WHEN the line item has already been partially or fully shipped,
      THEN the system SHALL skip processing that line item and move to the
      next line item.
    confidence: high
    confidence_basis: >
      Programmatically enforced with explicit conditional in
      processAnOrder() method line 187: checks if
      li.getQuantity() == li.getQuantityShipped() before attempting
      inventory check.
    risk_class: operational
    basis: >
      OrderFulfillmentFacadeEJB.processAnOrder() (line 187) iterates
      LineItems and evaluates: "if(li.getQuantity() == li.getQuantityShipped())
      continue;" skipping checkInventory() for already-shipped items.
    traces:
