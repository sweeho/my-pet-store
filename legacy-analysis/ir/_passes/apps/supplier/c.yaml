      itemId (String) and a container-managed field for quantity (int).
    confidence: high
    confidence_basis: >
      Declaratively enforced in ejb-jar.xml with CMP 2.x entity bean defining
      prim-key-class and cmp-fields; programmatically enforced with abstract
      getter/setter methods in InventoryEJB.
    risk_class: operational
    basis: >
