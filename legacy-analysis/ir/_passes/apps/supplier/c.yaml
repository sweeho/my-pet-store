  - record_key: FULFL-RULE-0009
    kind: business-rule
    capability_key: fulfillment-management
    requirement: >
      GIVEN an invoice has been generated,
      WHEN fulfillment is complete,
      THEN the system SHALL send the invoice XML via JMS topic to the Order
      Processing Center.
    confidence: high
    confidence_basis: >
      Programmatically enforced: SupplierOrderMDB.doTransition() creates
      TransitionInfo and delegates to transitionDelegate.doTransition(),
      which sends to JMS topic. SupplierOrderTD implements TransitionDelegate
      and sends to the InvoiceTopic.
    risk_class: operational
    basis: >
      SupplierOrderMDB.doTransition() (lines 151-154) creates TransitionInfo
      and calls transitionDelegate.doTransition(). SupplierOrderTD.doTransition()
      (lines 76-83) calls invoiceTopicSender.sendMessage(xmlInvoice) to the
      INVOICE_MDB_TOPIC. Topic reference declared in ejb-jar.xml
      resource-env-ref (lines 124-127) as jms/opc/InvoiceTopic.
    traces:
      - path: legacy-source/petstore1.3.2/src/apps/supplier/src/com/sun/j2ee/blueprints/supplier/processpo/ejb/SupplierOrderMDB.java
        line_start: 101
        line_end: 123
        excerpt: |
          public void onMessage(Message recvMsg) {
            try {
              String messageID = recvMsg.getJMSMessageID();
              TextMessage recdTM = (TextMessage)recvMsg;
              String recdText = recdTM.getText();
              String invoice = doWork(recdText);
              if(invoice!=null) {
                doTransition(invoice);
              }
      - path: legacy-source/petstore1.3.2/src/apps/supplier/src/com/sun/j2ee/blueprints/supplier/transitions/SupplierOrderTD.java
        line_start: 76
        line_end: 83
        excerpt: |
          public void doTransition(TransitionInfo info) throws TransitionException {
            String xmlInvoice = info.getXMLMessage();
            try {
              invoiceTopicSender.sendMessage(xmlInvoice);
            } catch(JMSException je) {
                throw new TransitionException(je);
            }
    stack_metadata:
      ejb.bean: SupplierOrderMDB
      jms.topic: jms/opc/InvoiceTopic
