  - record_key: FULFL-RULE-0003
    kind: business-rule
    capability_key: fulfillment-management
    requirement: >
      GIVEN inventory is available for a line item in a purchase order,
      WHEN the system determines availability,
      THEN the system SHALL deduct the requested quantity from the inventory
      quantity.
    confidence: high
    confidence_basis: >
      Programmatically enforced: checkInventory() method explicitly calls
      inv.reduceQuantity(item.getQuantity()) when the inventory check passes.
      The InventoryEJB entity bean implements this as a container-managed
      persistent operation with Required transaction attribute.
    risk_class: financial
    basis: >
      OrderFulfillmentFacadeEJB.checkInventory() (line 131) calls
      inv.reduceQuantity(item.getQuantity()). InventoryEJB.reduceQuantity()
      (lines 82-85) retrieves current quantity and decrements it via
      setQuantity(). Container-transaction in ejb-jar.xml (lines 261-271)
      declares reduceQuantity with trans-attribute Required.
    traces:
      - path: legacy-source/petstore1.3.2/src/apps/supplier/src/com/sun/j2ee/blueprints/supplier/orderfulfillment/ejb/OrderFulfillmentFacadeEJB.java
