  # Workflow
  - record_key: WORKFLOW-0001
    kind: workflow
    capability_key: fulfillment-management
    requirement: >
      GIVEN a purchase order is received,
      WHEN the order is processed and fulfilled,
      THEN the system SHALL execute the following workflow:
      (1) receive PO XML via JMS queue, (2) parse PO and persist order,
      (3) check inventory for each line item, (4) deduct inventory for
      available items, (5) create invoice XML for fulfilled items,
      (6) send invoice XML via JMS topic.
    confidence: high
    confidence_basis: >
      Programmatically enforced across multiple classes with explicit
      method calls and control flow. Order of operations is deterministic
      based on code execution sequence in OrderFulfillmentFacadeEJB and
      SupplierOrderMDB.
    risk_class: operational
    basis: >
      SupplierOrderMDB.onMessage() (lines 101-123) receives JMS message,
      calls doWork() which invokes processPO(), then calls doTransition()
      if invoice is not null. OrderFulfillmentFacadeEJB.processPO() (lines
      223-237) parses XML, creates order entity, calls processAnOrder().
      processAnOrder() (lines 176-210) iterates line items, calls
      checkInventory() for each, creates invoice if items fulfilled,
      updates order status.
    traces:
      - path: legacy-source/petstore1.3.2/src/apps/supplier/src/com/sun/j2ee/blueprints/supplier/processpo/ejb/SupplierOrderMDB.java
        line_start: 101
        line_end: 123
        excerpt: |
          public void onMessage(Message recvMsg) {
            try {
              String messageID = recvMsg.getJMSMessageID();
              TextMessage recdTM = (TextMessage)recvMsg;
              String recdText = recdTM.getText();
              String invoice = doWork(recdText);
              if(invoice!=null) {
                doTransition(invoice);
              }
      - path: legacy-source/petstore1.3.2/src/apps/supplier/src/com/sun/j2ee/blueprints/supplier/orderfulfillment/ejb/OrderFulfillmentFacadeEJB.java
        line_start: 223
        line_end: 237
        excerpt: |
          public String processPO(String poXmlDoc) throws CreateException,
              XMLDocumentException {
            String invoiceXml = null;
            SupplierOrderLocal order = null;
            SupplierOrder supplierOrder = null;
            supplierOrderXDE.setDocument(poXmlDoc);
            supplierOrder = supplierOrderXDE.getSupplierOrder();
            order = supplierOrderLocalHome.create(supplierOrder);
            invoiceXml = processAnOrder(order);
            return invoiceXml;
    stack_metadata:
      ejb.bean: SupplierOrderMDB, OrderFulfillmentFacadeEJB
      ejb.transaction: Required

  - record_key: WORKFLOW-0002
    kind: workflow
    capability_key: fulfillment-management
    requirement: >
      GIVEN new inventory has arrived,
      WHEN the supplier application administrator updates inventory,
      THEN the system SHALL execute the following workflow:
      (1) authenticate user, (2) display current inventory, (3) accept new
      quantity inputs, (4) update inventory entities, (5) find all pending
      orders, (6) attempt to fulfill each pending order, (7) collect generated
      invoices, (8) send each invoice via JMS topic, (9) commit transaction.
    confidence: high
    confidence_basis: >
      Programmatically enforced across servlet and EJBs with explicit
      transaction management (UserTransaction) and ordered method calls.
    risk_class: operational
    basis: >
      RcvrRequestProcessor.doPost() (lines 166-209) receives updateinventory
      request, begins UserTransaction (line 184), calls updateInventory()
      to update quantities from request parameters (lines 110-137), calls
      procPO.processPendingPO() (line 186) which returns Collection of
      invoices, calls sendInvoices() (line 187) to iterate invoices and
      send each via doTransition(), commits transaction (line 188).
    traces:
      - path: legacy-source/petstore1.3.2/src/apps/supplier/src/com/sun/j2ee/blueprints/supplier/inventory/web/RcvrRequestProcessor.java
        line_start: 166
        line_end: 209
        excerpt: |
          public void doPost(HttpServletRequest req, HttpServletResponse resp)
            throws java.io.IOException, javax.servlet.ServletException {
              if(fromDoGet) {
                getServletConfig().getServletContext().getRequestDispatcher("/index.jsp").forward(req, resp);
              } else {
                String curScreen = req.getParameter("currentScreen").trim();
                if(curScreen.equals("logout")) {
                  getServletConfig().getServletContext().getRequestDispatcher("/logout.jsp").forward(req, resp);
                }
                if(curScreen.equals("displayinventory")) {
                  getServletConfig().getServletContext().getRequestDispatcher("/displayinventory.jsp").forward(req, resp);
                }
                if(curScreen.equals("updateinventory")) {
                  UserTransaction ut = null;
                  try {
                    InitialContext ic = new InitialContext();
                    ut = (UserTransaction) ic.lookup(JNDINames.USER_TRANSACTION);
                    ut.begin();
                    updateInventory(req);
                    Collection invoices = procPO.processPendingPO();
                    sendInvoices(invoices);
                    ut.commit();
    stack_metadata:
      framework: Servlet
      servlet: RcvrRequestProcessor
      ejb.transaction: Required (for underlying EJB calls)

findings:
  - kind: ambiguity
    path: legacy-source/petstore1.3.2/src/apps/supplier/src/com/sun/j2ee/blueprints/supplier/orderfulfillment/ejb/OrderFulfillmentFacadeEJB.java
    description: >
      Line 205 prints to System.out on XMLDocumentException in processAnOrder(),
      but exception handling is unclear. The comment says "so order wont be
      fullfilled but po is persisted and can be fullfilled later" but the method
      returns null instead of re-throwing or signaling the error to the caller.
      processPO() returns null and SupplierOrderMDB.onMessage() silently swallows
      the null (line 111), so no transition occurs. Is this intended silent failure?

  - kind: ambiguity
    path: legacy-source/petstore1.3.2/src/apps/supplier/src/com/sun/j2ee/blueprints/supplier/orderfulfillment/ejb/OrderFulfillmentFacadeEJB.java
    description: >
      processPendingPO() (line 260) also catches XMLDocumentException and prints
      to System.out, then continues to the next pending order. The invoice may be
      null but it is added to the invoices collection only if not null (line 264),
      so silent failure is assumed. Clarify whether this is expected or a bug.

  - kind: conflict
    path: legacy-source/petstore1.3.2/src/apps/supplier/src/docroot/displayinventory.jsp
    description: >
      The JSP form (line 101-103) renders checkboxes with value="false" for
      each item, but RcvrRequestProcessor.updateInventory() (lines 119-131)
      checks if parameter startsWith("item_") and retrieves qty_[itemId], but
      does NOT verify the checkbox was selected. The updateInventory method
      only requires that qty_[itemId] be non-empty (lines 124-125); the checkbox
      value is never examined. Unclear if checkbox selection is enforced or merely
      a UI hint.

  - kind: unparseable
    path: legacy-source/petstore1.3.2/src/apps/supplier/src/com/sun/j2ee/blueprints/supplier/inventory/web/RcvrRequestProcessor.java
    description: >
      Lines 139-157 define sendInvoices() which iterates invoices and calls
      transitionDelegate.doTransition() for each, but no retry or error handling
      is visible if doTransition() throws TransitionException. The exception is
      caught and printed (line 154-156) but execution continues. If one invoice
      fails to send, subsequent invoices are still attempted, but no status is
      returned to indicate partial failure to the caller.

  - kind: unparseable
    path: legacy-source/petstore1.3.2/src/apps/supplier/src/com/sun/j2ee/blueprints/supplier/inventory/web/RcvrRequestProcessor.java
    description: >
      updateInventory() method (lines 110-137) parses request parameters to
      extract itemId and newQty, validates that newQty >= 0 (line 127), but
      does not validate that newQty is a valid integer until line 126 where
      it attempts new Integer(newQty). If a non-integer qty_ parameter is
      passed, NumberFormatException would be thrown but is not caught in
      updateInventory(). The catch block at line 134 only catches FinderException.
