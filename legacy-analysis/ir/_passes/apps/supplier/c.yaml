  - record_key: FULFL-RULE-0007
    kind: business-rule
    capability_key: fulfillment-management
    requirement: >
      GIVEN line items have been fulfilled,
      WHEN fulfilled items are identified,
      THEN the system SHALL create an invoice in XML format containing the
      fulfilled line items with their details (category, product, item id,
      line number, quantity, unit price).
    confidence: high
    confidence_basis: >
      Declaratively and programmatically enforced: createInvoice() method
      (lines 145-171) constructs TPAInvoiceXDE XML document with item
      details. Implementation is traceable through XML document construction.
    risk_class: operational
    basis: >
      OrderFulfillmentFacadeEJB.createInvoice() (lines 145-171) instantiates
      invoiceXDE (TPAInvoiceXDE), sets order metadata (poId, userId, dates),
      then iterates fulfilled items and calls invoiceXDE.addLineItem() with
      categoryId, productId, itemId, lineNumber, quantity, unitPrice.
      Returns invoiceXDE.getDocumentAsString().
    traces:
      - path: legacy-source/petstore1.3.2/src/apps/supplier/src/com/sun/j2ee/blueprints/supplier/orderfulfillment/ejb/OrderFulfillmentFacadeEJB.java
        line_start: 145
        line_end: 171
        excerpt: |
          private String createInvoice(SupplierOrderLocal po, HashMap newLis)
            throws XMLDocumentException {
              invoiceXDE.newDocument();
              invoiceXDE.setOrderId(po.getPoId());
              invoiceXDE.setUserId("Dear PetStore Customer");
              Date poDate = new Date(po.getPoDate());
              invoiceXDE.setOrderDate(poDate);
              Date curDate = new Date();
              invoiceXDE.setShippingDate(curDate);
              Collection items = po.getLineItems();
              Iterator it = items.iterator();
              while((it != null) && (it.hasNext())) {
                LineItemLocal anItem = (LineItemLocal)it.next();
                if(newLis.containsKey(anItem.getItemId())) {
                  invoiceXDE.addLineItem(anItem.getCategoryId(),
                                         anItem.getProductId(),
                                         anItem.getItemId(),
                                         anItem.getLineNumber(),
                                         anItem.getQuantity(),
                                         anItem.getUnitPrice());
    stack_metadata:
      ejb.bean: OrderFulfillmentFacadeEJB
      ejb.transaction: Required

