  # ENTITY RECORDS
  - record_key: fulfillment-management-entity-0001
    kind: entity
    capability_key: fulfillment-management
    requirement: >
      The system maintains an Inventory entity with itemId (string, primary key) and
      quantity (integer) fields. Each inventory item represents a product SKU stocked
      by the supplier.
    confidence: high
    confidence_basis: >
      Declared in ejb-jar.xml as CMP Entity Bean 2.x with explicit field definitions.
      Schema is enforced by container. Both declarative (ejb-jar.xml) and programmatic
      (InventoryEJB.java) evidence confirms field names and types.
    risk_class: operational
    basis: >
      InventoryEJB is a Container Managed Persistent (CMP 2.x) entity bean with abstract
      accessor methods for itemId (String) and quantity (int). The ejb-jar.xml declares
      these as <cmp-field> with itemId as primary key.
    traces:
      - path: legacy-source/petstore1.3.2/src/apps/supplier/src/ejb-jar.xml
        line_start: 49
        line_end: 81
        excerpt: |
          <entity>
            <description>Inventory CMP EJB</description>
            <display-name>InventoryEB</display-name>
            <ejb-name>InventoryEJB</ejb-name>
            <prim-key-class>java.lang.String</prim-key-class>
            <cmp-version>2.x</cmp-version>
            <abstract-schema-name>Inventory</abstract-schema-name>
            <cmp-field>
              <field-name>itemId</field-name>
            </cmp-field>
            <cmp-field>
              <field-name>quantity</field-name>
            </cmp-field>
            <primkey-field>itemId</primkey-field>
      - path: legacy-source/petstore1.3.2/src/apps/supplier/src/com/sun/j2ee/blueprints/supplier/inventory/ejb/InventoryEJB.java
        line_start: 57
        line_end: 75
        excerpt: |
          public abstract String getItemId();
          public abstract void setItemId(String itemId);
          public abstract int getQuantity();
          public abstract void setQuantity(int quantity);
    stack_metadata:
      ejb.bean: InventoryEJB
      ejb.persistence: Container Managed Persistence (CMP 2.x)

  - record_key: fulfillment-management-entity-0002
    kind: entity
    capability_key: fulfillment-management
    requirement: >
      The system maintains a SupplierOrder entity (via external EJB reference) that
      contains purchase order data including order ID, order date, line items, and
      order status. Order status values include PENDING and COMPLETED.
    confidence: high
    confidence_basis: >
      The SupplierOrder EJB is referenced in ejb-jar.xml and used throughout
      OrderFulfillmentFacadeEJB. Methods like getPoId(), getPoDate(), getLineItems(),
      getPoStatus(), setPoStatus() are invoked consistently. The status field is set
      using OrderStatusNames.PENDING and OrderStatusNames.COMPLETED constants.
    risk_class: operational
    basis: >
      SupplierOrder is imported from com.sun.j2ee.blueprints.supplierpo.ejb and
      referenced via EJB local home interface. The ejb-jar.xml declares it as an
      entity EJB dependency. OrderFulfillmentFacadeEJB creates instances, accesses
      order properties, and updates status using constants from OrderStatusNames.
    traces:
      - path: legacy-source/petstore1.3.2/src/apps/supplier/src/ejb-jar.xml
        line_start: 168
        line_end: 174
        excerpt: |
          <ejb-local-ref>
            <ejb-ref-name>ejb/SupplierOrder</ejb-ref-name>
            <ejb-ref-type>Entity</ejb-ref-type>
            <local-home>com.sun.j2ee.blueprints.supplierpo.ejb.SupplierOrderLocalHome</local-home>
            <local>com.sun.j2ee.blueprints.supplierpo.ejb.SupplierOrderLocal</local>
            <ejb-link>SupplierOrderEJB</ejb-link>
          </ejb-local-ref>
      - path: legacy-source/petstore1.3.2/src/apps/supplier/src/com/sun/j2ee/blueprints/supplier/orderfulfillment/ejb/OrderFulfillmentFacadeEJB.java
        line_start: 223
        line_end: 236
        excerpt: |
          public String processPO(String poXmlDoc) throws CreateException,
              XMLDocumentException {
            SupplierOrderLocal order = null;
            supplierOrderXDE.setDocument(poXmlDoc);
            supplierOrder = supplierOrderXDE.getSupplierOrder();
            order = supplierOrderLocalHome.create(supplierOrder);
            invoiceXml = processAnOrder(order);
            return invoiceXml;
    stack_metadata:
      ejb.bean: SupplierOrderEJB (external)

