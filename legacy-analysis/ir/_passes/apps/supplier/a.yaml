  - record_key: fulfillment-management-requirement-0005
    kind: requirement
    capability_key: fulfillment-management
    requirement: >
      The system SHALL set the purchase order status to COMPLETED when all line
      items in the order have been fulfilled (shipped).
    confidence: high
    confidence_basis: >
      In processAnOrder(), the condition "if(allItemsAvailable)" is explicitly checked
      before calling po.setPoStatus(OrderStatusNames.COMPLETED). The status transition
      occurs only when all inventory checks pass for all line items.
    risk_class: operational
    basis: >
      The allItemsAvailable flag is set to true initially, then set to false if any
      line item cannot be fulfilled. Only if it remains true after processing all
      line items is the order status set to COMPLETED using OrderStatusNames constant.
    traces:
      - path: legacy-source/petstore1.3.2/src/apps/supplier/src/com/sun/j2ee/blueprints/supplier/orderfulfillment/ejb/OrderFulfillmentFacadeEJB.java
        line_start: 176
        line_end: 210
        excerpt: |
          private String processAnOrder(SupplierOrderLocal po)
            throws XMLDocumentException {
              boolean allItemsAvailable = true;
              boolean invoiceReqd = false;
              HashMap items = new HashMap();
              Collection liColl = po.getLineItems();
              Iterator liIt = liColl.iterator();
              while((liIt != null) && (liIt.hasNext())) {
                LineItemLocal li = (LineItemLocal) liIt.next();
                if(!checkInventory(li)) {
                  allItemsAvailable = false;
                  continue;
                }
                li.setQuantityShipped(li.getQuantity());
                items.put(li.getItemId(), OrderStatusNames.COMPLETED);
                invoiceReqd = true;
              }
              if(allItemsAvailable)
                po.setPoStatus(OrderStatusNames.COMPLETED);
    stack_metadata:
      ejb.bean: OrderFulfillmentFacadeEJB

