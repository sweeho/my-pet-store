  # WORKFLOW RECORDS
  - record_key: fulfillment-management-workflow-0001
    kind: workflow
    capability_key: fulfillment-management
    requirement: >
      The supplier application SHALL support the following inventory update workflow:
      1. Display current inventory items and quantities
      2. Accept administrator input for new quantities (text input per item, checkbox to mark for update)
      3. On form submission, update the inventory quantities for all selected items
      4. Process all pending purchase orders with the newly available inventory
      5. Generate and send invoices for any orders that can now be fulfilled
      6. Wrap the entire operation in a user transaction (begin, commit, or rollback)
    confidence: high
    confidence_basis: >
      The RcvrRequestProcessor.doPost() method implements this complete workflow.
      The currentScreen="updateinventory" path calls updateInventory(), then
      processPendingPO(), then sendInvoices(), all within a UserTransaction context.
      Steps are explicit in the code and transaction demarcation is clear.
    risk_class: operational
    basis: >
      RcvrRequestProcessor handles the updateinventory action. It looks up UserTransaction,
      calls begin(), invokes updateInventory() to parse form parameters and update inventory
      via InventoryEJB, calls procPO.processPendingPO() to retrieve pending orders,
      calls sendInvoices() to emit invoices via JMS, then calls commit(). On exception,
      implicit rollback occurs.
    traces:
      - path: legacy-source/petstore1.3.2/src/apps/supplier/src/com/sun/j2ee/blueprints/supplier/inventory/web/RcvrRequestProcessor.java
        line_start: 166
        line_end: 210
        excerpt: |
          public void doPost(HttpServletRequest req, HttpServletResponse resp)
            throws java.io.IOException, javax.servlet.ServletException {
              if(curScreen.equals("updateinventory")) {
                UserTransaction ut = null;
                try {
                  InitialContext ic = new InitialContext();
                  ut = (UserTransaction) ic.lookup(JNDINames.USER_TRANSACTION);
                  ut.begin();
                  updateInventory(req);
                  Collection invoices = procPO.processPendingPO();
                  sendInvoices(invoices);
                  ut.commit();
                  getServletConfig().getServletContext().getRequestDispatcher("/back.jsp").forward(req, resp);
    stack_metadata:
      session.scope: HttpSession

  - record_key: fulfillment-management-workflow-0002
    kind: workflow
    capability_key: fulfillment-management
    requirement: >
      When a purchase order arrives via JMS message queue, the supplier SHALL:
      1. Receive the PO as an XML document in a TextMessage
      2. Parse and validate the XML
      3. Create a SupplierOrder entity to persist it
      4. Attempt to fulfill the order by checking inventory
      5. If any items are available, create an Invoice XML document
      6. Send the invoice back via JMS topic for order processing center consumption
      7. If no items are available, leave the order in PENDING status for later fulfillment
    confidence: high
    confidence_basis: >
      The SupplierOrderMDB.onMessage() and OrderFulfillmentFacadeEJB.processPO() methods
      implement this workflow. Both declarative (transaction attributes, JMS configuration)
      and programmatic (exception handling, status management) evidence is present.
