  - record_key: fulfillment-management-requirement-0007
    kind: requirement
    capability_key: fulfillment-management
    requirement: >
      The system SHALL process pending purchase orders when new inventory arrives
      at the supplier. Pending orders are orders whose status is PENDING and which
      could not be fully fulfilled when first received. The system SHALL retry
      fulfillment for all pending orders.
    confidence: high
    confidence_basis: >
      The processPendingPO() method queries for all orders with status PENDING using
      supplierOrderLocalHome.findOrdersByStatus(OrderStatusNames.PENDING), then
      iterates through them calling processAnOrder() for each. This is called from
      RcvrRequestProcessor when inventory is updated.
    risk_class: operational
    basis: >
      processPendingPO() uses a finder method to retrieve all PENDING orders and
      attempts to fulfill each one. If fulfillment succeeds, an invoice is generated
      and returned in a collection. Fulfillment is re-attempted based on new inventory.
    traces:
      - path: legacy-source/petstore1.3.2/src/apps/supplier/src/com/sun/j2ee/blueprints/supplier/orderfulfillment/ejb/OrderFulfillmentFacadeEJB.java
        line_start: 247
        line_end: 269
        excerpt: |
          public Collection processPendingPO() throws FinderException {
            ArrayList invoices = new ArrayList();
            Collection coll =
              supplierOrderLocalHome.findOrdersByStatus(OrderStatusNames.PENDING);
            if(coll != null) {
              Iterator it = coll.iterator();
              while((it!=null) && (it.hasNext())) {
                SupplierOrderLocal order = (SupplierOrderLocal) it.next();
                String newInvoice = null;
                try {
                  newInvoice = processAnOrder(order);
                } catch (XMLDocumentException xe) {
                  System.out.println("OrderFulfillmentFacade:" + xe);
                }
                if(newInvoice != null) {
                  invoices.add(newInvoice);
                }
              }
            }
            return invoices;
          }
    stack_metadata:
      ejb.bean: OrderFulfillmentFacadeEJB
      ejb.transaction: Required

