  - record_key: fulfillment-management-requirement-0002
    kind: requirement
    capability_key: fulfillment-management
    requirement: >
      The system SHALL reduce inventory quantity by the ordered quantity when
      fulfilling a purchase order line item.
      GIVEN: A purchase order line item with quantity Q and an inventory item with
      quantity I; WHEN: The line item is fulfilled; THEN: Inventory quantity becomes I - Q.
    confidence: high
    confidence_basis: >
      The logic is implemented in OrderFulfillmentFacadeEJB.checkInventory() method
      which explicitly calls inv.reduceQuantity(item.getQuantity()). This is both
      declarative (transaction attributes) and programmatic. The method is invoked
      from processAnOrder() during purchase order processing.
    risk_class: financial
    basis: >
      In OrderFulfillmentFacadeEJB.checkInventory(), the inventory is reduced by
      calling inv.reduceQuantity(item.getQuantity()). The InventoryEJB.reduceQuantity()
      method subtracts the passed quantity from the current quantity and persists it.
    traces:
      - path: legacy-source/petstore1.3.2/src/apps/supplier/src/com/sun/j2ee/blueprints/supplier/orderfulfillment/ejb/OrderFulfillmentFacadeEJB.java
        line_start: 126
        line_end: 139
        excerpt: |
          private boolean checkInventory(LineItemLocal item) {
            try {
              InventoryLocal inv = invHome.findByPrimaryKey(item.getItemId());
              if(inv.getQuantity() < item.getQuantity())
                return(false);
              inv.reduceQuantity(item.getQuantity());
            } catch (FinderException fe) {
              return(false);
            }
            return(true);
          }
      - path: legacy-source/petstore1.3.2/src/apps/supplier/src/com/sun/j2ee/blueprints/supplier/inventory/ejb/InventoryEJB.java
        line_start: 82
        line_end: 85
        excerpt: |
          public void reduceQuantity(int quantity) {
            int q = this.getQuantity();
            setQuantity(q-quantity);
          }
    stack_metadata:
      ejb.bean: InventoryEJB
      ejb.transaction: Required

  - record_key: fulfillment-management-requirement-0003
    kind: requirement
    capability_key: fulfillment-management
    requirement: >
      The system SHALL only reduce inventory if the quantity in stock is sufficient
      to fulfill the line item.
      GIVEN: A purchase order line item with quantity Q and inventory with quantity I;
      WHEN: I < Q; THEN: Inventory is NOT reduced and fulfillment is NOT completed
      for this line item.
    confidence: high
    confidence_basis: >
      The checkInventory() method explicitly checks inv.getQuantity() < item.getQuantity()
      before reducing. This guard clause is the only path to reduceQuantity(). Both
      programmatic (if statement) and data model (CMP field) evidence.
    risk_class: operational
    basis: >
      In checkInventory(), the condition "if(inv.getQuantity() < item.getQuantity())"
      returns false without calling reduceQuantity(). The caller (processAnOrder)
      treats this as "allItemsAvailable = false" and skips marking the item as shipped.
    traces:
      - path: legacy-source/petstore1.3.2/src/apps/supplier/src/com/sun/j2ee/blueprints/supplier/orderfulfillment/ejb/OrderFulfillmentFacadeEJB.java
        line_start: 126
        line_end: 139
        excerpt: |
          private boolean checkInventory(LineItemLocal item) {
            try {
              InventoryLocal inv = invHome.findByPrimaryKey(item.getItemId());
              if(inv.getQuantity() < item.getQuantity())
                return(false);
              inv.reduceQuantity(item.getQuantity());
            } catch (FinderException fe) {
              return(false);
            }
            return(true);
          }
      - path: legacy-source/petstore1.3.2/src/apps/supplier/src/com/sun/j2ee/blueprints/supplier/orderfulfillment/ejb/OrderFulfillmentFacadeEJB.java
        line_start: 176
        line_end: 210
        excerpt: |
          private String processAnOrder(SupplierOrderLocal po)
            throws XMLDocumentException {
              boolean allItemsAvailable = true;
              HashMap items = new HashMap();
              Collection liColl = po.getLineItems();
              Iterator liIt = liColl.iterator();
              while((liIt != null) && (liIt.hasNext())) {
                LineItemLocal li = (LineItemLocal) liIt.next();
                if(!checkInventory(li)) {
                  allItemsAvailable = false;
                  continue;
                }
    stack_metadata:
      ejb.transaction: Required

  # REQUIREMENT RECORDS - ORDER FULFILLMENT
  - record_key: fulfillment-management-requirement-0004
    kind: requirement
    capability_key: fulfillment-management
    requirement: >
      The system SHALL process incoming purchase orders received via JMS and persist
      them into the database. Each purchase order is converted from XML to a Java
      object, validated, and stored as a SupplierOrder entity.
    confidence: high
    confidence_basis: >
      The SupplierOrderMDB is a Message Driven Bean that implements MessageListener.
      It receives TextMessage, extracts XML, and calls OrderFulfillmentFacade.processPO().
      OrderFulfillmentFacadeEJB then creates the order via supplierOrderLocalHome.create().
      Both JMS configuration and EJB implementation are evident.
    risk_class: operational
    basis: >
      SupplierOrderMDB.onMessage() receives JMS TextMessage, extracts the XML text,
      and calls poProcessor.processPO(). OrderFulfillmentFacadeEJB.processPO() uses
      TPASupplierOrderXDE to parse XML and SupplierOrderLocalHome to persist it.
      Transaction attribute is Required for message processing.
    traces:
