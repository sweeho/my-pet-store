findings:
  - kind: ambiguity
    path: legacy-source/petstore1.3.2/src/apps/supplier/src/com/sun/j2ee/blueprints/supplier/orderfulfillment/ejb/OrderFulfillmentFacadeEJB.java
    description: >
      The processAnOrder() method (lines 176-210) tracks partial shipment status
      but the relationship between allItemsAvailable and partial fulfillment is
      unclear. If some items are available but not all, allItemsAvailable remains
      false (line 190), and order status is NOT set to COMPLETED (line 198 is
      conditional on allItemsAvailable being true). However, invoice IS created
      (lines 199-208). This means partial shipments generate invoices but leave
      the order in PENDING status. It is unclear whether this is intentional
      (allow multiple partial shipments) or a design issue where the order status
      should reflect "PARTIALLY_SHIPPED" or similar.

  - kind: unparseable
    path: legacy-source/petstore1.3.2/src/apps/supplier/src/com/sun/j2ee/blueprints/supplier/inventory/web/RcvrRequestProcessor.java
    description: >
      The updateInventory() method (lines 110-137) allows setting any integer
      quantity >= 0 but does NOT validate against negative inventory (a quantity
      that becomes negative after fulfillment). The checkInventory() method checks
      if current quantity >= line item quantity before reducing, but updateInventory()
      does a direct setQuantity() with no such guard. If an administrator manually
      sets a quantity lower than the stock currently reserved or in-flight, it could
      result in negative inventory. The validation constraint is unclear.

  - kind: ambiguity
    path: legacy-source/petstore1.3.2/src/apps/supplier/src/com/sun/j2ee/blueprints/supplier/orderfulfillment/ejb/OrderFulfillmentFacadeEJB.java
    description: >
      The user ID in the created invoice (line 149: setUserId("Dear PetStore Customer"))
      is hardcoded to a literal string instead of using the purchase order's actual
      user ID (po.getPoId() or equivalent). The reason for this hardcoding is unclear—
      whether it is intentional (all invoices use a generic greeting), a placeholder
      (meant to be filled in later), or an oversight (should use actual customer ID).
      This affects invoice accuracy and traceability.
