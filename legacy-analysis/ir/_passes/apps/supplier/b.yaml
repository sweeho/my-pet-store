  - record_key: FUL-BUS-0001
    kind: business-rule
    capability_key: fulfillment-management
    requirement: >
      The Inventory entity SHALL provide a method to reduce its quantity by
      a specified amount, calculating the new quantity as the current quantity
      minus the requested reduction amount.
    confidence: high
    confidence_basis: >
      The reduceQuantity(int) method is implemented in InventoryEJB (lines 82-85)
      with clear logic: it retrieves the current quantity, subtracts the parameter,
      and sets the new value. This method is explicitly declared in the configuration
      (lines 272-282 in ejb-jar.xml) with Required transaction attribute.
      The implementation is straightforward and unambiguous.
    risk_class: operational
    basis: >
      InventoryEJB.reduceQuantity(int quantity) method (lines 82-85) implements:
      int q = this.getQuantity(); setQuantity(q-quantity);
      ejb-jar.xml (lines 272-282) declares this method with trans-attribute Required
      for the Local interface. The subtraction is simple arithmetic with no
      rounding, constraints, or special cases apparent in the code.
    traces:
      - path: legacy-source/petstore1.3.2/src/apps/supplier/src/com/sun/j2ee/blueprints/supplier/inventory/ejb/InventoryEJB.java
        line_start: 77
        line_end: 85
        excerpt: |
          /**
           * This method allows reducing the quantity by a given amount
           * @param quantity an integer that represents the amount by which the
           *                 quantity has to be reduced
           */
          public void reduceQuantity(int quantity) {
              int q = this.getQuantity();
              setQuantity(q-quantity);
          }
