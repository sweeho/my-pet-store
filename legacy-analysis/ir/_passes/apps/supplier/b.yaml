  - record_key: ADM-BUS-0001
    kind: business-rule
    capability_key: admin-operations
    requirement: >
      The system SHALL allow administrators to update inventory quantities by
      submitting a form with parameter names of the format "qty_<itemId>" for
      quantities and "item_<itemId>" for selection checkboxes, then process all
      selected items by calling updateInventory() to persist the new quantities.
    confidence: high
    confidence_basis: >
      RcvrRequestProcessor.doPost() (lines 166-210) dispatches to updateInventory()
      when currentScreen equals "updateinventory" (lines 179-189). updateInventory()
      (lines 110-137) parses parameters starting with "item_" (line 119), extracts
      itemId, retrieves corresponding "qty_<itemId>" parameter (line 123), converts
      to Integer (line 126), and calls inventory.setQuantity() for each item found
      (line 129). displayinventory.jsp (lines 97-104) generates exactly these
      parameter names: qty_<itemId> input fields and item_<itemId> checkboxes.
    risk_class: operational
    basis: >
      RcvrRequestProcessor.updateInventory() (lines 110-137) enumerates request
      parameters (line 116), checks if param starts with "item_" (line 119), extracts
      itemId via substring "item_".length() to end (line 121), gets qty via
      "qty_"+itemId parameter (line 123), converts to Integer (line 126), and calls
      inventoryHomeRef.findByPrimaryKey(itemId) then setQuantity(qty) (lines 128-129).
      displayinventory.jsp (lines 97-104) generates input type="text" name="qty_<itemId>"
      and input type="checkbox" name="item_<itemId>".
    traces:
      - path: legacy-source/petstore1.3.2/src/apps/supplier/src/com/sun/j2ee/blueprints/supplier/inventory/web/RcvrRequestProcessor.java
        line_start: 110
        line_end: 137
        excerpt: |
          private void updateInventory(HttpServletRequest req) {
            String itemId;
            InventoryLocal inventory;
            try {
              Enumeration e = req.getParameterNames();
              while ((e != null) && e.hasMoreElements()) {
                String param = ((String)e.nextElement()).trim();
                if ((param != null) && param.startsWith("item_")) {
                  itemId = param.substring("item_".length(),param.length());
                  if(itemId != null) {
                    String newQty = req.getParameter("qty_" + itemId);
                    if((newQty == null) || (newQty.length() <= 0))
                      continue;
                    Integer qty = new Integer(newQty);
                    if(qty.intValue() >= 0 ) {
                      inventory = inventoryHomeRef.findByPrimaryKey(itemId);
                      inventory.setQuantity(qty.intValue());
                    }
                  }
                }
              }
            } catch (FinderException ne) {
              ne.printStackTrace();
            }
          }
