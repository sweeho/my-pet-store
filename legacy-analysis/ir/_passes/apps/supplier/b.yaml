  - record_key: FUL-BUS-0004
    kind: business-rule
    capability_key: fulfillment-management
    requirement: >
      When a Purchase Order is successfully fulfilled (all line items have
      available inventory), the system SHALL generate an Invoice XML document
      containing the order ID, user ID, order date, shipping date, and all
      fulfillable line items with their product information.
    confidence: high
    confidence_basis: >
      OrderFulfillmentFacadeEJB.createInvoice() method (lines 145-171) explicitly
      implements invoice XML creation. It calls invoiceXDE.newDocument() (line 147),
      sets order ID, user ID, order date (using current po data), and sets shipping
      date to current system date (lines 148-153). It iterates line items and calls
      addLineItem() for each item found in the newLis HashMap (lines 155-166).
      Finally calls getDocumentAsString() to serialize (line 169). This is clear
      and well-documented code.
    risk_class: operational
    basis: >
      OrderFulfillmentFacadeEJB.createInvoice() (lines 145-171) creates TPAInvoiceXDE
      document. Sets invoiceXDE.setOrderId(po.getPoId()), setUserId("Dear PetStore
      Customer"), setOrderDate(new Date(po.getPoDate())), setShippingDate(new Date()).
      Iterates po.getLineItems() (line 154), and for each item where newLis contains
      the itemId (line 158), calls addLineItem() with category, product, item ID,
      line number, quantity, unit price (lines 159-164). Returns invDoc string
      from invoiceXDE.getDocumentAsString() (line 169).
    traces:
      - path: legacy-source/petstore1.3.2/src/apps/supplier/src/com/sun/j2ee/blueprints/supplier/orderfulfillment/ejb/OrderFulfillmentFacadeEJB.java
        line_start: 141
        line_end: 171
        excerpt: |
          /**
           * Builds an Invoice XML document containing all the items that
           *  can be shipped from inventory
           */
          private String createInvoice(SupplierOrderLocal po, HashMap newLis)
            throws XMLDocumentException {
              invoiceXDE.newDocument();
              invoiceXDE.setOrderId(po.getPoId());
              invoiceXDE.setUserId("Dear PetStore Customer");
              Date poDate = new Date(po.getPoDate());
              invoiceXDE.setOrderDate(poDate);
              Date curDate = new Date();
              invoiceXDE.setShippingDate(curDate);
              Collection items = po.getLineItems();
              Iterator it = items.iterator();
              while((it != null) && (it.hasNext())) {
                LineItemLocal anItem = (LineItemLocal)it.next();
                if(newLis.containsKey(anItem.getItemId())) {
                  invoiceXDE.addLineItem(anItem.getCategoryId(),
                                         anItem.getProductId(),
                                         anItem.getItemId(),
                                         anItem.getLineNumber(),
                                         anItem.getQuantity(),
                                         anItem.getUnitPrice());
                }
              }
              String invDoc = null;
              invDoc = invoiceXDE.getDocumentAsString();
              return(invDoc);
          }
    stack_metadata:
      serialization_format: XML
      timestamp_format: Java Date

  - record_key: FUL-INT-0001
    kind: integration
    capability_key: fulfillment-management
    requirement: >
      The system SHALL receive Purchase Order messages via a JMS Queue through a
      Message-Driven Bean (SupplierOrderMDB), extract the XML payload, process
      the order for fulfillment, and if items are shipped, send the resulting
      Invoice back to the order processing center via a JMS Topic.
    confidence: high
    confidence_basis: >
      ejb-jar.xml declares SupplierOrderMDB (lines 85-129) with message-driven-destination
      of type javax.jms.Queue. The onMessage() method (lines 101-123 in
      SupplierOrderMDB.java) receives Message, casts to TextMessage, extracts
      text, calls doWork() (line 108), and if invoice is not null, calls
      doTransition() (line 112) which uses TransitionDelegate to send to JMS.
      This is a standard J2EE MDB pattern with explicit JMS references.
    risk_class: operational
    basis: >
      ejb-jar.xml (lines 85-129) declares message-driven bean SupplierOrderMDB
      with message-driven-destination type javax.jms.Queue. Declares resource-refs
      for jms/QueueConnectionFactory and jms/TopicConnectionFactory (lines 109-122).
      Declares resource-env-ref for jms/opc/InvoiceTopic (lines 124-127).
      SupplierOrderMDB.onMessage() (lines 101-123) receives Message, casts to
      TextMessage (line 104), gets text (line 105), calls doWork(recdText) (line 108),
      checks if invoice not null (line 111), calls doTransition(invoice) (line 112).
      doTransition() (lines 151-154) creates TransitionInfo and calls
      transitionDelegate.doTransition().
