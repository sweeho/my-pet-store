  - record_key: FUL-BUS-0002
    kind: business-rule
    capability_key: fulfillment-management
    requirement: >
      When processing a Purchase Order received from the order processing center,
      the system SHALL check inventory availability for each line item, reduce the
      inventory quantity if stock is available, mark the line item as shipped if
      all or part of the requested quantity can be fulfilled, and update the order
      status to COMPLETED if all items are available for shipment.
    confidence: high
    confidence_basis: >
      OrderFulfillmentFacadeEJB.processAnOrder() method (lines 176-210) explicitly
      implements this workflow. It iterates line items, calls checkInventory() for
      each (lines 126-139), and reduces inventory on success. It sets quantityShipped
      and marks item status as COMPLETED (line 194). It sets po.setPoStatus to
      COMPLETED if all items available (line 198). This is the primary business
      logic for order fulfillment and is clearly implemented and documented.
    risk_class: operational
    basis: >
      OrderFulfillmentFacadeEJB.processAnOrder() (lines 176-210) accepts a
      SupplierOrderLocal po. It iterates po.getLineItems() collection. For each
      item, it calls checkInventory(li) (line 189). checkInventory() (lines 126-139)
      finds inventory by itemId, checks if inventory.getQuantity() >= item.getQuantity(),
      and if so calls inv.reduceQuantity(). If successful, li.setQuantityShipped() is
      called (line 193), item marked COMPLETED (line 194), invoiceReqd set true.
      If all items available, po.setPoStatus(COMPLETED) called (line 198).
    traces:
      - path: legacy-source/petstore1.3.2/src/apps/supplier/src/com/sun/j2ee/blueprints/supplier/orderfulfillment/ejb/OrderFulfillmentFacadeEJB.java
        line_start: 120
        line_end: 139
        excerpt: |
          /**
           * if items are in stock then take them out of inventory to full order
           *
           * @return false if number of items in inventory is less than
           *         number in the line item of po; else return true.
           */
          private boolean checkInventory(LineItemLocal item)  {
            try {
              InventoryLocal inv = invHome.findByPrimaryKey(item.getItemId());
              if(inv.getQuantity() < item.getQuantity())
                return(false);
              inv.reduceQuantity(item.getQuantity());
            } catch (FinderException fe) {
              return(false);
            }
            return(true);
          }
      - path: legacy-source/petstore1.3.2/src/apps/supplier/src/com/sun/j2ee/blueprints/supplier/orderfulfillment/ejb/OrderFulfillmentFacadeEJB.java
        line_start: 173
        line_end: 210
        excerpt: |
          private String processAnOrder(SupplierOrderLocal po)
            throws XMLDocumentException  {
              boolean allItemsAvailable = true;
              boolean invoiceReqd = false;
              String invoiceXml = null;
              HashMap items = new HashMap();
              Collection liColl = po.getLineItems();
              Iterator liIt = liColl.iterator();
              while((liIt != null) && (liIt.hasNext())) {
                LineItemLocal li = (LineItemLocal) liIt.next();
                if(li.getQuantity() == li.getQuantityShipped())
                  continue;
                if(!checkInventory(li)) {
                  allItemsAvailable = false;
                  continue;
                }
                li.setQuantityShipped(li.getQuantity());
                items.put(li.getItemId(), OrderStatusNames.COMPLETED);
                invoiceReqd = true;
              }
              if(allItemsAvailable)
                po.setPoStatus(OrderStatusNames.COMPLETED);
              if(invoiceReqd) {
                try {
                  invoiceXml = (createInvoice(po, items));
                } catch (XMLDocumentException xe) {
                  System.out.println("OrderFulfillmentFacade**" + xe);
                  return null;
                }
              }
              return invoiceXml;
          }
    stack_metadata:
      ejb.transaction: Required
      workflow: order fulfillment with inventory checking

  - record_key: FUL-BUS-0003
    kind: business-rule
    capability_key: fulfillment-management
    requirement: >
      When an inventory update is received, the system SHALL retrieve all Purchase
      Orders with PENDING status and attempt to fulfill each using newly available
      inventory items, generating invoice XML documents for all successfully
      fulfilled orders.
    confidence: high
    confidence_basis: >
      OrderFulfillmentFacadeEJB.processPendingPO() method (lines 247-269) explicitly
      implements this. It calls supplierOrderLocalHome.findOrdersByStatus(PENDING),
      iterates the results, calls processAnOrder() for each, collects returned
      invoices, and returns them. RcvrRequestProcessor.doPost() (lines 180-188)
      calls this after updateInventory() and then calls sendInvoices() to dispatch
      them. This is clearly documented and consistently implemented.
    risk_class: operational
    basis: >
      OrderFulfillmentFacadeEJB.processPendingPO() (lines 247-269) calls
      supplierOrderLocalHome.findOrdersByStatus(OrderStatusNames.PENDING) to retrieve
      pending orders. Iterates them with a while loop (lines 254-266), calls
      processAnOrder(order) on each (line 258), catches XMLDocumentException
      (line 259), and adds non-null results to ArrayList invoices. Returns the
      collection. RcvrRequestProcessor (lines 186-187) calls procPO.processPendingPO()
      after updateInventory() completes.
    traces:
      - path: legacy-source/petstore1.3.2/src/apps/supplier/src/com/sun/j2ee/blueprints/supplier/orderfulfillment/ejb/OrderFulfillmentFacadeEJB.java
        line_start: 239
        line_end: 269
        excerpt: |
          /**
           * Called by the web tier when new inventory arrives, so we want to try
           * and fulfill any orders that are still pending
           *
           * @return a <code>Collection</code> of Invoices that are generated by
           *         fulfilling pending orders with the items that have just arrived
           *         in inventory
           */
          public Collection processPendingPO() throws FinderException {
            ArrayList invoices = new ArrayList();
            Collection coll =
              supplierOrderLocalHome.findOrdersByStatus(OrderStatusNames.PENDING);
            if(coll != null) {
              Iterator it = coll.iterator();
              while((it!=null) && (it.hasNext())) {
                SupplierOrderLocal order = (SupplierOrderLocal) it.next();
                String newInvoice = null;
                try {
                  newInvoice = processAnOrder(order);
                } catch (XMLDocumentException xe) {
                  System.out.println("OrderFulfillmentFacade:" + xe);
                }
                if(newInvoice != null) {
                  invoices.add(newInvoice);
                }
              }
            }
            return invoices;
          }
